# =============================================================================
# GRC Claw — Redis Configuration
# =============================================================================
# Production-grade Redis configuration for the GRC Claw platform.
# =============================================================================

# =============================================================================
# Network
# =============================================================================

bind 0.0.0.0
protected-mode yes
port 6379
tcp-backlog 511
timeout 300
tcp-keepalive 60

# =============================================================================
# General
# =============================================================================

daemonize no
supervised no
pidfile /var/run/redis/redis-server.pid
loglevel notice
logfile ""
databases 16

# =============================================================================
# Persistence
# =============================================================================

save 900 1
save 300 10
save 60 10000
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data

# Append Only Mode
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
aof-use-rdb-preamble yes
aof-load-truncated yes

# =============================================================================
# Memory Management
# =============================================================================

maxmemory 256mb
maxmemory-policy allkeys-lru
maxmemory-samples 5

# =============================================================================
# Lazy Freeing
# =============================================================================

lazyfree-lazy-eviction no
lazyfree-lazy-expire no
lazyfree-lazy-server-del no
replica-lazy-flush no

# =============================================================================
# Threaded I/O
# =============================================================================

io-threads 4
io-threads-do-reads yes

# =============================================================================
# Event Notification
# =============================================================================

notify-keyspace-events "Exg"

# =============================================================================
# Security
# =============================================================================

# requirepass your-strong-password-here
rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command CONFIG "CONFIG-a9f3b2c1"
rename-command DEBUG ""
rename-command SHUTDOWN "SHUTDOWN-a9f3b2c1"

# =============================================================================
# Client Output Buffer
# =============================================================================

client-output-buffer-limit normal 0 0 0
client-output-buffer-limit replica 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60

# =============================================================================
# Slow Log
# =============================================================================

slowlog-log-slower-than 10000
slowlog-max-len 128

# =============================================================================
# Latency Monitor
# =============================================================================

latency-monitor-threshold 100

# =============================================================================
# Active Defragmentation
# =============================================================================

activedefrag yes
active-defrag-ignore-bytes 100mb
active-defrag-threshold-lower 10
active-defrag-threshold-upper 100
active-defrag-cycle-min 1
active-defrag-cycle-max 25

# =============================================================================
# LRU / LFU
# =============================================================================

server-lru-clock yes

# =============================================================================
# Replication (for production HA setups)
# =============================================================================

# replicaof <masterip> <masterport>
# masterauth <master-password>
# replica-serve-stale-data yes
# replica-read-only yes
# repl-diskless-sync yes
# repl-diskless-sync-delay 5
# repl-ping-replica-period 10
# repl-timeout 60
# repl-disable-tcp-nodelay no
# repl-backlog-size 1mb
# replica-priority 100
# min-replicas-to-write 1
# min-replicas-max-lag 10
