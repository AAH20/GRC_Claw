components:
  securitySchemes:
    BearerToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token issued by GRC_Claw RBAC engine
    GrcClawTokenHeader:
      type: apiKey
      in: header
      name: X-GRC-Claw-Token
      description: Simple token authentication (backward compatibility)
  responses:
    Unauthorized:
      description: Authentication required
      headers:
        X-RateLimit-Limit:
          schema:
            type: integer
          description: Request limit per window
        X-RateLimit-Remaining:
          schema:
            type: integer
          description: Remaining requests
        Retry-After:
          schema:
            type: integer
          description: Seconds until rate limit resets
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    BadRequest:
      description: Invalid request
      headers:
        X-RateLimit-Limit:
          schema:
            type: integer
        X-RateLimit-Remaining:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    BadGateway:
      description: Upstream error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        field:
          type: string
        message:
          type: string
        timestamp:
          type: string
          format: date-time
    OkResponse:
      type: object
      properties:
        ok:
          type: boolean
        timestamp:
          type: string
          format: date-time
    HealthResponse:
      type: object
      properties:
        ok:
          type: boolean
        service:
          type: string
        a2z_soc_mode:
          type: string
        agentic_ai_security:
          type: boolean
        cloud_security_integration:
          type: boolean
        iso_42001_aims:
          type: boolean
        byoc_connectors:
          type: boolean
        llm_providers:
          type: integer
        mcp_servers:
          type: integer
        cloud_sources:
          type: array
          items:
            type: string
        persistence:
          type: string
        soc_stream:
          type: string
