openapi: 3.1.0
info:
  title: GRC_Claw API
  version: 1.0.0
  description: The GRC_Claw Gateway API powers the OSS chassis for ISO 42001-compliant agentic AI. It provides evidence management,
    framework crosswalks, control testing, risk quantification, trust scoring, agent runtime, compliance autopilot, knowledge
    graphs, marketplace, and standards export endpoints.
  contact:
    name: GRC_Claw Team
    url: https://github.com/grc-claw/grc-claw
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
servers:
- url: http://127.0.0.1:18791
  description: Local development gateway
- url: https://{hostname}
  description: Production
  variables:
    hostname:
      default: gw.grc-claw.example.com
security:
- BearerToken: []
- GrcClawTokenHeader: []
tags:
- name: Health
  description: Service health and readiness
- name: Evidence
  description: Evidence collection, storage, verification, and export
- name: Frameworks
  description: Framework packs, crosswalks, and control catalogs
- name: Control Testing
  description: Control status management and compliance scans
- name: Risk Quantification
  description: FAIR analysis, Monte Carlo simulation, and risk registers
- name: Trust Scoring
  description: Agent trust scores, badges, and credential issuance
- name: Agent Runtime
  description: Agent invocation, sessions, identity, and policy execution
- name: Verifier Network
  description: Verifier rooms, events, acceptances, and exports
- name: Benchmark Intelligence
  description: Benchmark signals, aggregations, and recommendations
- name: Defense Procurement
  description: Defense packets, SPRS scoring, and POA&M management
- name: Agent Policy Firewall
  description: Policy evaluation, receipts, and firewall statistics
- name: Compliance Autopilot
  description: Automated compliance monitoring, gap detection, and remediation
- name: Knowledge Graph
  description: Compliance knowledge graph nodes, edges, and traversal
- name: Marketplace
  description: Integration packs, installation, and verification
- name: Sovereign Deployment
  description: Sovereign deployment status and configuration
- name: Standards Exports
  description: OSCAL, OCSF, STIX, and SARIF format exports
- name: Connectors
  description: BYOC connector management, LLM chat, and MCP tools
- name: Entities
  description: Multi-entity compliance management
- name: Policies
  description: Policy lifecycle, approval workflows, and attestation
- name: Vendor Risk
  description: Third-party risk management and monitoring
- name: Employees
  description: Employee lifecycle and access review
- name: Tasks
  description: Compliance task engine and analytics
- name: Dashboard
  description: Real-time compliance dashboards and KPIs
