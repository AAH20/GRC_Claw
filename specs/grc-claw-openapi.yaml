openapi: 3.1.0
info:
  title: GRC_Claw API
  description: |
    GRC_Claw — open-source governance, risk, and compliance platform for agentic AI.
    
    This API provides four complementary interfaces:
    - **REST** — CRUD operations, search, and reporting
    - **GraphQL** — Complex nested queries for dashboards and analytics
    - **gRPC** — High-performance enforcement decisions and streaming
    - **Webhooks** — Event-driven integrations
    
    ## Authentication
    
    All API requests require authentication via one of:
    - **OAuth 2.1 / OIDC** — Bearer JWT token (RS256)
    - **API Key** — `Authorization: Bearer grc_live_...` or `grc_test_...`
    - **mTLS (SPIFFE)** — X.509 SVID for agent-to-PEP communication
    
    ## Rate Limiting
    
    Rate limit headers are included in all responses:
    - `X-RateLimit-Limit` — Request limit per window
    - `X-RateLimit-Remaining` — Remaining requests in current window
    - `X-RateLimit-Reset` — Unix timestamp when the window resets
    
    ## Error Format
    
    All errors follow RFC 7807 (Problem Details for HTTP APIs).
    
    ## Versioning
    
    Current version: `v1.0`. Version is specified in the URL path.
    Deprecation notices are sent via webhook 6 months before sunset.
  version: 1.0.0
  contact:
    name: GRC_Claw Architecture Team
    url: https://api.grc-claw.io
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
  - url: https://api.grc-claw.io
    description: Production
  - url: https://api.staging.grc-claw.io
    description: Staging
  - url: http://localhost:8080
    description: Local development
tags:
  - name: Policies
    description: Policy lifecycle management
  - name: Evidence
    description: Evidence collection, verification, and export
  - name: Enforcement
    description: Enforcement decisions (single, batch, streaming)
  - name: Assessments
    description: Risk, compliance, maturity, and readiness assessments
  - name: Compliance
    description: Compliance mapping across 10 frameworks
  - name: Agents
    description: Agent registry and identity management
  - name: Audit
    description: Audit trail querying and verification
  - name: Webhooks
    description: Webhook subscriptions and delivery
  - name: System
    description: Health, readiness, and metrics
paths:
  /v1.0/policies:
    get:
      operationId: listPolicies
      summary: List policies
      description: Returns a paginated list of policies with optional filtering.
      tags: [Policies]
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [draft, review, active, deprecated, archived]
        - name: category
          in: query
          schema:
            type: string
            enum: [ethics, safety, privacy, fairness]
        - name: framework
          in: query
          schema:
            type: string
        - name: agent_id
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            maximum: 500
        - name: cursor
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Paginated list of policies
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
    post:
      operationId: createPolicy
      summary: Create policy
      description: Creates a new policy in draft status.
      tags: [Policies]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PolicyCreateRequest'
      responses:
        '201':
          description: Policy created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Policy'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
  /v1.0/policies/{policy_id}:
    parameters:
      - name: policy_id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getPolicy
      summary: Get policy
      description: Returns full policy object including Cedar source and compiled Rego.
      tags: [Policies]
      responses:
        '200':
          description: Policy details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Policy'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: updatePolicy
      summary: Update policy
      description: Updates an existing policy. Creates a new version.
      tags: [Policies]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PolicyUpdateRequest'
      responses:
        '200':
          description: Policy updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Policy'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deletePolicy
      summary: Delete policy
      description: Deletes a policy. Use `force=true` to delete even if active.
      tags: [Policies]
      parameters:
        - name: force
          in: query
          schema:
            type: boolean
            default: false
      responses:
        '204':
          description: Policy deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1.0/policies/{policy_id}/compile:
    post:
      operationId: compilePolicy
      summary: Compile policy
      description: Compiles Cedar policy to Rego for OPA evaluation.
      tags: [Policies]
      parameters:
        - name: policy_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Compilation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompilationResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: Policy compilation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /v1.0/policies/{policy_id}/dry-run:
    post:
      operationId: dryRunPolicy
      summary: Dry-run policy
      description: Evaluates policy against test inputs without enforcement.
      tags: [Policies]
      parameters:
        - name: policy_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [test_inputs]
              properties:
                test_inputs:
                  type: array
                  items:
                    $ref: '#/components/schemas/DryRunInput'
      responses:
        '200':
          description: Dry-run results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DryRunResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1.0/policies/{policy_id}/versions:
    get:
      operationId: getPolicyVersions
      summary: Policy version history
      description: Returns version history for a policy.
      tags: [Policies]
      parameters:
        - name: policy_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Version history
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PolicyVersion'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1.0/policies/{policy_id}/dependencies:
    get:
      operationId: getPolicyDependencies
      summary: Policy dependency graph
      description: Returns dependency graph for a policy.
      tags: [Policies]
      parameters:
        - name: policy_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Dependency graph
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyDependencyGraph'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1.0/evidence:
    get:
      operationId: searchEvidence
      summary: Search evidence
      description: Search evidence with filtering and full-text search.
      tags: [Evidence]
      parameters:
        - name: policy_id
          in: query
          schema: { type: string }
        - name: assessment_id
          in: query
          schema: { type: string }
        - name: evidence_type
          in: query
          schema:
            type: string
            enum: [artifact, observation, interview, analysis, log]
        - name: framework
          in: query
          schema: { type: string }
        - name: control_id
          in: query
          schema: { type: string }
        - name: verification_level
          in: query
          schema:
            type: string
            enum: [L0, L1, L2, L3, L4]
        - name: environment
          in: query
          schema: { type: string }
        - name: date_from
          in: query
          schema: { type: string, format: date-time }
        - name: date_to
          in: query
          schema: { type: string, format: date-time }
        - name: query
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, default: 50, maximum: 500 }
        - name: cursor
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvidenceListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: submitEvidence
      summary: Submit evidence
      description: Submits new evidence for a policy and/or assessment.
      tags: [Evidence]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvidenceSubmitRequest'
      responses:
        '201':
          description: Evidence submitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Evidence'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1.0/evidence/{evidence_id}:
    get:
      operationId: getEvidence
      summary: Get evidence
      description: Returns full evidence item with chain of custody and verification status.
      tags: [Evidence]
      parameters:
        - name: evidence_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Evidence details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Evidence'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1.0/evidence/{evidence_id}/verify:
    post:
      operationId: verifyEvidence
      summary: Verify evidence
      description: Triggers integrity verification and chain-of-custody validation.
      tags: [Evidence]
      parameters:
        - name: evidence_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Verification result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvidenceVerification'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: Evidence verification failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /v1.0/evidence/export:
    post:
      operationId: exportEvidencePackage
      summary: Export evidence package
      description: Initiates async evidence package export.
      tags: [Evidence]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvidenceExportRequest'
      responses:
        '202':
          description: Export initiated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportPackage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1.0/evidence/export/{package_id}:
    get:
      operationId: getExportPackage
      summary: Get export package
      description: Returns export package status and download URL when complete.
      tags: [Evidence]
      parameters:
        - name: package_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Package status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportPackage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1.0/enforcement/decide:
    post:
      operationId: enforcementDecide
      summary: Request enforcement decision
      description: Evaluates agent action against policies and returns a decision.
      tags: [Enforcement]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnforcementRequest'
      responses:
        '200':
          description: Enforcement decision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnforcementDecision'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1.0/enforcement/decide-batch:
    post:
      operationId: enforcementDecideBatch
      summary: Batch enforcement decisions
      description: Evaluates multiple agent actions in a single request.
      tags: [Enforcement]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decisions]
              properties:
                decisions:
                  type: array
                  items:
                    $ref: '#/components/schemas/EnforcementRequest'
      responses:
        '200':
          description: Batch results
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/EnforcementDecision'
                  summary:
                    $ref: '#/components/schemas/BatchSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1.0/enforcement/decisions/{decision_id}:
    get:
      operationId: getDecision
      summary: Get decision
      description: Returns full decision certificate with evidence.
      tags: [Enforcement]
      parameters:
        - name: decision_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Decision details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnforcementDecision'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1.0/enforcement/decisions:
    get:
      operationId: listDecisions
      summary: List decisions
      description: Returns paginated list of enforcement decisions.
      tags: [Enforcement]
      parameters:
        - name: agent_id
          in: query
          schema: { type: string }
        - name: policy_id
          in: query
          schema: { type: string }
        - name: verdict
          in: query
          schema:
            type: string
            enum: [ALLOW, ALLOW_WITH_REDACTION, REQUIRE_APPROVAL, DENY, QUARANTINE]
        - name: date_from
          in: query
          schema: { type: string, format: date-time }
        - name: date_to
          in: query
          schema: { type: string, format: date-time }
        - name: limit
          in: query
          schema: { type: integer, default: 50, maximum: 500 }
        - name: cursor
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Paginated decisions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecisionListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1.0/assessments:
    get:
      operationId: listAssessments
      summary: List assessments
      description: Returns paginated list of assessments.
      tags: [Assessments]
      parameters:
        - name: assessment_type
          in: query
          schema:
            type: string
            enum: [risk, compliance, maturity, readiness]
        - name: status
          in: query
          schema:
            type: string
            enum: [planned, in_progress, completed, cancelled]
        - name: target_type
          in: query
          schema:
            type: string
            enum: [model, system, organization, process]
        - name: target_id
          in: query
          schema: { type: string }
        - name: methodology
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, default: 50, maximum: 500 }
        - name: cursor
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Paginated assessments
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssessmentListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: createAssessment
      summary: Create assessment
      description: Creates a new assessment.
      tags: [Assessments]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssessmentCreateRequest'
      responses:
        '201':
          description: Assessment created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Assessment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1.0/assessments/{assessment_id}:
    parameters:
      - name: assessment_id
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getAssessment
      summary: Get assessment
      description: Returns full assessment with findings.
      tags: [Assessments]
      responses:
        '200':
          description: Assessment details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Assessment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: updateAssessment
      summary: Update assessment
      description: Updates an existing assessment.
      tags: [Assessments]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssessmentUpdateRequest'
      responses:
        '200':
          description: Assessment updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Assessment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1.0/assessments/{assessment_id}/findings:
    post:
      operationId: addFinding
      summary: Add finding
      description: Adds a finding to an assessment.
      tags: [Assessments]
      parameters:
        - name: assessment_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FindingCreateRequest'
      responses:
        '201':
          description: Finding added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssessmentFinding'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1.0/assessments/{assessment_id}/report:
    post:
      operationId: generateAssessmentReport
      summary: Generate assessment report
      description: Initiates async report generation.
      tags: [Assessments]
      parameters:
        - name: assessment_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                format:
                  type: string
                  enum: [pdf, json, csv]
                include_evidence:
                  type: boolean
                include_remediation:
                  type: boolean
      responses:
        '202':
          description: Report generation initiated
          content:
            application/json:
              schema:
                type: object
                properties:
                  report_id:
                    type: string
                  status:
                    type: string
                    enum: [processing]
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1.0/compliance/frameworks:
    get:
      operationId: listFrameworks
      summary: List compliance frameworks
      description: Returns all supported compliance frameworks.
      tags: [Compliance]
      responses:
        '200':
          description: List of frameworks
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ComplianceFramework'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1.0/compliance/frameworks/{framework_id}/controls:
    get:
      operationId: listControls
      summary: List controls
      description: Returns controls for a specific framework.
      tags: [Compliance]
      parameters:
        - name: framework_id
          in: path
          required: true
          schema: { type: string }
        - name: category
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string }
        - name: target_id
          in: query
          schema: { type: string }
      responses:
        '200':
          description: List of controls
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ComplianceControl'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1.0/compliance/posture:
    get:
      operationId: getCompliancePosture
      summary: Get compliance posture
      description: Returns compliance posture for a framework and target.
      tags: [Compliance]
      parameters:
        - name: framework
          in: query
          required: true
          schema: { type: string }
        - name: target_id
          in: query
