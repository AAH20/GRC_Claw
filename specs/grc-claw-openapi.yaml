  /v1.0/graphql:
    post:
      operationId: graphql
      summary: GraphQL endpoint
      description: GraphQL endpoint for complex nested queries.
      tags: [System]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query:
                  type: string
                variables:
                  type: object
                operationName:
                  type: string
      responses:
        '200':
          description: GraphQL response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        message:
                          type: string
                        locations:
                          type: array
                          items:
                            type: object
                            properties:
                              line:
                                type: integer
                              column:
                                type: integer
                        path:
                          type: array
                          items:
                            type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    apiKeyAuth:
      type: apiKey
      in: header
      name: Authorization
      description: 'API key in format: Bearer grc_live_... or Bearer grc_test_...'
    mtlsAuth:
      type: mutualTLS
      description: mTLS with SPIFFE SVID
  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Conflict:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    RateLimited:
      description: Rate limit exceeded
      headers:
        X-RateLimit-Limit:
          schema: { type: integer }
        X-RateLimit-Remaining:
          schema: { type: integer }
        X-RateLimit-Reset:
          schema: { type: integer }
        Retry-After:
          schema: { type: integer }
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
  schemas:
    ProblemDetails:
      type: object
      required: [type, title, status, detail, code]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
        timestamp:
          type: string
          format: date-time
        request_id:
          type: string
        trace_id:
          type: string
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string
              code:
                type: string
    Pagination:
      type: object
      properties:
        next_cursor:
          type: string
        has_next:
          type: boolean
        total:
          type: integer
    Policy:
      type: object
      properties:
        id: { type: string }
        policy_key: { type: string }
        name: { type: string }
        description: { type: string }
        category:
          type: string
          enum: [ethics, safety, privacy, fairness]
        status:
          type: string
          enum: [draft, review, active, deprecated, archived]
        version: { type: string }
        framework_tags:
          type: array
          items: { type: string }
        effective_date:
          type: string
          format: date-time
        expiry_date:
          type: string
          format: date-time
        owner_id: { type: string }
        agent_bindings:
          type: array
          items: { type: string }
        metadata:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    PolicyCreateRequest:
      type: object
      required: [policy_key, name, category]
      properties:
        policy_key: { type: string }
        name: { type: string }
        description: { type: string }
        category:
          type: string
          enum: [ethics, safety, privacy, fairness]
        framework_tags:
          type: array
          items: { type: string }
        cedar_policy: { type: string }
        metadata:
          type: object
          additionalProperties: true
    PolicyUpdateRequest:
      type: object
      properties:
        name: { type: string }
        description: { type: string }
        cedar_policy: { type: string }
        metadata:
          type: object
          additionalProperties: true
    PolicyListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Policy'
        pagination:
          $ref: '#/components/schemas/Pagination'
    PolicyVersion:
      type: object
      properties:
        version: { type: string }
        status: { type: string }
        change_summary: { type: string }
        created_at:
          type: string
          format: date-time
        created_by: { type: string }
    PolicyDependencyGraph:
      type: object
      properties:
        policy_id: { type: string }
        dependencies:
          type: array
          items:
            type: object
            properties:
              target_policy_id: { type: string }
              target_policy_name: { type: string }
              relation_type: { type: string }
              description: { type: string }
        dependents:
          type: array
          items:
            type: object
            properties:
              source_policy_id: { type: string }
              source_policy_name: { type: string }
              relation_type: { type: string }
              description: { type: string }
    CompilationResult:
      type: object
      properties:
        policy_id: { type: string }
        compilation_status:
          type: string
          enum: [success, failed, partial]
        rego_policy: { type: string }
        warnings:
          type: array
          items: { type: string }
        errors:
          type: array
          items: { type: string }
        compiled_at:
          type: string
          format: date-time
    DryRunInput:
      type: object
      properties:
        principal:
          type: object
          additionalProperties: true
        action: { type: string }
        resource:
          type: object
          additionalProperties: true
        context:
          type: object
          additionalProperties: true
    DryRunResult:
      type: object
      properties:
        policy_id: { type: string }
        dry_run_results:
          type: array
          items:
            type: object
            properties:
              input_index: { type: integer }
              decision:
                type: string
                enum: [ALLOW, DENY]
              matched_rules:
                type: array
                items: { type: string }
              evaluation_time_ms: { type: number }
              reason: { type: string }
        summary:
          type: object
          properties:
            total: { type: integer }
            allowed: { type: integer }
            denied: { type: integer }
            avg_evaluation_time_ms: { type: number }
    Evidence:
      type: object
      properties:
        evidence_id: { type: string }
        policy_id: { type: string }
        assessment_id: { type: string }
        source:
          type: object
          properties:
            type: { type: string }
            system: { type: string }
            collection_method: { type: string }
        evidence_type:
          type: string
          enum: [artifact, observation, interview, analysis, log]
        content:
          type: object
          properties:
            format: { type: string }
            data: { type: string }
            hash: { type: string }
        context:
          type: object
          properties:
            environment: { type: string }
            region: { type: string }
            timestamp:
              type: string
              format: date-time
            metadata:
              type: object
              additionalProperties: true
        validation:
          type: object
          properties:
            status: { type: string }
            validated_by: { type: string }
            validated_at:
              type: string
              format: date-time
            confidence_score: { type: number }
        verification_level:
          type: string
          enum: [L0, L1, L2, L3, L4]
        chain_of_custody:
          type: array
          items:
            type: object
            properties:
              action: { type: string }
              actor: { type: string }
              timestamp:
                type: string
                format: date-time
              hash: { type: string }
        retention_class: { type: string }
        created_at:
          type: string
          format: date-time
