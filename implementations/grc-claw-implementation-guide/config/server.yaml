# GRC_Claw Configuration
# Main server configuration

server:
  host: "0.0.0.0"
  port: 8080
  workers: 4
  log_level: "info"
  api_version: "v1"
  cors_origins:
    - "https://grc-claw.internal"
    - "http://localhost:3000"

database:
  url: "postgresql://grcclaw:${DB_PASSWORD}@postgres:5432/grcclaw"
  pool_size: 20
  max_overflow: 10
  pool_timeout: 30
  echo: false

redis:
  url: "redis://redis:6379/0"
  max_connections: 50
  socket_timeout: 5

# ─── Policy Engine ──────────────────────────────────────────────────────────
policy_engine:
  primary: "cedar"
  compatibility: "rego"
  cedar:
    schema_path: "/config/cedar-schema.json"
    timeout_ms: 5000
    fail_closed: true
  rego:
    opa_url: "http://opa:8181"
    wasm_enabled: true
    timeout_ms: 10000
  default_action: "deny"
  on_timeout: "deny"
  enforcement_strategy: "deny_overrides"

# ─── Evidence ───────────────────────────────────────────────────────────────
evidence:
  signing_key_path: "/secrets/ed25519-private.key"
  merkle_chain:
    enabled: true
    batch_size: 100
    publish_root: true
  oscal:
    version: "1.1"
    output_format: "json"
  retention:
    default: "7years"
    audit_events: "7years"
    policy_evaluations: "3years"
    assessment_results: "5years"

# ─── Assessment ─────────────────────────────────────────────────────────────
assessment:
  default_threshold: 0.8
  max_concurrent: 5
  timeout_seconds: 300
  integrations:
    fairlearn:
      enabled: true
      version: "0.10.0"
    shap:
      enabled: true
      version: "0.43.0"
    promptfoo:
      enabled: true
      endpoint: "http://promptfoo:3000"

# ─── Compliance ─────────────────────────────────────────────────────────────
compliance:
  frameworks:
    - id: "iso-42001"
      name: "ISO/IEC 42001:2023"
      version: "2023"
      enabled: true
    - id: "nist-ai-rmf"
      name: "NIST AI RMF 1.0"
      version: "1.0"
      enabled: true
    - id: "eu-ai-act"
      name: "EU AI Act"
      version: "2024"
      enabled: true
    - id: "owasp-llm"
      name: "OWASP Top 10 for LLM Applications 2025"
      version: "2025"
      enabled: true
  compute_schedule: "0 * * * *"  # Every hour
  evidence_package_output: "/data/evidence-packages"

# ─── Audit Trail ────────────────────────────────────────────────────────────
audit:
  merkle_chain:
    enabled: true
    hash_algorithm: "sha256"
    signature_algorithm: "ed25519"
  export:
    format: "cloudevents"
    destination: "kafka"
    batch_size: 1000
  retention:
    hot_storage_days: 90
    cold_storage_years: 7

# ─── Event Bus (Kafka) ──────────────────────────────────────────────────────
event_bus:
  primary:
    type: kafka
    brokers:
      - "kafka-1:9092"
      - "kafka-2:9092"
      - "kafka-3:9092"
    protocol: sasl_ssl
    auth:
      mechanism: SCRAM-SHA-512
      username: ${KAFKA_USERNAME}
      password: ${KAFKA_PASSWORD}
    topics:
      - name: grcclaw.enforcement
        partitions: 12
        replication: 3
        retention_ms: 604800000
      - name: grcclaw.evidence
        partitions: 12
        replication: 3
        retention_ms: 2592000000
      - name: grcclaw.audit
        partitions: 6
        replication: 3
        retention_ms: 31536000000
      - name: grcclaw.compliance
        partitions: 6
        replication: 3
        retention_ms: 2592000000
      - name: grcclaw.risk
        partitions: 6
        replication: 3
        retention_ms: 604800000
      - name: grcclaw.agent
        partitions: 6
        replication: 3
        retention_ms: 2592000000
      - name: grcclaw.policy
        partitions: 6
        replication: 3
        retention_ms: 2592000000
      - name: grcclaw.assessment
        partitions: 6
        replication: 3
        retention_ms: 2592000000
      - name: grcclaw.dlq
        partitions: 3
        replication: 3
        retention_ms: 2592000000
  dead_letter:
    max_redeliveries: 5
    retry_delays: [1000, 5000, 30000, 120000, 600000]

# ─── Circuit Breakers ───────────────────────────────────────────────────────
circuit_breakers:
  enforcement_engine:
    failure_threshold: 5
    recovery_timeout: 30s
    half_open_max_calls: 3
    on_failure: fail_open
  policy_engine:
    failure_threshold: 3
    recovery_timeout: 10s
    half_open_max_calls: 1
    on_failure: fail_open
  evidence_store:
    failure_threshold: 10
    recovery_timeout: 60s
    half_open_max_calls: 5
    on_failure: fail_closed
  audit_trail:
    failure_threshold: 3
    recovery_timeout: 10s
    half_open_max_calls: 1
    on_failure: fail_open

# ─── Security ───────────────────────────────────────────────────────────────
security:
  identity:
    provider: "spiffe"
    spire_endpoint: "unix:///run/spire/sockets/agent.sock"
    trust_domain: "grc-claw.internal"
  encryption:
    at_rest:
      algorithm: "AES-256-GCM"
      key_path: "/secrets/master.key"
    in_transit:
      tls_version: "1.3"
      mtls: true
    signatures:
      algorithm: "Ed25519"
      fallback: "CRYSTALS-Dilithium"
  auth:
    method: "oidc"
    issuer: "https://auth.grc-claw.internal"
    audience: "grcclaw-api"
    token_ttl: 3600

# ─── Rate Limiting ──────────────────────────────────────────────────────────
rate_limiting:
  default: "10000/minute"
  enforcement: "100000/minute"
  evidence: "5000/minute"
  per_tenant: true

# ─── Observability ──────────────────────────────────────────────────────────
observability:
  metrics:
    enabled: true
    endpoint: "http://prometheus:9090"
    port: 9090
  tracing:
    enabled: true
    exporter: "otlp"
    endpoint: "http://otel-collector:4318"
    sample_rate: 0.1
  logging:
    format: "json"
    level: "info"
    output: "stdout"
