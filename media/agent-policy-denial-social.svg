<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">GRC Claw: governed agent action</title>
  <desc id="desc">A fictional inventory read is allowed, a fictional customer export is denied, and both decisions are recorded in an offline verifiable ledger.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#07121f"/>
      <stop offset="1" stop-color="#102941"/>
    </linearGradient>
    <linearGradient id="line" x1="0" x2="1">
      <stop offset="0" stop-color="#57d8c2"/>
      <stop offset="1" stop-color="#67aaf7"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <path d="M0 522 C250 446 340 614 612 525 S1015 465 1280 570" fill="none" stroke="#284d68" stroke-width="2" opacity=".55"/>
  <path d="M0 555 C280 480 385 645 660 558 S1035 505 1280 604" fill="none" stroke="#284d68" stroke-width="2" opacity=".35"/>
  <rect x="56" y="44" width="176" height="34" rx="17" fill="#16374a" stroke="#34758a"/>
  <text x="144" y="66" fill="#96e5d5" font-family="Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle" letter-spacing="2">GRC CLAW</text>
  <text x="56" y="142" fill="#f2f8ff" font-family="Arial, sans-serif" font-size="51" font-weight="700">Governed agent action</text>
  <text x="58" y="184" fill="#b3c8da" font-family="Arial, sans-serif" font-size="24">One permitted read. One denied export. Every decision inspectable.</text>
  <rect x="56" y="229" width="550" height="221" rx="20" fill="#102f40" stroke="#326b70" stroke-width="2"/>
  <rect x="674" y="229" width="550" height="221" rx="20" fill="#352632" stroke="#9f5764" stroke-width="2"/>
  <text x="88" y="275" fill="#9ddfd4" font-family="Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="2">CASE 01 · AUTHORIZED</text>
  <text x="706" y="275" fill="#f2aab0" font-family="Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="2">CASE 02 · OUTSIDE AUTHORITY</text>
  <text x="88" y="334" fill="#f3faff" font-family="Arial, sans-serif" font-size="36" font-weight="700">inventory.read</text>
  <text x="706" y="334" fill="#f3faff" font-family="Arial, sans-serif" font-size="36" font-weight="700">customer.export</text>
  <rect x="88" y="365" width="119" height="47" rx="23" fill="#186b58"/>
  <text x="147" y="395" fill="#edfff7" font-family="Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle">ALLOW</text>
  <text x="223" y="395" fill="#a8c9d0" font-family="Arial, sans-serif" font-size="18">Simulated only</text>
  <rect x="706" y="365" width="119" height="47" rx="23" fill="#a84f5e"/>
  <text x="765" y="395" fill="#fff8f9" font-family="Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle">DENY</text>
  <text x="841" y="395" fill="#e4b3ba" font-family="Arial, sans-serif" font-size="18">Tool explicitly denied</text>
  <path d="M607 339 L672 339" stroke="url(#line)" stroke-width="4" stroke-linecap="round"/>
  <path d="M660 328 L673 339 L660 350" fill="none" stroke="#68b9d7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="56" y="492" width="1168" height="87" rx="16" fill="#102b3b" stroke="#33546a"/>
  <text x="82" y="530" fill="#e2f1fa" font-family="Arial, sans-serif" font-size="21" font-weight="700">Offline replay</text>
  <text x="82" y="558" fill="#a7c3d2" font-family="Arial, sans-serif" font-size="17">Synthetic fixture · Hash-chained ledger · Independent verifier · No external tool execution</text>
  <text x="1207" y="47" fill="#80a8be" font-family="Arial, sans-serif" font-size="16" text-anchor="end">github.com/AAH20/GRC_Claw</text>
</svg>
