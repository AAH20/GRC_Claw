# Prometheus configuration for GRC Claw agentic AI marketing stack
# Scrapes metrics from all projects, exporters, and the OTel collector.

global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
  external_labels:
    cluster: grc-claw
    environment: production

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093
      scheme: http
      timeout: 10s

# Rule files
rule_files:
  - /etc/prometheus/alert-rules.yml

scrape_configs:
  # --- Prometheus self-monitoring ---
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090
    metrics_path: /metrics

  # --- Alertmanager self-monitoring ---
  - job_name: alertmanager
    static_configs:
      - targets:
          - alertmanager:9093
    metrics_path: /metrics

  # --- Node exporter (host metrics) ---
  - job_name: node-exporter
    static_configs:
      - targets:
          - node-exporter:9100
    metrics_path: /metrics

  # --- Agent Health Service ---
  - job_name: agent-health
    static_configs:
      - targets:
          - agent-health:8080
    metrics_path: /metrics
    scrape_interval: 10s
    scrape_timeout: 5s

  # --- Campaign Performance Service ---
  - job_name: campaign-performance
    static_configs:
      - targets:
          - campaign-performance:8080
    metrics_path: /metrics
    scrape_interval: 15s

  # --- Cost Explorer Service ---
  - job_name: cost-explorer
    static_configs:
      - targets:
          - cost-explorer:8080
    metrics_path: /metrics
    scrape_interval: 30s

  # --- Lead Scoring Service ---
  - job_name: lead-scoring
    static_configs:
      - targets:
          - lead-scoring:8080
    metrics_path: /metrics
    scrape_interval: 15s

  # --- Journey Orchestration Service ---
  - job_name: journey-orchestration
    static_configs:
      - targets:
          - journey-orchestration:8080
    metrics_path: /metrics
    scrape_interval: 15s

  # --- OpenTelemetry Collector ---
  - job_name: otel-collector
    static_configs:
      - targets:
          - otel-collector:8888
    metrics_path: /metrics

  # --- Grafana self-monitoring ---
  - job_name: grafana
    static_configs:
      - targets:
          - grafana:3000
    metrics_path: /metrics

  # --- Loki ---
  - job_name: loki
    static_configs:
      - targets:
          - loki:3100
    metrics_path: /metrics

  # --- Tempo ---
  - job_name: tempo
    static_configs:
      - targets:
          - tempo:3200
    metrics_path: /metrics

  # --- cAdvisor (container metrics) ---
  - job_name: cadvisor
    static_configs:
      - targets:
          - cadvisor:8080
    metrics_path: /metrics

  # --- Blackbox exporter (endpoint probing) ---
  - job_name: blackbox-http
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://agent-health:8080/health
          - http://campaign-performance:8080/health
          - http://cost-explorer:8080/health
          - http://lead-scoring:8080/health
          - http://journey-orchestration:8080/health
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # --- Blackbox TCP probe ---
  - job_name: blackbox-tcp
    metrics_path: /probe
    params:
      module: [tcp_connect]
    static_configs:
      - targets:
          - agent-health:8080
          - campaign-performance:8080
          - cost-explorer:8080
          - lead-scoring:8080
          - journey-orchestration:8080
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # ── Recruitment Platforms (10) ────────────────────────────────────
