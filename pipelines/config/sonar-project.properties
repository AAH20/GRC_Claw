# SonarQube / SonarCloud project configuration
# https://docs.sonarsource.com/sonarqube-server/latest/analyzing-source-code/scanners/sonarscanner/

# ── Project Identity ────────────────────────────────────────────────────────
sonar.projectKey=grc-claw-pipeline
sonar.organization=grc-claw
sonar.projectName=GRC Claw Pipeline
sonar.projectVersion=1.0.0

# ── Source Configuration ────────────────────────────────────────────────────
# Source code directories
sonar.sources=src
sonar.tests=tests

# File inclusions/exclusions
sonar.inclusions=**/*.py
sonar.exclusions=\
  tests/**,\
  test/**,\
  **/test_*.py,\
  **/*_test.py,\
  **/conftest.py,\
  **/migrations/**,\
  **/alembic/**,\
  **/node_modules/**,\
  **/.venv/**,\
  **/venv/**,\
  **/dist/**,\
  **/build/**,\
  **/.tox/**,\
  **/__pycache__/**,\
  **/*.egg-info/**,\
  **/htmlcov/**,\
  **/.pytest_cache/**,\
  **/.mypy_cache/**,\
  **/.ruff_cache/**

# Test file inclusions
sonar.test.inclusions=\
  tests/**/*.py,\
  test/**/*.py,\
  **/test_*.py,\
  **/*_test.py

# ── Python Configuration ────────────────────────────────────────────────────
sonar.python.version=3.10, 3.11, 3.12

# Coverage report paths
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.xunit.reportPath=pytest-report.xml

# Encoding
sonar.sourceEncoding=UTF-8

# ── External Analyzer Reports ───────────────────────────────────────────────
# Pylint
sonar.python.pylint.reportPaths=pylint-report.txt

# Bandit
sonar.python.bandit.reportPaths=bandit-report.json

# ── Duplication ─────────────────────────────────────────────────────────────
# Exclude test files from duplication detection
sonar.cpd.exclusions=\
  tests/**,\
  test/**,\
  **/migrations/**

# ── Technical Debt ──────────────────────────────────────────────────────────
# Ignore certain rules on specific files
sonar.issue.ignore.multicriteria=e1,e2

# Ignore "unused import" in __init__.py files
sonar.issue.ignore.multicriteria.e1.ruleKey=python:S1128
sonar.issue.ignore.multicriteria.e1.resourceKey=**/__init__.py

# Ignore "too many lines" in migration files
sonar.issue.ignore.multicriteria.e2.ruleKey=python:S104
sonar.issue.ignore.multicriteria.e2.resourceKey=**/migrations/**

# ── Quality Gate ────────────────────────────────────────────────────────────
# Wait for quality gate result in CI
sonar.qualitygate.wait=true

# ── SCM ─────────────────────────────────────────────────────────────────────
# Disable SCM sensor (let CI handle blame)
sonar.scm.disabled=true

# ── Coverage Exclusions ─────────────────────────────────────────────────────
sonar.coverage.exclusions=\
  **/tests/**,\
  **/test/**,\
  **/conftest.py,\
  **/migrations/**,\
  **/alembic/**,\
  **/setup.py,\
  **/wsgi.py,\
  **/asgi.py
