apiVersion: apps/v1
kind: Deployment
metadata:
  name: grc-claw
  labels:
    app: grc-claw
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: grc-claw
  template:
    metadata:
      labels:
        app: grc-claw
    spec:
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
            - name: metrics
              containerPort: {{ .Values.service.metricsPort }}
              protocol: TCP
          env:
            - name: A2Z_SOC_MODE
              value: "{{ .Values.env.A2Z_SOC_MODE }}"
            - name: A2Z_SOC_BASE_URL
              value: "{{ .Values.env.A2Z_SOC_BASE_URL }}"
            - name: A2Z_SOC_TENANT_ID
              value: "{{ .Values.env.A2Z_SOC_TENANT_ID }}"
            - name: GRC_CLAW_PORT
              value: "{{ .Values.env.GRC_CLAW_PORT }}"
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
