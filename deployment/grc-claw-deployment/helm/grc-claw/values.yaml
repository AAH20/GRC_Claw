global:
  imageRegistry: ghcr.io/grc-claw
  imagePullPolicy: Always
  storageClass: premium-rwo
  istio:
    enabled: true
  monitoring:
    enabled: true
policyApi:
  replicas: 3
  image:
    repository: policy-api
    tag: v1.2.0
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 2000m
      memory: 2Gi
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
pdpService:
  replicas: 3
  image:
    repository: pdp-service
    tag: v1.2.0
  resources:
    requests:
      cpu: 1000m
      memory: 1Gi
    limits:
      cpu: 4000m
      memory: 4Gi
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 20
    targetCPUUtilizationPercentage: 70
pepGateway:
  replicas: 3
  image:
    repository: pep-gateway
    tag: v1.2.0
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 2000m
      memory: 2Gi
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 20
    targetCPUUtilizationPercentage: 70
agentIdentity:
  replicas: 3
  image:
    repository: agent-identity
    tag: v1.2.0
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
evidenceCollector:
  replicas: 3
  image:
    repository: evidence-collector
    tag: v1.2.0
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 2000m
      memory: 2Gi
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 15
    targetCPUUtilizationPercentage: 70
postgresql:
  enabled: true
  architecture: replication
  replicaCount: 3
  resources:
    requests:
      cpu: 2000m
      memory: 4Gi
    limits:
      cpu: 8000m
      memory: 16Gi
  persistence:
    size: 500Gi
    storageClass: premium-rwo
redis:
  enabled: true
  architecture: cluster
  cluster:
    shards: 3
    replicasPerShard: 1
  resources:
    requests:
      cpu: 500m
      memory: 2Gi
    limits:
      cpu: 2000m
      memory: 8Gi
  persistence:
    size: 50Gi
    storageClass: premium-rwo
kafka:
  enabled: true
  replicaCount: 3
  resources:
    requests:
      cpu: 1000m
      memory: 4Gi
    limits:
      cpu: 4000m
      memory: 16Gi
  persistence:
    size: 200Gi
    storageClass: premium-rwo
