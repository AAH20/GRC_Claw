{{- if .Values.pdpService.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: pdp-service
  namespace: {{ .Release.Namespace }}
  labels:
    app: pdp-service
spec:
  selector:
    app: pdp-service
  ports:
    - port: 80
      targetPort: 8080
      name: http
    - port: 9090
      targetPort: 9090
      name: grpc
  type: ClusterIP
{{- end }}
