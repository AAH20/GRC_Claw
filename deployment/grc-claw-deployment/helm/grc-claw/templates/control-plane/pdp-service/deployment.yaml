{{- if .Values.pdpService.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pdp-service
  namespace: {{ .Release.Namespace }}
  labels:
    app: pdp-service
    grc.component: pdp-service
    grc.tier: control-plane
spec:
  replicas: {{ .Values.pdpService.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: pdp-service
  template:
    metadata:
      labels:
        app: pdp-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: pdp-service
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
      containers:
        - name: pdp
          image: "{{ .Values.global.imageRegistry }}/{{ .Values.pdpService.image.repository }}:{{ .Values.pdpService.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 9090
              name: grpc
          resources:
            requests:
              cpu: {{ .Values.pdpService.resources.requests.cpu }}
              memory: {{ .Values.pdpService.resources.requests.memory }}
            limits:
              cpu: {{ .Values.pdpService.resources.limits.cpu }}
              memory: {{ .Values.pdpService.resources.limits.memory }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: opa-policies
              mountPath: /policies
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: opa-policies
          configMap:
            name: opa-policy-bundles
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: pdp-service
                topologyKey: topology.kubernetes.io/zone
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: pdp-service
{{- end }}
