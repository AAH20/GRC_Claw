{{- if .Values.reportingEngine.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reporting-engine
  namespace: {{ .Release.Namespace }}
  labels:
    app: reporting-engine
    grc.component: reporting-engine
    grc.tier: analytics
spec:
  replicas: {{ .Values.reportingEngine.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: reporting-engine
  template:
    metadata:
      labels:
        app: reporting-engine
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: reporting-engine
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
      containers:
        - name: reporting
          image: "{{ .Values.global.imageRegistry }}/{{ .Values.reportingEngine.image.repository }}:{{ .Values.reportingEngine.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests:
              cpu: {{ .Values.reportingEngine.resources.requests.cpu }}
              memory: {{ .Values.reportingEngine.resources.requests.memory }}
            limits:
              cpu: {{ .Values.reportingEngine.resources.limits.cpu }}
              memory: {{ .Values.reportingEngine.resources.limits.memory }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: reporting-engine
                topologyKey: topology.kubernetes.io/zone
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: reporting-engine
{{- end }}
