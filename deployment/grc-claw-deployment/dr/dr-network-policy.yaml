apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dr-replication
  namespace: grc-claw-data
spec:
  podSelector:
    matchLabels:
      app: postgresql
  policyTypes:
  - Ingress
  ingress:
  - from:
    - ipBlock:
        cidr: 10.0.0.0/8
    ports:
    - protocol: TCP
      port: 5432
