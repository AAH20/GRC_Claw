apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: pdp-service-authz
  namespace: grc-claw-control-plane
spec:
  selector:
    matchLabels:
      app: pdp-service
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - "cluster.local/ns/grc-claw-control-plane/sa/pep-gateway"
              - "cluster.local/ns/grc-claw-control-plane/sa/policy-api"
      to:
        - operation:
            methods: ["GET", "POST"]
            paths: ["/v1/evaluate", "/v1/batch-evaluate", "/healthz", "/readyz", "/metrics"]
---
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: pep-gateway-authz
  namespace: grc-claw-control-plane
spec:
  selector:
    matchLabels:
      app: pep-gateway
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - "cluster.local/ns/grc-claw-ingress/sa/istio-ingressgateway-service-account"
      to:
        - operation:
            methods: ["GET", "POST"]
            paths: ["/v1/enforce", "/v1/check", "/healthz", "/readyz", "/metrics"]
---
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: policy-api-authz
  namespace: grc-claw-control-plane
spec:
  selector:
    matchLabels:
      app: policy-api
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - "cluster.local/ns/grc-claw-ingress/sa/istio-ingressgateway-service-account"
              - "cluster.local/ns/grc-claw-control-plane/sa/pdp-service"
      to:
        - operation:
            methods: ["GET", "POST", "PUT", "DELETE"]
            paths: ["/v1/policies/*", "/v1/policies", "/healthz", "/readyz", "/metrics"]
---
