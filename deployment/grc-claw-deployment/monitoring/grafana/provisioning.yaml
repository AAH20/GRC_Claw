apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning
  namespace: grc-claw-observability
data:
  datasources.yml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
        editable: false

      - name: Loki
        type: loki
        access: proxy
        url: http://loki:3100
        editable: false

      - name: Tempo
        type: tempo
        access: proxy
        url: http://tempo:3200
        editable: false

  dashboards.yml: |
    apiVersion: 1
    providers:
      - name: grc-claw
        orgId: 1
        folder: GRC_Claw
        type: file
        disableDeletion: false
        updateIntervalSeconds: 30
        allowUiUpdates: true
        options:
          path: /etc/grafana/dashboards
