global:
  smtp_smarthost: smtp.grc-claw.internal:587
  smtp_from: alerts@grc-claw.io
  slack_api_url: ${SLACK_WEBHOOK_URL}
  pagerduty_url: https://events.pagerduty.com/v2/enqueue
route:
  receiver: default
  group_by:
  - alertname
  - component
  - severity
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
  - match:
      severity: critical
    receiver: pagerduty-critical
    group_wait: 0s
    repeat_interval: 5m
  - match:
      severity: high
    receiver: slack-high
    group_wait: 30s
    repeat_interval: 15m
  - match:
      severity: medium
    receiver: slack-medium
    group_wait: 1m
    repeat_interval: 1h
receivers:
- name: default
  slack_configs:
  - channel: '#grc-claw-alerts'
    send_resolved: true
- name: pagerduty-critical
  pagerduty_configs:
  - service_key: ${PAGERDUTY_KEY}
    severity: critical
  slack_configs:
  - channel: '#grc-claw-critical'
    send_resolved: true
- name: slack-high
  slack_configs:
  - channel: '#grc-claw-alerts'
    send_resolved: true
- name: slack-medium
  slack_configs:
  - channel: '#grc-claw-alerts'
    send_resolved: true
inhibit_rules:
- source_match:
    severity: critical
  target_match:
    severity: high
  equal:
  - alertname
  - component
