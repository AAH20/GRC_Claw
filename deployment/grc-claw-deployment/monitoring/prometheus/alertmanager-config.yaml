apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: grc-claw-observability
data:
  alertmanager.yml: |
    global:
      smtp_smarthost: smtp.gmail.com:587
      smtp_from: alerts@grc-claw.io
      smtp_auth_username: alerts@grc-claw.io
      smtp_auth_password: "${SMTP_PASSWORD}"
      slack_api_url: "${SLACK_WEBHOOK_URL}"
      pagerduty_url: "https://events.pagerduty.com/v2/enqueue"

    route:
      receiver: default
      group_by: ["alertname", "severity", "namespace"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
        - match:
            severity: critical
          receiver: pagerduty-critical
          group_wait: 0s
          repeat_interval: 5m
        - match:
            severity: high
          receiver: slack-high
          group_wait: 0s
          repeat_interval: 15m
        - match:
            severity: medium
          receiver: slack-medium
        - match:
            severity: low
          receiver: slack-low

    receivers:
      - name: default
        slack_configs:
          - channel: "#grc-claw-alerts"
            send_resolved: true

      - name: pagerduty-critical
        pagerduty_configs:
          - service_key: "${PAGERDUTY_SERVICE_KEY}"
            severity: critical
            description: "{{ .GroupLabels.alertname }}: {{ .CommonAnnotations.summary }}"

      - name: slack-high
        slack_configs:
          - channel: "#grc-claw-alerts"
            send_resolved: true
            title: "{{ .GroupLabels.alertname }}"
            text: "{{ .CommonAnnotations.description }}"

      - name: slack-medium
        slack_configs:
          - channel: "#grc-claw-alerts"
            send_resolved: true

      - name: slack-low
        slack_configs:
          - channel: "#grc-claw-alerts"
            send_resolved: true

    inhibit_rules:
      - source_match:
          severity: critical
        target_match:
          severity: high
        equal: ["alertname", "namespace"]
      - source_match:
          severity: high
        target_match:
          severity: medium
        equal: ["alertname", "namespace"]
