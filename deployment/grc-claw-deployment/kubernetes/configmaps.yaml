apiVersion: v1
kind: ConfigMap
metadata:
  name: opa-policy-bundles
  namespace: grc-claw-control-plane
data:
  .gitkeep: ""
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-config
  namespace: grc-claw-data
data:
  redis.conf: |
    port 6379
    cluster-enabled yes
    cluster-config-file nodes.conf
    cluster-node-timeout 5000
    appendonly yes
    appendfsync everysec
    maxmemory 6gb
    maxmemory-policy allkeys-lru
    save 900 1
    save 300 10
    save 60 10000
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vault-config
  namespace: grc-claw-data
data:
  vault.hcl: |
    storage "raft" {
      path = "/vault/data"
      node_id = "node1"
    }
    listener "tcp" {
      address = "0.0.0.0:8200"
      tls_disable = 1
    }
    api_addr = "http://vault:8200"
    cluster_addr = "https://vault:8201"
    ui = true
    disable_mlock = true
    seal "awskms" {
      region = "us-east-1"
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: grc-claw-observability
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    processors:
      batch:
        timeout: 1s
        send_batch_size: 1024
      memory_limiter:
        limit_mib: 512
        spike_limit_mib: 128
    exporters:
      prometheusremotewrite:
        endpoint: http://prometheus:9090/api/v1/write
      loki:
        endpoint: http://loki:3100/loki/api/v1/push
      otlp/tempo:
        endpoint: tempo:4317
        tls:
          insecure: true
    service:
      pipelines:
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [prometheusremotewrite]
        logs:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [loki]
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [otlp/tempo]
