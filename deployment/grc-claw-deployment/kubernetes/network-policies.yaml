apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pdp-service-netpol
  namespace: grc-claw-control-plane
spec:
  podSelector:
    matchLabels:
      app: pdp-service
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: pep-gateway
        - podSelector:
            matchLabels:
              app: policy-api
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 9090
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: postgresql
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - podSelector:
            matchLabels:
              app: redis
      ports:
        - protocol: TCP
          port: 6379
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pep-gateway-netpol
  namespace: grc-claw-control-plane
spec:
  podSelector:
    matchLabels:
      app: pep-gateway
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              grc.tier: ingress
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: pdp-service
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 9090
    - to:
        - podSelector:
            matchLabels:
              app: agent-identity
      ports:
        - protocol: TCP
          port: 8080
---
