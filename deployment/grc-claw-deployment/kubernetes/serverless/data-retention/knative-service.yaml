apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: data-retention
  namespace: grc-claw-serverless
  labels:
    app: data-retention
    grc.component: data-retention
    grc.tier: serverless
  annotations:
    autoscaling.knative.dev/minScale: '0'
    autoscaling.knative.dev/maxScale: '2'
    autoscaling.knative.dev/target: '1'
    autoscaling.knative.dev/targetBurstCapacity: '2'
    autoscaling.knative.dev/scale-down-delay: 5m
    autoscaling.knative.dev/window: 60s
    autoscaling.knative.dev/metric: concurrency
    autoscaling.knative.dev/class: kpa.autoscaling.knative.dev
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/class: kpa.autoscaling.knative.dev
    spec:
      containerConcurrency: 1
      timeoutSeconds: 600
      containers:
      - image: ghcr.io/grc-claw/data-retention:v1.2.0
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        env:
        - name: RETENTION_DAYS
          value: '2555'
        - name: ARCHIVE_FORMAT
          value: parquet
        securityContext:
          runAsNonRoot: true
          runAsUser: 65534
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
