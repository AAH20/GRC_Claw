apiVersion: apps/v1
kind: Deployment
metadata:
  name: compliance-mapping
  namespace: grc-claw-evidence
  labels:
    app: compliance-mapping
    grc.component: compliance-mapping
    grc.tier: evidence
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: compliance-mapping
  template:
    metadata:
      labels:
        app: compliance-mapping
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: compliance-mapping
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
      containers:
        - name: compliance-mapping
          image: ghcr.io/grc-claw/compliance-mapping:v1.2.0
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: compliance-mapping
  namespace: grc-claw-evidence
  labels:
    app: compliance-mapping
spec:
  selector:
    app: compliance-mapping
  ports:
    - port: 8080
      name: http
      targetPort: 8080
  type: ClusterIP
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: compliance-mapping-pdb
  namespace: grc-claw-evidence
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: compliance-mapping
