apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-identity
  namespace: grc-claw-control-plane
  labels:
    app: agent-identity
    grc.component: agent-identity
    grc.tier: control-plane
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: agent-identity
  template:
    metadata:
      labels:
        app: agent-identity
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: agent-identity
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
      containers:
        - name: agent-identity
          image: ghcr.io/grc-claw/agent-identity:v1.2.0
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: agent-identity
  namespace: grc-claw-control-plane
  labels:
    app: agent-identity
spec:
  selector:
    app: agent-identity
  ports:
    - port: 8080
      name: http
      targetPort: 8080
  type: ClusterIP
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: agent-identity-pdb
  namespace: grc-claw-control-plane
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: agent-identity
