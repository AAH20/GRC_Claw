name: Docker Build and Push

on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: grc-claw

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v2
        id: filter
        with:
          filters: |
            policy-api: docker/policy-api/**
            pdp-service: docker/pdp-service/**
            pep-gateway: docker/pep-gateway/**
            agent-identity: docker/agent-identity/**
            evidence-collector: docker/evidence-collector/**
            compliance-mapping: docker/compliance-mapping/**
            analytics-engine: docker/analytics-engine/**
            reporting-engine: docker/reporting-engine/**
            discovery-engine: docker/discovery-engine/**
            risk-assessment: docker/risk-assessment/**
            approval-workflow: docker/approval-workflow/**

  build:
    needs: changes
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [policy-api, pdp-service, pep-gateway, agent-identity, evidence-collector, compliance-mapping, analytics-engine, reporting-engine, discovery-engine, risk-assessment, approval-workflow]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}
          tags: |
            type=semver,pattern={{version}}
            type=ref,event=branch
            type=sha,prefix=,suffix=,format=short

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./docker/${{ matrix.service }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: "1"

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:${{ github.sha }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Sign image with Cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v3
      - run: |
          cosign sign --yes             ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}@${{ steps.build.outputs.digest }}
        env:
          COSIGN_EXPERIMENTAL: "1"

  helm-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: v3.13.0
      - name: Lint Helm chart
        run: |
          helm lint helm/grc-claw
          helm template helm/grc-claw --values helm/grc-claw/values-production.yaml > /dev/null
      - name: Run kubeval
        run: |
          helm template helm/grc-claw | kubeval --strict

  deploy-staging:
    needs: [build, helm-lint]
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - name: Update image tags in GitOps repo
        run: |
          git clone https://github.com/grc-claw/grc-claw-gitops.git
          cd grc-claw-gitops
          yq e -i '.image.tag = "${{ github.sha }}"' environments/staging/us-east-1/values-*.yaml
          git commit -am "Update staging images to ${{ github.sha }}"
          git push

  deploy-production:
    needs: [build, helm-lint]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Update image tags in GitOps repo
        run: |
          git clone https://github.com/grc-claw/grc-claw-gitops.git
          cd grc-claw-gitops
          yq e -i '.image.tag = "${{ github.ref_name }}"' environments/production/us-east-1/values-*.yaml
          git commit -am "Update production images to ${{ github.ref_name }}"
          git push
