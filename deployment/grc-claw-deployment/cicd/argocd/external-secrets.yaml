apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: vault-backend
spec:
  provider:
    vault:
      server: https://vault.grc-claw.internal:8200
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: external-secrets
          serviceAccountRef:
            name: external-secrets
            namespace: grc-claw-data
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: pdp-service-db-credentials
  namespace: grc-claw-control-plane
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: pdp-service-db-credentials
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        DATABASE_URL: "postgresql://{{ .username }}:{{ .password }}@postgresql:5432/grc_claw"
  data:
    - secretKey: username
      remoteRef:
        key: grc-claw/production/pdp-service
        property: db-username
    - secretKey: password
      remoteRef:
        key: grc-claw/production/pdp-service
        property: db-password
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: db-credentials
  namespace: grc-claw-data
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: db-credentials
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        url: "postgresql://{{ .username }}:{{ .password }}@postgresql:5432/grc_claw"
        username: "{{ .username }}"
        password: "{{ .password }}"
  data:
    - secretKey: username
      remoteRef:
        key: grc-claw/production/database
        property: username
    - secretKey: password
      remoteRef:
        key: grc-claw/production/database
        property: password
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: redis-credentials
  namespace: grc-claw-data
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: redis-credentials
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        url: "redis://:{{ .password }}@redis:6379/0"
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: grc-claw/production/redis
        property: password
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: minio-credentials
  namespace: grc-claw-data
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: minio-credentials
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        access-key: "{{ .access-key }}"
        secret-key: "{{ .secret-key }}"
  data:
    - secretKey: access-key
      remoteRef:
        key: grc-claw/production/minio
        property: access-key
    - secretKey: secret-key
      remoteRef:
        key: grc-claw/production/minio
        property: secret-key
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: immudb-credentials
  namespace: grc-claw-data
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: immudb-credentials
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        admin-password: "{{ .admin-password }}"
  data:
    - secretKey: admin-password
      remoteRef:
        key: grc-claw/production/immudb
        property: admin-password
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: vault-unseal-key
  namespace: grc-claw-data
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: vault-unseal-key
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        key-id: "{{ .key-id }}"
  data:
    - secretKey: key-id
      remoteRef:
        key: grc-claw/production/vault
        property: unseal-key-id
