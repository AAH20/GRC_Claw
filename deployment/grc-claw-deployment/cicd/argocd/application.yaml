apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grc-claw-production
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: '2'
spec:
  project: grc-claw-production
  source:
    repoURL: https://github.com/grc-claw/grc-claw-gitops.git
    targetRevision: HEAD
    path: environments/production/us-east-1
    helm:
      valueFiles:
      - values-production.yaml
      parameters:
      - name: global.imageRegistry
        value: ghcr.io/grc-claw
      - name: pdpService.replicas
        value: '3'
      - name: pepGateway.replicas
        value: '3'
  destination:
    server: https://prod-us-east-1.grc-claw.internal
    namespace: grc-claw
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
    - CreateNamespace=true
    - PrunePropagationPolicy=foreground
    - PruneLast=true
    - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  ignoreDifferences:
  - group: apps
    kind: Deployment
    jsonPointers:
    - /spec/replicas
