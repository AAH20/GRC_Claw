# GRC_Claw — Local Development Docker Compose
# Mirrors the production K8s architecture for local development.
#
# Usage:
#   docker compose up -d           # Start all services
#   docker compose up -d policy-api  # Start a single service
#   docker compose logs -f policy-api  # Tail logs
#   docker compose down            # Stop all
#   docker compose down -v         # Stop and wipe volumes
#
# For live reload development, use Tilt (see Tiltfile) or Skaffold (see skaffold.yaml).

name: grc-claw

x-common-variables: &common-variables
  ENVIRONMENT: development
  LOG_LEVEL: debug
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
  OTEL_SERVICE_NAME: grc-claw

x-common-labels: &common-labels
  app.kubernetes.io/part-of: grc-claw
  app.kubernetes.io/managed-by: docker-compose

services:
  # ─────────────────────────────────────────────────────────────────────────
  # Data Layer
  # ─────────────────────────────────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: grc_claw
      POSTGRES_PASSWORD: grc_claw_dev_password
      POSTGRES_DB: grc_claw
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grc_claw -d grc_claw"]
      interval: 5s
      timeout: 3s
      retries: 10
    labels: *common-labels

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    labels: *common-labels

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 10
    labels: *common-labels

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_log:/var/lib/zookeeper/log
    labels: *common-labels

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10
    labels: *common-labels

  vault:
    image: hashicorp/vault:1.15
    ports:
      - "8200:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: dev-root-token
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    cap_add:
      - IPC_LOCK
    labels: *common-labels

  # ─────────────────────────────────────────────────────────────────────────
  # Control Plane Services
  # ─────────────────────────────────────────────────────────────────────────

  policy-api:
    build:
      context: ./grc-claw-deployment/docker/policy-api
      dockerfile: Dockerfile
      target: builder
    ports:
      - "8081:8080"
      - "50051:50051"
    environment:
      <<: *common-variables
      SERVICE_NAME: policy-api
      DATABASE_URL: postgresql+asyncpg://grc_claw:grc_claw_dev_password@postgres:5432/grc_claw
      REDIS_URL: redis://redis:6379/0
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: dev-root-token
    volumes:
      - ./grc-claw-deployment/docker/policy-api:/app:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels: *common-labels

  pdp-service:
    build:
      context: ./grc-claw-deployment/docker/pdp-service
      dockerfile: Dockerfile
      target: builder
    ports:
      - "8082:8080"
      - "50052:50051"
    environment:
      <<: *common-variables
      SERVICE_NAME: pdp-service
      DATABASE_URL: postgresql+asyncpg://grc_claw:grc_claw_dev_password@postgres:5432/grc_claw
      REDIS_URL: redis://redis:6379/0
      POLICY_API_URL: http://policy-api:8080
      OPA_URL: http://opa:8181
    volumes:
      - ./grc-claw-deployment/docker/pdp-service:/app:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      policy-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels: *common-labels

  pep-gateway:
    build:
      context: ./grc-claw-deployment/docker/pep-gateway
      dockerfile: Dockerfile
      target: builder
    ports:
      - "8083:8080"
      - "50053:50051"
    environment:
      <<: *common-variables
      SERVICE_NAME: pep-gateway
      DATABASE_URL: postgresql+asyncpg://grc_claw:grc_claw_dev_password@postgres:5432/grc_claw
      REDIS_URL: redis://redis:6379/0
      PDP_SERVICE_URL: http://pdp-service:8080
      AGENT_IDENTITY_URL: http://agent-identity:8080
    volumes:
      - ./grc-claw-deployment/docker/pep-gateway:/app:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      pdp-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels: *common-labels

  agent-identity:
    build:
      context: ./grc-claw-deployment/docker/agent-identity
      dockerfile: Dockerfile
      target: builder
    ports:
      - "8084:8080"
    environment:
      <<: *common-variables
      SERVICE_NAME: agent-identity
      DATABASE_URL: postgresql+asyncpg://grc_claw:grc_claw_dev_password@postgres:5432/grc_claw
      REDIS_URL: redis://redis:6379/0
      SPIRE_SERVER_ADDR: spire-server:8081
    volumes:
      - ./grc-claw-deployment/docker/agent-identity:/app:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels: *common-labels

  # ─────────────────────────────────────────────────────────────────────────
  # Analytics Services
  # ─────────────────────────────────────────────────────────────────────────

  analytics-engine:
    build:
      context: ./grc-claw-deployment/docker/analytics-engine
      dockerfile: Dockerfile
      target: builder
    ports:
      - "8085:8080"
    environment:
      <<: *common-variables
      SERVICE_NAME: analytics-engine
      DATABASE_URL: postgresql+asyncpg://grc_claw:grc_claw_dev_password@postgres:5432/grc_claw
      REDIS_URL: redis://redis:6379/0
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    volumes:
      - ./grc-claw-deployment/docker/analytics-engine:/app:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels: *common-labels

  reporting-engine:
    build:
      context: ./grc-claw-deployment/docker/reporting-engine
      dockerfile: Dockerfile
      target: builder
    ports:
      - "8086:8080"
    environment:
      <<: *common-variables
      SERVICE_NAME: reporting-engine
      DATABASE_URL: postgresql+asyncpg://grc_claw:grc_claw_dev_password@postgres:5432/grc_claw
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    volumes:
      - ./grc-claw-deployment/docker/reporting-engine:/app:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels: *common-labels

  # ─────────────────────────────────────────────────────────────────────────
  # Evidence Services
  # ─────────────────────────────────────────────────────────────────────────

  evidence-collector:
    build:
      context: ./grc-claw-deployment/docker/evidence-collector
      dockerfile: Dockerfile
      target: builder
    ports:
      - "8087:8080"
    environment:
      <<: *common-variables
      SERVICE_NAME: evidence-collector
      DATABASE_URL: postgresql+asyncpg://grc_claw:grc_claw_dev_password@postgres:5432/grc_claw
      REDIS_URL: redis://redis:6379/0
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    volumes:
      - ./grc-claw-deployment/docker/evidence-collector:/app:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels: *common-labels

  evidence-validator:
    build:
      context: ./grc-claw-deployment/docker/evidence-validator
      dockerfile: Dockerfile
      target: builder
    ports:
      - "8088:8080"
    environment:
      <<: *common-variables
      SERVICE_NAME: evidence-validator
      DATABASE_URL: postgresql+asyncpg://grc_claw:grc_claw_dev_password@postgres:5432/grc_claw
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./grc-claw-deployment/docker/evidence-validator:/app:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels: *common-labels

  compliance-mapping:
    build:
      context: ./grc-claw-deployment/docker/compliance-mapping
      dockerfile: Dockerfile
      target: builder
    ports:
      - "8089:8080"
    environment:
      <<: *common-variables
      SERVICE_NAME: compliance-mapping
      DATABASE_URL: postgresql+asyncpg://grc_claw:grc_claw_dev_password@postgres:5432/grc_claw
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./grc-claw-deployment/docker/compliance-mapping:/app:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels: *common-labels

  # ─────────────────────────────────────────────────────────────────────────
  # Observability Stack
  # ─────────────────────────────────────────────────────────────────────────

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.91.0
    command: ["--config=/etc/otel-collector-config.yaml"]
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "8888:8888"   # Metrics
    volumes:
      - ./grc-claw-deployment/monitoring/otel-collector/config.yaml:/etc/otel-collector-config.yaml:ro
    depends_on:
      - prometheus
      - jaeger
    labels: *common-labels

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./grc-claw-deployment/monitoring/prometheus/prometheus-config.yaml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    labels: *common-labels

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./grc-claw-deployment/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    labels: *common-labels

  jaeger:
    image: jaegertracing/all-in-one:latest
    ports:
      - "16686:16686"   # Jaeger UI
      - "14250:14250"   # gRPC
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    labels: *common-labels

  loki:
    image: grafana/loki:latest
    ports:
      - "3100:3100"
    volumes:
      - ./grc-claw-deployment/monitoring/loki/loki-config.yaml:/etc/loki/local-config.yaml:ro
    command: -config.file=/etc/loki/local-config.yaml
    labels: *common-labels

  # ─────────────────────────────────────────────────────────────────────────
  # Gateway (Node.js)
  # ─────────────────────────────────────────────────────────────────────────

  grc-claw-gateway:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: build
    ports:
      - "18791:18791"
    environment:
      GRC_CLAW_HOST: 0.0.0.0
      GRC_CLAW_PORT: 18791
      GRC_CLAW_GATEWAY_TOKEN: ${GRC_CLAW_GATEWAY_TOKEN:-dev-gateway-token}
      A2Z_SOC_MODE: ${A2Z_SOC_MODE:-demo}
      A2Z_SOC_BASE_URL: ${A2Z_SOC_BASE_URL:-http://host.docker.internal:3000}
      A2Z_SOC_API_KEY: ${A2Z_SOC_API_KEY:-}
      A2Z_SOC_TENANT_ID: ${A2Z_SOC_TENANT_ID:-1}
      POLICY_API_URL: http://policy-api:8080
      PDP_SERVICE_URL: http://pdp-service:8080
      PEP_GATEWAY_URL: http://pep-gateway:8080
      AGENT_IDENTITY_URL: http://agent-identity:8080
      ANALYTICS_ENGINE_URL: http://analytics-engine:8080
      REPORTING_ENGINE_URL: http://reporting-engine:8080
      EVIDENCE_COLLECTOR_URL: http://evidence-collector:8080
      EVIDENCE_VALIDATOR_URL: http://evidence-validator:8080
      COMPLIANCE_MAPPING_URL: http://compliance-mapping:8080
    volumes:
      - ../:/app:ro
    depends_on:
      - policy-api
      - pdp-service
      - pep-gateway
      - agent-identity
    labels: *common-labels

  # ─────────────────────────────────────────────────────────────────────────
  # OPA (Open Policy Agent) — used by PDP service
  # ─────────────────────────────────────────────────────────────────────────

  opa:
    image: openpolicyagent/opa:latest
    ports:
      - "8181:8181"
    command:
      - "run"
      - "--server"
      - "--addr=0.0.0.0:8181"
      - "--diagnostic-addr=0.0.0.0:8082"
      - "./policies"
    volumes:
      - ./policies:/policies:ro
    labels: *common-labels

volumes:
  postgres_data:
  redis_data:
  kafka_data:
  zookeeper_data:
  zookeeper_log:
  minio_data:
  prometheus_data:
  grafana_data:

networks:
  default:
    name: grc-claw-dev
    driver: bridge
