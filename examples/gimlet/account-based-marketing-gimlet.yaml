---
# Gimlet Deployment Configuration for account-based-marketing
# Production-grade configuration with build, deploy, and release pipeline
apiVersion: gimlet.io/v1
kind: Gimlet
metadata:
  name: account-based-marketing
  namespace: grc
  labels:
    app: account-based-marketing
    tier: backend
    managed-by: gimlet
spec:
  build:
    dockerfile: Dockerfile
    context: .
    target: production
    args:
      - name: NODE_ENV
        value: production
      - name: BUILD_ID
        value: "{{ .BuildID }}"
    cache:
      enabled: true
      key: account-based-marketing-{{ .Branch }}
    resources:
      cpu: "500m"
      memory: "512Mi"
    secrets:
      - name: npm-token
        source: vault://grc/npm-token
        target: NPM_TOKEN
  deploy:
    namespace: grc
    replicas: 3
    strategy:
      type: RollingUpdate
      rollingUpdate:
        maxSurge: 1
        maxUnavailable: 0
    containers:
      - name: account-based-marketing
        image: grc-registry/account-based-marketing:{{ .Tag }}
        ports:
          - containerPort: 8080
            protocol: TCP
        env:
          - name: NODE_ENV
            value: production
          - name: LOG_LEVEL
            value: info
          - name: METRICS_PORT
            value: "9090"
        envFrom:
          - configMapRef:
              name: account-based-marketing-config
          - secretRef:
              name: account-based-marketing-secrets
        resources:
          requests:
            cpu: "250m"
            memory: "256Mi"
          limits:
            cpu: "1000m"
            memory: "1Gi"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
          failureThreshold: 12
    service:
      type: ClusterIP
      ports:
        - port: 80
          targetPort: 8080
          protocol: TCP
          name: http
        - port: 9090
          targetPort: 9090
          protocol: TCP
          name: metrics
    ingress:
      enabled: true
      className: nginx
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod
        nginx.ingress.kubernetes.io/rate-limit: "100"
      hosts:
        - host: account-based-marketing.grc.svc.cluster.local
          paths:
            - path: /
              pathType: Prefix
        - host: account-based-marketing.example.com
          paths:
            - path: /
              pathType: Prefix
      tls:
        - secretName: account-based-marketing-tls
          hosts:
            - account-based-marketing.example.com
    autoscaling:
      enabled: true
      minReplicas: 3
      maxReplicas: 10
      targetCPUUtilizationPercentage: 70
      targetMemoryUtilizationPercentage: 80
    podDisruptionBudget:
      enabled: true
      minAvailable: 2
    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values:
                      - account-based-marketing
              topologyKey: kubernetes.io/hostname
  release:
    environments:
      - name: staging
        autoDeploy: true
        promotion: automatic
        checks:
          - type: smoke
            endpoint: /health
            timeout: 30s
          - type: integration
            suite: account-based-marketing-staging
            timeout: 300s
      - name: production
        autoDeploy: false
        promotion: manual
        checks:
          - type: smoke
            endpoint: /health
            timeout: 30s
          - type: integration
            suite: account-based-marketing-production
            timeout: 600s
          - type: performance
            suite: account-based-marketing-perf
            timeout: 300s
        canary:
          enabled: true
          steps:
            - weight: 10
              duration: 5m
            - weight: 25
              duration: 10m
            - weight: 50
              duration: 15m
            - weight: 100
              duration: 0m
          analysis:
            thresholdRange:
              min: 0
              max: 100
            metrics:
              - name: request-success-rate
                thresholdRange:
                  min: 99
              - name: request-duration-p99
                thresholdRange:
                  max: 500
        rollback:
          automatic: true
          threshold:
            errorRate: 5
            latencyP99: 1000
    notifications:
      slack:
        channel: "#grc-deployments"
        webhook: "{{ .Secrets.SLACK_WEBHOOK }}"
      email:
        recipients:
          - team-grc@example.com
    artifacts:
      - name: deployment-manifest
        path: k8s/deployment.yaml
      - name: service-manifest
        path: k8s/service.yaml
      - name: ingress-manifest
        path: k8s/ingress.yaml
