version: v2beta1

name: onboarding-training

# ============================================================
# BUILD CONFIGURATION
# ============================================================
images:
  onboarding-training:
    image: ghcr.io/grc-claw/onboarding-training
    dockerfile: ./Dockerfile
    context: .
    rebuildStrategy: ignoreContextChanges
    buildKit:
      args:
        BUILDKIT_INLINE_CACHE: "1"
    tags:
      - latest
      - $(git rev-parse --short HEAD)

# ============================================================
# DEPLOY CONFIGURATION
# ============================================================
deployments:
  onboarding-training:
    helm:
      values:
        replicaCount: 2
        image:
          repository: ghcr.io/grc-claw/onboarding-training
          tag: latest
          pullPolicy: IfNotPresent
        imagePullSecrets:
          - name: ghcr-registry-secret
        serviceAccount:
          create: true
          name: onboarding-training-sa
        service:
          type: ClusterIP
          port: 8026
          targetPort: 8026
          protocol: TCP
        ingress:
          enabled: true
          className: nginx
          annotations:
            cert-manager.io/cluster-issuer: letsencrypt-prod
            nginx.ingress.kubernetes.io/rate-limit: "100"
          hosts:
            - host: onboarding-training.grc-claw.local
              paths:
                - path: /
                  pathType: Prefix
          tls:
            - secretName: onboarding-training-tls
              hosts:
                - onboarding-training.grc-claw.local
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        autoscaling:
          enabled: true
          minReplicas: 2
          maxReplicas: 5
          targetCPUUtilizationPercentage: 70
          targetMemoryUtilizationPercentage: 80
        livenessProbe:
          httpGet:
            path: /health
            port: 8026
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: 8026
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        env:
          - name: SERVICE_NAME
            value: "onboarding-training"
          - name: SERVICE_PORT
            value: "8026"
          - name: LOG_LEVEL
            value: "info"
          - name: ENVIRONMENT
            value: "development"
          - name: REDIS_URL
            valueFrom:
              secretKeyRef:
                name: onboarding-training-secrets
                key: redis-url
          - name: DATABASE_URL
            valueFrom:
              secretKeyRef:
                name: onboarding-training-secrets
                key: database-url
          - name: API_KEY
            valueFrom:
              secretKeyRef:
                name: onboarding-training-secrets
                key: api-key
        envFrom:
          - configMapRef:
              name: onboarding-training-config
        podAnnotations:
          prometheus.io/scrape: "true"
          prometheus.io/port: "8026"
          prometheus.io/path: "/metrics"
        podSecurityContext:
          runAsNonRoot: true
          runAsUser: 1000
          fsGroup: 1000
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
        topologySpreadConstraints:
          - maxSkew: 1
            topologyKey: topology.kubernetes.io/zone
            whenUnsatisfiable: ScheduleAnyway
            labelSelector:
              matchLabels:
                app: onboarding-training
        affinity:
          podAntiAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                podAffinityTerm:
                  labelSelector:
                    matchExpressions:
                      - key: app
                        operator: In
                        values:
                          - onboarding-training
                  topologyKey: kubernetes.io/hostname

# ============================================================
# DEV CONFIGURATION
# ============================================================
dev:
  onboarding-training:
    imageSelector: ghcr.io/grc-claw/onboarding-training:latest
    terminal:
      command: /bin/sh -c "echo 'DevSpace terminal for Onboarding Training' && sleep infinity"
    ports:
      - port: "8026:8026"
      - port: "9229:9229"
    sync:
      - path: ./:/app
        excludePaths:
          - .git
          - node_modules
          - __pycache__
          - .venv
          - venv
          - .devspace
          - .idea
          - .vscode
          - "*.pyc"
          - .pytest_cache
          - .mypy_cache
          - dist
          - build
          - "*.egg-info"
        uploadExcludePaths:
          - tests
          - docs
          - scripts
        onUpload:
          restartContainer: true
        initialSync: mirrorLocal
    open:
      - url: http://localhost:8026
      - url: http://localhost:8026/docs
      - url: http://localhost:8026/health
    proxySubdomains: true
    replacePods:
      - imageSelector: ghcr.io/grc-claw/onboarding-training:latest
        paths:
          - ./src
          - ./app
          - ./lib
          - ./config
    persistPaths:
      - path: /app/data
      - path: /app/logs
      - path: /app/.cache
    sshAgentForwarding: true
    interactive:
      enabled: true
      defaultEnabled: false
    terminalUI:
      enabled: true
    logs:
      enabled: true
      lastLines: 100
    pullSecrets:
      - ghcr-registry-secret
    hooks:
      - command: "echo 'Pre-build hook: Installing dependencies...'"
        events: ["before:build"]
      - command: "npm ci"
        events: ["after:build"]
      - command: "echo 'Post-deploy hook: Running migrations...'"
        events: ["after:deploy"]
      - command: "echo 'Pre-stop hook: Cleaning up...'"
        events: ["before:stop"]

# ============================================================
# PIPELINES
# ============================================================
pipelines:
  dev:
    run: |-
      run_dependencies --all
      ensure_pipelines --all
      run_images --all
      run_deployments --all
      start_dev --all
  deploy:
    run: |-
      build_images --all
      create_deployments --all
      start_dev --all
  purge:
    run: |-
      stop_dev --all
      delete_deployments --all
      purge_images --all

# ============================================================
# FUNCTIONS
# ============================================================
functions:
  run_images: |-
    images --all
  run_deployments: |-
    deployments --all
  run_dependencies: |-
    deployments --all
  ensure_pipelines: |-
    ensure_pipelines --all
  start_dev: |-
    dev --all
  stop_dev: |-
    stop_dev --all
  delete_deployments: |-
    delete_deployments --all
  purge_images: |-
    purge_images --all
  build_images: |-
    build_images --all
  create_deployments: |-
    create_deployments --all
