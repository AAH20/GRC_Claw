apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: real-estate-marketing
  namespace: argocd
  labels:
    app.kubernetes.io/name: real-estate-marketing
    app.kubernetes.io/part-of: grc-claw
    app.kubernetes.io/managed-by: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/ahmedhassan/GRC_Claw.git
    targetRevision: HEAD
    path: projects/real-estate-marketing/k8s
    helm:
      valueFiles:
      - values-production.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: real-estate-marketing
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
    - CreateNamespace=true
    - PrunePropagationPolicy=foreground
    - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  revisionHistoryLimit: 10
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: real-estate-marketing-appset
  namespace: argocd
spec:
  generators:
  - git:
      repoURL: https://github.com/ahmedhassan/GRC_Claw.git
      revision: HEAD
      directories:
      - path: projects/real-estate-marketing/*
  template:
    metadata:
      name: '{{path.basename}}'
      labels:
        app.kubernetes.io/name: real-estate-marketing
        app.kubernetes.io/part-of: grc-claw
    spec:
      project: default
      source:
        repoURL: https://github.com/ahmedhassan/GRC_Claw.git
        targetRevision: HEAD
        path: '{{path}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: real-estate-marketing
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
        - CreateNamespace=true
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: real-estate-marketing-gitops-config
  namespace: real-estate-marketing
  labels:
    app.kubernetes.io/name: real-estate-marketing
    app.kubernetes.io/part-of: grc-claw
    argocd.argoproj.io/instance: real-estate-marketing
data:
  gitops.enabled: 'true'
  gitops.repo: https://github.com/ahmedhassan/GRC_Claw.git
  gitops.branch: main
  gitops.path: projects/real-estate-marketing
  gitops.autoSync: 'true'
  gitops.prune: 'true'
  gitops.selfHeal: 'true'
  gitops.retryLimit: '5'
  gitops.timeout: 300s
  gitops.revisionHistoryLimit: '10'
  gitops.valuesFile: values-production.yaml
  gitops.environment: production
  gitops.namespace: real-estate-marketing
  gitops.healthCheck.enabled: 'true'
  gitops.healthCheck.interval: 30s
  gitops.healthCheck.timeout: 5s
  gitops.notifications.enabled: 'true'
  gitops.notifications.slackChannel: '#grc-claw-deployments'
  gitops.notifications.email: devops@example.com
  gitops.backup.enabled: 'true'
  gitops.backup.schedule: 0 2 * * *
  gitops.monitoring.enabled: 'true'
  gitops.monitoring.prometheusEnabled: 'true'
  gitops.monitoring.grafanaDashboard: real-estate-marketing-dashboard
  gitops.security.runAsNonRoot: 'true'
  gitops.security.readOnlyRootFilesystem: 'true'
  gitops.security.dropCapabilities: ALL
  gitops.resources.requests.cpu: 100m
  gitops.resources.requests.memory: 128Mi
  gitops.resources.limits.cpu: 500m
  gitops.resources.limits.memory: 512Mi
  gitops.hpa.enabled: 'true'
  gitops.hpa.minReplicas: '2'
  gitops.hpa.maxReplicas: '10'
  gitops.hpa.targetCPUUtilizationPercentage: '70'
  gitops.hpa.targetMemoryUtilizationPercentage: '80'
  gitops.ingress.enabled: 'true'
  gitops.ingress.className: nginx
  gitops.ingress.tls: 'true'
  gitops.ingress.host: real-estate-marketing.example.com
  gitops.service.type: ClusterIP
  gitops.service.port: '8080'
  gitops.service.targetPort: '8080'
  gitops.configMap.enabled: 'true'
  gitops.secret.enabled: 'true'
  gitops.pdb.enabled: 'true'
  gitops.pdb.minAvailable: '1'
  gitops.networkPolicy.enabled: 'true'
  gitops.podDisruptionBudget.enabled: 'true'
  gitops.podAntiAffinity.enabled: 'true'
  gitops.topologySpreadConstraints.enabled: 'true'
  gitops.initContainers.enabled: 'true'
  gitops.sidecars.enabled: 'true'
  gitops.volumes.enabled: 'true'
  gitops.persistence.enabled: 'false'
  gitops.persistence.storageClass: standard
  gitops.persistence.size: 1Gi
  gitops.envFrom.configMapRef: real-estate-marketing-config
  gitops.envFrom.secretRef: real-estate-marketing-secrets
  gitops.probes.liveness.enabled: 'true'
  gitops.probes.liveness.path: /healthz
  gitops.probes.liveness.port: '8080'
  gitops.probes.readiness.enabled: 'true'
  gitops.probes.readiness.path: /readyz
  gitops.probes.readiness.port: '8080'
  gitops.probes.startup.enabled: 'true'
  gitops.probes.startup.path: /healthz
  gitops.probes.startup.port: '8080'
  gitops.lifecycle.preStop.enabled: 'true'
  gitops.lifecycle.preStop.command: /bin/sh,-c,sleep 10
  gitops.lifecycle.postStart.enabled: 'true'
  gitops.lifecycle.postStart.command: /bin/sh,-c,echo Container started
  gitops.affinity.podAntiAffinity.requiredDuringSchedulingIgnoredDuringExecution: 'true'
  gitops.tolerations.enabled: 'true'
  gitops.nodeSelector.enabled: 'true'
  gitops.priorityClassName: high-priority
  gitops.serviceAccount.create: 'true'
  gitops.serviceAccount.automountServiceAccountToken: 'false'
  gitops.rbac.create: 'true'
  gitops.rbac.rules: read-only
  gitops.autoscaling.vertical.enabled: 'false'
  gitops.autoscaling.horizontal.enabled: 'true'
  gitops.deploymentStrategy.type: RollingUpdate
  gitops.deploymentStrategy.rollingUpdate.maxSurge: '1'
  gitops.deploymentStrategy.rollingUpdate.maxUnavailable: '0'
  gitops.rollout.enabled: 'false'
  gitops.rollout.strategy.canary.enabled: 'false'
  gitops.rollout.strategy.blueGreen.enabled: 'false'
  gitops.istio.enabled: 'false'
