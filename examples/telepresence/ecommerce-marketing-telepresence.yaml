apiVersion: telepresence.io/v2
kind: Intercept
metadata:
  name: ecommerce-marketing-intercept
  namespace: default
  labels:
    app: ecommerce-marketing
    project: grc-claw
    environment: development
    managed-by: telepresence
  annotations:
    description: E-commerce marketing platform for product promotions, cart abandonment
      recovery, and personalized shopping experiences.
    telepresence.io/service: ecommerce-marketing
    telepresence.io/deployment: ecommerce-marketing
spec:
  service:
    name: ecommerce-marketing
    namespace: default
    ports:
    - name: http
      port: 8117
      targetPort: 8117
      protocol: TCP
  intercept:
    headers: &id001
    - name: X-Dev-User
      value: developer@example.com
    paths:
    - /ecommerce
    methods:
    - GET
    - POST
    - PUT
    - DELETE
    - PATCH
  swap:
    deployment: ecommerce-marketing
    namespace: default
    containerPort: 8117
    protocol: http
    env:
    - name: ENV
      value: development
    - name: ECOMMERCE_PLATFORM
      value: shopify
    volumes:
    - name: ecommerce-data
      mountPath: /data
      hostPath: /tmp/ecommerce-data
    resources:
      requests:
        cpu: 500m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 1Gi
    healthCheck:
      path: /health
      port: 8117
  preview:
    enabled: true
    path: /ecommerce
    headers: *id001
    port: 8117
    targetPort: 8117
    protocol: http
