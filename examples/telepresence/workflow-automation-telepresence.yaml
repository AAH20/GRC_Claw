apiVersion: telepresence.io/v2
kind: Intercept
metadata:
  name: workflow-automation-intercept
  namespace: default
  labels:
    app: workflow-automation
    project: grc-claw
    environment: development
    managed-by: telepresence
  annotations:
    description: Marketing workflow automation platform for building, executing, and
      monitoring automated marketing processes and approvals.
    telepresence.io/service: workflow-automation
    telepresence.io/deployment: workflow-automation
spec:
  service:
    name: workflow-automation
    namespace: default
    ports:
    - name: http
      port: 8103
      targetPort: 8103
      protocol: TCP
  intercept:
    headers: &id001
    - name: X-Dev-User
      value: developer@example.com
    paths:
    - /workflows
    methods:
    - GET
    - POST
    - PUT
    - DELETE
    - PATCH
  swap:
    deployment: workflow-automation
    namespace: default
    containerPort: 8103
    protocol: http
    env:
    - name: ENV
      value: development
    - name: WORKFLOW_ENGINE
      value: temporal
    volumes:
    - name: workflow-defs
      mountPath: /definitions
      hostPath: /tmp/workflow-defs
    resources:
      requests:
        cpu: 500m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 1Gi
    healthCheck:
      path: /health
      port: 8103
  preview:
    enabled: true
    path: /workflows
    headers: *id001
    port: 8103
    targetPort: 8103
    protocol: http
