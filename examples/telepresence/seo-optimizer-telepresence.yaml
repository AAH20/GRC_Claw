apiVersion: telepresence.io/v2
kind: Intercept
metadata:
  name: seo-optimizer-intercept
  namespace: default
  labels:
    app: seo-optimizer
    project: grc-claw
    environment: development
    managed-by: telepresence
  annotations:
    description: SEO optimization service that analyzes search rankings, suggests
      content improvements, and tracks keyword performance across search engines.
    telepresence.io/service: seo-optimizer
    telepresence.io/deployment: seo-optimizer
spec:
  service:
    name: seo-optimizer
    namespace: default
    ports:
    - name: http
      port: 8087
      targetPort: 8087
      protocol: TCP
  intercept:
    headers: &id001
    - name: X-Dev-User
      value: developer@example.com
    paths:
    - /audit
    methods:
    - GET
    - POST
    - PUT
    - DELETE
    - PATCH
  swap:
    deployment: seo-optimizer
    namespace: default
    containerPort: 8087
    protocol: http
    env:
    - name: ENV
      value: development
    - name: SEARCH_ENGINES
      value: google,bing,yahoo
    volumes:
    - name: seo-reports
      mountPath: /reports
      hostPath: /tmp/seo-reports
    resources:
      requests:
        cpu: 500m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 1Gi
    healthCheck:
      path: /health
      port: 8087
  preview:
    enabled: true
    path: /audit
    headers: *id001
    port: 8087
    targetPort: 8087
    protocol: http
