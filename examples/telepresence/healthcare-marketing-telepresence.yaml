apiVersion: telepresence.io/v2
kind: Intercept
metadata:
  name: healthcare-marketing-intercept
  namespace: default
  labels:
    app: healthcare-marketing
    project: grc-claw
    environment: development
    managed-by: telepresence
  annotations:
    description: Healthcare marketing platform with HIPAA-compliant campaigns, patient
      engagement, and provider reputation management.
    telepresence.io/service: healthcare-marketing
    telepresence.io/deployment: healthcare-marketing
spec:
  service:
    name: healthcare-marketing
    namespace: default
    ports:
    - name: http
      port: 8118
      targetPort: 8118
      protocol: TCP
  intercept:
    headers: &id001
    - name: X-Dev-User
      value: developer@example.com
    paths:
    - /healthcare
    methods:
    - GET
    - POST
    - PUT
    - DELETE
    - PATCH
  swap:
    deployment: healthcare-marketing
    namespace: default
    containerPort: 8118
    protocol: http
    env:
    - name: ENV
      value: development
    - name: COMPLIANCE
      value: hipaa
    - name: ENCRYPTION
      value: aes-256
    volumes:
    - name: healthcare-data
      mountPath: /data
      hostPath: /tmp/healthcare-data
    resources:
      requests:
        cpu: 500m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 1Gi
    healthCheck:
      path: /health
      port: 8118
  preview:
    enabled: true
    path: /healthcare
    headers: *id001
    port: 8118
    targetPort: 8118
    protocol: http
