apiVersion: telepresence.io/v2
kind: Intercept
metadata:
  name: analytics-intercept
  namespace: default
  labels:
    app: analytics
    project: grc-claw
    environment: development
    managed-by: telepresence
  annotations:
    description: Marketing analytics platform that aggregates data from multiple sources,
      builds dashboards, and provides real-time performance insights.
    telepresence.io/service: analytics
    telepresence.io/deployment: analytics
spec:
  service:
    name: analytics
    namespace: default
    ports:
    - name: http
      port: 8091
      targetPort: 8091
      protocol: TCP
  intercept:
    headers: &id001
    - name: X-Dev-User
      value: developer@example.com
    paths:
    - /dashboard
    methods:
    - GET
    - POST
    - PUT
    - DELETE
    - PATCH
  swap:
    deployment: analytics
    namespace: default
    containerPort: 8091
    protocol: http
    env:
    - name: ENV
      value: development
    - name: WAREHOUSE
      value: clickhouse
    volumes:
    - name: analytics-data
      mountPath: /data
      hostPath: /tmp/analytics-data
    resources:
      requests:
        cpu: 500m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 1Gi
    healthCheck:
      path: /health
      port: 8091
  preview:
    enabled: true
    path: /dashboard
    headers: *id001
    port: 8091
    targetPort: 8091
    protocol: http
