apiVersion: telepresence.io/v2
kind: Intercept
metadata:
  name: event-management-intercept
  namespace: default
  labels:
    app: event-management
    project: grc-claw
    environment: development
    managed-by: telepresence
  annotations:
    description: Event management platform for planning, promoting, and managing marketing
      events including webinars, conferences, and trade shows.
    telepresence.io/service: event-management
    telepresence.io/deployment: event-management
spec:
  service:
    name: event-management
    namespace: default
    ports:
    - name: http
      port: 8107
      targetPort: 8107
      protocol: TCP
  intercept:
    headers: &id001
    - name: X-Dev-User
      value: developer@example.com
    paths:
    - /events
    methods:
    - GET
    - POST
    - PUT
    - DELETE
    - PATCH
  swap:
    deployment: event-management
    namespace: default
    containerPort: 8107
    protocol: http
    env:
    - name: ENV
      value: development
    - name: EVENT_TYPES
      value: webinar,conference,tradeshow
    volumes:
    - name: event-data
      mountPath: /data
      hostPath: /tmp/event-data
    resources:
      requests:
        cpu: 500m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 1Gi
    healthCheck:
      path: /health
      port: 8107
  preview:
    enabled: true
    path: /events
    headers: *id001
    port: 8107
    targetPort: 8107
    protocol: http
