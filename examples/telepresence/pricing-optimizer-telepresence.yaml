apiVersion: telepresence.io/v2
kind: Intercept
metadata:
  name: pricing-optimizer-intercept
  namespace: default
  labels:
    app: pricing-optimizer
    project: grc-claw
    environment: development
    managed-by: telepresence
  annotations:
    description: Dynamic pricing optimization engine that adjusts prices based on
      demand, competition, and customer willingness to pay.
    telepresence.io/service: pricing-optimizer
    telepresence.io/deployment: pricing-optimizer
spec:
  service:
    name: pricing-optimizer
    namespace: default
    ports:
    - name: http
      port: 8095
      targetPort: 8095
      protocol: TCP
  intercept:
    headers: &id001
    - name: X-Dev-User
      value: developer@example.com
    paths:
    - /pricing
    methods:
    - GET
    - POST
    - PUT
    - DELETE
    - PATCH
  swap:
    deployment: pricing-optimizer
    namespace: default
    containerPort: 8095
    protocol: http
    env:
    - name: ENV
      value: development
    - name: PRICING_STRATEGY
      value: dynamic
    volumes:
    - name: pricing-models
      mountPath: /models
      hostPath: /tmp/pricing-models
    resources:
      requests:
        cpu: 500m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 1Gi
    healthCheck:
      path: /health
      port: 8095
  preview:
    enabled: true
    path: /pricing
    headers: *id001
    port: 8095
    targetPort: 8095
    protocol: http
