apiVersion: telepresence.io/v2
kind: Intercept
metadata:
  name: feedback-management-intercept
  namespace: default
  labels:
    app: feedback-management
    project: grc-claw
    environment: development
    managed-by: telepresence
  annotations:
    description: Customer feedback management system that collects, analyzes, and
      routes feedback from multiple channels for action.
    telepresence.io/service: feedback-management
    telepresence.io/deployment: feedback-management
spec:
  service:
    name: feedback-management
    namespace: default
    ports:
    - name: http
      port: 8106
      targetPort: 8106
      protocol: TCP
  intercept:
    headers: &id001
    - name: X-Dev-User
      value: developer@example.com
    paths:
    - /feedback
    methods:
    - GET
    - POST
    - PUT
    - DELETE
    - PATCH
  swap:
    deployment: feedback-management
    namespace: default
    containerPort: 8106
    protocol: http
    env:
    - name: ENV
      value: development
    - name: FEEDBACK_CHANNELS
      value: survey,social,email,chat
    volumes:
    - name: feedback-data
      mountPath: /data
      hostPath: /tmp/feedback-data
    resources:
      requests:
        cpu: 500m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 1Gi
    healthCheck:
      path: /health
      port: 8106
  preview:
    enabled: true
    path: /feedback
    headers: *id001
    port: 8106
    targetPort: 8106
    protocol: http
