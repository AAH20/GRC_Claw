apiVersion: telepresence.io/v2
kind: Intercept
metadata:
  name: real-estate-marketing-intercept
  namespace: default
  labels:
    app: real-estate-marketing
    project: grc-claw
    environment: development
    managed-by: telepresence
  annotations:
    description: Real estate marketing platform for property listings, virtual tours,
      lead nurturing, and agent productivity tools.
    telepresence.io/service: real-estate-marketing
    telepresence.io/deployment: real-estate-marketing
spec:
  service:
    name: real-estate-marketing
    namespace: default
    ports:
    - name: http
      port: 8120
      targetPort: 8120
      protocol: TCP
  intercept:
    headers: &id001
    - name: X-Dev-User
      value: developer@example.com
    paths:
    - /properties
    methods:
    - GET
    - POST
    - PUT
    - DELETE
    - PATCH
  swap:
    deployment: real-estate-marketing
    namespace: default
    containerPort: 8120
    protocol: http
    env:
    - name: ENV
      value: development
    - name: LISTING_SOURCES
      value: mls,zillow,realtor
    volumes:
    - name: realestate-data
      mountPath: /data
      hostPath: /tmp/realestate-data
    resources:
      requests:
        cpu: 500m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 1Gi
    healthCheck:
      path: /health
      port: 8120
  preview:
    enabled: true
    path: /properties
    headers: *id001
    port: 8120
    targetPort: 8120
    protocol: http
