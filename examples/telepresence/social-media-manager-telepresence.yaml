apiVersion: telepresence.io/v2
kind: Intercept
metadata:
  name: social-media-manager-intercept
  namespace: default
  labels:
    app: social-media-manager
    project: grc-claw
    environment: development
    managed-by: telepresence
  annotations:
    description: Social media management platform for scheduling, publishing, and
      analyzing content across multiple social networks from a unified dashboard.
    telepresence.io/service: social-media-manager
    telepresence.io/deployment: social-media-manager
spec:
  service:
    name: social-media-manager
    namespace: default
    ports:
    - name: http
      port: 8084
      targetPort: 8084
      protocol: TCP
  intercept:
    headers: &id001
    - name: X-Dev-User
      value: developer@example.com
    paths:
    - /dashboard
    methods:
    - GET
    - POST
    - PUT
    - DELETE
    - PATCH
  swap:
    deployment: social-media-manager
    namespace: default
    containerPort: 8084
    protocol: http
    env:
    - name: ENV
      value: development
    - name: PLATFORMS
      value: twitter,facebook,instagram,linkedin
    volumes:
    - name: social-assets
      mountPath: /assets
      hostPath: /tmp/social-assets
    resources:
      requests:
        cpu: 500m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 1Gi
    healthCheck:
      path: /health
      port: 8084
  preview:
    enabled: true
    path: /dashboard
    headers: *id001
    port: 8084
    targetPort: 8084
    protocol: http
