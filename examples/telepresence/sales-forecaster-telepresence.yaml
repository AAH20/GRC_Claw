apiVersion: telepresence.io/v2
kind: Intercept
metadata:
  name: sales-forecaster-intercept
  namespace: default
  labels:
    app: sales-forecaster
    project: grc-claw
    environment: development
    managed-by: telepresence
  annotations:
    description: Sales forecasting service using time-series analysis and machine
      learning to predict future revenue and pipeline trends.
    telepresence.io/service: sales-forecaster
    telepresence.io/deployment: sales-forecaster
spec:
  service:
    name: sales-forecaster
    namespace: default
    ports:
    - name: http
      port: 8096
      targetPort: 8096
      protocol: TCP
  intercept:
    headers: &id001
    - name: X-Dev-User
      value: developer@example.com
    paths:
    - /forecast
    methods:
    - GET
    - POST
    - PUT
    - DELETE
    - PATCH
  swap:
    deployment: sales-forecaster
    namespace: default
    containerPort: 8096
    protocol: http
    env:
    - name: ENV
      value: development
    - name: FORECAST_HORIZON
      value: 90d
    volumes:
    - name: forecast-models
      mountPath: /models
      hostPath: /tmp/forecast-models
    resources:
      requests:
        cpu: 500m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 1Gi
    healthCheck:
      path: /health
      port: 8096
  preview:
    enabled: true
    path: /forecast
    headers: *id001
    port: 8096
    targetPort: 8096
    protocol: http
