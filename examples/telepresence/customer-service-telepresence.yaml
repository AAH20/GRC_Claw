apiVersion: telepresence.io/v2
kind: Intercept
metadata:
  name: customer-service-intercept
  namespace: default
  labels:
    app: customer-service
    project: grc-claw
    environment: development
    managed-by: telepresence
  annotations:
    description: AI-powered customer service platform with chatbot, ticket routing,
      sentiment analysis, and automated response suggestions.
    telepresence.io/service: customer-service
    telepresence.io/deployment: customer-service
spec:
  service:
    name: customer-service
    namespace: default
    ports:
    - name: http
      port: 8090
      targetPort: 8090
      protocol: TCP
  intercept:
    headers: &id001
    - name: X-Dev-User
      value: developer@example.com
    paths:
    - /tickets
    methods:
    - GET
    - POST
    - PUT
    - DELETE
    - PATCH
  swap:
    deployment: customer-service
    namespace: default
    containerPort: 8090
    protocol: http
    env:
    - name: ENV
      value: development
    - name: CHAT_MODEL
      value: gpt-4
    - name: TICKET_SYSTEM
      value: zendesk
    volumes:
    - name: cs-knowledge-base
      mountPath: /kb
      hostPath: /tmp/cs-kb
    resources:
      requests:
        cpu: 500m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 1Gi
    healthCheck:
      path: /health
      port: 8090
  preview:
    enabled: true
    path: /tickets
    headers: *id001
    port: 8090
    targetPort: 8090
    protocol: http
