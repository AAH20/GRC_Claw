apiVersion: telepresence.io/v2
kind: Intercept
metadata:
  name: conversational-marketing-intercept
  namespace: default
  labels:
    app: conversational-marketing
    project: grc-claw
    environment: development
    managed-by: telepresence
  annotations:
    description: Conversational marketing platform for chatbots, live chat, and messaging
      apps to engage visitors in real-time conversations.
    telepresence.io/service: conversational-marketing
    telepresence.io/deployment: conversational-marketing
spec:
  service:
    name: conversational-marketing
    namespace: default
    ports:
    - name: http
      port: 8111
      targetPort: 8111
      protocol: TCP
  intercept:
    headers: &id001
    - name: X-Dev-User
      value: developer@example.com
    paths:
    - /conversations
    methods:
    - GET
    - POST
    - PUT
    - DELETE
    - PATCH
  swap:
    deployment: conversational-marketing
    namespace: default
    containerPort: 8111
    protocol: http
    env:
    - name: ENV
      value: development
    - name: CHAT_CHANNELS
      value: web,whatsapp,facebook-messenger
    volumes:
    - name: conversation-flows
      mountPath: /flows
      hostPath: /tmp/conversation-flows
    resources:
      requests:
        cpu: 500m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 1Gi
    healthCheck:
      path: /health
      port: 8111
  preview:
    enabled: true
    path: /conversations
    headers: *id001
    port: 8111
    targetPort: 8111
    protocol: http
