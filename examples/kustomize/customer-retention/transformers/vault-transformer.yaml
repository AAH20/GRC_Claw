apiVersion: builtin
kind: PatchTransformer
metadata:
  name: vault-patch
patch: |-
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultDynamicSecret
metadata:
  name: customer-retention-vault-secrets
spec:
  vaultAuthRef: customer-retention-vault-auth
  mount: secret
  path: customer-retention
  destination:
    create: true
    name: customer-retention-vault-secrets
  rolloutRestartTargets:
    - kind: Deployment
      name: customer-retention

target:
  kind: Deployment
  name: customer-retention
