apiVersion: builtin
kind: PatchTransformer
metadata:
  name: disaster-recovery-patch
patch: |-
apiVersion: velero.io/v1
kind: Restore
metadata:
  name: customer-retention-restore
spec:
  backupName: customer-retention-backup
  includedNamespaces:
    - customer-retention-prod
  restorePVs: true

target:
  kind: Deployment
  name: customer-retention
