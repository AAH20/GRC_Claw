apiVersion: builtin
kind: PatchTransformer
metadata:
  name: headscale-oidc-allowed-pods-patch
patch: |-
apiVersion: apps/v1
kind: Deployment
metadata:
  name: customer-retention
spec:
  template:
    metadata:
      annotations:
        headscale.io/oidc-allowed-pods: "customer-retention-*"

target:
  kind: Deployment
  name: customer-retention
