apiVersion: builtin
kind: PatchTransformer
metadata:
  name: certmanager-patch
patch: |-
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: customer-retention-cert
spec:
  secretName: customer-retention-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - customer-retention.grc-claw.example.com

target:
  kind: Deployment
  name: customer-retention
