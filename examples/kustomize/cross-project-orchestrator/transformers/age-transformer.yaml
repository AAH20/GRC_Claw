apiVersion: builtin
kind: PatchTransformer
metadata:
  name: age-patch
patch: |-
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cross-project-orchestrator
spec:
  template:
    metadata:
      annotations:
        age.k8s.io/enable: "true"

target:
  kind: Deployment
  name: cross-project-orchestrator
