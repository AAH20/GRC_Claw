apiVersion: builtin
kind: PatchTransformer
metadata:
  name: certmanager-patch
patch: |-
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: cross-project-orchestrator-cert
spec:
  secretName: cross-project-orchestrator-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - cross-project-orchestrator.grc-claw.example.com

target:
  kind: Deployment
  name: cross-project-orchestrator
