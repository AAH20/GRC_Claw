apiVersion: builtin
kind: PatchTransformer
metadata:
  name: headscale-oidc-allowed-pvcs-patch
patch: |-
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cross-project-orchestrator
spec:
  template:
    metadata:
      annotations:
        headscale.io/oidc-allowed-pvcs: "cross-project-orchestrator-*"

target:
  kind: Deployment
  name: cross-project-orchestrator
