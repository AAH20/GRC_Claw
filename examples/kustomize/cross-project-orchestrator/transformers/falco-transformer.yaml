apiVersion: builtin
kind: PatchTransformer
metadata:
  name: falco-patch
patch: |-
apiVersion: falco.org/v1
kind: FalcoRule
metadata:
  name: cross-project-orchestrator-rules
spec:
  rules: |
    - rule: cross_project_orchestrator_unexpected_process
      desc: Detect unexpected processes in cross-project-orchestrator container
      condition: >
        spawned_process and
        container and
        container.image.repository = "grcclaw/cross-project-orchestrator" and
        not proc.name in ("cross-project-orchestrator", "sh", "bash")
      output: >
        Unexpected process in cross-project-orchestrator container
        (user=%proc.pname command=%proc.cmdline)
      priority: WARNING

target:
  kind: Deployment
  name: cross-project-orchestrator
