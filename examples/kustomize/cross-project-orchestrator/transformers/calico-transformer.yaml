apiVersion: builtin
kind: PatchTransformer
metadata:
  name: calico-patch
patch: |-
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cross-project-orchestrator
spec:
  template:
    metadata:
      annotations:
        calico.org/enable: "true"

target:
  kind: Deployment
  name: cross-project-orchestrator
