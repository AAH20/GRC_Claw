apiVersion: builtin
kind: PatchTransformer
metadata:
  name: openvpn-patch
patch: |-
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cross-project-orchestrator
spec:
  template:
    metadata:
      annotations:
        k8s.v1.cni.cncf.io/networks: openvpn-conf

target:
  kind: Deployment
  name: cross-project-orchestrator
