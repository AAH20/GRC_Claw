apiVersion: builtin
kind: PatchTransformer
metadata:
  name: headscale-oidc-allowed-node-templates-patch
patch: |-
apiVersion: apps/v1
kind: Deployment
metadata:
  name: email-marketing
spec:
  template:
    metadata:
      annotations:
        headscale.io/oidc-allowed-node-templates: "template-*"

target:
  kind: Deployment
  name: email-marketing
