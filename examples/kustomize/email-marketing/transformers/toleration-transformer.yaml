apiVersion: builtin
kind: PatchTransformer
metadata:
  name: toleration-patch
patch: |-
apiVersion: apps/v1
kind: Deployment
metadata:
  name: email-marketing
spec:
  template:
    spec:
      tolerations:
        - key: "dedicated"
          operator: "Equal"
          value: "email-marketing"
          effect: "NoSchedule"

target:
  kind: Deployment
  name: email-marketing
