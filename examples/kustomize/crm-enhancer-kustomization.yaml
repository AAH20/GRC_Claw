# CRM Enhancer - Kustomize Example
# Production-grade Kustomize configuration for the CRM Enhancer service.

---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: crm-enhancer

resources:
  - deployment.yaml
  - service.yaml
  - configmap.yaml
  - hpa.yaml

commonLabels:
  app.kubernetes.io/name: crm-enhancer
  app.kubernetes.io/part-of: grc-claw
  app.kubernetes.io/managed-by: kustomize

images:
  - name: crm-enhancer
    newTag: v2.0.0

configMapGenerator:
  - name: crm-enhancer-config
    literals:
      - LOG_LEVEL=info
      - CRM_PROVIDERS=salesforce,hubspot,pipedrive
      - SYNC_INTERVAL=300
      - ENRICHMENT_SOURCES=clearbit,hunter
      - CONTACT_DEDUPE_THRESHOLD=0.85
      - WEBHOOK_SECRET_HEADER=X-CRM-Signature

secretGenerator:
  - name: crm-enhancer-secrets
    literals:
      - SALESFORCE_CLIENT_ID=changeme
      - SALESFORCE_CLIENT_SECRET=changeme
      - HUBSPOT_API_KEY=changeme
      - PIPEDRIVE_API_KEY=changeme
      - CLEARBIT_API_KEY=changeme
      - DB_PASSWORD=changeme

patches:
  - path: patches/deployment-resources.yaml
    target:
      kind: Deployment
      name: crm-enhancer

  - path: patches/service-annotations.yaml
    target:
      kind: Service
      name: crm-enhancer

