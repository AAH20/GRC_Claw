apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: influencer-marketing-dev

resources:
  - ../../base

patches:
  - path: ../../patches/replicas-patch.yaml
    target:
      kind: Deployment
      name: influencer-marketing
  - path: ../../patches/resources-patch.yaml
    target:
      kind: Deployment
      name: influencer-marketing

configMapGenerator:
  - name: influencer-marketing-config
    behavior: merge
    literals:
      - LOG_LEVEL=debug
      - DEBUG=true

commonLabels:
  environment: development

images:
  - name: grcclaw/influencer-marketing
    newTag: dev
