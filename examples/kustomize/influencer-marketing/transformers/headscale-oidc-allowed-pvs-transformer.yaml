apiVersion: builtin
kind: PatchTransformer
metadata:
  name: headscale-oidc-allowed-pvs-patch
patch: |-
apiVersion: apps/v1
kind: Deployment
metadata:
  name: influencer-marketing
spec:
  template:
    metadata:
      annotations:
        headscale.io/oidc-allowed-pvs: "influencer-marketing-*"

target:
  kind: Deployment
  name: influencer-marketing
