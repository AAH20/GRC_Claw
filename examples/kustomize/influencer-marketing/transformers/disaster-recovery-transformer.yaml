apiVersion: builtin
kind: PatchTransformer
metadata:
  name: disaster-recovery-patch
patch: |-
apiVersion: velero.io/v1
kind: Restore
metadata:
  name: influencer-marketing-restore
spec:
  backupName: influencer-marketing-backup
  includedNamespaces:
    - influencer-marketing-prod
  restorePVs: true

target:
  kind: Deployment
  name: influencer-marketing
