apiVersion: builtin
kind: PatchTransformer
metadata:
  name: falco-patch
patch: |-
apiVersion: falco.org/v1
kind: FalcoRule
metadata:
  name: influencer-marketing-rules
spec:
  rules: |
    - rule: influencer_marketing_unexpected_process
      desc: Detect unexpected processes in influencer-marketing container
      condition: >
        spawned_process and
        container and
        container.image.repository = "grcclaw/influencer-marketing" and
        not proc.name in ("influencer-marketing", "sh", "bash")
      output: >
        Unexpected process in influencer-marketing container
        (user=%proc.pname command=%proc.cmdline)
      priority: WARNING

target:
  kind: Deployment
  name: influencer-marketing
