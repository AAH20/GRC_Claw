apiVersion: builtin
kind: PatchTransformer
metadata:
  name: networkpolicy-patch
patch: |-
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: smb-marketing-netpol
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: smb-marketing
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: smb-marketing-prod
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              name: kube-system
      ports:
        - protocol: TCP
          port: 53
        - protocol: UDP
          port: 53

target:
  kind: Deployment
  name: smb-marketing
