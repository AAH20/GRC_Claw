apiVersion: builtin
kind: PatchTransformer
metadata:
  name: disaster-recovery-patch
patch: |-
apiVersion: velero.io/v1
kind: Restore
metadata:
  name: smb-marketing-restore
spec:
  backupName: smb-marketing-backup
  includedNamespaces:
    - smb-marketing-prod
  restorePVs: true

target:
  kind: Deployment
  name: smb-marketing
