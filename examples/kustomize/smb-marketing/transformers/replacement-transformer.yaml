apiVersion: builtin
kind: ReplacementTransformer
metadata:
  name: replacement-config
replacements:
  - source:
      kind: ConfigMap
      name: smb-marketing-config
      fieldPath: data.LOG_LEVEL
    targets:
      - select:
          kind: Deployment
          name: smb-marketing
        fieldPaths:
          - spec.template.spec.containers.[name=smb-marketing].env.[name=LOG_LEVEL].value
        options:
          create: true
