apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: conversational-marketing-staging

resources:
  - ../../base

patches:
  - path: ../../patches/replicas-patch.yaml
    target:
      kind: Deployment
      name: conversational-marketing
  - path: ../../patches/resources-patch.yaml
    target:
      kind: Deployment
      name: conversational-marketing

configMapGenerator:
  - name: conversational-marketing-config
    behavior: merge
    literals:
      - LOG_LEVEL=info
      - DEBUG=false

commonLabels:
  environment: staging

images:
  - name: grcclaw/conversational-marketing
    newTag: staging
