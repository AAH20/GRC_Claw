apiVersion: builtin
kind: PatchTransformer
metadata:
  name: falco-patch
patch: |-
apiVersion: falco.org/v1
kind: FalcoRule
metadata:
  name: conversational-marketing-rules
spec:
  rules: |
    - rule: conversational_marketing_unexpected_process
      desc: Detect unexpected processes in conversational-marketing container
      condition: >
        spawned_process and
        container and
        container.image.repository = "grcclaw/conversational-marketing" and
        not proc.name in ("conversational-marketing", "sh", "bash")
      output: >
        Unexpected process in conversational-marketing container
        (user=%proc.pname command=%proc.cmdline)
      priority: WARNING

target:
  kind: Deployment
  name: conversational-marketing
