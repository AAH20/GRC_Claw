apiVersion: builtin
kind: PatchTransformer
metadata:
  name: disaster-recovery-patch
patch: |-
apiVersion: velero.io/v1
kind: Restore
metadata:
  name: conversational-marketing-restore
spec:
  backupName: conversational-marketing-backup
  includedNamespaces:
    - conversational-marketing-prod
  restorePVs: true

target:
  kind: Deployment
  name: conversational-marketing
