apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: seo-optimizer-dev

resources:
  - ../../base

patches:
  - path: ../../patches/replicas-patch.yaml
    target:
      kind: Deployment
      name: seo-optimizer
  - path: ../../patches/resources-patch.yaml
    target:
      kind: Deployment
      name: seo-optimizer

configMapGenerator:
  - name: seo-optimizer-config
    behavior: merge
    literals:
      - LOG_LEVEL=debug
      - DEBUG=true

commonLabels:
  environment: development

images:
  - name: grcclaw/seo-optimizer
    newTag: dev
