apiVersion: builtin
kind: PatchTransformer
metadata:
  name: serviceaccount-patch
patch: |-
apiVersion: v1
kind: ServiceAccount
metadata:
  name: seo-optimizer-sa
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/seo-optimizer-role

target:
  kind: Deployment
  name: seo-optimizer
