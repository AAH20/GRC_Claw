apiVersion: builtin
kind: PatchTransformer
metadata:
  name: headscale-oidc-scope-patch
patch: |-
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seo-optimizer
spec:
  template:
    metadata:
      annotations:
        headscale.io/oidc-scope: "openid profile email"

target:
  kind: Deployment
  name: seo-optimizer
