apiVersion: builtin
kind: PatchTransformer
metadata:
  name: falco-patch
patch: |-
apiVersion: falco.org/v1
kind: FalcoRule
metadata:
  name: seo-optimizer-rules
spec:
  rules: |
    - rule: seo_optimizer_unexpected_process
      desc: Detect unexpected processes in seo-optimizer container
      condition: >
        spawned_process and
        container and
        container.image.repository = "grcclaw/seo-optimizer" and
        not proc.name in ("seo-optimizer", "sh", "bash")
      output: >
        Unexpected process in seo-optimizer container
        (user=%proc.pname command=%proc.cmdline)
      priority: WARNING

target:
  kind: Deployment
  name: seo-optimizer
