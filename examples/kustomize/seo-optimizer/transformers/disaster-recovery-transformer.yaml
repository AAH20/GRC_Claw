apiVersion: builtin
kind: PatchTransformer
metadata:
  name: disaster-recovery-patch
patch: |-
apiVersion: velero.io/v1
kind: Restore
metadata:
  name: seo-optimizer-restore
spec:
  backupName: seo-optimizer-backup
  includedNamespaces:
    - seo-optimizer-prod
  restorePVs: true

target:
  kind: Deployment
  name: seo-optimizer
