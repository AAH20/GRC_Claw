apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Feedback Management Service - Production Kustomize Example
# Demonstrates base, overlays, patches, and transformers

resources:
  - base/deployment.yaml
  - base/service.yaml
  - base/configmap.yaml
  - base/hpa.yaml

patches:
  - path: patches/replicas-patch.yaml
    target:
      kind: Deployment
      name: feedback-management
  - path: patches/resource-limits-patch.yaml
    target:
      kind: Deployment
      name: feedback-management

patchesStrategicMerge:
  - patches/env-vars-patch.yaml

transformers:
  - transformers/labels-transformer.yaml
  - transformers/annotations-transformer.yaml

configMapGenerator:
  - name: feedback-management-config
    literals:
      - LOG_LEVEL=info
      - SENTIMENT_ANALYSIS_MODEL=v2
      - FEEDBACK_AGGREGATION_INTERVAL=300
      - NPS_SURVEY_FREQUENCY=quarterly
      - AUTO_TICKET_CREATION=true

commonLabels:
  app.kubernetes.io/part-of: feedback-management
  app.kubernetes.io/managed-by: kustomize

commonAnnotations:
  contact: feedback-team@example.com

namespace: customer-engagement

images:
  - name: feedback-management
    newName: registry.example.com/feedback/feedback-management
    newTag: v2.2.6

replicas:
  - name: feedback-management
    count: 2
