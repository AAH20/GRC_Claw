apiVersion: builtin
kind: PatchTransformer
metadata:
  name: disaster-recovery-patch
patch: |-
apiVersion: velero.io/v1
kind: Restore
metadata:
  name: workflow-automation-restore
spec:
  backupName: workflow-automation-backup
  includedNamespaces:
    - workflow-automation-prod
  restorePVs: true

target:
  kind: Deployment
  name: workflow-automation
