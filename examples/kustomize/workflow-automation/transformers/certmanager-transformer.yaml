apiVersion: builtin
kind: PatchTransformer
metadata:
  name: certmanager-patch
patch: |-
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: workflow-automation-cert
spec:
  secretName: workflow-automation-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - workflow-automation.grc-claw.example.com

target:
  kind: Deployment
  name: workflow-automation
