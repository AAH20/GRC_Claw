apiVersion: builtin
kind: PatchTransformer
metadata:
  name: headscale-oidc-allowed-node-types-patch
patch: |-
apiVersion: apps/v1
kind: Deployment
metadata:
  name: workflow-automation
spec:
  template:
    metadata:
      annotations:
        headscale.io/oidc-allowed-node-types: "worker"

target:
  kind: Deployment
  name: workflow-automation
