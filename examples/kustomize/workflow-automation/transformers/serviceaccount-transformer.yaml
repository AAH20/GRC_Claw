apiVersion: builtin
kind: PatchTransformer
metadata:
  name: serviceaccount-patch
patch: |-
apiVersion: v1
kind: ServiceAccount
metadata:
  name: workflow-automation-sa
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/workflow-automation-role

target:
  kind: Deployment
  name: workflow-automation
