apiVersion: builtin
kind: PatchTransformer
metadata:
  name: falco-patch
patch: |-
apiVersion: falco.org/v1
kind: FalcoRule
metadata:
  name: workflow-automation-rules
spec:
  rules: |
    - rule: workflow_automation_unexpected_process
      desc: Detect unexpected processes in workflow-automation container
      condition: >
        spawned_process and
        container and
        container.image.repository = "grcclaw/workflow-automation" and
        not proc.name in ("workflow-automation", "sh", "bash")
      output: >
        Unexpected process in workflow-automation container
        (user=%proc.pname command=%proc.cmdline)
      priority: WARNING

target:
  kind: Deployment
  name: workflow-automation
