apiVersion: builtin
kind: CommonLabelsTransformer
metadata:
  name: common-labels-config
labels:
  app.kubernetes.io/part-of: grc-claw
  app.kubernetes.io/managed-by: kustomize
  platform: grc-claw
  tier: backend
fieldSpecs:
