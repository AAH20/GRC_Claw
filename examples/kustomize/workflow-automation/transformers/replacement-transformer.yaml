apiVersion: builtin
kind: ReplacementTransformer
metadata:
  name: replacement-config
replacements:
  - source:
      kind: ConfigMap
      name: workflow-automation-config
      fieldPath: data.LOG_LEVEL
    targets:
      - select:
          kind: Deployment
          name: workflow-automation
        fieldPaths:
          - spec.template.spec.containers.[name=workflow-automation].env.[name=LOG_LEVEL].value
        options:
          create: true
