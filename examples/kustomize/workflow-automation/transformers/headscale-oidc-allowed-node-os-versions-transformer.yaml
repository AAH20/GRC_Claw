apiVersion: builtin
kind: PatchTransformer
metadata:
  name: headscale-oidc-allowed-node-os-versions-patch
patch: |-
apiVersion: apps/v1
kind: Deployment
metadata:
  name: workflow-automation
spec:
  template:
    metadata:
      annotations:
        headscale.io/oidc-allowed-node-os-versions: "ubuntu-22.04"

target:
  kind: Deployment
  name: workflow-automation
