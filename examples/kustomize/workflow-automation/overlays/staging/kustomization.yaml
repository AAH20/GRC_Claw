apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: workflow-automation-staging

resources:
  - ../../base

patches:
  - path: ../../patches/replicas-patch.yaml
    target:
      kind: Deployment
      name: workflow-automation
  - path: ../../patches/resources-patch.yaml
    target:
      kind: Deployment
      name: workflow-automation

configMapGenerator:
  - name: workflow-automation-config
    behavior: merge
    literals:
      - LOG_LEVEL=info
      - DEBUG=false

commonLabels:
  environment: staging

images:
  - name: grcclaw/workflow-automation
    newTag: staging
