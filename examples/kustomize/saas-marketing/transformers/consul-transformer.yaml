apiVersion: builtin
kind: PatchTransformer
metadata:
  name: consul-patch
patch: |-
apiVersion: apps/v1
kind: Deployment
metadata:
  name: saas-marketing
spec:
  template:
    metadata:
      annotations:
        consul.hashicorp.com/connect-inject: "true"

target:
  kind: Deployment
  name: saas-marketing
