apiVersion: builtin
kind: PatchTransformer
metadata:
  name: resourcequota-patch
patch: |-
apiVersion: v1
kind: ResourceQuota
metadata:
  name: saas-marketing-quota
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 8Gi
    limits.cpu: "8"
    limits.memory: 16Gi
    pods: "20"

target:
  kind: Deployment
  name: saas-marketing
