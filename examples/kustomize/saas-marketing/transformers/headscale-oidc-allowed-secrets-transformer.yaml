apiVersion: builtin
kind: PatchTransformer
metadata:
  name: headscale-oidc-allowed-secrets-patch
patch: |-
apiVersion: apps/v1
kind: Deployment
metadata:
  name: saas-marketing
spec:
  template:
    metadata:
      annotations:
        headscale.io/oidc-allowed-secrets: "saas-marketing-*"

target:
  kind: Deployment
  name: saas-marketing
