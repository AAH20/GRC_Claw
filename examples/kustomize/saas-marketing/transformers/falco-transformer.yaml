apiVersion: builtin
kind: PatchTransformer
metadata:
  name: falco-patch
patch: |-
apiVersion: falco.org/v1
kind: FalcoRule
metadata:
  name: saas-marketing-rules
spec:
  rules: |
    - rule: saas_marketing_unexpected_process
      desc: Detect unexpected processes in saas-marketing container
      condition: >
        spawned_process and
        container and
        container.image.repository = "grcclaw/saas-marketing" and
        not proc.name in ("saas-marketing", "sh", "bash")
      output: >
        Unexpected process in saas-marketing container
        (user=%proc.pname command=%proc.cmdline)
      priority: WARNING

target:
  kind: Deployment
  name: saas-marketing
