apiVersion: builtin
kind: PatchTransformer
metadata:
  name: falco-patch
patch: |-
apiVersion: falco.org/v1
kind: FalcoRule
metadata:
  name: ppc-manager-rules
spec:
  rules: |
    - rule: ppc_manager_unexpected_process
      desc: Detect unexpected processes in ppc-manager container
      condition: >
        spawned_process and
        container and
        container.image.repository = "grcclaw/ppc-manager" and
        not proc.name in ("ppc-manager", "sh", "bash")
      output: >
        Unexpected process in ppc-manager container
        (user=%proc.pname command=%proc.cmdline)
      priority: WARNING

target:
  kind: Deployment
  name: ppc-manager
