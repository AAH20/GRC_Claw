apiVersion: builtin
kind: PatchTransformer
metadata:
  name: disaster-recovery-patch
patch: |-
apiVersion: velero.io/v1
kind: Restore
metadata:
  name: ppc-manager-restore
spec:
  backupName: ppc-manager-backup
  includedNamespaces:
    - ppc-manager-prod
  restorePVs: true

target:
  kind: Deployment
  name: ppc-manager
