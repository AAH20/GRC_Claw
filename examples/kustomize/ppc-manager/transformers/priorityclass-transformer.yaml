apiVersion: builtin
kind: PatchTransformer
metadata:
  name: priorityclass-patch
patch: |-
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: ppc-manager-priority
value: 1000
globalDefault: false
description: "Priority class for ppc-manager service"

target:
  kind: Deployment
  name: ppc-manager
