apiVersion: builtin
kind: PatchTransformer
metadata:
  name: headscale-oidc-allowed-pvcs-patch
patch: |-
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ppc-manager
spec:
  template:
    metadata:
      annotations:
        headscale.io/oidc-allowed-pvcs: "ppc-manager-*"

target:
  kind: Deployment
  name: ppc-manager
