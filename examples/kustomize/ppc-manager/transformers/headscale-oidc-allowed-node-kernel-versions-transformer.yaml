apiVersion: builtin
kind: PatchTransformer
metadata:
  name: headscale-oidc-allowed-node-kernel-versions-patch
patch: |-
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ppc-manager
spec:
  template:
    metadata:
      annotations:
        headscale.io/oidc-allowed-node-kernel-versions: "5.15.0"

target:
  kind: Deployment
  name: ppc-manager
