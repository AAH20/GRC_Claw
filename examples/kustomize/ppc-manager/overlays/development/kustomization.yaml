apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ppc-manager-dev

resources:
  - ../../base

patches:
  - path: ../../patches/replicas-patch.yaml
    target:
      kind: Deployment
      name: ppc-manager
  - path: ../../patches/resources-patch.yaml
    target:
      kind: Deployment
      name: ppc-manager

configMapGenerator:
  - name: ppc-manager-config
    behavior: merge
    literals:
      - LOG_LEVEL=debug
      - DEBUG=true

commonLabels:
  environment: development

images:
  - name: grcclaw/ppc-manager
    newTag: dev
