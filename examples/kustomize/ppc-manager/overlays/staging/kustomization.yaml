apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ppc-manager-staging

resources:
  - ../../base

patches:
  - path: ../../patches/replicas-patch.yaml
    target:
      kind: Deployment
      name: ppc-manager
  - path: ../../patches/resources-patch.yaml
    target:
      kind: Deployment
      name: ppc-manager

configMapGenerator:
  - name: ppc-manager-config
    behavior: merge
    literals:
      - LOG_LEVEL=info
      - DEBUG=false

commonLabels:
  environment: staging

images:
  - name: grcclaw/ppc-manager
    newTag: staging
