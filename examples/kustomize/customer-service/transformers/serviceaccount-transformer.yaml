apiVersion: builtin
kind: PatchTransformer
metadata:
  name: serviceaccount-patch
patch: |-
apiVersion: v1
kind: ServiceAccount
metadata:
  name: customer-service-sa
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/customer-service-role

target:
  kind: Deployment
  name: customer-service
