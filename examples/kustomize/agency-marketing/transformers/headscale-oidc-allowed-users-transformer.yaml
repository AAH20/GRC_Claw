apiVersion: builtin
kind: PatchTransformer
metadata:
  name: headscale-oidc-allowed-users-patch
patch: |-
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agency-marketing
spec:
  template:
    metadata:
      annotations:
        headscale.io/oidc-allowed-users: "user@example.com"

target:
  kind: Deployment
  name: agency-marketing
