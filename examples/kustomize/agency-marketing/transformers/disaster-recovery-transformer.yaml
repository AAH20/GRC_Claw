apiVersion: builtin
kind: PatchTransformer
metadata:
  name: disaster-recovery-patch
patch: |-
apiVersion: velero.io/v1
kind: Restore
metadata:
  name: agency-marketing-restore
spec:
  backupName: agency-marketing-backup
  includedNamespaces:
    - agency-marketing-prod
  restorePVs: true

target:
  kind: Deployment
  name: agency-marketing
