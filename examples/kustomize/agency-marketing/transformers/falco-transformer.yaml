apiVersion: builtin
kind: PatchTransformer
metadata:
  name: falco-patch
patch: |-
apiVersion: falco.org/v1
kind: FalcoRule
metadata:
  name: agency-marketing-rules
spec:
  rules: |
    - rule: agency_marketing_unexpected_process
      desc: Detect unexpected processes in agency-marketing container
      condition: >
        spawned_process and
        container and
        container.image.repository = "grcclaw/agency-marketing" and
        not proc.name in ("agency-marketing", "sh", "bash")
      output: >
        Unexpected process in agency-marketing container
        (user=%proc.pname command=%proc.cmdline)
      priority: WARNING

target:
  kind: Deployment
  name: agency-marketing
