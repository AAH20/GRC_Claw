apiVersion: builtin
kind: PatchTransformer
metadata:
  name: disaster-recovery-patch
patch: |-
apiVersion: velero.io/v1
kind: Restore
metadata:
  name: sales-automator-restore
spec:
  backupName: sales-automator-backup
  includedNamespaces:
    - sales-automator-prod
  restorePVs: true

target:
  kind: Deployment
  name: sales-automator
