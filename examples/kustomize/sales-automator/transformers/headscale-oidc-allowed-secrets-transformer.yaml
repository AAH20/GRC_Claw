apiVersion: builtin
kind: PatchTransformer
metadata:
  name: headscale-oidc-allowed-secrets-patch
patch: |-
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sales-automator
spec:
  template:
    metadata:
      annotations:
        headscale.io/oidc-allowed-secrets: "sales-automator-*"

target:
  kind: Deployment
  name: sales-automator
