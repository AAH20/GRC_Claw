apiVersion: builtin
kind: VarTransformer
metadata:
  name: var-config
vars:
  - name: SERVICE_NAME
    objref:
      kind: Service
      name: sales-automator
      apiVersion: v1
    fieldref:
      fieldpath: metadata.name
  - name: NAMESPACE
    objref:
      kind: Namespace
      name: sales-automator-prod
      apiVersion: v1
    fieldref:
      fieldpath: metadata.name
