apiVersion: builtin
kind: PatchTransformer
metadata:
  name: falco-patch
patch: |-
apiVersion: falco.org/v1
kind: FalcoRule
metadata:
  name: sales-automator-rules
spec:
  rules: |
    - rule: sales_automator_unexpected_process
      desc: Detect unexpected processes in sales-automator container
      condition: >
        spawned_process and
        container and
        container.image.repository = "grcclaw/sales-automator" and
        not proc.name in ("sales-automator", "sh", "bash")
      output: >
        Unexpected process in sales-automator container
        (user=%proc.pname command=%proc.cmdline)
      priority: WARNING

target:
  kind: Deployment
  name: sales-automator
