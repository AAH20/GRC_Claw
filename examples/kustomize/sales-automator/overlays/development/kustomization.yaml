apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: sales-automator-dev

resources:
  - ../../base

patches:
  - path: ../../patches/replicas-patch.yaml
    target:
      kind: Deployment
      name: sales-automator
  - path: ../../patches/resources-patch.yaml
    target:
      kind: Deployment
      name: sales-automator

configMapGenerator:
  - name: sales-automator-config
    behavior: merge
    literals:
      - LOG_LEVEL=debug
      - DEBUG=true

commonLabels:
  environment: development

images:
  - name: grcclaw/sales-automator
    newTag: dev
