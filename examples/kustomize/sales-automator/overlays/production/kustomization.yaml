apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: sales-automator-prod

resources:
  - ../../base

patches:
  - path: ../../patches/replicas-patch.yaml
    target:
      kind: Deployment
      name: sales-automator
  - path: ../../patches/resources-patch.yaml
    target:
      kind: Deployment
      name: sales-automator
  - path: ../../patches/security-patch.yaml
    target:
      kind: Deployment
      name: sales-automator

configMapGenerator:
  - name: sales-automator-config
    behavior: merge
    literals:
      - LOG_LEVEL=warn
      - DEBUG=false

commonLabels:
  environment: production

images:
  - name: grcclaw/sales-automator
    newTag: stable

replicas:
  - name: sales-automator
    count: 3
