apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: sales-forecaster-dev

resources:
  - ../../base

patches:
  - path: ../../patches/replicas-patch.yaml
    target:
      kind: Deployment
      name: sales-forecaster
  - path: ../../patches/resources-patch.yaml
    target:
      kind: Deployment
      name: sales-forecaster

configMapGenerator:
  - name: sales-forecaster-config
    behavior: merge
    literals:
      - LOG_LEVEL=debug
      - DEBUG=true

commonLabels:
  environment: development

images:
  - name: grcclaw/sales-forecaster
    newTag: dev
