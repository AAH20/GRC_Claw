apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: sales-forecaster-staging

resources:
  - ../../base

patches:
  - path: ../../patches/replicas-patch.yaml
    target:
      kind: Deployment
      name: sales-forecaster
  - path: ../../patches/resources-patch.yaml
    target:
      kind: Deployment
      name: sales-forecaster

configMapGenerator:
  - name: sales-forecaster-config
    behavior: merge
    literals:
      - LOG_LEVEL=info
      - DEBUG=false

commonLabels:
  environment: staging

images:
  - name: grcclaw/sales-forecaster
    newTag: staging
