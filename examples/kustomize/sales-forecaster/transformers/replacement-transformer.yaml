apiVersion: builtin
kind: ReplacementTransformer
metadata:
  name: replacement-config
replacements:
  - source:
      kind: ConfigMap
      name: sales-forecaster-config
      fieldPath: data.LOG_LEVEL
    targets:
      - select:
          kind: Deployment
          name: sales-forecaster
        fieldPaths:
          - spec.template.spec.containers.[name=sales-forecaster].env.[name=LOG_LEVEL].value
        options:
          create: true
