apiVersion: builtin
kind: PatchTransformer
metadata:
  name: disaster-recovery-patch
patch: |-
apiVersion: velero.io/v1
kind: Restore
metadata:
  name: sales-forecaster-restore
spec:
  backupName: sales-forecaster-backup
  includedNamespaces:
    - sales-forecaster-prod
  restorePVs: true

target:
  kind: Deployment
  name: sales-forecaster
