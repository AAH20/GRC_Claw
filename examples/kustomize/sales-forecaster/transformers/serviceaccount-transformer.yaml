apiVersion: builtin
kind: PatchTransformer
metadata:
  name: serviceaccount-patch
patch: |-
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sales-forecaster-sa
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/sales-forecaster-role

target:
  kind: Deployment
  name: sales-forecaster
