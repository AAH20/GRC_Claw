apiVersion: builtin
kind: PatchTransformer
metadata:
  name: headscale-oidc-allowed-node-taints-patch
patch: |-
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sales-forecaster
spec:
  template:
    metadata:
      annotations:
        headscale.io/oidc-allowed-node-taints: "dedicated=sales-forecaster:NoSchedule"

target:
  kind: Deployment
  name: sales-forecaster
