apiVersion: builtin
kind: PatchTransformer
metadata:
  name: certmanager-patch
patch: |-
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: sales-forecaster-cert
spec:
  secretName: sales-forecaster-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - sales-forecaster.grc-claw.example.com

target:
  kind: Deployment
  name: sales-forecaster
