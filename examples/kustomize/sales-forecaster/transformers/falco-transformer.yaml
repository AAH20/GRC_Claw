apiVersion: builtin
kind: PatchTransformer
metadata:
  name: falco-patch
patch: |-
apiVersion: falco.org/v1
kind: FalcoRule
metadata:
  name: sales-forecaster-rules
spec:
  rules: |
    - rule: sales_forecaster_unexpected_process
      desc: Detect unexpected processes in sales-forecaster container
      condition: >
        spawned_process and
        container and
        container.image.repository = "grcclaw/sales-forecaster" and
        not proc.name in ("sales-forecaster", "sh", "bash")
      output: >
        Unexpected process in sales-forecaster container
        (user=%proc.pname command=%proc.cmdline)
      priority: WARNING

target:
  kind: Deployment
  name: sales-forecaster
