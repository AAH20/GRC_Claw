# Analytics - Kustomize Example
# Production-grade Kustomize configuration for the Analytics service.

---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: analytics

resources:
  - deployment.yaml
  - service.yaml
  - configmap.yaml
  - hpa.yaml

commonLabels:
  app.kubernetes.io/name: analytics
  app.kubernetes.io/part-of: grc-claw
  app.kubernetes.io/managed-by: kustomize

images:
  - name: analytics
    newTag: v3.0.0

configMapGenerator:
  - name: analytics-config
    literals:
      - LOG_LEVEL=info
      - EVENT_INGESTION_RATE=10000
      - WAREHOUSE_TYPE=clickhouse
      - DASHBOARD_REFRESH_INTERVAL=60
      - RETENTION_DAYS=365
      - REALTIME_WINDOW_SECONDS=300

secretGenerator:
  - name: analytics-secrets
    literals:
      - CLICKHOUSE_PASSWORD=changeme
      - DB_PASSWORD=changeme
      - JWT_SECRET=changeme

patches:
  - path: patches/deployment-resources.yaml
    target:
      kind: Deployment
      name: analytics

  - path: patches/service-annotations.yaml
    target:
      kind: Service
      name: analytics

# ─────────────────────────────────────────────────────────────────────────────
# OVERLAYS
# ─────────────────────────────────────────────────────────────────────────────
# overlays/dev/kustomization.yaml
# overlays/staging/kustomization.yaml
# overlays/prod/kustomization.yaml
#
# Example overlay (prod):
# ---
# apiVersion: kustomize.config.k8s.io/v1beta1
# kind: Kustomization
#
# resources:
#   - ../../base
#
# namePrefix: prod-
#
# replicas:
#   - name: analytics
#     count: 10
#
# patches:
#   - path: patches/prod-resources.yaml
