apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: analytics-staging

resources:
  - ../../base

patches:
  - path: ../../patches/replicas-patch.yaml
    target:
      kind: Deployment
      name: analytics
  - path: ../../patches/resources-patch.yaml
    target:
      kind: Deployment
      name: analytics

configMapGenerator:
  - name: analytics-config
    behavior: merge
    literals:
      - LOG_LEVEL=info
      - DEBUG=false

commonLabels:
  environment: staging

images:
  - name: grcclaw/analytics
    newTag: staging
