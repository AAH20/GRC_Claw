apiVersion: builtin
kind: PatchTransformer
metadata:
  name: gcp-secret-manager-patch
patch: |-
apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics
spec:
  template:
    metadata:
      annotations:
        secrets-store.csi.k8s.io/enable: "true"

target:
  kind: Deployment
  name: analytics
