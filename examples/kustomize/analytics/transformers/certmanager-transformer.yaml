apiVersion: builtin
kind: PatchTransformer
metadata:
  name: certmanager-patch
patch: |-
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: analytics-cert
spec:
  secretName: analytics-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - analytics.grc-claw.example.com

target:
  kind: Deployment
  name: analytics
