apiVersion: builtin
kind: PatchTransformer
metadata:
  name: azure-lb-patch
patch: |-
apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics
spec:
  template:
    metadata:
      annotations:
        service.beta.kubernetes.io/azure-load-balancer-internal: "false"

target:
  kind: Deployment
  name: analytics
