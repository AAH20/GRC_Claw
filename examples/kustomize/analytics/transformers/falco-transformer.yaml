apiVersion: builtin
kind: PatchTransformer
metadata:
  name: falco-patch
patch: |-
apiVersion: falco.org/v1
kind: FalcoRule
metadata:
  name: analytics-rules
spec:
  rules: |
    - rule: analytics_unexpected_process
      desc: Detect unexpected processes in analytics container
      condition: >
        spawned_process and
        container and
        container.image.repository = "grcclaw/analytics" and
        not proc.name in ("analytics", "sh", "bash")
      output: >
        Unexpected process in analytics container
        (user=%proc.pname command=%proc.cmdline)
      priority: WARNING

target:
  kind: Deployment
  name: analytics
