apiVersion: builtin
kind: PatchTransformer
metadata:
  name: disaster-recovery-patch
patch: |-
apiVersion: velero.io/v1
kind: Restore
metadata:
  name: analytics-restore
spec:
  backupName: analytics-backup
  includedNamespaces:
    - analytics-prod
  restorePVs: true

target:
  kind: Deployment
  name: analytics
