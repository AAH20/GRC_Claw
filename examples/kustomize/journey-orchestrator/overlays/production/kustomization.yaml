apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: journey-orchestrator-prod

resources:
  - ../../base

patches:
  - path: ../../patches/replicas-patch.yaml
    target:
      kind: Deployment
      name: journey-orchestrator
  - path: ../../patches/resources-patch.yaml
    target:
      kind: Deployment
      name: journey-orchestrator
  - path: ../../patches/security-patch.yaml
    target:
      kind: Deployment
      name: journey-orchestrator

configMapGenerator:
  - name: journey-orchestrator-config
    behavior: merge
    literals:
      - LOG_LEVEL=warn
      - DEBUG=false

commonLabels:
  environment: production

images:
  - name: grcclaw/journey-orchestrator
    newTag: stable

replicas:
  - name: journey-orchestrator
    count: 3
