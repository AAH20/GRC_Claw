apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: journey-orchestrator-dev

resources:
  - ../../base

patches:
  - path: ../../patches/replicas-patch.yaml
    target:
      kind: Deployment
      name: journey-orchestrator
  - path: ../../patches/resources-patch.yaml
    target:
      kind: Deployment
      name: journey-orchestrator

configMapGenerator:
  - name: journey-orchestrator-config
    behavior: merge
    literals:
      - LOG_LEVEL=debug
      - DEBUG=true

commonLabels:
  environment: development

images:
  - name: grcclaw/journey-orchestrator
    newTag: dev
