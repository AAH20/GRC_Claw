apiVersion: builtin
kind: PatchTransformer
metadata:
  name: headscale-oidc-allowed-organizations-patch
patch: |-
apiVersion: apps/v1
kind: Deployment
metadata:
  name: journey-orchestrator
spec:
  template:
    metadata:
      annotations:
        headscale.io/oidc-allowed-organizations: "org1"

target:
  kind: Deployment
  name: journey-orchestrator
