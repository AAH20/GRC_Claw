apiVersion: builtin
kind: PatchTransformer
metadata:
  name: falco-patch
patch: |-
apiVersion: falco.org/v1
kind: FalcoRule
metadata:
  name: journey-orchestrator-rules
spec:
  rules: |
    - rule: journey_orchestrator_unexpected_process
      desc: Detect unexpected processes in journey-orchestrator container
      condition: >
        spawned_process and
        container and
        container.image.repository = "grcclaw/journey-orchestrator" and
        not proc.name in ("journey-orchestrator", "sh", "bash")
      output: >
        Unexpected process in journey-orchestrator container
        (user=%proc.pname command=%proc.cmdline)
      priority: WARNING

target:
  kind: Deployment
  name: journey-orchestrator
