apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Account-Based Marketing Service - Production Kustomize Example
# Demonstrates base, overlays, patches, and transformers

resources:
  - base/deployment.yaml
  - base/service.yaml
  - base/configmap.yaml
  - base/hpa.yaml

patches:
  - path: patches/replicas-patch.yaml
    target:
      kind: Deployment
      name: account-based-marketing
  - path: patches/resource-limits-patch.yaml
    target:
      kind: Deployment
      name: account-based-marketing

patchesStrategicMerge:
  - patches/env-vars-patch.yaml

transformers:
  - transformers/labels-transformer.yaml
  - transformers/annotations-transformer.yaml

configMapGenerator:
  - name: account-based-marketing-config
    literals:
      - LOG_LEVEL=info
      - ICP_MATCHING_THRESHOLD=0.85
      - ACCOUNT_SCORING_MODEL=v2
      - CRM_SYNC_INTERVAL=600

commonLabels:
  app.kubernetes.io/part-of: account-based-marketing
  app.kubernetes.io/managed-by: kustomize

commonAnnotations:
  contact: abm-team@example.com

namespace: marketing

images:
  - name: account-based-marketing
    newName: registry.example.com/marketing/account-based-marketing
    newTag: v1.5.3

replicas:
  - name: account-based-marketing
    count: 2
