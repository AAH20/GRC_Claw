apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: broker-enablement-prod

resources:
  - ../../base

patches:
  - path: ../../patches/replicas-patch.yaml
    target:
      kind: Deployment
      name: broker-enablement
  - path: ../../patches/resources-patch.yaml
    target:
      kind: Deployment
      name: broker-enablement
  - path: ../../patches/security-patch.yaml
    target:
      kind: Deployment
      name: broker-enablement

configMapGenerator:
  - name: broker-enablement-config
    behavior: merge
    literals:
      - LOG_LEVEL=warn
      - DEBUG=false

commonLabels:
  environment: production

images:
  - name: grcclaw/broker-enablement
    newTag: stable

replicas:
  - name: broker-enablement
    count: 3
