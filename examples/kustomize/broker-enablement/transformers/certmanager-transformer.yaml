apiVersion: builtin
kind: PatchTransformer
metadata:
  name: certmanager-patch
patch: |-
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: broker-enablement-cert
spec:
  secretName: broker-enablement-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - broker-enablement.grc-claw.example.com

target:
  kind: Deployment
  name: broker-enablement
