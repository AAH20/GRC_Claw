apiVersion: builtin
kind: ReplacementTransformer
metadata:
  name: replacement-config
replacements:
  - source:
      kind: ConfigMap
      name: broker-enablement-config
      fieldPath: data.LOG_LEVEL
    targets:
      - select:
          kind: Deployment
          name: broker-enablement
        fieldPaths:
          - spec.template.spec.containers.[name=broker-enablement].env.[name=LOG_LEVEL].value
        options:
          create: true
