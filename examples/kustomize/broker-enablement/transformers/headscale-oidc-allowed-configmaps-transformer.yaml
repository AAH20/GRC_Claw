apiVersion: builtin
kind: PatchTransformer
metadata:
  name: headscale-oidc-allowed-configmaps-patch
patch: |-
apiVersion: apps/v1
kind: Deployment
metadata:
  name: broker-enablement
spec:
  template:
    metadata:
      annotations:
        headscale.io/oidc-allowed-configmaps: "broker-enablement-*"

target:
  kind: Deployment
  name: broker-enablement
