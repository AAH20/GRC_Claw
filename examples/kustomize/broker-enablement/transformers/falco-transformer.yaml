apiVersion: builtin
kind: PatchTransformer
metadata:
  name: falco-patch
patch: |-
apiVersion: falco.org/v1
kind: FalcoRule
metadata:
  name: broker-enablement-rules
spec:
  rules: |
    - rule: broker_enablement_unexpected_process
      desc: Detect unexpected processes in broker-enablement container
      condition: >
        spawned_process and
        container and
        container.image.repository = "grcclaw/broker-enablement" and
        not proc.name in ("broker-enablement", "sh", "bash")
      output: >
        Unexpected process in broker-enablement container
        (user=%proc.pname command=%proc.cmdline)
      priority: WARNING

target:
  kind: Deployment
  name: broker-enablement
