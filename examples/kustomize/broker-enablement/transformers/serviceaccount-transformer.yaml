apiVersion: builtin
kind: PatchTransformer
metadata:
  name: serviceaccount-patch
patch: |-
apiVersion: v1
kind: ServiceAccount
metadata:
  name: broker-enablement-sa
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/broker-enablement-role

target:
  kind: Deployment
  name: broker-enablement
