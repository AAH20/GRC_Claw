# Journey Orchestrator - Kustomize Example
# Production-grade Kustomize configuration for the Journey Orchestrator service.

---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: journey-orchestrator

resources:
  - deployment.yaml
  - service.yaml
  - configmap.yaml
  - hpa.yaml

commonLabels:
  app.kubernetes.io/name: journey-orchestrator
  app.kubernetes.io/part-of: grc-claw
  app.kubernetes.io/managed-by: kustomize

images:
  - name: journey-orchestrator
    newTag: v1.5.0

configMapGenerator:
  - name: journey-orchestrator-config
    literals:
      - LOG_LEVEL=info
      - ORCHESTRATION_ENGINE=temporal
      - MAX_CONCURRENT_JOURNEYS=500
      - JOURNEY_TIMEOUT=86400
      - EVENT_STORE_URL=http://event-store:9092

secretGenerator:
  - name: journey-orchestrator-secrets
    literals:
      - DB_PASSWORD=changeme
      - TEMPORAL_API_KEY=changeme

patches:
  - path: patches/deployment-resources.yaml
    target:
      kind: Deployment
      name: journey-orchestrator

  - path: patches/service-annotations.yaml
    target:
      kind: Service
      name: journey-orchestrator

