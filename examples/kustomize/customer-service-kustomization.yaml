# Customer Service - Kustomize Example
# Production-grade Kustomize configuration for the Customer Service service.

---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: customer-service

resources:
  - deployment.yaml
  - service.yaml
  - configmap.yaml
  - hpa.yaml

commonLabels:
  app.kubernetes.io/name: customer-service
  app.kubernetes.io/part-of: grc-claw
  app.kubernetes.io/managed-by: kustomize

images:
  - name: customer-service
    newTag: v2.2.0

configMapGenerator:
  - name: customer-service-config
    literals:
      - LOG_LEVEL=info
      - TICKET_SYSTEM=zendesk
      - CHATBOT_ENABLED=true
      - SLA_RESPONSE_TIME_MINUTES=30
      - KNOWLEDGE_BASE_URL=https://help.grc-claw.io
      - MAX_CONCURRENT_CHATS=50

secretGenerator:
  - name: customer-service-secrets
    literals:
      - ZENDESK_API_KEY=changeme
      - ZENDESK_EMAIL=support@grc-claw.io
      - OPENAI_API_KEY=changeme
      - DB_PASSWORD=changeme

patches:
  - path: patches/deployment-resources.yaml
    target:
      kind: Deployment
      name: customer-service

  - path: patches/service-annotations.yaml
    target:
      kind: Service
      name: customer-service

# ─────────────────────────────────────────────────────────────────────────────
# OVERLAYS
# ─────────────────────────────────────────────────────────────────────────────
# overlays/dev/kustomization.yaml
# overlays/staging/kustomization.yaml
