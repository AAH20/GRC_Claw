apiVersion: builtin
kind: PatchTransformer
metadata:
  name: falco-patch
patch: |-
apiVersion: falco.org/v1
kind: FalcoRule
metadata:
  name: partner-management-rules
spec:
  rules: |
    - rule: partner_management_unexpected_process
      desc: Detect unexpected processes in partner-management container
      condition: >
        spawned_process and
        container and
        container.image.repository = "grcclaw/partner-management" and
        not proc.name in ("partner-management", "sh", "bash")
      output: >
        Unexpected process in partner-management container
        (user=%proc.pname command=%proc.cmdline)
      priority: WARNING

target:
  kind: Deployment
  name: partner-management
