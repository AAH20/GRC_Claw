apiVersion: builtin
kind: PatchTransformer
metadata:
  name: disaster-recovery-patch
patch: |-
apiVersion: velero.io/v1
kind: Restore
metadata:
  name: partner-management-restore
spec:
  backupName: partner-management-backup
  includedNamespaces:
    - partner-management-prod
  restorePVs: true

target:
  kind: Deployment
  name: partner-management
