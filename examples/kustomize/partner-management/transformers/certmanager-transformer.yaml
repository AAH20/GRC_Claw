apiVersion: builtin
kind: PatchTransformer
metadata:
  name: certmanager-patch
patch: |-
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: partner-management-cert
spec:
  secretName: partner-management-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - partner-management.grc-claw.example.com

target:
  kind: Deployment
  name: partner-management
