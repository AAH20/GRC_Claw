apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: partner-management-prod

resources:
  - ../../base

patches:
  - path: ../../patches/replicas-patch.yaml
    target:
      kind: Deployment
      name: partner-management
  - path: ../../patches/resources-patch.yaml
    target:
      kind: Deployment
      name: partner-management
  - path: ../../patches/security-patch.yaml
    target:
      kind: Deployment
      name: partner-management

configMapGenerator:
  - name: partner-management-config
    behavior: merge
    literals:
      - LOG_LEVEL=warn
      - DEBUG=false

commonLabels:
  environment: production

images:
  - name: grcclaw/partner-management
    newTag: stable

replicas:
  - name: partner-management
    count: 3
