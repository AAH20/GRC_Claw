apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: partner-management-staging

resources:
  - ../../base

patches:
  - path: ../../patches/replicas-patch.yaml
    target:
      kind: Deployment
      name: partner-management
  - path: ../../patches/resources-patch.yaml
    target:
      kind: Deployment
      name: partner-management

configMapGenerator:
  - name: partner-management-config
    behavior: merge
    literals:
      - LOG_LEVEL=info
      - DEBUG=false

commonLabels:
  environment: staging

images:
  - name: grcclaw/partner-management
    newTag: staging
