apiVersion: apps/v1
kind: Deployment
metadata:
  name: partner-management
  labels:
    app.kubernetes.io/name: partner-management
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: partner-management
  template:
    metadata:
      labels:
        app.kubernetes.io/name: partner-management
    spec:
      containers:
        - name: partner-management
          image: grcclaw/partner-management:latest
          ports:
            - containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: partner-management-config
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      securityContext:
        fsGroup: 1000
