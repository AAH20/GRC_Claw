apiVersion: apps/v1
kind: Deployment
metadata:
  name: marketing-personalization
spec:
  template:
    spec:
      containers:
        - name: marketing-personalization
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
