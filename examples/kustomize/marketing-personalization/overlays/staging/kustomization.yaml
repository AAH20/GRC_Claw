apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: marketing-personalization-staging

resources:
  - ../../base

patches:
  - path: ../../patches/replicas-patch.yaml
    target:
      kind: Deployment
      name: marketing-personalization
  - path: ../../patches/resources-patch.yaml
    target:
      kind: Deployment
      name: marketing-personalization

configMapGenerator:
  - name: marketing-personalization-config
    behavior: merge
    literals:
      - LOG_LEVEL=info
      - DEBUG=false

commonLabels:
  environment: staging

images:
  - name: grcclaw/marketing-personalization
    newTag: staging
