apiVersion: builtin
kind: PatchTransformer
metadata:
  name: falco-patch
patch: |-
apiVersion: falco.org/v1
kind: FalcoRule
metadata:
  name: marketing-personalization-rules
spec:
  rules: |
    - rule: marketing_personalization_unexpected_process
      desc: Detect unexpected processes in marketing-personalization container
      condition: >
        spawned_process and
        container and
        container.image.repository = "grcclaw/marketing-personalization" and
        not proc.name in ("marketing-personalization", "sh", "bash")
      output: >
        Unexpected process in marketing-personalization container
        (user=%proc.pname command=%proc.cmdline)
      priority: WARNING

target:
  kind: Deployment
  name: marketing-personalization
