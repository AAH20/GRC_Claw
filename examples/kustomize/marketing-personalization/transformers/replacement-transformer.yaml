apiVersion: builtin
kind: ReplacementTransformer
metadata:
  name: replacement-config
replacements:
  - source:
      kind: ConfigMap
      name: marketing-personalization-config
      fieldPath: data.LOG_LEVEL
    targets:
      - select:
          kind: Deployment
          name: marketing-personalization
        fieldPaths:
          - spec.template.spec.containers.[name=marketing-personalization].env.[name=LOG_LEVEL].value
        options:
          create: true
