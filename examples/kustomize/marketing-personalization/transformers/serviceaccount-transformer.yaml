apiVersion: builtin
kind: PatchTransformer
metadata:
  name: serviceaccount-patch
patch: |-
apiVersion: v1
kind: ServiceAccount
metadata:
  name: marketing-personalization-sa
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/marketing-personalization-role

target:
  kind: Deployment
  name: marketing-personalization
