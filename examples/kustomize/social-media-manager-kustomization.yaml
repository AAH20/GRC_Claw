# Social Media Manager - Kustomize Example
# Production-grade Kustomize configuration for the Social Media Manager service.

---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: social-media-manager

resources:
  - deployment.yaml
  - service.yaml
  - configmap.yaml
  - hpa.yaml

commonLabels:
  app.kubernetes.io/name: social-media-manager
  app.kubernetes.io/part-of: grc-claw
  app.kubernetes.io/managed-by: kustomize

images:
  - name: social-media-manager
    newTag: v2.3.0

configMapGenerator:
  - name: social-media-manager-config
    literals:
      - LOG_LEVEL=info
      - SCHEDULER_INTERVAL=300
      - PLATFORMS=twitter,linkedin,facebook,instagram
      - RATE_LIMIT_PER_MINUTE=30
      - MEDIA_UPLOAD_BUCKET=grc-claw-media

secretGenerator:
  - name: social-media-manager-secrets
    literals:
      - TWITTER_API_KEY=changeme
      - TWITTER_API_SECRET=changeme
      - LINKEDIN_CLIENT_ID=changeme
      - LINKEDIN_CLIENT_SECRET=changeme
      - DB_PASSWORD=changeme

patches:
  - path: patches/deployment-resources.yaml
    target:
      kind: Deployment
      name: social-media-manager

  - path: patches/service-annotations.yaml
    target:
      kind: Service
      name: social-media-manager

# ─────────────────────────────────────────────────────────────────────────────
# OVERLAYS
# ─────────────────────────────────────────────────────────────────────────────
