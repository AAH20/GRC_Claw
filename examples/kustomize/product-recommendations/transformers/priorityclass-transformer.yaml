apiVersion: builtin
kind: PatchTransformer
metadata:
  name: priorityclass-patch
patch: |-
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: product-recommendations-priority
value: 1000
globalDefault: false
description: "Priority class for product-recommendations service"

target:
  kind: Deployment
  name: product-recommendations
