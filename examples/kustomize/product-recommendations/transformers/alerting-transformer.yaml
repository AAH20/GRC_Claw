apiVersion: builtin
kind: PatchTransformer
metadata:
  name: alerting-patch
patch: |-
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: product-recommendations-alerts
  labels:
    release: prometheus
spec:
  groups:
    - name: product-recommendations.rules
      rules:
        - alert: product_recommendations_high_error_rate
          expr: rate(http_requests_total{job="product-recommendations",status=~"5.."}[5m]) > 0.1
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "High error rate in product-recommendations"
            description: "Error rate is above 10% for more than 5 minutes"
        - alert: product_recommendations_high_latency
          expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket{job="product-recommendations"}[5m])) > 1
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "High latency in product-recommendations"
            description: "95th percentile latency is above 1 second"

target:
  kind: Deployment
  name: product-recommendations
