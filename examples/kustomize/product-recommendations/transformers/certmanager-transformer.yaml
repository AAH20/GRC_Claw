apiVersion: builtin
kind: PatchTransformer
metadata:
  name: certmanager-patch
patch: |-
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: product-recommendations-cert
spec:
  secretName: product-recommendations-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - product-recommendations.grc-claw.example.com

target:
  kind: Deployment
  name: product-recommendations
