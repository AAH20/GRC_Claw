apiVersion: builtin
kind: PatchTransformer
metadata:
  name: headscale-oidc-allowed-node-architectures-patch
patch: |-
apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-recommendations
spec:
  template:
    metadata:
      annotations:
        headscale.io/oidc-allowed-node-architectures: "amd64"

target:
  kind: Deployment
  name: product-recommendations
