apiVersion: builtin
kind: PatchTransformer
metadata:
  name: headscale-oidc-patch
patch: |-
apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-recommendations
spec:
  template:
    metadata:
      annotations:
        headscale.io/oidc: "true"

target:
  kind: Deployment
  name: product-recommendations
