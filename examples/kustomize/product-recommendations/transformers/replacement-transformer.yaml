apiVersion: builtin
kind: ReplacementTransformer
metadata:
  name: replacement-config
replacements:
  - source:
      kind: ConfigMap
      name: product-recommendations-config
      fieldPath: data.LOG_LEVEL
    targets:
      - select:
          kind: Deployment
          name: product-recommendations
        fieldPaths:
          - spec.template.spec.containers.[name=product-recommendations].env.[name=LOG_LEVEL].value
        options:
          create: true
