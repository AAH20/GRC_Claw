apiVersion: builtin
kind: PatchTransformer
metadata:
  name: falco-patch
patch: |-
apiVersion: falco.org/v1
kind: FalcoRule
metadata:
  name: product-recommendations-rules
spec:
  rules: |
    - rule: product_recommendations_unexpected_process
      desc: Detect unexpected processes in product-recommendations container
      condition: >
        spawned_process and
        container and
        container.image.repository = "grcclaw/product-recommendations" and
        not proc.name in ("product-recommendations", "sh", "bash")
      output: >
        Unexpected process in product-recommendations container
        (user=%proc.pname command=%proc.cmdline)
      priority: WARNING

target:
  kind: Deployment
  name: product-recommendations
