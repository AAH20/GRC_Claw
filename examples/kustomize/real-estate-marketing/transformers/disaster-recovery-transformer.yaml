apiVersion: builtin
kind: PatchTransformer
metadata:
  name: disaster-recovery-patch
patch: |-
apiVersion: velero.io/v1
kind: Restore
metadata:
  name: real-estate-marketing-restore
spec:
  backupName: real-estate-marketing-backup
  includedNamespaces:
    - real-estate-marketing-prod
  restorePVs: true

target:
  kind: Deployment
  name: real-estate-marketing
