apiVersion: builtin
kind: PatchTransformer
metadata:
  name: monitoring-patch
patch: |-
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: real-estate-marketing-metrics
  labels:
    release: prometheus
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: real-estate-marketing
  endpoints:
    - port: http
      interval: 30s
      path: /metrics

target:
  kind: Deployment
  name: real-estate-marketing
