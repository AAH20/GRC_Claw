apiVersion: builtin
kind: PatchTransformer
metadata:
  name: headscale-oidc-allowed-node-labels-patch
patch: |-
apiVersion: apps/v1
kind: Deployment
metadata:
  name: real-estate-marketing
spec:
  template:
    metadata:
      annotations:
        headscale.io/oidc-allowed-node-labels: "node-role.kubernetes.io/worker="

target:
  kind: Deployment
  name: real-estate-marketing
