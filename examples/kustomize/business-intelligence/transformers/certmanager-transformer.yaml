apiVersion: builtin
kind: PatchTransformer
metadata:
  name: certmanager-patch
patch: |-
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: business-intelligence-cert
spec:
  secretName: business-intelligence-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - business-intelligence.grc-claw.example.com

target:
  kind: Deployment
  name: business-intelligence
