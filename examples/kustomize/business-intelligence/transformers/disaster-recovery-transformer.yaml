apiVersion: builtin
kind: PatchTransformer
metadata:
  name: disaster-recovery-patch
patch: |-
apiVersion: velero.io/v1
kind: Restore
metadata:
  name: business-intelligence-restore
spec:
  backupName: business-intelligence-backup
  includedNamespaces:
    - business-intelligence-prod
  restorePVs: true

target:
  kind: Deployment
  name: business-intelligence
