apiVersion: builtin
kind: ReplacementTransformer
metadata:
  name: replacement-config
replacements:
  - source:
      kind: ConfigMap
      name: business-intelligence-config
      fieldPath: data.LOG_LEVEL
    targets:
      - select:
          kind: Deployment
          name: business-intelligence
        fieldPaths:
          - spec.template.spec.containers.[name=business-intelligence].env.[name=LOG_LEVEL].value
        options:
          create: true
