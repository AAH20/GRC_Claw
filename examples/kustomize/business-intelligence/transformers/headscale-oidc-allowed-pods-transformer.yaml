apiVersion: builtin
kind: PatchTransformer
metadata:
  name: headscale-oidc-allowed-pods-patch
patch: |-
apiVersion: apps/v1
kind: Deployment
metadata:
  name: business-intelligence
spec:
  template:
    metadata:
      annotations:
        headscale.io/oidc-allowed-pods: "business-intelligence-*"

target:
  kind: Deployment
  name: business-intelligence
