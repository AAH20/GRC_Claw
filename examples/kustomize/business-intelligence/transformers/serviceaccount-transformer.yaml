apiVersion: builtin
kind: PatchTransformer
metadata:
  name: serviceaccount-patch
patch: |-
apiVersion: v1
kind: ServiceAccount
metadata:
  name: business-intelligence-sa
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/business-intelligence-role

target:
  kind: Deployment
  name: business-intelligence
