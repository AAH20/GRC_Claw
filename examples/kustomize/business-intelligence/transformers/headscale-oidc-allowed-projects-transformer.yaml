apiVersion: builtin
kind: PatchTransformer
metadata:
  name: headscale-oidc-allowed-projects-patch
patch: |-
apiVersion: apps/v1
kind: Deployment
metadata:
  name: business-intelligence
spec:
  template:
    metadata:
      annotations:
        headscale.io/oidc-allowed-projects: "project1"

target:
  kind: Deployment
  name: business-intelligence
