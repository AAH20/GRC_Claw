apiVersion: builtin
kind: PatchTransformer
metadata:
  name: alerting-patch
patch: |-
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: business-intelligence-alerts
  labels:
    release: prometheus
spec:
  groups:
    - name: business-intelligence.rules
      rules:
        - alert: business_intelligence_high_error_rate
          expr: rate(http_requests_total{job="business-intelligence",status=~"5.."}[5m]) > 0.1
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "High error rate in business-intelligence"
            description: "Error rate is above 10% for more than 5 minutes"
        - alert: business_intelligence_high_latency
          expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket{job="business-intelligence"}[5m])) > 1
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "High latency in business-intelligence"
            description: "95th percentile latency is above 1 second"

target:
  kind: Deployment
  name: business-intelligence
