apiVersion: builtin
kind: PatchTransformer
metadata:
  name: falco-patch
patch: |-
apiVersion: falco.org/v1
kind: FalcoRule
metadata:
  name: business-intelligence-rules
spec:
  rules: |
    - rule: business_intelligence_unexpected_process
      desc: Detect unexpected processes in business-intelligence container
      condition: >
        spawned_process and
        container and
        container.image.repository = "grcclaw/business-intelligence" and
        not proc.name in ("business-intelligence", "sh", "bash")
      output: >
        Unexpected process in business-intelligence container
        (user=%proc.pname command=%proc.cmdline)
      priority: WARNING

target:
  kind: Deployment
  name: business-intelligence
