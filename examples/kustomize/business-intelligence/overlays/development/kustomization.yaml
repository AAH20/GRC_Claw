apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: business-intelligence-dev

resources:
  - ../../base

patches:
  - path: ../../patches/replicas-patch.yaml
    target:
      kind: Deployment
      name: business-intelligence
  - path: ../../patches/resources-patch.yaml
    target:
      kind: Deployment
      name: business-intelligence

configMapGenerator:
  - name: business-intelligence-config
    behavior: merge
    literals:
      - LOG_LEVEL=debug
      - DEBUG=true

commonLabels:
  environment: development

images:
  - name: grcclaw/business-intelligence
    newTag: dev
