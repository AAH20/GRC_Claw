apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Business Intelligence Service - Production Kustomize Example
# Demonstrates base, overlays, patches, and transformers

resources:
  - base/deployment.yaml
  - base/service.yaml
  - base/configmap.yaml
  - base/hpa.yaml

patches:
  - path: patches/replicas-patch.yaml
    target:
      kind: Deployment
      name: business-intelligence
  - path: patches/resource-limits-patch.yaml
    target:
      kind: Deployment
      name: business-intelligence

patchesStrategicMerge:
  - patches/env-vars-patch.yaml

transformers:
  - transformers/labels-transformer.yaml
  - transformers/annotations-transformer.yaml

configMapGenerator:
  - name: business-intelligence-config
    literals:
      - LOG_LEVEL=info
      - QUERY_CACHE_TTL=600
      - DASHBOARD_REFRESH_INTERVAL=60
      - DATA_WAREHOUSE_URL=http://warehouse:5432
      - REPORT_SCHEDULER_ENABLED=true

commonLabels:
  app.kubernetes.io/part-of: business-intelligence
  app.kubernetes.io/managed-by: kustomize

commonAnnotations:
  contact: bi-team@example.com

namespace: analytics

images:
  - name: business-intelligence
    newName: registry.example.com/analytics/business-intelligence
    newTag: v4.1.0

replicas:
  - name: business-intelligence
    count: 2
