apiVersion: builtin
kind: PatchTransformer
metadata:
  name: alerting-patch
patch: |-
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: market-research-alerts
  labels:
    release: prometheus
spec:
  groups:
    - name: market-research.rules
      rules:
        - alert: market_research_high_error_rate
          expr: rate(http_requests_total{job="market-research",status=~"5.."}[5m]) > 0.1
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "High error rate in market-research"
            description: "Error rate is above 10% for more than 5 minutes"
        - alert: market_research_high_latency
          expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket{job="market-research"}[5m])) > 1
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "High latency in market-research"
            description: "95th percentile latency is above 1 second"

target:
  kind: Deployment
  name: market-research
