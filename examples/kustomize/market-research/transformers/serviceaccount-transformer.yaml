apiVersion: builtin
kind: PatchTransformer
metadata:
  name: serviceaccount-patch
patch: |-
apiVersion: v1
kind: ServiceAccount
metadata:
  name: market-research-sa
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/market-research-role

target:
  kind: Deployment
  name: market-research
