apiVersion: builtin
kind: PatchTransformer
metadata:
  name: certmanager-patch
patch: |-
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: market-research-cert
spec:
  secretName: market-research-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - market-research.grc-claw.example.com

target:
  kind: Deployment
  name: market-research
