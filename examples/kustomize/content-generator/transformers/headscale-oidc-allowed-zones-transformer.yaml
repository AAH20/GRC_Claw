apiVersion: builtin
kind: PatchTransformer
metadata:
  name: headscale-oidc-allowed-zones-patch
patch: |-
apiVersion: apps/v1
kind: Deployment
metadata:
  name: content-generator
spec:
  template:
    metadata:
      annotations:
        headscale.io/oidc-allowed-zones: "us-east-1a"

target:
  kind: Deployment
  name: content-generator
