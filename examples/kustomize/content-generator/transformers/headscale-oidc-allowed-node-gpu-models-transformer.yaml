apiVersion: builtin
kind: PatchTransformer
metadata:
  name: headscale-oidc-allowed-node-gpu-models-patch
patch: |-
apiVersion: apps/v1
kind: Deployment
metadata:
  name: content-generator
spec:
  template:
    metadata:
      annotations:
        headscale.io/oidc-allowed-node-gpu-models: "nvidia-tesla-t4"

target:
  kind: Deployment
  name: content-generator
