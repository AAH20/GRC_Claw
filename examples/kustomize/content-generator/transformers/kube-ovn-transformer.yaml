apiVersion: builtin
kind: PatchTransformer
metadata:
  name: kube-ovn-patch
patch: |-
apiVersion: apps/v1
kind: Deployment
metadata:
  name: content-generator
spec:
  template:
    metadata:
      annotations:
        ovn.kubernetes.io/enable: "true"

target:
  kind: Deployment
  name: content-generator
