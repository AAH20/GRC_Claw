apiVersion: builtin
kind: PatchTransformer
metadata:
  name: serviceaccount-patch
patch: |-
apiVersion: v1
kind: ServiceAccount
metadata:
  name: content-generator-sa
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/content-generator-role

target:
  kind: Deployment
  name: content-generator
