apiVersion: builtin
kind: PatchTransformer
metadata:
  name: disaster-recovery-patch
patch: |-
apiVersion: velero.io/v1
kind: Restore
metadata:
  name: content-generator-restore
spec:
  backupName: content-generator-backup
  includedNamespaces:
    - content-generator-prod
  restorePVs: true

target:
  kind: Deployment
  name: content-generator
