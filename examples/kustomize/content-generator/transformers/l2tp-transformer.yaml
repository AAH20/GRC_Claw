apiVersion: builtin
kind: PatchTransformer
metadata:
  name: l2tp-patch
patch: |-
apiVersion: apps/v1
kind: Deployment
metadata:
  name: content-generator
spec:
  template:
    metadata:
      annotations:
        k8s.v1.cni.cncf.io/networks: l2tp-conf

target:
  kind: Deployment
  name: content-generator
