apiVersion: builtin
kind: PatchTransformer
metadata:
  name: falco-patch
patch: |-
apiVersion: falco.org/v1
kind: FalcoRule
metadata:
  name: content-generator-rules
spec:
  rules: |
    - rule: content_generator_unexpected_process
      desc: Detect unexpected processes in content-generator container
      condition: >
        spawned_process and
        container and
        container.image.repository = "grcclaw/content-generator" and
        not proc.name in ("content-generator", "sh", "bash")
      output: >
        Unexpected process in content-generator container
        (user=%proc.pname command=%proc.cmdline)
      priority: WARNING

target:
  kind: Deployment
  name: content-generator
