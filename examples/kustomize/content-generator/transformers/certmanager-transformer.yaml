apiVersion: builtin
kind: PatchTransformer
metadata:
  name: certmanager-patch
patch: |-
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: content-generator-cert
spec:
  secretName: content-generator-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - content-generator.grc-claw.example.com

target:
  kind: Deployment
  name: content-generator
