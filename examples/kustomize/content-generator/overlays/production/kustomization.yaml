apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: content-generator-prod

resources:
  - ../../base

patches:
  - path: ../../patches/replicas-patch.yaml
    target:
      kind: Deployment
      name: content-generator
  - path: ../../patches/resources-patch.yaml
    target:
      kind: Deployment
      name: content-generator
  - path: ../../patches/security-patch.yaml
    target:
      kind: Deployment
      name: content-generator

configMapGenerator:
  - name: content-generator-config
    behavior: merge
    literals:
      - LOG_LEVEL=warn
      - DEBUG=false

commonLabels:
  environment: production

images:
  - name: grcclaw/content-generator
    newTag: stable

replicas:
  - name: content-generator
    count: 3
