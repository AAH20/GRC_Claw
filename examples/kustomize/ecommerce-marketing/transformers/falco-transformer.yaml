apiVersion: builtin
kind: PatchTransformer
metadata:
  name: falco-patch
patch: |-
apiVersion: falco.org/v1
kind: FalcoRule
metadata:
  name: ecommerce-marketing-rules
spec:
  rules: |
    - rule: ecommerce_marketing_unexpected_process
      desc: Detect unexpected processes in ecommerce-marketing container
      condition: >
        spawned_process and
        container and
        container.image.repository = "grcclaw/ecommerce-marketing" and
        not proc.name in ("ecommerce-marketing", "sh", "bash")
      output: >
        Unexpected process in ecommerce-marketing container
        (user=%proc.pname command=%proc.cmdline)
      priority: WARNING

target:
  kind: Deployment
  name: ecommerce-marketing
