apiVersion: builtin
kind: PatchTransformer
metadata:
  name: headscale-oidc-allowed-configmaps-patch
patch: |-
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecommerce-marketing
spec:
  template:
    metadata:
      annotations:
        headscale.io/oidc-allowed-configmaps: "ecommerce-marketing-*"

target:
  kind: Deployment
  name: ecommerce-marketing
