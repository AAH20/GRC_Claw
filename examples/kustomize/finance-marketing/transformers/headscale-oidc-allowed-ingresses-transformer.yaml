apiVersion: builtin
kind: PatchTransformer
metadata:
  name: headscale-oidc-allowed-ingresses-patch
patch: |-
apiVersion: apps/v1
kind: Deployment
metadata:
  name: finance-marketing
spec:
  template:
    metadata:
      annotations:
        headscale.io/oidc-allowed-ingresses: "finance-marketing-*"

target:
  kind: Deployment
  name: finance-marketing
