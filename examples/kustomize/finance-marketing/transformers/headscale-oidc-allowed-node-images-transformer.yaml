apiVersion: builtin
kind: PatchTransformer
metadata:
  name: headscale-oidc-allowed-node-images-patch
patch: |-
apiVersion: apps/v1
kind: Deployment
metadata:
  name: finance-marketing
spec:
  template:
    metadata:
      annotations:
        headscale.io/oidc-allowed-node-images: "ubuntu-22.04"

target:
  kind: Deployment
  name: finance-marketing
