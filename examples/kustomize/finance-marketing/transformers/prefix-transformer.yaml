apiVersion: builtin
kind: PrefixTransformer
metadata:
  name: name-prefix
prefix: financemarketing-
fieldSpecs:
  - path: metadata/name
    create: true
  - path: spec/template/metadata/labels/app\.kubernetes\.io/name
    create: true
  - path: spec/selector/matchLabels/app\.kubernetes\.io/name
    create: true
