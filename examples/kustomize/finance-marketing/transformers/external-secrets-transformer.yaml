apiVersion: builtin
kind: PatchTransformer
metadata:
  name: external-secrets-patch
patch: |-
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: finance-marketing-external-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: finance-marketing-secrets
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: finance-marketing/database
        property: url
    - secretKey: API_KEY
      remoteRef:
        key: finance-marketing/api
        property: key

target:
  kind: Deployment
  name: finance-marketing
