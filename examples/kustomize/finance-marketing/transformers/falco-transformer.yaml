apiVersion: builtin
kind: PatchTransformer
metadata:
  name: falco-patch
patch: |-
apiVersion: falco.org/v1
kind: FalcoRule
metadata:
  name: finance-marketing-rules
spec:
  rules: |
    - rule: finance_marketing_unexpected_process
      desc: Detect unexpected processes in finance-marketing container
      condition: >
        spawned_process and
        container and
        container.image.repository = "grcclaw/finance-marketing" and
        not proc.name in ("finance-marketing", "sh", "bash")
      output: >
        Unexpected process in finance-marketing container
        (user=%proc.pname command=%proc.cmdline)
      priority: WARNING

target:
  kind: Deployment
  name: finance-marketing
