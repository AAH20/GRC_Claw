apiVersion: builtin
kind: PatchTransformer
metadata:
  name: falco-patch
patch: |-
apiVersion: falco.org/v1
kind: FalcoRule
metadata:
  name: affiliate-marketing-rules
spec:
  rules: |
    - rule: affiliate_marketing_unexpected_process
      desc: Detect unexpected processes in affiliate-marketing container
      condition: >
        spawned_process and
        container and
        container.image.repository = "grcclaw/affiliate-marketing" and
        not proc.name in ("affiliate-marketing", "sh", "bash")
      output: >
        Unexpected process in affiliate-marketing container
        (user=%proc.pname command=%proc.cmdline)
      priority: WARNING

target:
  kind: Deployment
  name: affiliate-marketing
