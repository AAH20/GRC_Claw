apiVersion: builtin
kind: PatchTransformer
metadata:
  name: disaster-recovery-patch
patch: |-
apiVersion: velero.io/v1
kind: Restore
metadata:
  name: affiliate-marketing-restore
spec:
  backupName: affiliate-marketing-backup
  includedNamespaces:
    - affiliate-marketing-prod
  restorePVs: true

target:
  kind: Deployment
  name: affiliate-marketing
