apiVersion: builtin
kind: PatchTransformer
metadata:
  name: headscale-oidc-allowed-nodes-patch
patch: |-
apiVersion: apps/v1
kind: Deployment
metadata:
  name: event-management
spec:
  template:
    metadata:
      annotations:
        headscale.io/oidc-allowed-nodes: "node-*"

target:
  kind: Deployment
  name: event-management
