apiVersion: builtin
kind: PatchTransformer
metadata:
  name: falco-patch
patch: |-
apiVersion: falco.org/v1
kind: FalcoRule
metadata:
  name: event-management-rules
spec:
  rules: |
    - rule: event_management_unexpected_process
      desc: Detect unexpected processes in event-management container
      condition: >
        spawned_process and
        container and
        container.image.repository = "grcclaw/event-management" and
        not proc.name in ("event-management", "sh", "bash")
      output: >
        Unexpected process in event-management container
        (user=%proc.pname command=%proc.cmdline)
      priority: WARNING

target:
  kind: Deployment
  name: event-management
