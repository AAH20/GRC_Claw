apiVersion: builtin
kind: PatchTransformer
metadata:
  name: strategic-merge-patch
patch: |-
  apiVersion: apps/v1
  kind: Deployment
  metadata:
    name: event-management
  spec:
    template:
      spec:
        containers:
          - name: event-management
            env:
              - name: FEATURE_FLAG
                value: "true"
              - name: CACHE_TTL
                value: "300"
target:
  kind: Deployment
  name: event-management
