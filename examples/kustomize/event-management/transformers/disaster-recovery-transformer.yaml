apiVersion: builtin
kind: PatchTransformer
metadata:
  name: disaster-recovery-patch
patch: |-
apiVersion: velero.io/v1
kind: Restore
metadata:
  name: event-management-restore
spec:
  backupName: event-management-backup
  includedNamespaces:
    - event-management-prod
  restorePVs: true

target:
  kind: Deployment
  name: event-management
