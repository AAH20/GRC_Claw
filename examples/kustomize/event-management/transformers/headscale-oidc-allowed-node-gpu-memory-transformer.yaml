apiVersion: builtin
kind: PatchTransformer
metadata:
  name: headscale-oidc-allowed-node-gpu-memory-patch
patch: |-
apiVersion: apps/v1
kind: Deployment
metadata:
  name: event-management
spec:
  template:
    metadata:
      annotations:
        headscale.io/oidc-allowed-node-gpu-memory: "16Gi"

target:
  kind: Deployment
  name: event-management
