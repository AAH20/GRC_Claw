apiVersion: builtin
kind: PatchTransformer
metadata:
  name: gcp-lb-patch
patch: |-
apiVersion: apps/v1
kind: Deployment
metadata:
  name: event-management
spec:
  template:
    metadata:
      annotations:
        cloud.google.com/neg: '{"ingress": true}'

target:
  kind: Deployment
  name: event-management
