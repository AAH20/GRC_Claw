apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: event-management-dev

resources:
  - ../../base

patches:
  - path: ../../patches/replicas-patch.yaml
    target:
      kind: Deployment
      name: event-management
  - path: ../../patches/resources-patch.yaml
    target:
      kind: Deployment
      name: event-management

configMapGenerator:
  - name: event-management-config
    behavior: merge
    literals:
      - LOG_LEVEL=debug
      - DEBUG=true

commonLabels:
  environment: development

images:
  - name: grcclaw/event-management
    newTag: dev
