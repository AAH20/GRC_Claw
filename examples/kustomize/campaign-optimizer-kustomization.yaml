# Campaign Optimizer - Kustomize Example
# Production-grade Kustomize configuration for the Campaign Optimizer service.
# Demonstrates base, overlays (dev/staging/prod), patches, and transformers.

---
# ─────────────────────────────────────────────────────────────────────────────
# BASE
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: campaign-optimizer

resources:
  - deployment.yaml
  - service.yaml
  - configmap.yaml
  - hpa.yaml

commonLabels:
  app.kubernetes.io/name: campaign-optimizer
  app.kubernetes.io/part-of: grc-claw
  app.kubernetes.io/managed-by: kustomize

images:
  - name: campaign-optimizer
    newTag: v1.2.3

configMapGenerator:
  - name: campaign-optimizer-config
    literals:
      - LOG_LEVEL=info
      - OPTIMIZER_WORKERS=4
      - CAMPAIGN_CACHE_TTL=300
      - ML_MODEL_PATH=/models/campaign-optimizer

secretGenerator:
  - name: campaign-optimizer-secrets
    literals:
      - DB_PASSWORD=changeme
      - API_KEY=changeme

patches:
  - path: patches/deployment-resources.yaml
    target:
      kind: Deployment
      name: campaign-optimizer

  - path: patches/service-annotations.yaml
    target:
      kind: Service
      name: campaign-optimizer

# ─────────────────────────────────────────────────────────────────────────────
# OVERLAYS
# ─────────────────────────────────────────────────────────────────────────────
# overlays/dev/kustomization.yaml
# overlays/staging/kustomization.yaml
# overlays/prod/kustomization.yaml
#
# Example overlay (prod):
# ---
# apiVersion: kustomize.config.k8s.io/v1beta1
# kind: Kustomization
#
# resources:
#   - ../../base
#
# namePrefix: prod-
#
# replicas:
#   - name: campaign-optimizer
#     count: 5
#
# patches:
#   - path: patches/prod-resources.yaml
#   - path: patches/prod-autoscaling.yaml
#
# configMapGenerator:
#   - name: campaign-optimizer-config
#     behavior: merge
#     literals:
#       - LOG_LEVEL=warn
#       - OPTIMIZER_WORKERS=16
#
# ─────────────────────────────────────────────────────────────────────────────
# TRANSFORMERS
# ─────────────────────────────────────────────────────────────────────────────
# transformers/labels-transformer.yaml
# transformers/namespace-transformer.yaml
# transformers/image-transformer.yaml
