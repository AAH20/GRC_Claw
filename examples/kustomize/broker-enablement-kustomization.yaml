# Broker Enablement - Kustomize Example
# Production-grade Kustomize configuration for the Broker Enablement service.

---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: broker-enablement

resources:
  - deployment.yaml
  - service.yaml
  - configmap.yaml
  - hpa.yaml

commonLabels:
  app.kubernetes.io/name: broker-enablement
  app.kubernetes.io/part-of: grc-claw
  app.kubernetes.io/managed-by: kustomize

images:
  - name: broker-enablement
    newTag: v1.3.0

configMapGenerator:
  - name: broker-enablement-config
    literals:
      - LOG_LEVEL=info
      - ONBOARDING_WORKFLOW_STEPS=5
      - DOCUMENT_VERIFICATION_PROVIDER=onfido
      - COMPLIANCE_CHECK_INTERVAL=86400
      - TRAINING_MODULES=compliance,product-sales,objection-handling
      - CERTIFICATION_VALIDITY_DAYS=365

secretGenerator:
  - name: broker-enablement-secrets
    literals:
      - ONFIDO_API_KEY=changeme
      - DB_PASSWORD=changeme
      - JWT_SECRET=changeme

patches:
  - path: patches/deployment-resources.yaml
    target:
      kind: Deployment
      name: broker-enablement

  - path: patches/service-annotations.yaml
    target:
      kind: Service
      name: broker-enablement

