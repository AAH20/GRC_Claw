apiVersion: builtin
kind: NamePrefixTransformer
metadata:
  name: name-prefix-config
prefix: brandmonitoring-
fieldSpecs:
  - path: metadata/name
    create: true
  - path: spec/template/metadata/labels/app\.kubernetes\.io/name
    create: true
  - path: spec/selector/matchLabels/app\.kubernetes\.io/name
    create: true
