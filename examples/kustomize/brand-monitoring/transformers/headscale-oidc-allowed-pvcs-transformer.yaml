apiVersion: builtin
kind: PatchTransformer
metadata:
  name: headscale-oidc-allowed-pvcs-patch
patch: |-
apiVersion: apps/v1
kind: Deployment
metadata:
  name: brand-monitoring
spec:
  template:
    metadata:
      annotations:
        headscale.io/oidc-allowed-pvcs: "brand-monitoring-*"

target:
  kind: Deployment
  name: brand-monitoring
