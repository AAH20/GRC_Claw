apiVersion: builtin
kind: PatchTransformer
metadata:
  name: kube-bench-patch
patch: |-
apiVersion: batch/v1
kind: Job
metadata:
  name: brand-monitoring-kube-bench
spec:
  template:
    spec:
      containers:
        - name: kube-bench
          image: aquasec/kube-bench:latest
          command: ["kube-bench", "run", "--targets", "node"]
      restartPolicy: Never

target:
  kind: Deployment
  name: brand-monitoring
