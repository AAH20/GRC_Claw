apiVersion: builtin
kind: PatchTransformer
metadata:
  name: headscale-oidc-allowed-node-container-runtime-versions-patch
patch: |-
apiVersion: apps/v1
kind: Deployment
metadata:
  name: brand-monitoring
spec:
  template:
    metadata:
      annotations:
        headscale.io/oidc-allowed-node-container-runtime-versions: "containerd://1.7.0"

target:
  kind: Deployment
  name: brand-monitoring
