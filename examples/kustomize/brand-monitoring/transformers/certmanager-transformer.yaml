apiVersion: builtin
kind: PatchTransformer
metadata:
  name: certmanager-patch
patch: |-
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: brand-monitoring-cert
spec:
  secretName: brand-monitoring-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - brand-monitoring.grc-claw.example.com

target:
  kind: Deployment
  name: brand-monitoring
