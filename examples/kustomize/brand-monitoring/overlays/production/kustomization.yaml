apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: brand-monitoring-prod

resources:
  - ../../base

patches:
  - path: ../../patches/replicas-patch.yaml
    target:
      kind: Deployment
      name: brand-monitoring
  - path: ../../patches/resources-patch.yaml
    target:
      kind: Deployment
      name: brand-monitoring
  - path: ../../patches/security-patch.yaml
    target:
      kind: Deployment
      name: brand-monitoring

configMapGenerator:
  - name: brand-monitoring-config
    behavior: merge
    literals:
      - LOG_LEVEL=warn
      - DEBUG=false

commonLabels:
  environment: production

images:
  - name: grcclaw/brand-monitoring
    newTag: stable

replicas:
  - name: brand-monitoring
    count: 3
