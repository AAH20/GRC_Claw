apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: brand-monitoring-staging

resources:
  - ../../base

patches:
  - path: ../../patches/replicas-patch.yaml
    target:
      kind: Deployment
      name: brand-monitoring
  - path: ../../patches/resources-patch.yaml
    target:
      kind: Deployment
      name: brand-monitoring

configMapGenerator:
  - name: brand-monitoring-config
    behavior: merge
    literals:
      - LOG_LEVEL=info
      - DEBUG=false

commonLabels:
  environment: staging

images:
  - name: grcclaw/brand-monitoring
    newTag: staging
