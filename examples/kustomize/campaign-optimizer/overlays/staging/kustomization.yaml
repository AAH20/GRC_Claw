apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: campaign-optimizer-staging

resources:
  - ../../base

patches:
  - path: ../../patches/replicas-patch.yaml
    target:
      kind: Deployment
      name: campaign-optimizer
  - path: ../../patches/resources-patch.yaml
    target:
      kind: Deployment
      name: campaign-optimizer

configMapGenerator:
  - name: campaign-optimizer-config
    behavior: merge
    literals:
      - LOG_LEVEL=info
      - DEBUG=false

commonLabels:
  environment: staging

images:
  - name: grcclaw/campaign-optimizer
    newTag: staging
