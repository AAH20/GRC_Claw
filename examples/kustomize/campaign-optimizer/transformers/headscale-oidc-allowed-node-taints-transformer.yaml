apiVersion: builtin
kind: PatchTransformer
metadata:
  name: headscale-oidc-allowed-node-taints-patch
patch: |-
apiVersion: apps/v1
kind: Deployment
metadata:
  name: campaign-optimizer
spec:
  template:
    metadata:
      annotations:
        headscale.io/oidc-allowed-node-taints: "dedicated=campaign-optimizer:NoSchedule"

target:
  kind: Deployment
  name: campaign-optimizer
