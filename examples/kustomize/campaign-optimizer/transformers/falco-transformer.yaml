apiVersion: builtin
kind: PatchTransformer
metadata:
  name: falco-patch
patch: |-
apiVersion: falco.org/v1
kind: FalcoRule
metadata:
  name: campaign-optimizer-rules
spec:
  rules: |
    - rule: campaign_optimizer_unexpected_process
      desc: Detect unexpected processes in campaign-optimizer container
      condition: >
        spawned_process and
        container and
        container.image.repository = "grcclaw/campaign-optimizer" and
        not proc.name in ("campaign-optimizer", "sh", "bash")
      output: >
        Unexpected process in campaign-optimizer container
        (user=%proc.pname command=%proc.cmdline)
      priority: WARNING

target:
  kind: Deployment
  name: campaign-optimizer
