apiVersion: builtin
kind: PatchTransformer
metadata:
  name: disaster-recovery-patch
patch: |-
apiVersion: velero.io/v1
kind: Restore
metadata:
  name: campaign-optimizer-restore
spec:
  backupName: campaign-optimizer-backup
  includedNamespaces:
    - campaign-optimizer-prod
  restorePVs: true

target:
  kind: Deployment
  name: campaign-optimizer
