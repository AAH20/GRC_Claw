apiVersion: builtin
kind: PatchTransformer
metadata:
  name: certmanager-patch
patch: |-
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: campaign-optimizer-cert
spec:
  secretName: campaign-optimizer-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - campaign-optimizer.grc-claw.example.com

target:
  kind: Deployment
  name: campaign-optimizer
