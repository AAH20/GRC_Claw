apiVersion: builtin
kind: PatchTransformer
metadata:
  name: serviceaccount-patch
patch: |-
apiVersion: v1
kind: ServiceAccount
metadata:
  name: campaign-optimizer-sa
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/campaign-optimizer-role

target:
  kind: Deployment
  name: campaign-optimizer
