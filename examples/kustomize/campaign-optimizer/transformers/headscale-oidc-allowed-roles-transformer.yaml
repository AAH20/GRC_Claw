apiVersion: builtin
kind: PatchTransformer
metadata:
  name: headscale-oidc-allowed-roles-patch
patch: |-
apiVersion: apps/v1
kind: Deployment
metadata:
  name: campaign-optimizer
spec:
  template:
    metadata:
      annotations:
        headscale.io/oidc-allowed-roles: "admin"

target:
  kind: Deployment
  name: campaign-optimizer
