apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: onboarding-training-prod

resources:
  - ../../base

patches:
  - path: ../../patches/replicas-patch.yaml
    target:
      kind: Deployment
      name: onboarding-training
  - path: ../../patches/resources-patch.yaml
    target:
      kind: Deployment
      name: onboarding-training
  - path: ../../patches/security-patch.yaml
    target:
      kind: Deployment
      name: onboarding-training

configMapGenerator:
  - name: onboarding-training-config
    behavior: merge
    literals:
      - LOG_LEVEL=warn
      - DEBUG=false

commonLabels:
  environment: production

images:
  - name: grcclaw/onboarding-training
    newTag: stable

replicas:
  - name: onboarding-training
    count: 3
