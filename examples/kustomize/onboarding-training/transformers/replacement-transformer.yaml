apiVersion: builtin
kind: ReplacementTransformer
metadata:
  name: replacement-config
replacements:
  - source:
      kind: ConfigMap
      name: onboarding-training-config
      fieldPath: data.LOG_LEVEL
    targets:
      - select:
          kind: Deployment
          name: onboarding-training
        fieldPaths:
          - spec.template.spec.containers.[name=onboarding-training].env.[name=LOG_LEVEL].value
        options:
          create: true
