apiVersion: builtin
kind: PatchTransformer
metadata:
  name: disaster-recovery-patch
patch: |-
apiVersion: velero.io/v1
kind: Restore
metadata:
  name: onboarding-training-restore
spec:
  backupName: onboarding-training-backup
  includedNamespaces:
    - onboarding-training-prod
  restorePVs: true

target:
  kind: Deployment
  name: onboarding-training
