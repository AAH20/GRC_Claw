apiVersion: builtin
kind: PatchTransformer
metadata:
  name: serviceaccount-patch
patch: |-
apiVersion: v1
kind: ServiceAccount
metadata:
  name: onboarding-training-sa
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/onboarding-training-role

target:
  kind: Deployment
  name: onboarding-training
