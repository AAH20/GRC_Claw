apiVersion: builtin
kind: PatchTransformer
metadata:
  name: certmanager-patch
patch: |-
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: onboarding-training-cert
spec:
  secretName: onboarding-training-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - onboarding-training.grc-claw.example.com

target:
  kind: Deployment
  name: onboarding-training
