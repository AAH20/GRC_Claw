apiVersion: builtin
kind: PatchTransformer
metadata:
  name: falco-patch
patch: |-
apiVersion: falco.org/v1
kind: FalcoRule
metadata:
  name: onboarding-training-rules
spec:
  rules: |
    - rule: onboarding_training_unexpected_process
      desc: Detect unexpected processes in onboarding-training container
      condition: >
        spawned_process and
        container and
        container.image.repository = "grcclaw/onboarding-training" and
        not proc.name in ("onboarding-training", "sh", "bash")
      output: >
        Unexpected process in onboarding-training container
        (user=%proc.pname command=%proc.cmdline)
      priority: WARNING

target:
  kind: Deployment
  name: onboarding-training
