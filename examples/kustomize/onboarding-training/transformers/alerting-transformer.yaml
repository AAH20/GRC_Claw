apiVersion: builtin
kind: PatchTransformer
metadata:
  name: alerting-patch
patch: |-
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: onboarding-training-alerts
  labels:
    release: prometheus
spec:
  groups:
    - name: onboarding-training.rules
      rules:
        - alert: onboarding_training_high_error_rate
          expr: rate(http_requests_total{job="onboarding-training",status=~"5.."}[5m]) > 0.1
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "High error rate in onboarding-training"
            description: "Error rate is above 10% for more than 5 minutes"
        - alert: onboarding_training_high_latency
          expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket{job="onboarding-training"}[5m])) > 1
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "High latency in onboarding-training"
            description: "95th percentile latency is above 1 second"

target:
  kind: Deployment
  name: onboarding-training
