apiVersion: builtin
kind: PatchTransformer
metadata:
  name: serviceaccount-patch
patch: |-
apiVersion: v1
kind: ServiceAccount
metadata:
  name: website-optimization-sa
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/website-optimization-role

target:
  kind: Deployment
  name: website-optimization
