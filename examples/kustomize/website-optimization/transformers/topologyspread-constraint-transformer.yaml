apiVersion: builtin
kind: PatchTransformer
metadata:
  name: topologyspread-patch
patch: |-
apiVersion: apps/v1
kind: Deployment
metadata:
  name: website-optimization
spec:
  template:
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: website-optimization

target:
  kind: Deployment
  name: website-optimization
