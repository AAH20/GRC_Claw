apiVersion: builtin
kind: PatchTransformer
metadata:
  name: headscale-oidc-allowed-node-annotations-patch
patch: |-
apiVersion: apps/v1
kind: Deployment
metadata:
  name: website-optimization
spec:
  template:
    metadata:
      annotations:
        headscale.io/oidc-allowed-node-annotations: "node.alpha.kubernetes.io/ttl=0"

target:
  kind: Deployment
  name: website-optimization
