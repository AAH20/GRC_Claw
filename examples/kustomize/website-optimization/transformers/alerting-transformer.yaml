apiVersion: builtin
kind: PatchTransformer
metadata:
  name: alerting-patch
patch: |-
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: website-optimization-alerts
  labels:
    release: prometheus
spec:
  groups:
    - name: website-optimization.rules
      rules:
        - alert: website_optimization_high_error_rate
          expr: rate(http_requests_total{job="website-optimization",status=~"5.."}[5m]) > 0.1
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "High error rate in website-optimization"
            description: "Error rate is above 10% for more than 5 minutes"
        - alert: website_optimization_high_latency
          expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket{job="website-optimization"}[5m])) > 1
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "High latency in website-optimization"
            description: "95th percentile latency is above 1 second"

target:
  kind: Deployment
  name: website-optimization
