apiVersion: builtin
kind: PatchTransformer
metadata:
  name: certmanager-patch
patch: |-
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: website-optimization-cert
spec:
  secretName: website-optimization-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - website-optimization.grc-claw.example.com

target:
  kind: Deployment
  name: website-optimization
