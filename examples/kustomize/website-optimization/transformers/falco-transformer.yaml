apiVersion: builtin
kind: PatchTransformer
metadata:
  name: falco-patch
patch: |-
apiVersion: falco.org/v1
kind: FalcoRule
metadata:
  name: website-optimization-rules
spec:
  rules: |
    - rule: website_optimization_unexpected_process
      desc: Detect unexpected processes in website-optimization container
      condition: >
        spawned_process and
        container and
        container.image.repository = "grcclaw/website-optimization" and
        not proc.name in ("website-optimization", "sh", "bash")
      output: >
        Unexpected process in website-optimization container
        (user=%proc.pname command=%proc.cmdline)
      priority: WARNING

target:
  kind: Deployment
  name: website-optimization
