apiVersion: builtin
kind: PatchTransformer
metadata:
  name: headscale-oidc-client-id-patch
patch: |-
apiVersion: apps/v1
kind: Deployment
metadata:
  name: website-optimization
spec:
  template:
    metadata:
      annotations:
        headscale.io/oidc-client-id: "headscale"

target:
  kind: Deployment
  name: website-optimization
