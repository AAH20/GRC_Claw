apiVersion: builtin
kind: PatchTransformer
metadata:
  name: priorityclass-patch
patch: |-
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: website-optimization-priority
value: 1000
globalDefault: false
description: "Priority class for website-optimization service"

target:
  kind: Deployment
  name: website-optimization
