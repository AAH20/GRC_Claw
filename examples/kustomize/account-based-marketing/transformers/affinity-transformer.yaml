apiVersion: builtin
kind: PatchTransformer
metadata:
  name: affinity-patch
patch: |-
apiVersion: apps/v1
kind: Deployment
metadata:
  name: account-based-marketing
spec:
  template:
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/name
                      operator: In
                      values:
                        - account-based-marketing
                topologyKey: kubernetes.io/hostname

target:
  kind: Deployment
  name: account-based-marketing
