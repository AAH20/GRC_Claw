apiVersion: builtin
kind: ReplacementTransformer
metadata:
  name: replacement-config
replacements:
  - source:
      kind: ConfigMap
      name: account-based-marketing-config
      fieldPath: data.LOG_LEVEL
    targets:
      - select:
          kind: Deployment
          name: account-based-marketing
        fieldPaths:
          - spec.template.spec.containers.[name=account-based-marketing].env.[name=LOG_LEVEL].value
        options:
          create: true
