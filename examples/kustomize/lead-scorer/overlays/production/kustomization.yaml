apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: lead-scorer-prod

resources:
  - ../../base

patches:
  - path: ../../patches/replicas-patch.yaml
    target:
      kind: Deployment
      name: lead-scorer
  - path: ../../patches/resources-patch.yaml
    target:
      kind: Deployment
      name: lead-scorer
  - path: ../../patches/security-patch.yaml
    target:
      kind: Deployment
      name: lead-scorer

configMapGenerator:
  - name: lead-scorer-config
    behavior: merge
    literals:
      - LOG_LEVEL=warn
      - DEBUG=false

commonLabels:
  environment: production

images:
  - name: grcclaw/lead-scorer
    newTag: stable

replicas:
  - name: lead-scorer
    count: 3
