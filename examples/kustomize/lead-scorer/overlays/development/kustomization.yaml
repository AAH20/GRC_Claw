apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: lead-scorer-dev

resources:
  - ../../base

patches:
  - path: ../../patches/replicas-patch.yaml
    target:
      kind: Deployment
      name: lead-scorer
  - path: ../../patches/resources-patch.yaml
    target:
      kind: Deployment
      name: lead-scorer

configMapGenerator:
  - name: lead-scorer-config
    behavior: merge
    literals:
      - LOG_LEVEL=debug
      - DEBUG=true

commonLabels:
  environment: development

images:
  - name: grcclaw/lead-scorer
    newTag: dev
