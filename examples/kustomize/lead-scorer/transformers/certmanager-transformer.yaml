apiVersion: builtin
kind: PatchTransformer
metadata:
  name: certmanager-patch
patch: |-
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: lead-scorer-cert
spec:
  secretName: lead-scorer-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - lead-scorer.grc-claw.example.com

target:
  kind: Deployment
  name: lead-scorer
