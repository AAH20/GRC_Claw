apiVersion: builtin
kind: PatchTransformer
metadata:
  name: falco-patch
patch: |-
apiVersion: falco.org/v1
kind: FalcoRule
metadata:
  name: lead-scorer-rules
spec:
  rules: |
    - rule: lead_scorer_unexpected_process
      desc: Detect unexpected processes in lead-scorer container
      condition: >
        spawned_process and
        container and
        container.image.repository = "grcclaw/lead-scorer" and
        not proc.name in ("lead-scorer", "sh", "bash")
      output: >
        Unexpected process in lead-scorer container
        (user=%proc.pname command=%proc.cmdline)
      priority: WARNING

target:
  kind: Deployment
  name: lead-scorer
