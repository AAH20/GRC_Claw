apiVersion: builtin
kind: PatchTransformer
metadata:
  name: gitops-patch
patch: |-
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: lead-scorer
  namespace: argocd
spec:
  project: grc-claw
  source:
    repoURL: https://github.com/grc-claw/lead-scorer.git
    targetRevision: HEAD
    path: overlays/production
  destination:
    server: https://kubernetes.default.svc
    namespace: lead-scorer-prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

target:
  kind: Deployment
  name: lead-scorer
