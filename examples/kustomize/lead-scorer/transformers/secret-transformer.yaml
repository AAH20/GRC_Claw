apiVersion: builtin
kind: SecretTransformer
metadata:
  name: secret-config
secretGenerator:
  - name: lead-scorer-secrets
    type: Opaque
    literals:
      - DATABASE_URL=postgresql://prod-db:5432/lead-scorer
      - API_KEY=prod-api-key
      - JWT_SECRET=prod-jwt-secret
fieldSpecs:
  - path: spec/template/spec/containers/envFrom/secretRef/name
    create: true
