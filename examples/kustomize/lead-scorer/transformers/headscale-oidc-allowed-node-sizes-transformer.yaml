apiVersion: builtin
kind: PatchTransformer
metadata:
  name: headscale-oidc-allowed-node-sizes-patch
patch: |-
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lead-scorer
spec:
  template:
    metadata:
      annotations:
        headscale.io/oidc-allowed-node-sizes: "medium"

target:
  kind: Deployment
  name: lead-scorer
