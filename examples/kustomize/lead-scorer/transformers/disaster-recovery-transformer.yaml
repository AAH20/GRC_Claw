apiVersion: builtin
kind: PatchTransformer
metadata:
  name: disaster-recovery-patch
patch: |-
apiVersion: velero.io/v1
kind: Restore
metadata:
  name: lead-scorer-restore
spec:
  backupName: lead-scorer-backup
  includedNamespaces:
    - lead-scorer-prod
  restorePVs: true

target:
  kind: Deployment
  name: lead-scorer
