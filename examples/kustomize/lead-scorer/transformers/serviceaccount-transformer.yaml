apiVersion: builtin
kind: PatchTransformer
metadata:
  name: serviceaccount-patch
patch: |-
apiVersion: v1
kind: ServiceAccount
metadata:
  name: lead-scorer-sa
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/lead-scorer-role

target:
  kind: Deployment
  name: lead-scorer
