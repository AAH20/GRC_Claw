apiVersion: builtin
kind: PatchTransformer
metadata:
  name: headscale-oidc-allowed-environments-patch
patch: |-
apiVersion: apps/v1
kind: Deployment
metadata:
  name: customer-segmentation
spec:
  template:
    metadata:
      annotations:
        headscale.io/oidc-allowed-environments: "production"

target:
  kind: Deployment
  name: customer-segmentation
