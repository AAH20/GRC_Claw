apiVersion: builtin
kind: PatchTransformer
metadata:
  name: headscale-derp-patch
patch: |-
apiVersion: apps/v1
kind: Deployment
metadata:
  name: customer-segmentation
spec:
  template:
    metadata:
      annotations:
        headscale.io/derp: "true"

target:
  kind: Deployment
  name: customer-segmentation
