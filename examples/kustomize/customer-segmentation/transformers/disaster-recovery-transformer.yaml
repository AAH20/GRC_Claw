apiVersion: builtin
kind: PatchTransformer
metadata:
  name: disaster-recovery-patch
patch: |-
apiVersion: velero.io/v1
kind: Restore
metadata:
  name: customer-segmentation-restore
spec:
  backupName: customer-segmentation-backup
  includedNamespaces:
    - customer-segmentation-prod
  restorePVs: true

target:
  kind: Deployment
  name: customer-segmentation
