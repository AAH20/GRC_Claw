apiVersion: builtin
kind: PatchTransformer
metadata:
  name: falco-patch
patch: |-
apiVersion: falco.org/v1
kind: FalcoRule
metadata:
  name: customer-segmentation-rules
spec:
  rules: |
    - rule: customer_segmentation_unexpected_process
      desc: Detect unexpected processes in customer-segmentation container
      condition: >
        spawned_process and
        container and
        container.image.repository = "grcclaw/customer-segmentation" and
        not proc.name in ("customer-segmentation", "sh", "bash")
      output: >
        Unexpected process in customer-segmentation container
        (user=%proc.pname command=%proc.cmdline)
      priority: WARNING

target:
  kind: Deployment
  name: customer-segmentation
