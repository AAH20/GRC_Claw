apiVersion: builtin
kind: PatchTransformer
metadata:
  name: limitrange-patch
patch: |-
apiVersion: v1
kind: LimitRange
metadata:
  name: customer-segmentation-limits
spec:
  limits:
    - default:
        cpu: 500m
        memory: 512Mi
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      max:
        cpu: "2"
        memory: 2Gi
      min:
        cpu: 50m
        memory: 64Mi
      type: Container

target:
  kind: Deployment
  name: customer-segmentation
