apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: customer-segmentation-staging

resources:
  - ../../base

patches:
  - path: ../../patches/replicas-patch.yaml
    target:
      kind: Deployment
      name: customer-segmentation
  - path: ../../patches/resources-patch.yaml
    target:
      kind: Deployment
      name: customer-segmentation

configMapGenerator:
  - name: customer-segmentation-config
    behavior: merge
    literals:
      - LOG_LEVEL=info
      - DEBUG=false

commonLabels:
  environment: staging

images:
  - name: grcclaw/customer-segmentation
    newTag: staging
