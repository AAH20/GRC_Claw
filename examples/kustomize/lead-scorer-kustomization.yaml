# Lead Scorer - Kustomize Example
# Production-grade Kustomize configuration for the Lead Scorer service.

---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: lead-scorer

resources:
  - deployment.yaml
  - service.yaml
  - configmap.yaml
  - hpa.yaml

commonLabels:
  app.kubernetes.io/name: lead-scorer
  app.kubernetes.io/part-of: grc-claw
  app.kubernetes.io/managed-by: kustomize

images:
  - name: lead-scorer
    newTag: v2.0.1

configMapGenerator:
  - name: lead-scorer-config
    literals:
      - LOG_LEVEL=info
      - SCORING_MODEL_VERSION=v3
      - BATCH_SIZE=1000
      - REDIS_TTL=3600
      - FEATURE_STORE_URL=http://feature-store:8080

secretGenerator:
  - name: lead-scorer-secrets
    literals:
      - DB_PASSWORD=changeme
      - MLFLOW_TRACKING_TOKEN=changeme

patches:
  - path: patches/deployment-resources.yaml
    target:
      kind: Deployment
      name: lead-scorer

  - path: patches/service-annotations.yaml
    target:
      kind: Service
      name: lead-scorer

