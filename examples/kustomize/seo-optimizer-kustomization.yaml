# SEO Optimizer - Kustomize Example
# Production-grade Kustomize configuration for the SEO Optimizer service.

---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: seo-optimizer

resources:
  - deployment.yaml
  - service.yaml
  - configmap.yaml
  - hpa.yaml

commonLabels:
  app.kubernetes.io/name: seo-optimizer
  app.kubernetes.io/part-of: grc-claw
  app.kubernetes.io/managed-by: kustomize

images:
  - name: seo-optimizer
    newTag: v1.4.0

configMapGenerator:
  - name: seo-optimizer-config
    literals:
      - LOG_LEVEL=info
      - CRAWL_INTERVAL=86400
      - SERP_API_PROVIDER=serpapi
      - KEYWORD_TRACKING_INTERVAL=3600
      - CONTENT_AUDIT_DEPTH=full
      - MAX_PAGES_PER_CRAWL=10000

secretGenerator:
  - name: seo-optimizer-secrets
    literals:
      - SERPAPI_KEY=changeme
      - GOOGLE_SEARCH_CONSOLE_KEY=changeme
      - DB_PASSWORD=changeme

patches:
  - path: patches/deployment-resources.yaml
    target:
      kind: Deployment
      name: seo-optimizer

  - path: patches/service-annotations.yaml
    target:
      kind: Service
      name: seo-optimizer

