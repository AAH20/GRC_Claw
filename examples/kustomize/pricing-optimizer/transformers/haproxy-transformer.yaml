apiVersion: builtin
kind: PatchTransformer
metadata:
  name: haproxy-patch
patch: |-
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pricing-optimizer
spec:
  template:
    metadata:
      annotations:
        haproxy.org/ingress.class: haproxy

target:
  kind: Deployment
  name: pricing-optimizer
