apiVersion: builtin
kind: PatchTransformer
metadata:
  name: vault-patch
patch: |-
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultDynamicSecret
metadata:
  name: pricing-optimizer-vault-secrets
spec:
  vaultAuthRef: pricing-optimizer-vault-auth
  mount: secret
  path: pricing-optimizer
  destination:
    create: true
    name: pricing-optimizer-vault-secrets
  rolloutRestartTargets:
    - kind: Deployment
      name: pricing-optimizer

target:
  kind: Deployment
  name: pricing-optimizer
