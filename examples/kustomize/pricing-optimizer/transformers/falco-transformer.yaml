apiVersion: builtin
kind: PatchTransformer
metadata:
  name: falco-patch
patch: |-
apiVersion: falco.org/v1
kind: FalcoRule
metadata:
  name: pricing-optimizer-rules
spec:
  rules: |
    - rule: pricing_optimizer_unexpected_process
      desc: Detect unexpected processes in pricing-optimizer container
      condition: >
        spawned_process and
        container and
        container.image.repository = "grcclaw/pricing-optimizer" and
        not proc.name in ("pricing-optimizer", "sh", "bash")
      output: >
        Unexpected process in pricing-optimizer container
        (user=%proc.pname command=%proc.cmdline)
      priority: WARNING

target:
  kind: Deployment
  name: pricing-optimizer
