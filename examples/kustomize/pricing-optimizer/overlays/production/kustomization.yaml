apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: pricing-optimizer-prod

resources:
  - ../../base

patches:
  - path: ../../patches/replicas-patch.yaml
    target:
      kind: Deployment
      name: pricing-optimizer
  - path: ../../patches/resources-patch.yaml
    target:
      kind: Deployment
      name: pricing-optimizer
  - path: ../../patches/security-patch.yaml
    target:
      kind: Deployment
      name: pricing-optimizer

configMapGenerator:
  - name: pricing-optimizer-config
    behavior: merge
    literals:
      - LOG_LEVEL=warn
      - DEBUG=false

commonLabels:
  environment: production

images:
  - name: grcclaw/pricing-optimizer
    newTag: stable

replicas:
  - name: pricing-optimizer
    count: 3
