apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: pricing-optimizer-staging

resources:
  - ../../base

patches:
  - path: ../../patches/replicas-patch.yaml
    target:
      kind: Deployment
      name: pricing-optimizer
  - path: ../../patches/resources-patch.yaml
    target:
      kind: Deployment
      name: pricing-optimizer

configMapGenerator:
  - name: pricing-optimizer-config
    behavior: merge
    literals:
      - LOG_LEVEL=info
      - DEBUG=false

commonLabels:
  environment: staging

images:
  - name: grcclaw/pricing-optimizer
    newTag: staging
