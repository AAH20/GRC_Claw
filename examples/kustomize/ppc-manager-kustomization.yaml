# PPC Manager - Kustomize Example
# Production-grade Kustomize configuration for the PPC Manager service.

---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ppc-manager

resources:
  - deployment.yaml
  - service.yaml
  - configmap.yaml
  - hpa.yaml

commonLabels:
  app.kubernetes.io/name: ppc-manager
  app.kubernetes.io/part-of: grc-claw
  app.kubernetes.io/managed-by: kustomize

images:
  - name: ppc-manager
    newTag: v2.1.0

configMapGenerator:
  - name: ppc-manager-config
    literals:
      - LOG_LEVEL=info
      - AD_PLATFORMS=google-ads,facebook-ads,linkedin-ads
      - BUDGET_SYNC_INTERVAL=600
      - KEYWORD_REDISCOVERY_INTERVAL=3600
      - CONVERSION_WINDOW_DAYS=30

secretGenerator:
  - name: ppc-manager-secrets
    literals:
      - GOOGLE_ADS_DEVELOPER_TOKEN=changeme
      - GOOGLE_ADS_CLIENT_ID=changeme
      - GOOGLE_ADS_CLIENT_SECRET=changeme
      - FACEBOOK_ACCESS_TOKEN=changeme
      - DB_PASSWORD=changeme

patches:
  - path: patches/deployment-resources.yaml
    target:
      kind: Deployment
      name: ppc-manager

  - path: patches/service-annotations.yaml
    target:
      kind: Service
      name: ppc-manager

# ─────────────────────────────────────────────────────────────────────────────
# OVERLAYS
# ─────────────────────────────────────────────────────────────────────────────
