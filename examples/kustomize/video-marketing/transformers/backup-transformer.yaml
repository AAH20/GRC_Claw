apiVersion: builtin
kind: PatchTransformer
metadata:
  name: backup-patch
patch: |-
apiVersion: velero.io/v1
kind: Schedule
metadata:
  name: video-marketing-backup
spec:
  schedule: "0 2 * * *"
  template:
    includedNamespaces:
      - video-marketing-prod
    includedResources:
      - deployments
      - services
      - configmaps
      - secrets
    storageLocation: default
    ttl: 720h

target:
  kind: Deployment
  name: video-marketing
