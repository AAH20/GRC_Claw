apiVersion: builtin
kind: PatchTransformer
metadata:
  name: falco-patch
patch: |-
apiVersion: falco.org/v1
kind: FalcoRule
metadata:
  name: video-marketing-rules
spec:
  rules: |
    - rule: video_marketing_unexpected_process
      desc: Detect unexpected processes in video-marketing container
      condition: >
        spawned_process and
        container and
        container.image.repository = "grcclaw/video-marketing" and
        not proc.name in ("video-marketing", "sh", "bash")
      output: >
        Unexpected process in video-marketing container
        (user=%proc.pname command=%proc.cmdline)
      priority: WARNING

target:
  kind: Deployment
  name: video-marketing
