apiVersion: builtin
kind: PatchTransformer
metadata:
  name: certmanager-patch
patch: |-
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: crm-enhancer-cert
spec:
  secretName: crm-enhancer-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - crm-enhancer.grc-claw.example.com

target:
  kind: Deployment
  name: crm-enhancer
