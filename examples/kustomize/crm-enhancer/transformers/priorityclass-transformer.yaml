apiVersion: builtin
kind: PatchTransformer
metadata:
  name: priorityclass-patch
patch: |-
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: crm-enhancer-priority
value: 1000
globalDefault: false
description: "Priority class for crm-enhancer service"

target:
  kind: Deployment
  name: crm-enhancer
