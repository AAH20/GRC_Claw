apiVersion: builtin
kind: PatchTransformer
metadata:
  name: disaster-recovery-patch
patch: |-
apiVersion: velero.io/v1
kind: Restore
metadata:
  name: crm-enhancer-restore
spec:
  backupName: crm-enhancer-backup
  includedNamespaces:
    - crm-enhancer-prod
  restorePVs: true

target:
  kind: Deployment
  name: crm-enhancer
