apiVersion: builtin
kind: PatchTransformer
metadata:
  name: falco-patch
patch: |-
apiVersion: falco.org/v1
kind: FalcoRule
metadata:
  name: crm-enhancer-rules
spec:
  rules: |
    - rule: crm_enhancer_unexpected_process
      desc: Detect unexpected processes in crm-enhancer container
      condition: >
        spawned_process and
        container and
        container.image.repository = "grcclaw/crm-enhancer" and
        not proc.name in ("crm-enhancer", "sh", "bash")
      output: >
        Unexpected process in crm-enhancer container
        (user=%proc.pname command=%proc.cmdline)
      priority: WARNING

target:
  kind: Deployment
  name: crm-enhancer
