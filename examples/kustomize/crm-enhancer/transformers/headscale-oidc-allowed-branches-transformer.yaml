apiVersion: builtin
kind: PatchTransformer
metadata:
  name: headscale-oidc-allowed-branches-patch
patch: |-
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crm-enhancer
spec:
  template:
    metadata:
      annotations:
        headscale.io/oidc-allowed-branches: "main"

target:
  kind: Deployment
  name: crm-enhancer
