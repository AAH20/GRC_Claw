apiVersion: builtin
kind: PatchTransformer
metadata:
  name: serviceaccount-patch
patch: |-
apiVersion: v1
kind: ServiceAccount
metadata:
  name: crm-enhancer-sa
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/crm-enhancer-role

target:
  kind: Deployment
  name: crm-enhancer
