apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: crm-enhancer-dev

resources:
  - ../../base

patches:
  - path: ../../patches/replicas-patch.yaml
    target:
      kind: Deployment
      name: crm-enhancer
  - path: ../../patches/resources-patch.yaml
    target:
      kind: Deployment
      name: crm-enhancer

configMapGenerator:
  - name: crm-enhancer-config
    behavior: merge
    literals:
      - LOG_LEVEL=debug
      - DEBUG=true

commonLabels:
  environment: development

images:
  - name: grcclaw/crm-enhancer
    newTag: dev
