apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: crm-enhancer-prod

resources:
  - ../../base

patches:
  - path: ../../patches/replicas-patch.yaml
    target:
      kind: Deployment
      name: crm-enhancer
  - path: ../../patches/resources-patch.yaml
    target:
      kind: Deployment
      name: crm-enhancer
  - path: ../../patches/security-patch.yaml
    target:
      kind: Deployment
      name: crm-enhancer

configMapGenerator:
  - name: crm-enhancer-config
    behavior: merge
    literals:
      - LOG_LEVEL=warn
      - DEBUG=false

commonLabels:
  environment: production

images:
  - name: grcclaw/crm-enhancer
    newTag: stable

replicas:
  - name: crm-enhancer
    count: 3
