# Content Generator - Kustomize Example
# Production-grade Kustomize configuration for the Content Generator service.

---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: content-generator

resources:
  - deployment.yaml
  - service.yaml
  - configmap.yaml
  - hpa.yaml

commonLabels:
  app.kubernetes.io/name: content-generator
  app.kubernetes.io/part-of: grc-claw
  app.kubernetes.io/managed-by: kustomize

images:
  - name: content-generator
    newTag: v3.1.0

configMapGenerator:
  - name: content-generator-config
    literals:
      - LOG_LEVEL=info
      - LLM_PROVIDER=openai
      - LLM_MODEL=gpt-4
      - MAX_TOKENS=4096
      - CONTENT_CACHE_TTL=600
      - TEMPLATE_PATH=/templates

secretGenerator:
  - name: content-generator-secrets
    literals:
      - OPENAI_API_KEY=changeme
      - DB_PASSWORD=changeme

patches:
  - path: patches/deployment-resources.yaml
    target:
      kind: Deployment
      name: content-generator

  - path: patches/service-annotations.yaml
    target:
      kind: Service
      name: content-generator

# ─────────────────────────────────────────────────────────────────────────────
# OVERLAYS
