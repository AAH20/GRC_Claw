apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: marketing-compliance-prod

resources:
  - ../../base

patches:
  - path: ../../patches/replicas-patch.yaml
    target:
      kind: Deployment
      name: marketing-compliance
  - path: ../../patches/resources-patch.yaml
    target:
      kind: Deployment
      name: marketing-compliance
  - path: ../../patches/security-patch.yaml
    target:
      kind: Deployment
      name: marketing-compliance

configMapGenerator:
  - name: marketing-compliance-config
    behavior: merge
    literals:
      - LOG_LEVEL=warn
      - DEBUG=false

commonLabels:
  environment: production

images:
  - name: grcclaw/marketing-compliance
    newTag: stable

replicas:
  - name: marketing-compliance
    count: 3
