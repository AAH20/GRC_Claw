apiVersion: builtin
kind: PatchTransformer
metadata:
  name: serviceaccount-patch
patch: |-
apiVersion: v1
kind: ServiceAccount
metadata:
  name: marketing-compliance-sa
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/marketing-compliance-role

target:
  kind: Deployment
  name: marketing-compliance
