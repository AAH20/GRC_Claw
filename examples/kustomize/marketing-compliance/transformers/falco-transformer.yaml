apiVersion: builtin
kind: PatchTransformer
metadata:
  name: falco-patch
patch: |-
apiVersion: falco.org/v1
kind: FalcoRule
metadata:
  name: marketing-compliance-rules
spec:
  rules: |
    - rule: marketing_compliance_unexpected_process
      desc: Detect unexpected processes in marketing-compliance container
      condition: >
        spawned_process and
        container and
        container.image.repository = "grcclaw/marketing-compliance" and
        not proc.name in ("marketing-compliance", "sh", "bash")
      output: >
        Unexpected process in marketing-compliance container
        (user=%proc.pname command=%proc.cmdline)
      priority: WARNING

target:
  kind: Deployment
  name: marketing-compliance
