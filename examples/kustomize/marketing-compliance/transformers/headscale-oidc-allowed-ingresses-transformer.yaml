apiVersion: builtin
kind: PatchTransformer
metadata:
  name: headscale-oidc-allowed-ingresses-patch
patch: |-
apiVersion: apps/v1
kind: Deployment
metadata:
  name: marketing-compliance
spec:
  template:
    metadata:
      annotations:
        headscale.io/oidc-allowed-ingresses: "marketing-compliance-*"

target:
  kind: Deployment
  name: marketing-compliance
