apiVersion: builtin
kind: ReplacementTransformer
metadata:
  name: replacement-config
replacements:
  - source:
      kind: ConfigMap
      name: marketing-compliance-config
      fieldPath: data.LOG_LEVEL
    targets:
      - select:
          kind: Deployment
          name: marketing-compliance
        fieldPaths:
          - spec.template.spec.containers.[name=marketing-compliance].env.[name=LOG_LEVEL].value
        options:
          create: true
