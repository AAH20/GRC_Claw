apiVersion: builtin
kind: PatchTransformer
metadata:
  name: certmanager-patch
patch: |-
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: marketing-compliance-cert
spec:
  secretName: marketing-compliance-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - marketing-compliance.grc-claw.example.com

target:
  kind: Deployment
  name: marketing-compliance
