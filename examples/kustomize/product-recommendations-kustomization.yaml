# Product Recommendations - Kustomize Example
# Production-grade Kustomize configuration for the Product Recommendations service.

---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: product-recommendations

resources:
  - deployment.yaml
  - service.yaml
  - configmap.yaml
  - hpa.yaml

commonLabels:
  app.kubernetes.io/name: product-recommendations
  app.kubernetes.io/part-of: grc-claw
  app.kubernetes.io/managed-by: kustomize

images:
  - name: product-recommendations
    newTag: v2.4.0

configMapGenerator:
  - name: product-recommendations-config
    literals:
      - LOG_LEVEL=info
      - RECOMMENDATION_ALGORITHM=collaborative-filtering
      - MODEL_RETRAIN_INTERVAL=86400
      - CANDIDATE_POOL_SIZE=10000
      - DIVERSITY_FACTOR=0.3
      - COLD_START_STRATEGy=popularity
      - CACHE_TTL=300

secretGenerator:
  - name: product-recommendations-secrets
    literals:
      - DB_PASSWORD=changeme
      - REDIS_PASSWORD=changeme
      - MLFLOW_TRACKING_TOKEN=changeme

patches:
  - path: patches/deployment-resources.yaml
    target:
      kind: Deployment
      name: product-recommendations

  - path: patches/service-annotations.yaml
    target:
      kind: Service
      name: product-recommendations

