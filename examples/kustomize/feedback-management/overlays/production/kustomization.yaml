apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: feedback-management-prod

resources:
  - ../../base

patches:
  - path: ../../patches/replicas-patch.yaml
    target:
      kind: Deployment
      name: feedback-management
  - path: ../../patches/resources-patch.yaml
    target:
      kind: Deployment
      name: feedback-management
  - path: ../../patches/security-patch.yaml
    target:
      kind: Deployment
      name: feedback-management

configMapGenerator:
  - name: feedback-management-config
    behavior: merge
    literals:
      - LOG_LEVEL=warn
      - DEBUG=false

commonLabels:
  environment: production

images:
  - name: grcclaw/feedback-management
    newTag: stable

replicas:
  - name: feedback-management
    count: 3
