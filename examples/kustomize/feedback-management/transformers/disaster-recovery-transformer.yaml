apiVersion: builtin
kind: PatchTransformer
metadata:
  name: disaster-recovery-patch
patch: |-
apiVersion: velero.io/v1
kind: Restore
metadata:
  name: feedback-management-restore
spec:
  backupName: feedback-management-backup
  includedNamespaces:
    - feedback-management-prod
  restorePVs: true

target:
  kind: Deployment
  name: feedback-management
