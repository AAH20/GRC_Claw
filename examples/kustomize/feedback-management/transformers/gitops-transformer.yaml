apiVersion: builtin
kind: PatchTransformer
metadata:
  name: gitops-patch
patch: |-
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: feedback-management
  namespace: argocd
spec:
  project: grc-claw
  source:
    repoURL: https://github.com/grc-claw/feedback-management.git
    targetRevision: HEAD
    path: overlays/production
  destination:
    server: https://kubernetes.default.svc
    namespace: feedback-management-prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

target:
  kind: Deployment
  name: feedback-management
