apiVersion: builtin
kind: PatchTransformer
metadata:
  name: priorityclass-patch
patch: |-
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: feedback-management-priority
value: 1000
globalDefault: false
description: "Priority class for feedback-management service"

target:
  kind: Deployment
  name: feedback-management
