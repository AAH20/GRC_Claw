apiVersion: builtin
kind: ReplacementTransformer
metadata:
  name: replacement-config
replacements:
  - source:
      kind: ConfigMap
      name: feedback-management-config
      fieldPath: data.LOG_LEVEL
    targets:
      - select:
          kind: Deployment
          name: feedback-management
        fieldPaths:
          - spec.template.spec.containers.[name=feedback-management].env.[name=LOG_LEVEL].value
        options:
          create: true
