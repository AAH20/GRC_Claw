apiVersion: builtin
kind: PatchTransformer
metadata:
  name: alerting-patch
patch: |-
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: feedback-management-alerts
  labels:
    release: prometheus
spec:
  groups:
    - name: feedback-management.rules
      rules:
        - alert: feedback_management_high_error_rate
          expr: rate(http_requests_total{job="feedback-management",status=~"5.."}[5m]) > 0.1
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "High error rate in feedback-management"
            description: "Error rate is above 10% for more than 5 minutes"
        - alert: feedback_management_high_latency
          expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket{job="feedback-management"}[5m])) > 1
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "High latency in feedback-management"
            description: "95th percentile latency is above 1 second"

target:
  kind: Deployment
  name: feedback-management
