apiVersion: builtin
kind: PatchTransformer
metadata:
  name: serviceaccount-patch
patch: |-
apiVersion: v1
kind: ServiceAccount
metadata:
  name: feedback-management-sa
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/feedback-management-role

target:
  kind: Deployment
  name: feedback-management
