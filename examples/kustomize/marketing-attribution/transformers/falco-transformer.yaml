apiVersion: builtin
kind: PatchTransformer
metadata:
  name: falco-patch
patch: |-
apiVersion: falco.org/v1
kind: FalcoRule
metadata:
  name: marketing-attribution-rules
spec:
  rules: |
    - rule: marketing_attribution_unexpected_process
      desc: Detect unexpected processes in marketing-attribution container
      condition: >
        spawned_process and
        container and
        container.image.repository = "grcclaw/marketing-attribution" and
        not proc.name in ("marketing-attribution", "sh", "bash")
      output: >
        Unexpected process in marketing-attribution container
        (user=%proc.pname command=%proc.cmdline)
      priority: WARNING

target:
  kind: Deployment
  name: marketing-attribution
