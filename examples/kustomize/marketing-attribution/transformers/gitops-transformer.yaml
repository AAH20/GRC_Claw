apiVersion: builtin
kind: PatchTransformer
metadata:
  name: gitops-patch
patch: |-
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: marketing-attribution
  namespace: argocd
spec:
  project: grc-claw
  source:
    repoURL: https://github.com/grc-claw/marketing-attribution.git
    targetRevision: HEAD
    path: overlays/production
  destination:
    server: https://kubernetes.default.svc
    namespace: marketing-attribution-prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

target:
  kind: Deployment
  name: marketing-attribution
