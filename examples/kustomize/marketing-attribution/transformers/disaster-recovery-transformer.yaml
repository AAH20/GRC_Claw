apiVersion: builtin
kind: PatchTransformer
metadata:
  name: disaster-recovery-patch
patch: |-
apiVersion: velero.io/v1
kind: Restore
metadata:
  name: marketing-attribution-restore
spec:
  backupName: marketing-attribution-backup
  includedNamespaces:
    - marketing-attribution-prod
  restorePVs: true

target:
  kind: Deployment
  name: marketing-attribution
