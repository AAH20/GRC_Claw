apiVersion: builtin
kind: ReplacementTransformer
metadata:
  name: replacement-config
replacements:
  - source:
      kind: ConfigMap
      name: marketing-attribution-config
      fieldPath: data.LOG_LEVEL
    targets:
      - select:
          kind: Deployment
          name: marketing-attribution
        fieldPaths:
          - spec.template.spec.containers.[name=marketing-attribution].env.[name=LOG_LEVEL].value
        options:
          create: true
