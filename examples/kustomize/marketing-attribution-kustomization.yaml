apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Marketing Attribution Service - Production Kustomize Example
# Demonstrates base, overlays, patches, and transformers

resources:
  - base/deployment.yaml
  - base/service.yaml
  - base/configmap.yaml
  - base/hpa.yaml

patches:
  - path: patches/replicas-patch.yaml
    target:
      kind: Deployment
      name: marketing-attribution
  - path: patches/resource-limits-patch.yaml
    target:
      kind: Deployment
      name: marketing-attribution

patchesStrategicMerge:
  - patches/env-vars-patch.yaml

transformers:
  - transformers/labels-transformer.yaml
  - transformers/annotations-transformer.yaml

configMapGenerator:
  - name: marketing-attribution-config
    literals:
      - LOG_LEVEL=info
      - ATTRIBUTION_MODEL=multi-touch
      - LOOKBACK_WINDOW_DAYS=30
      - CONVERSION_TRACKING_ENABLED=true

commonLabels:
  app.kubernetes.io/part-of: marketing-attribution
  app.kubernetes.io/managed-by: kustomize

commonAnnotations:
  contact: attribution-team@example.com

namespace: marketing

images:
  - name: marketing-attribution
    newName: registry.example.com/marketing/marketing-attribution
    newTag: v2.1.0

replicas:
  - name: marketing-attribution
    count: 3
