apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: social-media-manager-prod

resources:
  - ../../base

patches:
  - path: ../../patches/replicas-patch.yaml
    target:
      kind: Deployment
      name: social-media-manager
  - path: ../../patches/resources-patch.yaml
    target:
      kind: Deployment
      name: social-media-manager
  - path: ../../patches/security-patch.yaml
    target:
      kind: Deployment
      name: social-media-manager

configMapGenerator:
  - name: social-media-manager-config
    behavior: merge
    literals:
      - LOG_LEVEL=warn
      - DEBUG=false

commonLabels:
  environment: production

images:
  - name: grcclaw/social-media-manager
    newTag: stable

replicas:
  - name: social-media-manager
    count: 3
