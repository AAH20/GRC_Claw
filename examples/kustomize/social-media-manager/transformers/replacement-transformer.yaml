apiVersion: builtin
kind: ReplacementTransformer
metadata:
  name: replacement-config
replacements:
  - source:
      kind: ConfigMap
      name: social-media-manager-config
      fieldPath: data.LOG_LEVEL
    targets:
      - select:
          kind: Deployment
          name: social-media-manager
        fieldPaths:
          - spec.template.spec.containers.[name=social-media-manager].env.[name=LOG_LEVEL].value
        options:
          create: true
