apiVersion: builtin
kind: PatchTransformer
metadata:
  name: serviceaccount-patch
patch: |-
apiVersion: v1
kind: ServiceAccount
metadata:
  name: social-media-manager-sa
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/social-media-manager-role

target:
  kind: Deployment
  name: social-media-manager
