apiVersion: builtin
kind: PatchTransformer
metadata:
  name: disaster-recovery-patch
patch: |-
apiVersion: velero.io/v1
kind: Restore
metadata:
  name: social-media-manager-restore
spec:
  backupName: social-media-manager-backup
  includedNamespaces:
    - social-media-manager-prod
  restorePVs: true

target:
  kind: Deployment
  name: social-media-manager
