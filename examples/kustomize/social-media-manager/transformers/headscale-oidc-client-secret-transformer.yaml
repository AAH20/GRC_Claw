apiVersion: builtin
kind: PatchTransformer
metadata:
  name: headscale-oidc-client-secret-patch
patch: |-
apiVersion: apps/v1
kind: Deployment
metadata:
  name: social-media-manager
spec:
  template:
    metadata:
      annotations:
        headscale.io/oidc-client-secret: "secret"

target:
  kind: Deployment
  name: social-media-manager
