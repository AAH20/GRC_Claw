apiVersion: builtin
kind: PatchTransformer
metadata:
  name: opa-patch
patch: |-
apiVersion: constraints.gatekeeper.sh/v1beta1
kind: K8sRequiredLabels
metadata:
  name: social-media-manager-required-labels
spec:
  match:
    kinds:
      - apiGroups: [""]
        kinds: ["Deployment"]
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: social-media-manager
  parameters:
    labels:
      - key: "app.kubernetes.io/part-of"
        allowedValues: ["grc-claw"]
      - key: "environment"
        allowedValues: ["development", "staging", "production"]

target:
  kind: Deployment
  name: social-media-manager
