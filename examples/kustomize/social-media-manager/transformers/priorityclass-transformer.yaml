apiVersion: builtin
kind: PatchTransformer
metadata:
  name: priorityclass-patch
patch: |-
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: social-media-manager-priority
value: 1000
globalDefault: false
description: "Priority class for social-media-manager service"

target:
  kind: Deployment
  name: social-media-manager
