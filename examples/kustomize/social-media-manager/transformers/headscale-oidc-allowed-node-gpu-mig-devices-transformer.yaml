apiVersion: builtin
kind: PatchTransformer
metadata:
  name: headscale-oidc-allowed-node-gpu-mig-devices-patch
patch: |-
apiVersion: apps/v1
kind: Deployment
metadata:
  name: social-media-manager
spec:
  template:
    metadata:
      annotations:
        headscale.io/oidc-allowed-node-gpu-mig-devices: "nvidia.com/gpu=0"

target:
  kind: Deployment
  name: social-media-manager
