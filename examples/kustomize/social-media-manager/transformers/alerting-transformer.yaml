apiVersion: builtin
kind: PatchTransformer
metadata:
  name: alerting-patch
patch: |-
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: social-media-manager-alerts
  labels:
    release: prometheus
spec:
  groups:
    - name: social-media-manager.rules
      rules:
        - alert: social_media_manager_high_error_rate
          expr: rate(http_requests_total{job="social-media-manager",status=~"5.."}[5m]) > 0.1
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "High error rate in social-media-manager"
            description: "Error rate is above 10% for more than 5 minutes"
        - alert: social_media_manager_high_latency
          expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket{job="social-media-manager"}[5m])) > 1
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "High latency in social-media-manager"
            description: "95th percentile latency is above 1 second"

target:
  kind: Deployment
  name: social-media-manager
