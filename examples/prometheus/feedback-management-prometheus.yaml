# Prometheus Monitoring Configuration for Feedback Management
# Description: Customer feedback collection and analysis
# Generated for production monitoring with ServiceMonitor, PrometheusRule, and Alertmanager configuration

---
# ServiceMonitor: Scrapes metrics from the feedback-management service
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: feedback-management-monitor
  namespace: monitoring
  labels:
    app: feedback-management
    release: prometheus
spec:
  selector:
    matchLabels:
      app: feedback-management
  endpoints:
  - port: metrics
    path: /metrics
    interval: 30s
    scrapeTimeout: 10s
    honorLabels: true
    metricRelabelings:
    - sourceLabels:
      - __name__
      regex: feedback_management_.*
      action: keep
  namespaceSelector:
    matchNames:
    - default


---
# PrometheusRule: Alerting and recording rules for feedback-management
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: feedback-management-rules
  namespace: monitoring
  labels:
    app: feedback-management
    release: prometheus
spec:
  groups:
  - name: feedback-management-recording-rules
    interval: 30s
    rules:
    - record: feedback_management:api_request_rate:rate5m
      expr: rate(feedback_management_api_requests_total[5m])
    - record: feedback_management:api_error_rate:rate5m
      expr: rate(feedback_management_api_errors_total[5m])
    - record: feedback_management:api_latency_p95:rate5m
      expr: histogram_quantile(0.95, rate(feedback_management_api_latency_seconds_bucket[5m]))
  - name: feedback-management-alerts-1
    rules:
    - alert: FeedbackManagementHighErrorRate
      expr: rate(feedback_management_api_errors_total[5m]) / rate(feedback_management_api_requests_total[5m])
        > 0.05
      for: 5m
      labels:
        severity: critical
        service: feedback-management
      annotations:
        summary: '{{ $labels.service }}: FeedbackManagementHighErrorRate is firing'
        description: '{{ $labels.service }} has triggered FeedbackManagementHighErrorRate
          for more than 5 minutes.'
    - alert: FeedbackManagementLowNPS
      expr: feedback_management_nps_score < 30
      for: 5m
      labels:
        severity: warning
        service: feedback-management
      annotations:
        summary: '{{ $labels.service }}: FeedbackManagementLowNPS is firing'
        description: '{{ $labels.service }} has triggered FeedbackManagementLowNPS
          for more than 5 minutes.'
    - alert: FeedbackManagementLowResponseRate
      expr: feedback_management_response_rate < 0.1
      for: 5m
      labels:
        severity: warning
        service: feedback-management
      annotations:
        summary: '{{ $labels.service }}: FeedbackManagementLowResponseRate is firing'
        description: '{{ $labels.service }} has triggered FeedbackManagementLowResponseRate
          for more than 5 minutes.'
    - alert: FeedbackManagementHighLatency
      expr: histogram_quantile(0.95, rate(feedback_management_api_latency_seconds_bucket[5m]))
        > 3.0
      for: 5m
      labels:
        severity: warning
        service: feedback-management
      annotations:
        summary: '{{ $labels.service }}: FeedbackManagementHighLatency is firing'
        description: '{{ $labels.service }} has triggered FeedbackManagementHighLatency
          for more than 5 minutes.'


---
# Alertmanager Configuration: Routing and notification for feedback-management alerts
route:
  receiver: default
  group_by:
  - alertname
  - service
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
  - match:
      service: feedback-management
    receiver: feedback-management-alerts
    group_by:
    - alertname
    - severity
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
receivers:
- name: default
  slack_configs:
  - api_url: https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK
    channel: '#alerts'
    send_resolved: true
- name: feedback-management-alerts
  slack_configs:
  - api_url: https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK
    channel: '#feedback-management-alerts'
    send_resolved: true
  pagerduty_configs:
  - service_key: YOUR_PAGERDUTY_KEY
    severity: '{{ .GroupLabels.severity }}'
inhibit_rules:
- source_match:
    severity: critical
  target_match:
    severity: warning
  equal:
  - alertname
  - service

