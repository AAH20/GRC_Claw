# Prometheus Monitoring Configuration for Finance Marketing
# Description: Financial services marketing
# Generated for production monitoring with ServiceMonitor, PrometheusRule, and Alertmanager configuration

---
# ServiceMonitor: Scrapes metrics from the finance-marketing service
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: finance-marketing-monitor
  namespace: monitoring
  labels:
    app: finance-marketing
    release: prometheus
spec:
  selector:
    matchLabels:
      app: finance-marketing
  endpoints:
  - port: metrics
    path: /metrics
    interval: 30s
    scrapeTimeout: 10s
    honorLabels: true
    metricRelabelings:
    - sourceLabels:
      - __name__
      regex: finance_marketing_.*
      action: keep
  namespaceSelector:
    matchNames:
    - default


---
# PrometheusRule: Alerting and recording rules for finance-marketing
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: finance-marketing-rules
  namespace: monitoring
  labels:
    app: finance-marketing
    release: prometheus
spec:
  groups:
  - name: finance-marketing-recording-rules
    interval: 30s
    rules:
    - record: finance_marketing:api_request_rate:rate5m
      expr: rate(finance_marketing_api_requests_total[5m])
    - record: finance_marketing:api_error_rate:rate5m
      expr: rate(finance_marketing_api_errors_total[5m])
    - record: finance_marketing:api_latency_p95:rate5m
      expr: histogram_quantile(0.95, rate(finance_marketing_api_latency_seconds_bucket[5m]))
  - name: finance-marketing-alerts-1
    rules:
    - alert: FinanceMarketingHighErrorRate
      expr: rate(finance_marketing_api_errors_total[5m]) / rate(finance_marketing_api_requests_total[5m])
        > 0.05
      for: 5m
      labels:
        severity: critical
        service: finance-marketing
      annotations:
        summary: '{{ $labels.service }}: FinanceMarketingHighErrorRate is firing'
        description: '{{ $labels.service }} has triggered FinanceMarketingHighErrorRate
          for more than 5 minutes.'
    - alert: FinanceMarketingLowCompliance
      expr: finance_marketing_compliance_score < 0.95
      for: 5m
      labels:
        severity: critical
        service: finance-marketing
      annotations:
        summary: '{{ $labels.service }}: FinanceMarketingLowCompliance is firing'
        description: '{{ $labels.service }} has triggered FinanceMarketingLowCompliance
          for more than 5 minutes.'
    - alert: FinanceMarketingRegulatoryViolation
      expr: finance_marketing_regulatory_compliance < 1.0
      for: 5m
      labels:
        severity: critical
        service: finance-marketing
      annotations:
        summary: '{{ $labels.service }}: FinanceMarketingRegulatoryViolation is firing'
        description: '{{ $labels.service }} has triggered FinanceMarketingRegulatoryViolation
          for more than 5 minutes.'
    - alert: FinanceMarketingHighLatency
      expr: histogram_quantile(0.95, rate(finance_marketing_api_latency_seconds_bucket[5m]))
        > 3.0
      for: 5m
      labels:
        severity: warning
        service: finance-marketing
      annotations:
        summary: '{{ $labels.service }}: FinanceMarketingHighLatency is firing'
        description: '{{ $labels.service }} has triggered FinanceMarketingHighLatency
          for more than 5 minutes.'


---
# Alertmanager Configuration: Routing and notification for finance-marketing alerts
route:
  receiver: default
  group_by:
  - alertname
  - service
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
  - match:
      service: finance-marketing
    receiver: finance-marketing-alerts
    group_by:
    - alertname
    - severity
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
receivers:
- name: default
  slack_configs:
  - api_url: https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK
    channel: '#alerts'
    send_resolved: true
- name: finance-marketing-alerts
  slack_configs:
  - api_url: https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK
    channel: '#finance-marketing-alerts'
    send_resolved: true
  pagerduty_configs:
  - service_key: YOUR_PAGERDUTY_KEY
    severity: '{{ .GroupLabels.severity }}'
inhibit_rules:
- source_match:
    severity: critical
  target_match:
    severity: warning
  equal:
  - alertname
  - service

