# Prometheus Monitoring Configuration for Marketing Personalization
# Description: AI marketing personalization engine
# Generated for production monitoring with ServiceMonitor, PrometheusRule, and Alertmanager configuration

---
# ServiceMonitor: Scrapes metrics from the marketing-personalization service
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: marketing-personalization-monitor
  namespace: monitoring
  labels:
    app: marketing-personalization
    release: prometheus
spec:
  selector:
    matchLabels:
      app: marketing-personalization
  endpoints:
  - port: metrics
    path: /metrics
    interval: 30s
    scrapeTimeout: 10s
    honorLabels: true
    metricRelabelings:
    - sourceLabels:
      - __name__
      regex: marketing_personalization_.*
      action: keep
  namespaceSelector:
    matchNames:
    - default


---
# PrometheusRule: Alerting and recording rules for marketing-personalization
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: marketing-personalization-rules
  namespace: monitoring
  labels:
    app: marketing-personalization
    release: prometheus
spec:
  groups:
  - name: marketing-personalization-recording-rules
    interval: 30s
    rules:
    - record: marketing_personalization:api_request_rate:rate5m
      expr: rate(marketing_personalization_api_requests_total[5m])
    - record: marketing_personalization:api_error_rate:rate5m
      expr: rate(marketing_personalization_api_errors_total[5m])
    - record: marketing_personalization:api_latency_p95:rate5m
      expr: histogram_quantile(0.95, rate(marketing_personalization_api_latency_seconds_bucket[5m]))
  - name: marketing-personalization-alerts-1
    rules:
    - alert: MarketingPersonalizationHighErrorRate
      expr: rate(marketing_personalization_api_errors_total[5m]) / rate(marketing_personalization_api_requests_total[5m])
        > 0.05
      for: 5m
      labels:
        severity: critical
        service: marketing-personalization
      annotations:
        summary: '{{ $labels.service }}: MarketingPersonalizationHighErrorRate is
          firing'
        description: '{{ $labels.service }} has triggered MarketingPersonalizationHighErrorRate
          for more than 5 minutes.'
    - alert: MarketingPersonalizationLowUplift
      expr: marketing_personalization_uplift < 0.05
      for: 5m
      labels:
        severity: warning
        service: marketing-personalization
      annotations:
        summary: '{{ $labels.service }}: MarketingPersonalizationLowUplift is firing'
        description: '{{ $labels.service }} has triggered MarketingPersonalizationLowUplift
          for more than 5 minutes.'
    - alert: MarketingPersonalizationLowCoverage
      expr: marketing_personalization_coverage < 0.5
      for: 5m
      labels:
        severity: warning
        service: marketing-personalization
      annotations:
        summary: '{{ $labels.service }}: MarketingPersonalizationLowCoverage is firing'
        description: '{{ $labels.service }} has triggered MarketingPersonalizationLowCoverage
          for more than 5 minutes.'
    - alert: MarketingPersonalizationHighLatency
      expr: histogram_quantile(0.95, rate(marketing_personalization_api_latency_seconds_bucket[5m]))
        > 2.0
      for: 5m
      labels:
        severity: warning
        service: marketing-personalization
      annotations:
        summary: '{{ $labels.service }}: MarketingPersonalizationHighLatency is firing'
        description: '{{ $labels.service }} has triggered MarketingPersonalizationHighLatency
          for more than 5 minutes.'


---
# Alertmanager Configuration: Routing and notification for marketing-personalization alerts
route:
  receiver: default
  group_by:
  - alertname
  - service
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
  - match:
      service: marketing-personalization
    receiver: marketing-personalization-alerts
    group_by:
    - alertname
    - severity
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
receivers:
- name: default
  slack_configs:
  - api_url: https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK
    channel: '#alerts'
    send_resolved: true
- name: marketing-personalization-alerts
  slack_configs:
  - api_url: https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK
    channel: '#marketing-personalization-alerts'
    send_resolved: true
  pagerduty_configs:
  - service_key: YOUR_PAGERDUTY_KEY
    severity: '{{ .GroupLabels.severity }}'
inhibit_rules:
- source_match:
    severity: critical
  target_match:
    severity: warning
  equal:
  - alertname
  - service

