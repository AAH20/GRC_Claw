# Prometheus Monitoring Configuration for SaaS Marketing
# Description: SaaS marketing automation
# Generated for production monitoring with ServiceMonitor, PrometheusRule, and Alertmanager configuration

---
# ServiceMonitor: Scrapes metrics from the saas-marketing service
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: saas-marketing-monitor
  namespace: monitoring
  labels:
    app: saas-marketing
    release: prometheus
spec:
  selector:
    matchLabels:
      app: saas-marketing
  endpoints:
  - port: metrics
    path: /metrics
    interval: 30s
    scrapeTimeout: 10s
    honorLabels: true
    metricRelabelings:
    - sourceLabels:
      - __name__
      regex: saas_marketing_.*
      action: keep
  namespaceSelector:
    matchNames:
    - default


---
# PrometheusRule: Alerting and recording rules for saas-marketing
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: saas-marketing-rules
  namespace: monitoring
  labels:
    app: saas-marketing
    release: prometheus
spec:
  groups:
  - name: saas-marketing-recording-rules
    interval: 30s
    rules:
    - record: saas_marketing:api_request_rate:rate5m
      expr: rate(saas_marketing_api_requests_total[5m])
    - record: saas_marketing:api_error_rate:rate5m
      expr: rate(saas_marketing_api_errors_total[5m])
    - record: saas_marketing:api_latency_p95:rate5m
      expr: histogram_quantile(0.95, rate(saas_marketing_api_latency_seconds_bucket[5m]))
  - name: saas-marketing-alerts-1
    rules:
    - alert: SaaSMarketingHighErrorRate
      expr: rate(saas_marketing_api_errors_total[5m]) / rate(saas_marketing_api_requests_total[5m])
        > 0.05
      for: 5m
      labels:
        severity: critical
        service: saas-marketing
      annotations:
        summary: '{{ $labels.service }}: SaaSMarketingHighErrorRate is firing'
        description: '{{ $labels.service }} has triggered SaaSMarketingHighErrorRate
          for more than 5 minutes.'
    - alert: SaaSMarketingLowConversionRate
      expr: saas_marketing_conversion_rate < 0.05
      for: 5m
      labels:
        severity: warning
        service: saas-marketing
      annotations:
        summary: '{{ $labels.service }}: SaaSMarketingLowConversionRate is firing'
        description: '{{ $labels.service }} has triggered SaaSMarketingLowConversionRate
          for more than 5 minutes.'
    - alert: SaaSMarketingHighCAC
      expr: saas_marketing_cac > 500
      for: 5m
      labels:
        severity: warning
        service: saas-marketing
      annotations:
        summary: '{{ $labels.service }}: SaaSMarketingHighCAC is firing'
        description: '{{ $labels.service }} has triggered SaaSMarketingHighCAC for
          more than 5 minutes.'
    - alert: SaaSMarketingHighLatency
      expr: histogram_quantile(0.95, rate(saas_marketing_api_latency_seconds_bucket[5m]))
        > 3.0
      for: 5m
      labels:
        severity: warning
        service: saas-marketing
      annotations:
        summary: '{{ $labels.service }}: SaaSMarketingHighLatency is firing'
        description: '{{ $labels.service }} has triggered SaaSMarketingHighLatency
          for more than 5 minutes.'


---
# Alertmanager Configuration: Routing and notification for saas-marketing alerts
route:
  receiver: default
  group_by:
  - alertname
  - service
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
  - match:
      service: saas-marketing
    receiver: saas-marketing-alerts
    group_by:
    - alertname
    - severity
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
receivers:
- name: default
  slack_configs:
  - api_url: https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK
    channel: '#alerts'
    send_resolved: true
- name: saas-marketing-alerts
  slack_configs:
  - api_url: https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK
    channel: '#saas-marketing-alerts'
    send_resolved: true
  pagerduty_configs:
  - service_key: YOUR_PAGERDUTY_KEY
    severity: '{{ .GroupLabels.severity }}'
inhibit_rules:
- source_match:
    severity: critical
  target_match:
    severity: warning
  equal:
  - alertname
  - service

