# Prometheus Monitoring Configuration for Workflow Automation
# Description: Marketing workflow automation
# Generated for production monitoring with ServiceMonitor, PrometheusRule, and Alertmanager configuration

---
# ServiceMonitor: Scrapes metrics from the workflow-automation service
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: workflow-automation-monitor
  namespace: monitoring
  labels:
    app: workflow-automation
    release: prometheus
spec:
  selector:
    matchLabels:
      app: workflow-automation
  endpoints:
  - port: metrics
    path: /metrics
    interval: 30s
    scrapeTimeout: 10s
    honorLabels: true
    metricRelabelings:
    - sourceLabels:
      - __name__
      regex: workflow_automation_.*
      action: keep
  namespaceSelector:
    matchNames:
    - default


---
# PrometheusRule: Alerting and recording rules for workflow-automation
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: workflow-automation-rules
  namespace: monitoring
  labels:
    app: workflow-automation
    release: prometheus
spec:
  groups:
  - name: workflow-automation-recording-rules
    interval: 30s
    rules:
    - record: workflow_automation:api_request_rate:rate5m
      expr: rate(workflow_automation_api_requests_total[5m])
    - record: workflow_automation:api_error_rate:rate5m
      expr: rate(workflow_automation_api_errors_total[5m])
    - record: workflow_automation:api_latency_p95:rate5m
      expr: histogram_quantile(0.95, rate(workflow_automation_api_latency_seconds_bucket[5m]))
  - name: workflow-automation-alerts-1
    rules:
    - alert: WorkflowAutomationHighErrorRate
      expr: rate(workflow_automation_api_errors_total[5m]) / rate(workflow_automation_api_requests_total[5m])
        > 0.05
      for: 5m
      labels:
        severity: critical
        service: workflow-automation
      annotations:
        summary: '{{ $labels.service }}: WorkflowAutomationHighErrorRate is firing'
        description: '{{ $labels.service }} has triggered WorkflowAutomationHighErrorRate
          for more than 5 minutes.'
    - alert: WorkflowAutomationLowSuccessRate
      expr: workflow_automation_success_rate < 0.95
      for: 5m
      labels:
        severity: critical
        service: workflow-automation
      annotations:
        summary: '{{ $labels.service }}: WorkflowAutomationLowSuccessRate is firing'
        description: '{{ $labels.service }} has triggered WorkflowAutomationLowSuccessRate
          for more than 5 minutes.'
    - alert: WorkflowAutomationHighQueueDepth
      expr: workflow_automation_queue_depth > 100
      for: 5m
      labels:
        severity: warning
        service: workflow-automation
      annotations:
        summary: '{{ $labels.service }}: WorkflowAutomationHighQueueDepth is firing'
        description: '{{ $labels.service }} has triggered WorkflowAutomationHighQueueDepth
          for more than 5 minutes.'
    - alert: WorkflowAutomationHighLatency
      expr: histogram_quantile(0.95, rate(workflow_automation_api_latency_seconds_bucket[5m]))
        > 3.0
      for: 5m
      labels:
        severity: warning
        service: workflow-automation
      annotations:
        summary: '{{ $labels.service }}: WorkflowAutomationHighLatency is firing'
        description: '{{ $labels.service }} has triggered WorkflowAutomationHighLatency
          for more than 5 minutes.'


---
# Alertmanager Configuration: Routing and notification for workflow-automation alerts
route:
  receiver: default
  group_by:
  - alertname
  - service
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
  - match:
      service: workflow-automation
    receiver: workflow-automation-alerts
    group_by:
    - alertname
    - severity
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
receivers:
- name: default
  slack_configs:
  - api_url: https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK
    channel: '#alerts'
    send_resolved: true
- name: workflow-automation-alerts
  slack_configs:
  - api_url: https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK
    channel: '#workflow-automation-alerts'
    send_resolved: true
  pagerduty_configs:
  - service_key: YOUR_PAGERDUTY_KEY
    severity: '{{ .GroupLabels.severity }}'
inhibit_rules:
- source_match:
    severity: critical
  target_match:
    severity: warning
  equal:
  - alertname
  - service

