# Prometheus Monitoring Configuration for Agency Marketing
# Description: Marketing agency management
# Generated for production monitoring with ServiceMonitor, PrometheusRule, and Alertmanager configuration

---
# ServiceMonitor: Scrapes metrics from the agency-marketing service
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: agency-marketing-monitor
  namespace: monitoring
  labels:
    app: agency-marketing
    release: prometheus
spec:
  selector:
    matchLabels:
      app: agency-marketing
  endpoints:
  - port: metrics
    path: /metrics
    interval: 30s
    scrapeTimeout: 10s
    honorLabels: true
    metricRelabelings:
    - sourceLabels:
      - __name__
      regex: agency_marketing_.*
      action: keep
  namespaceSelector:
    matchNames:
    - default


---
# PrometheusRule: Alerting and recording rules for agency-marketing
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: agency-marketing-rules
  namespace: monitoring
  labels:
    app: agency-marketing
    release: prometheus
spec:
  groups:
  - name: agency-marketing-recording-rules
    interval: 30s
    rules:
    - record: agency_marketing:api_request_rate:rate5m
      expr: rate(agency_marketing_api_requests_total[5m])
    - record: agency_marketing:api_error_rate:rate5m
      expr: rate(agency_marketing_api_errors_total[5m])
    - record: agency_marketing:api_latency_p95:rate5m
      expr: histogram_quantile(0.95, rate(agency_marketing_api_latency_seconds_bucket[5m]))
  - name: agency-marketing-alerts-1
    rules:
    - alert: AgencyMarketingHighErrorRate
      expr: rate(agency_marketing_api_errors_total[5m]) / rate(agency_marketing_api_requests_total[5m])
        > 0.05
      for: 5m
      labels:
        severity: critical
        service: agency-marketing
      annotations:
        summary: '{{ $labels.service }}: AgencyMarketingHighErrorRate is firing'
        description: '{{ $labels.service }} has triggered AgencyMarketingHighErrorRate
          for more than 5 minutes.'
    - alert: AgencyMarketingLowClientSatisfaction
      expr: agency_marketing_client_satisfaction < 3.5
      for: 5m
      labels:
        severity: warning
        service: agency-marketing
      annotations:
        summary: '{{ $labels.service }}: AgencyMarketingLowClientSatisfaction is firing'
        description: '{{ $labels.service }} has triggered AgencyMarketingLowClientSatisfaction
          for more than 5 minutes.'
    - alert: AgencyMarketingLowUtilization
      expr: agency_marketing_utilization_rate < 0.6
      for: 5m
      labels:
        severity: warning
        service: agency-marketing
      annotations:
        summary: '{{ $labels.service }}: AgencyMarketingLowUtilization is firing'
        description: '{{ $labels.service }} has triggered AgencyMarketingLowUtilization
          for more than 5 minutes.'
    - alert: AgencyMarketingHighLatency
      expr: histogram_quantile(0.95, rate(agency_marketing_api_latency_seconds_bucket[5m]))
        > 3.0
      for: 5m
      labels:
        severity: warning
        service: agency-marketing
      annotations:
        summary: '{{ $labels.service }}: AgencyMarketingHighLatency is firing'
        description: '{{ $labels.service }} has triggered AgencyMarketingHighLatency
          for more than 5 minutes.'


---
# Alertmanager Configuration: Routing and notification for agency-marketing alerts
route:
  receiver: default
  group_by:
  - alertname
  - service
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
  - match:
      service: agency-marketing
    receiver: agency-marketing-alerts
    group_by:
    - alertname
    - severity
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
receivers:
- name: default
  slack_configs:
  - api_url: https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK
    channel: '#alerts'
    send_resolved: true
- name: agency-marketing-alerts
  slack_configs:
  - api_url: https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK
    channel: '#agency-marketing-alerts'
    send_resolved: true
  pagerduty_configs:
  - service_key: YOUR_PAGERDUTY_KEY
    severity: '{{ .GroupLabels.severity }}'
inhibit_rules:
- source_match:
    severity: critical
  target_match:
    severity: warning
  equal:
  - alertname
  - service

