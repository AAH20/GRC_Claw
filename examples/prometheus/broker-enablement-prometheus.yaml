# Prometheus Monitoring Configuration for Broker Enablement
# Description: Broker enablement and support tools
# Generated for production monitoring with ServiceMonitor, PrometheusRule, and Alertmanager configuration

---
# ServiceMonitor: Scrapes metrics from the broker-enablement service
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: broker-enablement-monitor
  namespace: monitoring
  labels:
    app: broker-enablement
    release: prometheus
spec:
  selector:
    matchLabels:
      app: broker-enablement
  endpoints:
  - port: metrics
    path: /metrics
    interval: 30s
    scrapeTimeout: 10s
    honorLabels: true
    metricRelabelings:
    - sourceLabels:
      - __name__
      regex: broker_enablement_.*
      action: keep
  namespaceSelector:
    matchNames:
    - default


---
# PrometheusRule: Alerting and recording rules for broker-enablement
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: broker-enablement-rules
  namespace: monitoring
  labels:
    app: broker-enablement
    release: prometheus
spec:
  groups:
  - name: broker-enablement-recording-rules
    interval: 30s
    rules:
    - record: broker_enablement:api_request_rate:rate5m
      expr: rate(broker_enablement_api_requests_total[5m])
    - record: broker_enablement:api_error_rate:rate5m
      expr: rate(broker_enablement_api_errors_total[5m])
    - record: broker_enablement:api_latency_p95:rate5m
      expr: histogram_quantile(0.95, rate(broker_enablement_api_latency_seconds_bucket[5m]))
  - name: broker-enablement-alerts-1
    rules:
    - alert: BrokerEnablementHighErrorRate
      expr: rate(broker_enablement_api_errors_total[5m]) / rate(broker_enablement_api_requests_total[5m])
        > 0.05
      for: 5m
      labels:
        severity: critical
        service: broker-enablement
      annotations:
        summary: '{{ $labels.service }}: BrokerEnablementHighErrorRate is firing'
        description: '{{ $labels.service }} has triggered BrokerEnablementHighErrorRate
          for more than 5 minutes.'
    - alert: BrokerEnablementLowTrainingCompletion
      expr: broker_enablement_training_completion_rate < 0.5
      for: 5m
      labels:
        severity: warning
        service: broker-enablement
      annotations:
        summary: '{{ $labels.service }}: BrokerEnablementLowTrainingCompletion is
          firing'
        description: '{{ $labels.service }} has triggered BrokerEnablementLowTrainingCompletion
          for more than 5 minutes.'
    - alert: BrokerEnablementHighLatency
      expr: histogram_quantile(0.95, rate(broker_enablement_api_latency_seconds_bucket[5m]))
        > 3.0
      for: 5m
      labels:
        severity: warning
        service: broker-enablement
      annotations:
        summary: '{{ $labels.service }}: BrokerEnablementHighLatency is firing'
        description: '{{ $labels.service }} has triggered BrokerEnablementHighLatency
          for more than 5 minutes.'
    - alert: BrokerEnablementLowEngagement
      expr: broker_enablement_engagement_score < 0.4
      for: 5m
      labels:
        severity: info
        service: broker-enablement
      annotations:
        summary: '{{ $labels.service }}: BrokerEnablementLowEngagement is firing'
        description: '{{ $labels.service }} has triggered BrokerEnablementLowEngagement
          for more than 5 minutes.'


---
# Alertmanager Configuration: Routing and notification for broker-enablement alerts
route:
  receiver: default
  group_by:
  - alertname
  - service
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
  - match:
      service: broker-enablement
    receiver: broker-enablement-alerts
    group_by:
    - alertname
    - severity
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
receivers:
- name: default
  slack_configs:
  - api_url: https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK
    channel: '#alerts'
    send_resolved: true
- name: broker-enablement-alerts
  slack_configs:
  - api_url: https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK
    channel: '#broker-enablement-alerts'
    send_resolved: true
  pagerduty_configs:
  - service_key: YOUR_PAGERDUTY_KEY
    severity: '{{ .GroupLabels.severity }}'
inhibit_rules:
- source_match:
    severity: critical
  target_match:
    severity: warning
  equal:
  - alertname
  - service

