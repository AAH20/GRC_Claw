# Prometheus Monitoring Configuration for Conversational Marketing
# Description: Conversational marketing and chatbots
# Generated for production monitoring with ServiceMonitor, PrometheusRule, and Alertmanager configuration

---
# ServiceMonitor: Scrapes metrics from the conversational-marketing service
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: conversational-marketing-monitor
  namespace: monitoring
  labels:
    app: conversational-marketing
    release: prometheus
spec:
  selector:
    matchLabels:
      app: conversational-marketing
  endpoints:
  - port: metrics
    path: /metrics
    interval: 30s
    scrapeTimeout: 10s
    honorLabels: true
    metricRelabelings:
    - sourceLabels:
      - __name__
      regex: conversational_marketing_.*
      action: keep
  namespaceSelector:
    matchNames:
    - default


---
# PrometheusRule: Alerting and recording rules for conversational-marketing
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: conversational-marketing-rules
  namespace: monitoring
  labels:
    app: conversational-marketing
    release: prometheus
spec:
  groups:
  - name: conversational-marketing-recording-rules
    interval: 30s
    rules:
    - record: conversational_marketing:api_request_rate:rate5m
      expr: rate(conversational_marketing_api_requests_total[5m])
    - record: conversational_marketing:api_error_rate:rate5m
      expr: rate(conversational_marketing_api_errors_total[5m])
    - record: conversational_marketing:api_latency_p95:rate5m
      expr: histogram_quantile(0.95, rate(conversational_marketing_api_latency_seconds_bucket[5m]))
  - name: conversational-marketing-alerts-1
    rules:
    - alert: ConversationalMarketingHighErrorRate
      expr: rate(conversational_marketing_api_errors_total[5m]) / rate(conversational_marketing_api_requests_total[5m])
        > 0.05
      for: 5m
      labels:
        severity: critical
        service: conversational-marketing
      annotations:
        summary: '{{ $labels.service }}: ConversationalMarketingHighErrorRate is firing'
        description: '{{ $labels.service }} has triggered ConversationalMarketingHighErrorRate
          for more than 5 minutes.'
    - alert: ConversationalMarketingLowEngagementRate
      expr: conversational_marketing_engagement_rate < 0.3
      for: 5m
      labels:
        severity: warning
        service: conversational-marketing
      annotations:
        summary: '{{ $labels.service }}: ConversationalMarketingLowEngagementRate
          is firing'
        description: '{{ $labels.service }} has triggered ConversationalMarketingLowEngagementRate
          for more than 5 minutes.'
    - alert: ConversationalMarketingSlowResponse
      expr: conversational_marketing_response_time_seconds > 30
      for: 5m
      labels:
        severity: warning
        service: conversational-marketing
      annotations:
        summary: '{{ $labels.service }}: ConversationalMarketingSlowResponse is firing'
        description: '{{ $labels.service }} has triggered ConversationalMarketingSlowResponse
          for more than 5 minutes.'
    - alert: ConversationalMarketingHighLatency
      expr: histogram_quantile(0.95, rate(conversational_marketing_api_latency_seconds_bucket[5m]))
        > 3.0
      for: 5m
      labels:
        severity: warning
        service: conversational-marketing
      annotations:
        summary: '{{ $labels.service }}: ConversationalMarketingHighLatency is firing'
        description: '{{ $labels.service }} has triggered ConversationalMarketingHighLatency
          for more than 5 minutes.'


---
# Alertmanager Configuration: Routing and notification for conversational-marketing alerts
route:
  receiver: default
  group_by:
  - alertname
  - service
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
  - match:
      service: conversational-marketing
    receiver: conversational-marketing-alerts
    group_by:
    - alertname
    - severity
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
receivers:
- name: default
  slack_configs:
  - api_url: https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK
    channel: '#alerts'
    send_resolved: true
- name: conversational-marketing-alerts
  slack_configs:
  - api_url: https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK
    channel: '#conversational-marketing-alerts'
    send_resolved: true
  pagerduty_configs:
  - service_key: YOUR_PAGERDUTY_KEY
    severity: '{{ .GroupLabels.severity }}'
inhibit_rules:
- source_match:
    severity: critical
  target_match:
    severity: warning
  equal:
  - alertname
  - service

