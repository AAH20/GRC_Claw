# Prometheus Monitoring Configuration for Product Recommendations
# Description: AI product recommendation engine
# Generated for production monitoring with ServiceMonitor, PrometheusRule, and Alertmanager configuration

---
# ServiceMonitor: Scrapes metrics from the product-recommendations service
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: product-recommendations-monitor
  namespace: monitoring
  labels:
    app: product-recommendations
    release: prometheus
spec:
  selector:
    matchLabels:
      app: product-recommendations
  endpoints:
  - port: metrics
    path: /metrics
    interval: 30s
    scrapeTimeout: 10s
    honorLabels: true
    metricRelabelings:
    - sourceLabels:
      - __name__
      regex: product_recommendations_.*
      action: keep
  namespaceSelector:
    matchNames:
    - default


---
# PrometheusRule: Alerting and recording rules for product-recommendations
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: product-recommendations-rules
  namespace: monitoring
  labels:
    app: product-recommendations
    release: prometheus
spec:
  groups:
  - name: product-recommendations-recording-rules
    interval: 30s
    rules:
    - record: product_recommendations:api_request_rate:rate5m
      expr: rate(product_recommendations_api_requests_total[5m])
    - record: product_recommendations:api_error_rate:rate5m
      expr: rate(product_recommendations_api_errors_total[5m])
    - record: product_recommendations:api_latency_p95:rate5m
      expr: histogram_quantile(0.95, rate(product_recommendations_api_latency_seconds_bucket[5m]))
  - name: product-recommendations-alerts-1
    rules:
    - alert: ProductRecommendationsHighErrorRate
      expr: rate(product_recommendations_api_errors_total[5m]) / rate(product_recommendations_api_requests_total[5m])
        > 0.05
      for: 5m
      labels:
        severity: critical
        service: product-recommendations
      annotations:
        summary: '{{ $labels.service }}: ProductRecommendationsHighErrorRate is firing'
        description: '{{ $labels.service }} has triggered ProductRecommendationsHighErrorRate
          for more than 5 minutes.'
    - alert: ProductRecommendationsLowCTR
      expr: product_recommendations_ctr < 0.03
      for: 5m
      labels:
        severity: warning
        service: product-recommendations
      annotations:
        summary: '{{ $labels.service }}: ProductRecommendationsLowCTR is firing'
        description: '{{ $labels.service }} has triggered ProductRecommendationsLowCTR
          for more than 5 minutes.'
    - alert: ProductRecommendationsLowModelAccuracy
      expr: product_recommendations_model_accuracy < 0.6
      for: 5m
      labels:
        severity: critical
        service: product-recommendations
      annotations:
        summary: '{{ $labels.service }}: ProductRecommendationsLowModelAccuracy is
          firing'
        description: '{{ $labels.service }} has triggered ProductRecommendationsLowModelAccuracy
          for more than 5 minutes.'
    - alert: ProductRecommendationsHighLatency
      expr: histogram_quantile(0.95, rate(product_recommendations_api_latency_seconds_bucket[5m]))
        > 2.0
      for: 5m
      labels:
        severity: warning
        service: product-recommendations
      annotations:
        summary: '{{ $labels.service }}: ProductRecommendationsHighLatency is firing'
        description: '{{ $labels.service }} has triggered ProductRecommendationsHighLatency
          for more than 5 minutes.'
    - alert: ProductRecommendationsLowCoverage
      expr: product_recommendations_coverage < 0.5
      for: 5m
      labels:
        severity: warning
        service: product-recommendations
      annotations:
        summary: '{{ $labels.service }}: ProductRecommendationsLowCoverage is firing'
        description: '{{ $labels.service }} has triggered ProductRecommendationsLowCoverage
          for more than 5 minutes.'


---
# Alertmanager Configuration: Routing and notification for product-recommendations alerts
route:
  receiver: default
  group_by:
  - alertname
  - service
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
  - match:
      service: product-recommendations
    receiver: product-recommendations-alerts
    group_by:
    - alertname
    - severity
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
receivers:
- name: default
  slack_configs:
  - api_url: https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK
    channel: '#alerts'
    send_resolved: true
- name: product-recommendations-alerts
  slack_configs:
  - api_url: https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK
    channel: '#product-recommendations-alerts'
    send_resolved: true
  pagerduty_configs:
  - service_key: YOUR_PAGERDUTY_KEY
    severity: '{{ .GroupLabels.severity }}'
inhibit_rules:
- source_match:
    severity: critical
  target_match:
    severity: warning
  equal:
  - alertname
  - service

