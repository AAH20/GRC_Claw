# Prometheus Monitoring Configuration for Customer Retention
# Description: Customer retention and churn prevention
# Generated for production monitoring with ServiceMonitor, PrometheusRule, and Alertmanager configuration

---
# ServiceMonitor: Scrapes metrics from the customer-retention service
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: customer-retention-monitor
  namespace: monitoring
  labels:
    app: customer-retention
    release: prometheus
spec:
  selector:
    matchLabels:
      app: customer-retention
  endpoints:
  - port: metrics
    path: /metrics
    interval: 30s
    scrapeTimeout: 10s
    honorLabels: true
    metricRelabelings:
    - sourceLabels:
      - __name__
      regex: customer_retention_.*
      action: keep
  namespaceSelector:
    matchNames:
    - default


---
# PrometheusRule: Alerting and recording rules for customer-retention
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: customer-retention-rules
  namespace: monitoring
  labels:
    app: customer-retention
    release: prometheus
spec:
  groups:
  - name: customer-retention-recording-rules
    interval: 30s
    rules:
    - record: customer_retention:api_request_rate:rate5m
      expr: rate(customer_retention_api_requests_total[5m])
    - record: customer_retention:api_error_rate:rate5m
      expr: rate(customer_retention_api_errors_total[5m])
    - record: customer_retention:api_latency_p95:rate5m
      expr: histogram_quantile(0.95, rate(customer_retention_api_latency_seconds_bucket[5m]))
  - name: customer-retention-alerts-1
    rules:
    - alert: CustomerRetentionHighChurnRate
      expr: customer_retention_churn_rate > 0.1
      for: 5m
      labels:
        severity: critical
        service: customer-retention
      annotations:
        summary: '{{ $labels.service }}: CustomerRetentionHighChurnRate is firing'
        description: '{{ $labels.service }} has triggered CustomerRetentionHighChurnRate
          for more than 5 minutes.'
    - alert: CustomerRetentionHighErrorRate
      expr: rate(customer_retention_api_errors_total[5m]) / rate(customer_retention_api_requests_total[5m])
        > 0.05
      for: 5m
      labels:
        severity: critical
        service: customer-retention
      annotations:
        summary: '{{ $labels.service }}: CustomerRetentionHighErrorRate is firing'
        description: '{{ $labels.service }} has triggered CustomerRetentionHighErrorRate
          for more than 5 minutes.'
    - alert: CustomerRetentionHighAtRiskCustomers
      expr: customer_retention_at_risk_customers > 100
      for: 5m
      labels:
        severity: warning
        service: customer-retention
      annotations:
        summary: '{{ $labels.service }}: CustomerRetentionHighAtRiskCustomers is firing'
        description: '{{ $labels.service }} has triggered CustomerRetentionHighAtRiskCustomers
          for more than 5 minutes.'
    - alert: CustomerRetentionLowSaveRate
      expr: customer_retention_save_rate < 0.3
      for: 5m
      labels:
        severity: warning
        service: customer-retention
      annotations:
        summary: '{{ $labels.service }}: CustomerRetentionLowSaveRate is firing'
        description: '{{ $labels.service }} has triggered CustomerRetentionLowSaveRate
          for more than 5 minutes.'
    - alert: CustomerRetentionHighLatency
      expr: histogram_quantile(0.95, rate(customer_retention_api_latency_seconds_bucket[5m]))
        > 3.0
      for: 5m
      labels:
        severity: warning
        service: customer-retention
      annotations:
        summary: '{{ $labels.service }}: CustomerRetentionHighLatency is firing'
        description: '{{ $labels.service }} has triggered CustomerRetentionHighLatency
          for more than 5 minutes.'


---
# Alertmanager Configuration: Routing and notification for customer-retention alerts
route:
  receiver: default
  group_by:
  - alertname
  - service
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
  - match:
      service: customer-retention
    receiver: customer-retention-alerts
    group_by:
    - alertname
    - severity
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
receivers:
- name: default
  slack_configs:
  - api_url: https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK
    channel: '#alerts'
    send_resolved: true
- name: customer-retention-alerts
  slack_configs:
  - api_url: https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK
    channel: '#customer-retention-alerts'
    send_resolved: true
  pagerduty_configs:
  - service_key: YOUR_PAGERDUTY_KEY
    severity: '{{ .GroupLabels.severity }}'
inhibit_rules:
- source_match:
    severity: critical
  target_match:
    severity: warning
  equal:
  - alertname
  - service

