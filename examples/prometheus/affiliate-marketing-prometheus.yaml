# Prometheus Monitoring Configuration for Affiliate Marketing
# Description: Affiliate marketing management
# Generated for production monitoring with ServiceMonitor, PrometheusRule, and Alertmanager configuration

---
# ServiceMonitor: Scrapes metrics from the affiliate-marketing service
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: affiliate-marketing-monitor
  namespace: monitoring
  labels:
    app: affiliate-marketing
    release: prometheus
spec:
  selector:
    matchLabels:
      app: affiliate-marketing
  endpoints:
  - port: metrics
    path: /metrics
    interval: 30s
    scrapeTimeout: 10s
    honorLabels: true
    metricRelabelings:
    - sourceLabels:
      - __name__
      regex: affiliate_marketing_.*
      action: keep
  namespaceSelector:
    matchNames:
    - default


---
# PrometheusRule: Alerting and recording rules for affiliate-marketing
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: affiliate-marketing-rules
  namespace: monitoring
  labels:
    app: affiliate-marketing
    release: prometheus
spec:
  groups:
  - name: affiliate-marketing-recording-rules
    interval: 30s
    rules:
    - record: affiliate_marketing:api_request_rate:rate5m
      expr: rate(affiliate_marketing_api_requests_total[5m])
    - record: affiliate_marketing:api_error_rate:rate5m
      expr: rate(affiliate_marketing_api_errors_total[5m])
    - record: affiliate_marketing:api_latency_p95:rate5m
      expr: histogram_quantile(0.95, rate(affiliate_marketing_api_latency_seconds_bucket[5m]))
  - name: affiliate-marketing-alerts-1
    rules:
    - alert: AffiliateMarketingHighErrorRate
      expr: rate(affiliate_marketing_api_errors_total[5m]) / rate(affiliate_marketing_api_requests_total[5m])
        > 0.05
      for: 5m
      labels:
        severity: critical
        service: affiliate-marketing
      annotations:
        summary: '{{ $labels.service }}: AffiliateMarketingHighErrorRate is firing'
        description: '{{ $labels.service }} has triggered AffiliateMarketingHighErrorRate
          for more than 5 minutes.'
    - alert: AffiliateMarketingHighFraudRate
      expr: affiliate_marketing_fraud_rate > 0.05
      for: 5m
      labels:
        severity: critical
        service: affiliate-marketing
      annotations:
        summary: '{{ $labels.service }}: AffiliateMarketingHighFraudRate is firing'
        description: '{{ $labels.service }} has triggered AffiliateMarketingHighFraudRate
          for more than 5 minutes.'
    - alert: AffiliateMarketingLowConversionRate
      expr: affiliate_marketing_conversion_rate < 0.01
      for: 5m
      labels:
        severity: warning
        service: affiliate-marketing
      annotations:
        summary: '{{ $labels.service }}: AffiliateMarketingLowConversionRate is firing'
        description: '{{ $labels.service }} has triggered AffiliateMarketingLowConversionRate
          for more than 5 minutes.'
    - alert: AffiliateMarketingHighLatency
      expr: histogram_quantile(0.95, rate(affiliate_marketing_api_latency_seconds_bucket[5m]))
        > 3.0
      for: 5m
      labels:
        severity: warning
        service: affiliate-marketing
      annotations:
        summary: '{{ $labels.service }}: AffiliateMarketingHighLatency is firing'
        description: '{{ $labels.service }} has triggered AffiliateMarketingHighLatency
          for more than 5 minutes.'


---
# Alertmanager Configuration: Routing and notification for affiliate-marketing alerts
route:
  receiver: default
  group_by:
  - alertname
  - service
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
  - match:
      service: affiliate-marketing
    receiver: affiliate-marketing-alerts
    group_by:
    - alertname
    - severity
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
receivers:
- name: default
  slack_configs:
  - api_url: https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK
    channel: '#alerts'
    send_resolved: true
- name: affiliate-marketing-alerts
  slack_configs:
  - api_url: https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK
    channel: '#affiliate-marketing-alerts'
    send_resolved: true
  pagerduty_configs:
  - service_key: YOUR_PAGERDUTY_KEY
    severity: '{{ .GroupLabels.severity }}'
inhibit_rules:
- source_match:
    severity: critical
  target_match:
    severity: warning
  equal:
  - alertname
  - service

