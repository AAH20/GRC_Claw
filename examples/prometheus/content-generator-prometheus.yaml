# Prometheus Monitoring Configuration for Content Generator
# Description: AI content generation and optimization
# Generated for production monitoring with ServiceMonitor, PrometheusRule, and Alertmanager configuration

---
# ServiceMonitor: Scrapes metrics from the content-generator service
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: content-generator-monitor
  namespace: monitoring
  labels:
    app: content-generator
    release: prometheus
spec:
  selector:
    matchLabels:
      app: content-generator
  endpoints:
  - port: metrics
    path: /metrics
    interval: 30s
    scrapeTimeout: 10s
    honorLabels: true
    metricRelabelings:
    - sourceLabels:
      - __name__
      regex: content_generator_.*
      action: keep
  namespaceSelector:
    matchNames:
    - default


---
# PrometheusRule: Alerting and recording rules for content-generator
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: content-generator-rules
  namespace: monitoring
  labels:
    app: content-generator
    release: prometheus
spec:
  groups:
  - name: content-generator-recording-rules
    interval: 30s
    rules:
    - record: content_generator:api_request_rate:rate5m
      expr: rate(content_generator_api_requests_total[5m])
    - record: content_generator:api_error_rate:rate5m
      expr: rate(content_generator_api_errors_total[5m])
  - name: content-generator-alerts-1
    rules:
    - alert: ContentGeneratorHighErrorRate
      expr: rate(content_generator_api_errors_total[5m]) / rate(content_generator_api_requests_total[5m])
        > 0.05
      for: 5m
      labels:
        severity: critical
        service: content-generator
      annotations:
        summary: '{{ $labels.service }}: ContentGeneratorHighErrorRate is firing'
        description: '{{ $labels.service }} has triggered ContentGeneratorHighErrorRate
          for more than 5 minutes.'
    - alert: ContentGeneratorHighLatency
      expr: histogram_quantile(0.95, rate(content_generator_generation_latency_seconds_bucket[5m]))
        > 10.0
      for: 5m
      labels:
        severity: warning
        service: content-generator
      annotations:
        summary: '{{ $labels.service }}: ContentGeneratorHighLatency is firing'
        description: '{{ $labels.service }} has triggered ContentGeneratorHighLatency
          for more than 5 minutes.'
    - alert: ContentGeneratorLowQualityScore
      expr: content_generator_quality_score < 0.6
      for: 5m
      labels:
        severity: warning
        service: content-generator
      annotations:
        summary: '{{ $labels.service }}: ContentGeneratorLowQualityScore is firing'
        description: '{{ $labels.service }} has triggered ContentGeneratorLowQualityScore
          for more than 5 minutes.'
    - alert: ContentGeneratorRateLimitHits
      expr: rate(content_generator_rate_limit_hits_total[5m]) > 10
      for: 5m
      labels:
        severity: warning
        service: content-generator
      annotations:
        summary: '{{ $labels.service }}: ContentGeneratorRateLimitHits is firing'
        description: '{{ $labels.service }} has triggered ContentGeneratorRateLimitHits
          for more than 5 minutes.'
    - alert: ContentGeneratorLowAcceptanceRate
      expr: content_generator_content_accepted_rate < 0.5
      for: 5m
      labels:
        severity: warning
        service: content-generator
      annotations:
        summary: '{{ $labels.service }}: ContentGeneratorLowAcceptanceRate is firing'
        description: '{{ $labels.service }} has triggered ContentGeneratorLowAcceptanceRate
          for more than 5 minutes.'


---
# Alertmanager Configuration: Routing and notification for content-generator alerts
route:
  receiver: default
  group_by:
  - alertname
  - service
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
  - match:
      service: content-generator
    receiver: content-generator-alerts
    group_by:
    - alertname
    - severity
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
receivers:
- name: default
  slack_configs:
  - api_url: https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK
    channel: '#alerts'
    send_resolved: true
- name: content-generator-alerts
  slack_configs:
  - api_url: https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK
    channel: '#content-generator-alerts'
    send_resolved: true
  pagerduty_configs:
  - service_key: YOUR_PAGERDUTY_KEY
    severity: '{{ .GroupLabels.severity }}'
inhibit_rules:
- source_match:
    severity: critical
  target_match:
    severity: warning
  equal:
  - alertname
  - service

