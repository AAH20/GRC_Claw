# Tempo Tracing Configuration for customer-segmentation
# Customer segmentation and audience management
# Generated for GRC_Claw project suite

apiVersion: tempo.grafana.com/v1alpha1
kind: TempoStack
metadata:
  name: customer-segmentation-tempo
  namespace: grc-claw-monitoring
  labels:
    app: customer-segmentation
    component: tempo
    project: grc-claw
    environment: production
spec:
  # Resource configuration
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 4Gi

  # Storage configuration
  storage:
    trace:
      backend: s3
      s3:
        bucket: grc-claw-tempo-traces
        endpoint: s3.amazonaws.com
        region: us-east-1
      wal:
        path: /var/tempo/wal

  # Retention configuration
  retention:
    global:
      traces: 168h  # 7 days
    perTenant:
      traces: 72h  # 3 days

  # Receiver configuration
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318
    jaeger:
      protocols:
        grpc:
          endpoint: 0.0.0.0:14250
        thrift_http:
          endpoint: 0.0.0.0:14268
    zipkin:
      endpoint: 0.0.0.0:9411

  # Ingestion configuration
  ingestion:
    rate_limit_bytes: 20000000  # 20MB/s per tenant
    burst_size_bytes: 50000000   # 50MB burst
    max_traces_per_user: 100000
    max_bytes_per_trace: 5000000  # 5MB per trace

  # Query configuration
  query:
    max_duration: 30s
    max_bytes: 10000000  # 10MB
    concurrent_queries: 20

  # Compaction configuration
  compaction:
    block_retention: 168h  # 7 days
    compacted_block_retention: 24h
    max_compaction_objects: 1000000

  # Multitenancy configuration
  multitenancy:
    enabled: true
    header: X-Scope-OrgID
    tenant_name: customer-segmentation

  # Metrics generator configuration
  metrics_generator:
    enabled: true
    storage:
      path: /var/tempo/metrics
      remote_write:
        - url: http://prometheus:9090/api/v1/write
          send_exemplars: true
    processor:
      service_graphs:
        enabled: true
        dimensions:
          - service.name
          - span.name
          - span.kind
      span_metrics:
        enabled: true
        dimensions:
          - service.name
          - span.name
          - span.kind
          - status.code
        histogram_buckets:
          - 0.005
          - 0.01
          - 0.025
          - 0.05
          - 0.1
          - 0.25
          - 0.5
          - 1.0
          - 2.5
          - 5.0
          - 10.0

---
# Trace Query Configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: customer-segmentation-trace-queries
  namespace: grc-claw-monitoring
  labels:
    app: customer-segmentation
    component: tempo-queries
data:
  # Service-specific trace queries
  trace_queries.yaml: |
    queries:
      # Query 1: Find segments with imbalance ratios above 0.8
      - name: "Find segments with imbalance ratios above 0.8"
        type: search
        query:
          service.name: "customer-segmentation"
          span.name: "segment.create"
          duration: "> 1s"
          start: "-24h"
        limit: 50
        sort: duration:desc

      # Query 2: Show segment sizes and value scores
      - name: "Show segment sizes and value scores"
        type: search
        query:
          service.name: "customer-segmentation"
          span.name: "segment.update"
          duration: "> 500ms"
          start: "-1h"
        limit: 25
        sort: duration:desc

      # Query 3: Identify segment assignment failures
      - name: "Identify segment assignment failures"
        type: search
        query:
          service.name: "customer-segmentation"
          span.name: "segment.assign"
          duration: "> 100ms"
          start: "-1h"
        limit: 25
        sort: duration:desc

      # Service graph query
      - name: "service-graph"
        type: service-graph
        query:
          service.name: "customer-segmentation"
          start: "-1h"
        limit: 100

      # Error traces query
      - name: "error-traces"
        type: search
        query:
          service.name: "customer-segmentation"
          status.code: "STATUS_CODE_ERROR"
          start: "-1h"
        limit: 50
        sort: timestamp:desc

      # Slow traces query
      - name: "slow-traces"
        type: search
        query:
          service.name: "customer-segmentation"
          duration: "> 5s"
          start: "-1h"
        limit: 25
        sort: duration:desc

  # Span attributes configuration
  span_attributes.yaml: |
    attributes:
      - key: "segment.id"
        description: "Span attribute for segment.id"
        type: string
      - key: "segment.name"
        description: "Span attribute for segment.name"
        type: string
      - key: "segment.size"
        description: "Span attribute for segment.size"
        type: string
      - key: "segment.criteria"
        description: "Span attribute for segment.criteria"
        type: string
      - key: "segment.value_score"
        description: "Span attribute for segment.value_score"
        type: string

---
# Alerting Configuration
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: customer-segmentation-tempo-alerts
  namespace: grc-claw-monitoring
  labels:
    app: customer-segmentation
    component: tempo-alerts
    project: grc-claw
spec:
  groups:
    - name: customer-segmentation.tracing.alerts
      rules:
        - alert: segment-imbalance
          expr: |
            segment_size_ratio > 0.8
          for: 5m
          labels:
            severity: warning
            service: customer-segmentation
            team: marketing-engineering
          annotations:
            summary: "Segment imbalance detected"
            description: "Alert for customer-segmentation: Segment imbalance detected"
            runbook_url: "https://wiki.grc-claw.com/runbooks/customer-segmentation/segment-imbalance"
            dashboard_url: "https://grafana.grc-claw.com/d/customer-segmentation-tracing"

        - alert: assignment-failure
          expr: |
            assignment_status == 'failed'
          for: 5m
          labels:
            severity: critical
            service: customer-segmentation
            team: marketing-engineering
          annotations:
            summary: "Segment assignment failure"
            description: "Alert for customer-segmentation: Segment assignment failure"
            runbook_url: "https://wiki.grc-claw.com/runbooks/customer-segmentation/assignment-failure"
            dashboard_url: "https://grafana.grc-claw.com/d/customer-segmentation-tracing"

        - alert: high-value-segment
          expr: |
            value_score > 0.8
          for: 5m
          labels:
            severity: info
            service: customer-segmentation
            team: marketing-engineering
          annotations:
            summary: "High-value segment identified"
            description: "Alert for customer-segmentation: High-value segment identified"
            runbook_url: "https://wiki.grc-claw.com/runbooks/customer-segmentation/high-value-segment"
            dashboard_url: "https://grafana.grc-claw.com/d/customer-segmentation-tracing"


    - name: customer-segmentation.tracing.slo
      rules:
        - alert: HighErrorRate
          expr: |
            sum(rate(traces_spanmetrics_calls_total{service="customer-segmentation",status="ERROR"}[5m]))
            /
            sum(rate(traces_spanmetrics_calls_total{service="customer-segmentation"}[5m]))
            > 0.05
          for: 10m
          labels:
            severity: critical
            service: customer-segmentation
            team: marketing-engineering
          annotations:
            summary: "High error rate for customer-segmentation"
            description: "Error rate exceeds 5% for customer-segmentation"

        - alert: HighLatency
          expr: |
            histogram_quantile(0.95,
              sum(rate(traces_spanmetrics_latency_bucket{service="customer-segmentation"}[5m])) by (le)
            ) > 2.0
          for: 10m
          labels:
            severity: warning
            service: customer-segmentation
            team: marketing-engineering
          annotations:
            summary: "High P95 latency for customer-segmentation"
            description: "P95 latency exceeds 2 seconds for customer-segmentation"

        - alert: TraceVolumeSpike
          expr: |
            sum(rate(traces_spanmetrics_calls_total{service="customer-segmentation"}[5m]))
            >
            2 * avg_over_time(
              sum(rate(traces_spanmetrics_calls_total{service="customer-segmentation"}[5m]))[1h:5m]
            )
          for: 15m
          labels:
            severity: warning
            service: customer-segmentation
            team: marketing-engineering
          annotations:
            summary: "Trace volume spike for customer-segmentation"
            description: "Trace volume is 2x above 1-hour average for customer-segmentation"

---
# Grafana Dashboard Configuration
apiVersion: integreatly.org/v1alpha1
kind: GrafanaDashboard
metadata:
  name: customer-segmentation-tracing-dashboard
  namespace: grc-claw-monitoring
  labels:
    app: customer-segmentation
    component: tempo-dashboard
data:
  dashboard.json: |
    {
      "title": "customer-segmentation - Tempo Tracing Dashboard",
      "uid": "customer-segmentation-tracing",
      "tags": ["tempo", "tracing", "customer-segmentation", "grc-claw"],
      "timezone": "utc",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "panels": [
        {
          "id": 1,
          "title": "Request Rate",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0},
          "targets": [
            {
              "expr": "sum(rate(traces_spanmetrics_calls_total{service=\"customer-segmentation\"}[5m])) by (span_name)",
              "legendFormat": "{span_name}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 2,
          "title": "Error Rate",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0},
          "targets": [
            {
              "expr": "sum(rate(traces_spanmetrics_calls_total{service=\"customer-segmentation\",status=\"ERROR\"}[5m])) by (span_name)",
              "legendFormat": "{span_name}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 3,
          "title": "P95 Latency",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 8},
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum(rate(traces_spanmetrics_latency_bucket{service=\"customer-segmentation\"}[5m])) by (le, span_name))",
              "legendFormat": "{span_name}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 4,
          "title": "Service Graph",
          "type": "nodeGraph",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 8},
          "targets": [
            {
              "expr": "traces_service_graph_request_total{service=\"customer-segmentation\"}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 5,
          "title": "Trace Volume by Span",
          "type": "barchart",
          "gridPos": {"h": 8, "w": 24, "x": 0, "y": 16},
          "targets": [
            {
              "expr": "sum(rate(traces_spanmetrics_calls_total{service=\"customer-segmentation\"}[5m])) by (span_name)",
              "legendFormat": "{span_name}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 6,
          "title": "Error Distribution",
          "type": "piechart",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 24},
          "targets": [
            {
              "expr": "sum(rate(traces_spanmetrics_calls_total{service=\"customer-segmentation\",status=\"ERROR\"}[5m])) by (span_name)",
              "legendFormat": "{span_name}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 7,
          "title": "Latency Heatmap",
          "type": "heatmap",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 24},
          "targets": [
            {
              "expr": "sum(rate(traces_spanmetrics_latency_bucket{service=\"customer-segmentation\"}[5m])) by (le)",
              "refId": "A"
            }
          ]
        }
      ]
    }

---
# Service Monitor Configuration
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: customer-segmentation-tempo-metrics
  namespace: grc-claw-monitoring
  labels:
    app: customer-segmentation
    component: tempo-metrics
spec:
  selector:
    matchLabels:
      app: customer-segmentation
      component: tempo
  endpoints:
    - port: metrics
      interval: 30s
      scrapeTimeout: 10s
      path: /metrics
      scheme: http
      metricRelabelings:
        - sourceLabels: [__name__]
          regex: "traces_.*"
          action: keep

---
# Pod Monitor Configuration
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: customer-segmentation-tempo-pods
  namespace: grc-claw-monitoring
  labels:
    app: customer-segmentation
    component: tempo-pods
spec:
  selector:
    matchLabels:
      app: customer-segmentation
      component: tempo
  podMetricsEndpoints:
    - port: metrics
      interval: 30s
      scrapeTimeout: 10s
      path: /metrics
      scheme: http

---
# Network Policy Configuration
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: customer-segmentation-tempo-network-policy
  namespace: grc-claw-monitoring
  labels:
    app: customer-segmentation
    component: tempo-network
spec:
  podSelector:
    matchLabels:
      app: customer-segmentation
      component: tempo
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: grc-claw-monitoring
      ports:
        - protocol: TCP
          port: 4317
        - protocol: TCP
          port: 4318
        - protocol: TCP
          port: 14250
        - protocol: TCP
          port: 14268
        - protocol: TCP
          port: 9411
        - protocol: TCP
          port: 3200
        - protocol: TCP
          port: 80
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              name: grc-claw-monitoring
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 9090

---
# Pod Disruption Budget
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: customer-segmentation-tempo-pdb
  namespace: grc-claw-monitoring
  labels:
    app: customer-segmentation
    component: tempo-pdb
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: customer-segmentation
      component: tempo

---
# Horizontal Pod Autoscaler
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: customer-segmentation-tempo-hpa
  namespace: grc-claw-monitoring
  labels:
    app: customer-segmentation
    component: tempo-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: customer-segmentation-tempo
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 10
          periodSeconds: 60
