# Okteto Configuration for video-marketing
# Video marketing and production
# Auto-generated production-grade Okteto manifest

build:
  videomarketing:
    context: .
    dockerfile: Dockerfile
    target: production
    args:
      - NODE_ENV=production
      - BUILD_DATE={{date}}
      - VCS_REF={{sha}}

deploy:
  - name: video-marketing
    image: okteto.dev/videomarketing:latest
    command: ["./start.sh"]
    replicas: 2
    resources:
      requests:
        cpu: 500m
        memory: 512Mi
      limits:
        cpu: "1000m"
        memory: "1024Mi"
    ports:
      - port: 8080
        protocol: TCP
    healthCheck:
      path: /health
      port: 8080
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
    env:
      - name: PORT
        value: "8080"
      - name: LOG_LEVEL
        value: info
      - name: ENVIRONMENT
        value: production
      - name: OTEL_EXPORTER_OTLP_ENDPOINT
        value: http://otel-collector:4317
      - name: OTEL_SERVICE_NAME
        value: video-marketing
      - name: REDIS_URL
        valueFrom:
          secretKeyRef:
            name: videomarketing-secrets
            key: redis-url
      - name: DATABASE_URL
        valueFrom:
          secretKeyRef:
            name: videomarketing-secrets
            key: database-url
      - name: API_KEY
        valueFrom:
          secretKeyRef:
            name: videomarketing-secrets
            key: api-key
    labels:
      app: videomarketing
      tier: backend
      part-of: grc-claw
    annotations:
      prometheus.io/scrape: "true"
      prometheus.io/port: "8080"
      prometheus.io/path: /metrics
    strategy:
      type: RollingUpdate
      rollingUpdate:
        maxSurge: 1
        maxUnavailable: 0
    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values:
                      - videomarketing
              topologyKey: kubernetes.io/hostname

dev:
  videomarketing:
    image: okteto/dev:latest
    command: ["./dev-start.sh"]
    sync:
      - .:/app
    forward:
      - 8080:8080
    environment:
      - NODE_ENV=development
      - DEBUG=true
      - LOG_LEVEL=debug
    resources:
      requests:
        cpu: 250m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
    persistentVolume:
      enabled: true
      size: 1Gi
    secrets:
      - .env:/app/.env
    initContainer:
      image: busybox:1.36
      command: ["sh", "-c", "echo 'Initializing video-marketing dev environment...'"]
    timeout: 120s
    selector:
      app: videomarketing
    annotations:
      okteto.com/auto-ingress: "true"

# End of video-marketing Okteto configuration
