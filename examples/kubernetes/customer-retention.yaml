---
apiVersion: v1
kind: ConfigMap
metadata:
  name: customer-retention-config
  labels:
    app: customer-retention
    tier: backend
    part-of: grc-claw
data:
  LOG_LEVEL: "info"
  PORT: "8080"
  METRICS_PORT: "9090"
  HEALTH_CHECK_PATH: "/health"
  READINESS_CHECK_PATH: "/ready"
  ENVIRONMENT: "production"
  SERVICE_NAME: "customer-retention"
  DB_POOL_SIZE: "20"
  DB_POOL_TIMEOUT: "30s"
  CACHE_TTL: "300"
  MAX_RETRIES: "3"
  REQUEST_TIMEOUT: "30s"
  SHUTDOWN_GRACE_PERIOD: "15s"
---
apiVersion: v1
kind: Secret
metadata:
  name: customer-retention-secrets
  labels:
    app: customer-retention
    tier: backend
    part-of: grc-claw
type: Opaque
data:
  DB_PASSWORD: cGFzc3dvcmQxMjM=
  API_KEY: YWJjZGVmZ2hpamtsbW5vcHFyc3R1dnd4eXo=
  JWT_SECRET: c3VwZXJzZWNyZXRqd3RzZWNyZXQ=
  ENCRYPTION_KEY: ZW5jcnlwdGlvbmtleTEyMzQ1Njc4OTA=
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: customer-retention
  labels:
    app: customer-retention
    tier: backend
    part-of: grc-claw
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: customer-retention
  template:
    metadata:
      labels:
        app: customer-retention
        tier: backend
        part-of: grc-claw
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: customer-retention-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: customer-retention
          image: grc-claw/customer-retention:v1.0.0
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
          envFrom:
            - configMapRef:
                name: customer-retention-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: customer-retention-secrets
                  key: DB_PASSWORD
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: customer-retention-secrets
                  key: API_KEY
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: customer-retention-secrets
                  key: JWT_SECRET
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: customer-retention-secrets
                  key: ENCRYPTION_KEY
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 12
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: config-vol
              mountPath: /config
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: tmp
          emptyDir: {}
        - name: config-vol
          configMap:
            name: customer-retention-config
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - customer-retention
                topologyKey: topology.kubernetes.io/zone
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: customer-retention
---
apiVersion: v1
kind: Service
metadata:
  name: customer-retention
  labels:
    app: customer-retention
    tier: backend
    part-of: grc-claw
spec:
  type: ClusterIP
  selector:
    app: customer-retention
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
    - name: metrics
      port: 9090
      targetPort: metrics
      protocol: TCP
  sessionAffinity: None
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: customer-retention
  labels:
    app: customer-retention
    tier: backend
    part-of: grc-claw
  annotations:
    kubernetes.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - customer-retention.grc-claw.example.com
      secretName: customer-retention-tls
  rules:
    - host: customer-retention.grc-claw.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: customer-retention
                port:
                  number: 80
