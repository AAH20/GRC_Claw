apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: moderation-analytics
  namespace: moderation-analytics
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/rate-limit: "100"
spec:
  tls:
    - hosts:
        - moderation-analytics.example.com
      secretName: moderation-analytics-tls
  rules:
    - host: moderation-analytics.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: moderation-analytics
                port:
                  number: 80
