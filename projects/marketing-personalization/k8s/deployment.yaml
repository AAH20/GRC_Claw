apiVersion: apps/v1
kind: Deployment
metadata:
  name: marketing-personalization
  labels:
    app: marketing-personalization
    version: v1
spec:
  replicas: 3
  selector:
    matchLabels:
      app: marketing-personalization
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: marketing-personalization
        version: v1
    spec:
      containers:
        - name: app
          image: marketing-personalization:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              protocol: TCP
          env:
            - name: APP_ENV
              value: "production"
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: marketing-personalization-secrets
                  key: redis-url
            - name: SALESFORCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: marketing-personalization-secrets
                  key: salesforce-username
            - name: SALESFORCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: marketing-personalization-secrets
                  key: salesforce-password
            - name: HUBSPOT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: marketing-personalization-secrets
                  key: hubspot-api-key
            - name: MAILCHIMP_API_KEY
              valueFrom:
                secretKeyRef:
                  name: marketing-personalization-secrets
                  key: mailchimp-api-key
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      securityContext:
        fsGroup: 999
