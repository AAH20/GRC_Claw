apiVersion: v1
kind: Service
metadata:
  name: marketing-personalization
  labels:
    app: marketing-personalization
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8000
      protocol: TCP
      name: http
  selector:
    app: marketing-personalization
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: marketing-personalization
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/rate-limit: "100"
spec:
  tls:
    - hosts:
        - api.marketing.example.com
      secretName: marketing-personalization-tls
  rules:
    - host: api.marketing.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: marketing-personalization
                port:
                  number: 80
