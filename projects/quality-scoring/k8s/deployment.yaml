apiVersion: v1
kind: Namespace
metadata:
  name: quality-scoring
  labels:
    app: quality-scoring
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: quality-scoring-config
  namespace: quality-scoring
data:
  ENVIRONMENT: "production"
  LOG_LEVEL: "INFO"
  LLM_MODEL: "gpt-4o-mini"
  ENABLE_METRICS: "true"
  MIN_CONTENT_LENGTH: "50"
  MAX_CONTENT_LENGTH: "50000"
---
apiVersion: v1
kind: Secret
metadata:
  name: quality-scoring-secrets
  namespace: quality-scoring
type: Opaque
stringData:
  OPENAI_API_KEY: ""
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: quality-scoring-api
  namespace: quality-scoring
  labels:
    app: quality-scoring
    component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: quality-scoring
      component: api
  template:
    metadata:
      labels:
        app: quality-scoring
        component: api
    spec:
      containers:
        - name: api
          image: quality-scoring:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: quality-scoring-config
          env:
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: quality-scoring-secrets
                  key: OPENAI_API_KEY
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: quality-scoring-service
  namespace: quality-scoring
  labels:
    app: quality-scoring
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8000
      protocol: TCP
      name: http
  selector:
    app: quality-scoring
    component: api
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: quality-scoring-ingress
  namespace: quality-scoring
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/rate-limit: "100"
spec:
  tls:
    - hosts:
        - quality-scoring.example.com
      secretName: quality-scoring-tls
  rules:
    - host: quality-scoring.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: quality-scoring-service
                port:
                  number: 80
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: quality-scoring-hpa
  namespace: quality-scoring
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: quality-scoring-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: quality-scoring-pdb
  namespace: quality-scoring
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: quality-scoring
      component: api
