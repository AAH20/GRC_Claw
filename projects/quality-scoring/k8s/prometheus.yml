apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: quality-scoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      - job_name: quality-scoring
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names:
                - quality-scoring
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            regex: quality-scoring-service
            action: keep
          - source_labels: [__meta_kubernetes_endpoint_port_name]
            regex: http
            action: keep
          - target_label: __address__
            replacement: $(1):8000
