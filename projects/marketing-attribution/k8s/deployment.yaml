apiVersion: apps/v1
kind: Deployment
metadata:
  name: marketing-attribution
  labels:
    app: marketing-attribution
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: marketing-attribution
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: marketing-attribution
        version: v1
    spec:
      containers:
        - name: attribution-api
          image: marketing-attribution:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              protocol: TCP
          env:
            - name: LOG_LEVEL
              value: "info"
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: attribution-secrets
                  key: redis-url
            - name: GOOGLE_ADS_DEVELOPER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: attribution-secrets
                  key: google-ads-developer-token
            - name: META_ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: attribution-secrets
                  key: meta-access-token
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - marketing-attribution
                topologyKey: kubernetes.io/hostname
