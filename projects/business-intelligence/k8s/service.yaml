apiVersion: v1
kind: Service
metadata:
  name: business-intelligence
  labels:
    app: business-intelligence
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8000
      protocol: TCP
  selector:
    app: business-intelligence
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: business-intelligence
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
    - hosts:
        - bi.example.com
      secretName: bi-tls
  rules:
    - host: bi.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: business-intelligence
                port:
                  number: 80
