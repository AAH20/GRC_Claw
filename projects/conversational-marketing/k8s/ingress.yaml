apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: conversational-marketing
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/rate-limit: "100"
spec:
  tls:
    - hosts:
        - conversational-marketing.example.com
      secretName: conversational-marketing-tls
  rules:
    - host: conversational-marketing.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: conversational-marketing
                port:
                  number: 80
