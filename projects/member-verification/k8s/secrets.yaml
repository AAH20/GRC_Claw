# Kubernetes Secrets Template
# NOTE: Replace placeholder values with actual secrets before applying
# Use: kubectl apply -f k8s/secrets.yaml --namespace=member-verification
apiVersion: v1
kind: Secret
metadata:
  name: member-verification-secrets
  namespace: member-verification
type: Opaque
stringData:
  redis-url: "redis://redis:6379/0"
  openai-api-key: "sk-replace-with-actual-key"
  langchain-api-key: "langchain-replace-with-actual-key"
  secret-key: "replace-with-secure-random-secret"
  database-url: "postgresql://user:password@postgres:5432/member_verification"
