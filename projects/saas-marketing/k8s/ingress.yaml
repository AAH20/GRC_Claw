apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: saas-marketing
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/rate-limit: '100'
spec:
  tls:
  - hosts:
    - api.saas-marketing.example.com
    secretName: saas-marketing-tls
  rules:
  - host: api.saas-marketing.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: saas-marketing
            port:
              number: 80
