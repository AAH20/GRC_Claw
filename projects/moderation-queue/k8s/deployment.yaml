# Kubernetes Deployment for Moderation Queue API
apiVersion: apps/v1
kind: Deployment
metadata:
  name: moderation-queue-api
  namespace: moderation-queue
  labels:
    app: moderation-queue
    component: api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: moderation-queue
      component: api
  template:
    metadata:
      labels:
        app: moderation-queue
        component: api
    spec:
      containers:
      - name: api
        image: moderation-queue:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
          name: http
        env:
        - name: ENVIRONMENT
          value: "production"
        - name: LOG_LEVEL
          value: "INFO"
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: moderation-queue-secrets
              key: redis-url
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: moderation-queue-secrets
              key: database-url
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: moderation-queue-secrets
              key: openai-api-key
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
        securityContext:
          runAsNonRoot: true
          runAsUser: 999
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
