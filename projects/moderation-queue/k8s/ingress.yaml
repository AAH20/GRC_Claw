# Kubernetes Ingress for Moderation Queue API
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: moderation-queue-ingress
  namespace: moderation-queue
  annotations:
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
spec:
  ingressClassName: nginx
  rules:
  - host: moderation-queue.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: moderation-queue-service
            port:
              number: 80
