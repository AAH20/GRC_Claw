# Kubernetes Secret Template for Moderation Queue
# NOTE: Replace placeholder values with actual secrets before applying
apiVersion: v1
kind: Secret
metadata:
  name: moderation-queue-secrets
  namespace: moderation-queue
type: Opaque
stringData:
  redis-url: "redis://redis:6379/0"
  database-url: "postgresql+asyncpg://user:pass@db:5432/moderation_queue"
  openai-api-key: "your-openai-api-key-here"
