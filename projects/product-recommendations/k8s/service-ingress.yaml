apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: product-recommendations
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/rate-limit: "100"
spec:
  tls:
    - hosts:
        - api.product-recommendations.example.com
      secretName: product-recommendations-tls
  rules:
    - host: api.product-recommendations.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: product-recommendations
                port:
                  number: 80
