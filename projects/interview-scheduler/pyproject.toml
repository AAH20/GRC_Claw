[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "interview-scheduler"
version = "0.1.0"
description = "AI-powered interview scheduling with calendar integration, timezone handling, and conflict resolution"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Ahmed Hassan", email = "ahmed@example.com" },
]
keywords = ["interview", "scheduling", "fastapi", "langchain", "agents"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-deepagents>=0.1.0",
    "langchain-openai>=0.2.0",
    "httpx>=0.27.0",
    "python-dateutil>=2.9.0",
    "pytz>=2024.1",
    "tenacity>=8.3.0",
    "structlog>=24.1.0",
    "prometheus-client>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "respx>=0.21.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "types-pytz>=2024.1.0",
]
google = [
    "google-api-python-client>=2.130.0",
    "google-auth>=2.29.0",
    "google-auth-oauthlib>=1.2.0",
]
outlook = [
    "msal>=1.28.0",
    "requests>=2.31.0",
]

[project.scripts]
interview-scheduler = "interview_scheduler.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src/interview_scheduler"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "A", "C4", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src/interview_scheduler"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 80
