name: Dependabot

on:
  schedule:
    - cron: "0 8 * * *" # Daily at 8 AM UTC
  workflow_dispatch:
    inputs:
      ecosystem:
        description: "Ecosystem to check"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - pip
          - npm
          - github-actions
          - docker

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Python Dependencies ──────────────────────────────────────────────────
  pip-updates:
    name: Python Dependencies
    runs-on: ubuntu-latest
    if: github.event.inputs.ecosystem == 'all' || github.event.inputs.ecosystem == 'pip' || github.event_name == 'schedule'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Check for outdated packages
        id: outdated
        run: |
          pip list --outdated --format=json > outdated.json || true
          echo "count=$(cat outdated.json | python -c 'import sys,json; print(len(json.load(sys.stdin)))')" >> $GITHUB_OUTPUT

      - name: Create update PR
        if: steps.outdated.outputs.count > 0
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(deps): update Python dependencies"
          title: "chore(deps): update Python dependencies"
          body: |
            ## Dependency Updates

            This PR updates outdated Python dependencies.

            <details>
            <summary>Outdated packages (${{ steps.outdated.outputs.count }})</summary>

            ```json
            ${{ steps.outdated.outputs.count > 0 && fromJSON(steps.outdated.outputs.count) || '[]' }}
            ```

            </details>

            🤖 Auto-generated by Dependabot workflow
          branch: deps/pip-updates
          delete-branch: true
          labels: |
            dependencies
            python

  # ─── Node Dependencies ────────────────────────────────────────────────────
  npm-updates:
    name: Node Dependencies
    runs-on: ubuntu-latest
    if: github.event.inputs.ecosystem == 'all' || github.event.inputs.ecosystem == 'npm' || github.event_name == 'schedule'
    defaults:
      run:
        working-directory: frontend
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check for outdated packages
        id: outdated
        run: |
          npm outdated --json > outdated.json || true
          echo "count=$(cat outdated.json | python -c 'import sys,json; print(len(json.load(sys.stdin)))')" >> $GITHUB_OUTPUT

      - name: Update dependencies
        if: steps.outdated.outputs.count > 0
        run: |
          npm update
          npm audit fix || true

      - name: Create update PR
        if: steps.outdated.outputs.count > 0
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(deps): update Node dependencies"
          title: "chore(deps): update Node dependencies"
          body: |
            ## Dependency Updates

            This PR updates outdated Node.js dependencies.

            **Outdated packages:** ${{ steps.outdated.outputs.count }}

            🤖 Auto-generated by Dependabot workflow
          branch: deps/npm-updates
          delete-branch: true
          labels: |
            dependencies
            javascript

  # ─── GitHub Actions Updates ───────────────────────────────────────────────
  github-actions-updates:
    name: GitHub Actions Updates
    runs-on: ubuntu-latest
    if: github.event.inputs.ecosystem == 'all' || github.event.inputs.ecosystem == 'github-actions' || github.event_name == 'schedule'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Check for action updates
        uses: actions/github-script@v7
        id: check
        with:
          script: |
            const workflows = await github.rest.actions.listRepoWorkflows({
              owner: context.repo.owner,
              repo: context.repo.repo,
            });

            const updates = [];
            for (const workflow of workflows.data.workflows) {
              const content = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path: workflow.path,
              });

              const decoded = Buffer.from(content.data.content, 'base64').toString();
              const actionRefs = decoded.match(/uses:\s*([\w\-]+\/[\w\-]+)@([\w\.\-]+)/g) || [];

              for (const ref of actionRefs) {
                const match = ref.match(/uses:\s*([\w\-]+\/[\w\-]+)@([\w\.\-]+)/);
                if (match) {
                  updates.push({ action: match[1], current: match[2] });
                }
              }
            }

            core.setOutput('count', updates.length);
            core.setOutput('updates', JSON.stringify(updates));

      - name: Create update PR
        if: steps.check.outputs.count > 0
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(deps): update GitHub Actions"
          title: "chore(deps): update GitHub Actions"
          body: |
            ## GitHub Actions Updates

            This PR updates GitHub Actions to their latest versions.

            **Actions to review:** ${{ steps.check.outputs.count }}

            🤖 Auto-generated by Dependabot workflow
          branch: deps/github-actions-updates
          delete-branch: true
          labels: |
            dependencies
            github-actions

  # ─── Docker Base Image Updates ────────────────────────────────────────────
  docker-updates:
    name: Docker Base Image Updates
    runs-on: ubuntu-latest
    if: github.event.inputs.ecosystem == 'all' || github.event.inputs.ecosystem == 'docker' || github.event_name == 'schedule'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Check Dockerfile
        id: check
        run: |
          if [ -f Dockerfile ]; then
            echo "found=true" >> $GITHUB_OUTPUT
            grep '^FROM' Dockerfile
          else
            echo "found=false" >> $GITHUB_OUTPUT
          fi

      - name: Update base image
        if: steps.check.outputs.found == 'true'
        run: |
          # Update python:3.12-slim to latest patch
          sed -i 's|FROM python:3.12-slim|FROM python:3.12-slim|' Dockerfile
          echo "Base image check complete"

      - name: Create update PR
        if: steps.check.outputs.found == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(deps): update Docker base image"
          title: "chore(deps): update Docker base image"
          body: |
            ## Docker Base Image Update

            This PR updates the Docker base image to the latest patch version.

            🤖 Auto-generated by Dependabot workflow
          branch: deps/docker-updates
          delete-branch: true
          labels: |
            dependencies
            docker
