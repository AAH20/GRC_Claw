# Fluentd Configuration for Recruitment Platform
# Centralized logging configuration

# Source: Docker container logs
<source>
  @type forward
  port 24224
  bind 0.0.0.0
</source>

# Source: Application log files
<source>
  @type tail
  path /var/log/recruitment-platform/*.log
  pos_file /var/log/fluentd/recruitment-platform.pos
  tag recruitment.platform
  format json
  time_key timestamp
  time_format %Y-%m-%dT%H:%M:%S.%NZ
  read_from_head true
</source>

# Filter: Parse and enrich recruitment platform logs
<filter recruitment.platform>
  @type parser
  key_name log
  reserve_data true
  remove_key_name_field true
  <parse>
    @type json
    time_key timestamp
    time_format %Y-%m-%dT%H:%M:%S.%NZ
  </parse>
</filter>

# Filter: Add environment metadata
<filter recruitment.platform>
  @type record_transformer
  enable_ruby true
  <record>
    environment production
    service recruitment-platform
    hostname ${hostname}
    fluentd_worker ${worker_id}
  </record>
</filter>

# Filter: Route error logs
<filter recruitment.platform>
  @type grep
  <regexp>
    key level
    pattern /ERROR|CRITICAL|FATAL/
  </regexp>
</filter>

# Output: Elasticsearch for long-term storage
<match recruitment.platform>
  @type elasticsearch
  host elasticsearch
  port 9200
  logstash_format true
  logstash_prefix recruitment-platform
  logstash_dateformat %Y.%m.%d
  include_tag_key true
  tag_key @log_name
  flush_interval 10s
  retry_limit 20
  retry_wait 10
  num_threads 4
  buffer_type file
  buffer_path /var/log/fluentd/buffer/elasticsearch
  buffer_chunk_limit 8m
  buffer_queue_limit 32
  flush_thread_count 4
  slow_flush_log_threshold 30.0
</match>

# Output: S3 for archival (error logs only)
<match recruitment.platform>
  @type s3
  aws_key_id ENV['AWS_ACCESS_KEY_ID']
  aws_sec_key ENV['AWS_SECRET_ACCESS_KEY']
  s3_bucket recruitment-platform-logs
  s3_region us-east-1
  path logs/%Y/%m/%d/
  time_slice_format %H%M
  time_slice_wait 10m
  utc true
  buffer_path /var/log/fluentd/buffer/s3
  buffer_chunk_limit 256m
  buffer_queue_limit 32
  flush_interval 10m
  slow_flush_log_threshold 30.0
</match>

# Output: Stdout for debugging (development only)
<match recruitment.platform>
  @type stdout
  <format>
    @type json
  </format>
</match>
