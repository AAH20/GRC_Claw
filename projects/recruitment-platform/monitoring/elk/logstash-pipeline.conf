input {
  beats {
    port => 5044
    type => "app-logs"
  }
  tcp {
    port => 514
    type => "syslog"
    codec => json
  }
}

filter {
  if [type] == "app-logs" {
    grok {
      match => {
        "message" => "%{TIMESTAMP_ISO8601:timestamp} %{LOGLEVEL:level} \[%{DATA:service}\] %{GREEDYDATA:msg}"
      }
    }
    date {
      match => ["timestamp", "ISO8601"]
      target => "@timestamp"
    }
    mutate {
      add_field => {
        "environment" => "${ENV:production}"
        "platform" => "recruitment"
      }
    }
  }
  if [level] == "ERROR" or [level] == "FATAL" {
    mutate {
      add_tag => ["alert", "error"]
    }
  }
}

output {
  elasticsearch {
    hosts => ["${ES_HOST:localhost:9200}"]
    index => "recruitment-logs-%{+YYYY.MM.dd}"
    template => "/etc/logstash/templates/recruitment-template.json"
    template_name => "recruitment-logs"
  }
  if "alert" in [tags] {
    http {
      url => "${ALERT_WEBHOOK}"
      http_method => "post"
      content_type => "application/json"
      format => "json"
    }
  }
}
