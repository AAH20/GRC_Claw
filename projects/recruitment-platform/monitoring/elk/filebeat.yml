filebeat.inputs:
  - type: log
    enabled: true
    paths:
      - /var/log/recruitment-platform/*.log
    fields:
      service: recruitment-platform
      environment: production
    fields_under_root: true
    multiline.pattern: '^\d{4}-\d{2}-\d{2}'
    multiline.negate: true
    multiline.match: after

  - type: log
    enabled: true
    paths:
      - /var/log/recruitment-platform/audit/*.log
    fields:
      service: recruitment-audit
      log_type: audit
    fields_under_root: true

output.logstash:
  hosts: ["logstash:5044"]
  loadbalance: true
  compression_level: 3

logging.level: info
logging.to_files: true
logging.files:
  path: /var/log/filebeat
  name: filebeat
  keepfiles: 7
