groups:
  - name: recruitment-platform-alerts
    rules:
      # High error rate alert
      - alert: HighErrorRate
        expr: rate(http_requests_total{job="recruitment-api",status=~"5.."}[5m]) / rate(http_requests_total{job="recruitment-api"}[5m]) > 0.05
        for: 5m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "High error rate on recruitment API"
          description: "Error rate is {{ $value | humanizePercentage }} for the last 5 minutes."

      # High response time alert
      - alert: HighResponseTime
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket{job="recruitment-api"}[5m])) > 2
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "High response time on recruitment API"
          description: "p95 response time is {{ $value }}s for the last 5 minutes."

      # Service down alert
      - alert: ServiceDown
        expr: up{job="recruitment-api"} == 0
        for: 1m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "Recruitment API is down"
          description: "The recruitment API has been down for more than 1 minute."

      # High memory usage alert
      - alert: HighMemoryUsage
        expr: process_resident_memory_bytes{job="recruitment-api"} > 500000000
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "High memory usage on recruitment API"
          description: "Memory usage is {{ $value | humanize }} for the last 5 minutes."

      # High CPU usage alert
      - alert: HighCPUUsage
        expr: 100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "High CPU usage"
          description: "CPU usage is above 80% for the last 5 minutes."

      # Database connection alert
      - alert: DatabaseConnectionsHigh
        expr: pg_stat_activity_count{datname="recruitment"} > 80
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "High database connections"
          description: "Database connections are above 80 for the last 5 minutes."

      # Celery worker down alert
      - alert: CeleryWorkerDown
        expr: up{job="recruitment-worker"} == 0
        for: 1m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "Celery worker is down"
          description: "The Celery worker has been down for more than 1 minute."

      # Celery task backlog alert
      - alert: CeleryTaskBacklog
        expr: celery_tasks_total{state="PENDING"} > 100
        for: 10m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Celery task backlog"
          description: "More than 100 tasks are pending in the Celery queue."

      # Disk space alert
      - alert: DiskSpaceLow
        expr: (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"}) < 0.1
        for: 5m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "Low disk space"
          description: "Disk space is below 10% on {{ $labels.instance }}."

      # Redis connection alert
      - alert: RedisDown
        expr: up{job="redis-exporter"} == 0
        for: 1m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "Redis is down"
          description: "Redis has been down for more than 1 minute."
