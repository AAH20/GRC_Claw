apiVersion: apps/v1
kind: Deployment
metadata:
  name: email-marketing
  labels:
    app: email-marketing
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: email-marketing
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: email-marketing
        version: v1
    spec:
      containers:
        - name: email-marketing
          image: ghcr.io/grc-marketing/email-marketing:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: em-config
            - secretRef:
                name: em-secrets
          env:
            - name: LOG_LEVEL
              value: "info"
            - name: WORKERS
              value: "4"
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - email-marketing
                topologyKey: kubernetes.io/hostname
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: em-config
data:
  APP_ENV: "production"
  LOG_LEVEL: "INFO"
---
apiVersion: v1
kind: Secret
metadata:
  name: em-secrets
type: Opaque
stringData:
  SENDGRID_API_KEY: ""
  MAILCHIMP_API_KEY: ""
  KLAVIYO_API_KEY: ""
  OPENAI_API_KEY: ""
