apiVersion: v1
kind: Service
metadata:
  name: email-marketing
  labels:
    app: email-marketing
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8000
      protocol: TCP
      name: http
  selector:
    app: email-marketing
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: email-marketing
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/rate-limit: "100"
spec:
  tls:
    - hosts:
        - email-marketing.grc-marketing.com
      secretName: email-marketing-tls
  rules:
    - host: email-marketing.grc-marketing.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: email-marketing
                port:
                  number: 80
