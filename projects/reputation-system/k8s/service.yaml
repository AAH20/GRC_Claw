apiVersion: v1
kind: Service
metadata:
  name: reputation-system
  namespace: reputation-system
  labels:
    app: reputation-system
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8000
      protocol: TCP
      name: http
  selector:
    app: reputation-system
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: reputation-system
  namespace: reputation-system
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
spec:
  tls:
    - hosts:
        - reputation.example.com
      secretName: reputation-system-tls
  rules:
    - host: reputation.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: reputation-system
                port:
                  number: 80
