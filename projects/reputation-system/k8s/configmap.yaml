apiVersion: v1
kind: ConfigMap
metadata:
  name: reputation-system-config
  namespace: reputation-system
data:
  APP_ENV: "production"
  LOG_LEVEL: "info"
  LOG_FORMAT: "json"
  DATABASE_URL: "postgresql+asyncpg://reputation:reputation@postgres:5432/reputation"
  REDIS_URL: "redis://redis:6379/0"
  CORS_ORIGINS: '["https://reputation.example.com"]'
  RATE_LIMIT_REQUESTS: "100"
  RATE_LIMIT_WINDOW: "60"
  AGENT_TIMEOUT_SECONDS: "30"
  MAX_REPUTATION_SCORE: "1000"
  MIN_REPUTATION_SCORE: "0"
  DEFAULT_TRUST_TIER: "bronze"
  HISTORY_RETENTION_DAYS: "365"
  BADGE_AUTO_ASSIGN: "true"
  EXPLANATION_ENABLED: "true"
---
apiVersion: v1
kind: Secret
metadata:
  name: reputation-system-secrets
  namespace: reputation-system
type: Opaque
stringData:
  OPENAI_API_KEY: ""
  DATABASE_PASSWORD: "reputation"
  REDIS_PASSWORD: ""
  JWT_SECRET: "change-me-in-production"
