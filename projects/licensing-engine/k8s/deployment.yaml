apiVersion: apps/v1
kind: Deployment
metadata:
  name: licensing-engine
  labels:
    app: licensing-engine
    version: v1
spec:
  replicas: 3
  selector:
    matchLabels:
      app: licensing-engine
  template:
    metadata:
      labels:
        app: licensing-engine
        version: v1
    spec:
      containers:
        - name: licensing-engine
          image: licensing-engine:latest
          ports:
            - containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: licensing-engine-config
          env:
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: licensing-engine-secrets
                  key: openai-api-key
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
