apiVersion: v1
kind: Service
metadata:
  name: licensing-engine
  labels:
    app: licensing-engine
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8000
      protocol: TCP
      name: http
  selector:
    app: licensing-engine
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: licensing-engine
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/rate-limit: "100"
spec:
  tls:
    - hosts:
        - licensing-engine.example.com
      secretName: licensing-engine-tls
  rules:
    - host: licensing-engine.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: licensing-engine
                port:
                  number: 80
