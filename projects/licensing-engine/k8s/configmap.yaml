apiVersion: v1
kind: ConfigMap
metadata:
  name: licensing-engine-config
data:
  APP_ENV: "production"
  LOG_LEVEL: "INFO"
  DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/licensing"
  REDIS_URL: "redis://redis:6379/0"
  MAX_AGENTS: "10"
  AGENT_TIMEOUT_SECONDS: "300"
  ENABLE_TELEMETRY: "true"
