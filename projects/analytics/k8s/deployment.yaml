apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-attribution
  labels:
    app: analytics-attribution
    version: v1
spec:
  replicas: 3
  selector:
    matchLabels:
      app: analytics-attribution
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: analytics-attribution
        version: v1
    spec:
      containers:
        - name: analytics
          image: analytics-attribution:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              protocol: TCP
          env:
            - name: LOG_LEVEL
              value: "INFO"
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: analytics-secrets
                  key: redis-url
                  optional: true
            - name: GA_CREDENTIALS_PATH
              value: "/etc/analytics/ga-credentials.json"
            - name: MIXPANEL_API_SECRET
              valueFrom:
                secretKeyRef:
                  name: analytics-secrets
                  key: mixpanel-api-secret
                  optional: true
            - name: AMPLITUDE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: analytics-secrets
                  key: amplitude-api-key
                  optional: true
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: ga-credentials
              mountPath: /etc/analytics
              readOnly: true
      volumes:
        - name: ga-credentials
          secret:
            secretName: analytics-ga-credentials
            optional: true
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - analytics-attribution
                topologyKey: kubernetes.io/hostname
