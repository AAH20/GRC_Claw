apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rights-management
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
    - host: rights-management.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: rights-management
                port:
                  number: 80
