apiVersion: apps/v1
kind: Deployment
metadata:
  name: rights-management
  labels:
    app: rights-management
spec:
  replicas: 2
  selector:
    matchLabels:
      app: rights-management
  template:
    metadata:
      labels:
        app: rights-management
    spec:
      containers:
        - name: rights-management
          image: rights-management:latest
          ports:
            - containerPort: 8000
          env:
            - name: RIGHTS_DEBUG
              value: "false"
            - name: RIGHTS_LOG_LEVEL
              value: "INFO"
            - name: RIGHTS_LLM_MODEL
              value: "gpt-4o-mini"
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
