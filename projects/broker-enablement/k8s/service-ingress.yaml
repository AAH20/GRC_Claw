apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: broker-enablement
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/rate-limit: "100"
spec:
  tls:
    - hosts:
        - api.broker-enablement.example.com
      secretName: broker-enablement-tls
  rules:
    - host: api.broker-enablement.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: broker-enablement
                port:
                  number: 80
