apiVersion: apps/v1
kind: Deployment
metadata:
  name: influencer-marketing
  labels:
    app: influencer-marketing
    version: v1
spec:
  replicas: 3
  selector:
    matchLabels:
      app: influencer-marketing
  template:
    metadata:
      labels:
        app: influencer-marketing
        version: v1
    spec:
      containers:
        - name: app
          image: ghcr.io/your-org/influencer-marketing:latest
          ports:
            - containerPort: 8000
              protocol: TCP
          env:
            - name: ENVIRONMENT
              value: "production"
            - name: LOG_LEVEL
              value: "info"
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: influencer-marketing-secrets
                  key: secret-key
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: influencer-marketing-secrets
                  key: openai-api-key
            - name: INSTAGRAM_ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: influencer-marketing-secrets
                  key: instagram-access-token
            - name: TIKTOK_ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: influencer-marketing-secrets
                  key: tiktok-access-token
            - name: YOUTUBE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: influencer-marketing-secrets
                  key: youtube-api-key
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "2Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      securityContext:
        fsGroup: 1000
