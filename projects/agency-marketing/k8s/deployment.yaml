apiVersion: apps/v1
kind: Deployment
metadata:
  name: agency-marketing
  namespace: default
  labels:
    app: agency-marketing
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: agency-marketing
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: agency-marketing
        version: v1
    spec:
      containers:
        - name: agency-marketing
          image: ghcr.io/grc-claw/agency-marketing:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              protocol: TCP
          env:
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: agency-marketing-secrets
                  key: openai-api-key
                  optional: true
            - name: LANGCHAIN_API_KEY
              valueFrom:
                secretKeyRef:
                  name: agency-marketing-secrets
                  key: langchain-api-key
                  optional: true
            - name: SALESFORCE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: agency-marketing-secrets
                  key: salesforce-client-id
                  optional: true
            - name: SALESFORCE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: agency-marketing-secrets
                  key: salesforce-client-secret
                  optional: true
            - name: HUBSPOT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: agency-marketing-secrets
                  key: hubspot-api-key
                  optional: true
            - name: GOHIGHLEVEL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: agency-marketing-secrets
                  key: gohighlevel-api-key
                  optional: true
            - name: LOG_LEVEL
              value: "INFO"
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      securityContext:
        fsGroup: 999
