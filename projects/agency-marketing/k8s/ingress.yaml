apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: agency-marketing-ingress
  namespace: default
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/rate-limit: '100'
    nginx.ingress.kubernetes.io/rate-limit-window: 1m
spec:
  tls:
  - hosts:
    - api.agency-marketing.example.com
    secretName: agency-marketing-tls
  rules:
  - host: api.agency-marketing.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: agency-marketing-service
            port:
              number: 80
