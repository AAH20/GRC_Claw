# Agency Marketing Configuration
# This file contains default configuration values.
# Environment variables take precedence over these settings.

app:
  name: "Agency Marketing"
  version: "0.1.0"
  description: "Standalone modularized agentic AI marketing platform"
  debug: false
  log_level: "INFO"

server:
  host: "0.0.0.0"
  port: 8000
  workers: 4
  reload: false

agents:
  research:
    enabled: true
    model: "gpt-4"
    max_tokens: 4096
    temperature: 0.7
    timeout_seconds: 120
    retry_attempts: 3

  strategy:
    enabled: true
    model: "gpt-4"
    max_tokens: 4096
    temperature: 0.5
    timeout_seconds: 120
    retry_attempts: 3

  creative:
    enabled: true
    model: "gpt-4"
    max_tokens: 4096
    temperature: 0.8
    timeout_seconds: 120
    retry_attempts: 3

  launch:
    enabled: true
    model: "gpt-4"
    max_tokens: 4096
    temperature: 0.3
    timeout_seconds: 120
    retry_attempts: 3

  optimization:
    enabled: true
    model: "gpt-4"
    max_tokens: 4096
    temperature: 0.4
    timeout_seconds: 120
    retry_attempts: 3

integrations:
  salesforce:
    enabled: false
    api_version: "v58.0"
    sandbox: false
    timeout_seconds: 30
    rate_limit_per_second: 25

  hubspot:
    enabled: false
    api_version: "v3"
    timeout_seconds: 30
    rate_limit_per_second: 100

  gohighlevel:
    enabled: false
    api_version: "v1"
    timeout_seconds: 30
    rate_limit_per_second: 50

database:
  # PostgreSQL connection (optional - uses in-memory storage if not configured)
  url: "postgresql://agency:agency_secret@localhost:5432/agency_marketing"
  pool_size: 10
  max_overflow: 20
  pool_timeout: 30

redis:
  # Redis connection for caching and task queues
  url: "redis://localhost:6379/0"
  ttl_seconds: 3600

langchain:
  tracing_v2: false
  project_name: "agency-marketing"
  callbacks: []

security:
  api_key_header: "X-API-Key"
  rate_limit_requests: 100
  rate_limit_window_seconds: 60
  allowed_hosts:
    - "*"
