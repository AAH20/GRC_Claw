[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bias-detector"
version = "0.1.0"
description = "AI-powered bias detection for hiring decisions using agentic AI"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Ahmed Hassan", email = "ahmed@example.com" },
]
keywords = ["bias-detection", "fairness", "hiring", "ai", "grc"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "deepagents>=0.1.0",
    "langchain-openai>=0.2.0",
    "httpx>=0.27.0",
    "structlog>=24.1.0",
    "prometheus-client>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[project.scripts]
bias-detector = "bias_detector.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bias_detector"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["src/bias_detector/tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
