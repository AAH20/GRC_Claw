apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bias-detector
  namespace: bias-detector
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
spec:
  tls:
    - hosts:
        - bias-detector.example.com
      secretName: bias-detector-tls
  rules:
    - host: bias-detector.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: bias-detector
                port:
                  number: 80
