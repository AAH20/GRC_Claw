apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: recruitment-analytics

resources:
  - ../../base

patchesStrategicMerge:
  - deployment-patch.yaml

configMapGenerator:
  - name: recruitment-analytics-config
    behavior: merge
    literals:
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO

replicas:
  - name: recruitment-analytics
    count: 3
