apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: recruitment-analytics-dev

resources:
  - ../../base

configMapGenerator:
  - name: recruitment-analytics-config
    behavior: merge
    literals:
      - ENVIRONMENT=development
      - LOG_LEVEL=DEBUG

replicas:
  - name: recruitment-analytics
    count: 1
