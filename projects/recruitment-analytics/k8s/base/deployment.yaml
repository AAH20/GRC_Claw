apiVersion: apps/v1
kind: Deployment
metadata:
  name: recruitment-analytics
  labels:
    app: recruitment-analytics
spec:
  replicas: 2
  selector:
    matchLabels:
      app: recruitment-analytics
  template:
    metadata:
      labels:
        app: recruitment-analytics
    spec:
      containers:
        - name: api
          image: recruitment-analytics:latest
          ports:
            - containerPort: 8000
              protocol: TCP
          env:
            - name: ENVIRONMENT
              value: "production"
            - name: LOG_LEVEL
              value: "INFO"
            - name: PORT
              value: "8000"
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: recruitment-analytics-secrets
                  key: openai-api-key
            - name: ATS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: recruitment-analytics-secrets
                  key: ats-api-key
            - name: HRMS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: recruitment-analytics-secrets
                  key: hrms-api-key
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: recruitment-analytics-secrets
                  key: secret-key
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /api/v1/live
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/v1/ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
