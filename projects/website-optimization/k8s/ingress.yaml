apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: website-optimization
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
    - hosts:
        - website-optimization.example.com
      secretName: website-optimization-tls
  rules:
    - host: website-optimization.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: website-optimization
                port:
                  number: 80
