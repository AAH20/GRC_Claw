apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: moderation-api-ingress
  namespace: content-moderation
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/rate-limit: "100"
spec:
  tls:
    - hosts:
        - moderation.example.com
      secretName: moderation-tls
  rules:
    - host: moderation.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: moderation-api
                port:
                  number: 80
