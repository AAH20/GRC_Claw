[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "abm"
version = "0.1.0"
description = "Account-Based Marketing AI Agent Platform"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    {name = "Ahmed Hassan", email = "ahmed@example.com"}
]
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "httpx>=0.25.0",
    "PyYAML>=6.0",
    "structlog>=23.2.0",
    "tenacity>=8.2.0",
    "langchain-core>=0.1.0",
    "langchain-community>=0.0.10",
    "deepagents>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.25.0",
    "respx>=0.20.0",
    "mypy>=1.7.0",
    "ruff>=0.1.6",
]

[project.scripts]
abm-server = "abm.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.ruff]
line-length = 100
target-version = "py310"
