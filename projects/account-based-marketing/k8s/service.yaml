apiVersion: v1
kind: Service
metadata:
  name: abm-api-service
  labels:
    app: abm-api
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8000
      protocol: TCP
  selector:
    app: abm-api
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: abm-api-ingress
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
    - hosts:
        - abm.example.com
      secretName: abm-tls
  rules:
    - host: abm.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: abm-api-service
                port:
                  number: 80
