apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: creator-monetization
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
    - hosts:
        - creator-monetization.example.com
      secretName: creator-monetization-tls
  rules:
    - host: creator-monetization.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: creator-monetization
                port:
                  number: 80