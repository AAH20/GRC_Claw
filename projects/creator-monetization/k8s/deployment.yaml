apiVersion: apps/v1
kind: Deployment
metadata:
  name: creator-monetization
  labels:
    app: creator-monetization
spec:
  replicas: 3
  selector:
    matchLabels:
      app: creator-monetization
  template:
    metadata:
      labels:
        app: creator-monetization
    spec:
      containers:
        - name: creator-monetization
          image: creator-monetization:latest
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: creator-monetization-secrets
                  key: database-url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: creator-monetization-secrets
                  key: redis-url
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: creator-monetization-secrets
                  key: openai-api-key
                  optional: true
            - name: SENTRY_DSN
              valueFrom:
                secretKeyRef:
                  name: creator-monetization-secrets
                  key: sentry-dsn
                  optional: true
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false