apiVersion: apps/v1
kind: Deployment
metadata:
  name: sales-automator
  labels:
    app: sales-automator
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sales-automator
  template:
    metadata:
      labels:
        app: sales-automator
    spec:
      containers:
        - name: sales-automator
          image: ghcr.io/ahmedhassan/sales-automator:latest
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: sales-automator-secrets
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
