apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sales-automator
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
    - hosts:
        - sales-automator.example.com
      secretName: sales-automator-tls
  rules:
    - host: sales-automator.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sales-automator
                port:
                  number: 80
