apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: affiliate-marketing
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
    - hosts:
        - affiliate-marketing.example.com
      secretName: affiliate-marketing-tls
  rules:
    - host: affiliate-marketing.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: affiliate-marketing
                port:
                  number: 80
