apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: candidate-matcher-ingress
  namespace: candidate-matcher
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
spec:
  tls:
    - hosts:
        - candidate-matcher.example.com
      secretName: candidate-matcher-tls
  rules:
    - host: candidate-matcher.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: candidate-matcher-service
                port:
                  number: 80
