apiVersion: v1
kind: ConfigMap
metadata:
  name: candidate-matcher-config
  namespace: candidate-matcher
data:
  CANDIDATE_MATCHER_DEBUG: "false"
  CANDIDATE_MATCHER_ENVIRONMENT: "production"
  CANDIDATE_MATCHER_LOG_LEVEL: "INFO"
  CANDIDATE_MATCHER_LLM_PROVIDER: "openai"
  CANDIDATE_MATCHER_LLM_MODEL: "gpt-4o-mini"
  CANDIDATE_MATCHER_EMBEDDING_MODEL: "text-embedding-3-small"
  CANDIDATE_MATCHER_SEMANTIC_SIMILARITY_THRESHOLD: "0.7"
  CANDIDATE_MATCHER_SKILLS_GAP_THRESHOLD: "0.5"
  CANDIDATE_MATCHER_BIAS_PENALTY_FACTOR: "0.15"
  CANDIDATE_MATCHER_MAX_CANDIDATES_PER_REQUEST: "100"
  CANDIDATE_MATCHER_DEFAULT_TOP_K: "10"
  CANDIDATE_MATCHER_CACHE_TTL_SECONDS: "3600"
  CANDIDATE_MATCHER_ENABLE_METRICS: "true"
  CANDIDATE_MATCHER_ENABLE_TRACING: "false"
