# Default values for ugc-marketplace.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# -- Number of replicas for the deployment
replicaCount: 3

# -- Image configuration
image:
  repository: ugc-marketplace
  pullPolicy: IfNotPresent
  # -- Overrides the image tag whose default is the chart appVersion
  tag: "latest"

# -- Image pull secrets for private registries
imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# -- Service account configuration
serviceAccount:
  # -- Specifies whether a service account should be created
  create: true
  # -- Annotations to add to the service account
  annotations: {}
  # -- The name of the service account to use. If not set and create is true, a name is generated using the fullname template
  name: ""

# -- Pod annotations
podAnnotations: {}

# -- Pod security context
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

# -- Container security context
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# -- Service configuration
service:
  type: ClusterIP
  port: 8000
  targetPort: 8000
  protocol: TCP
  # -- Service annotations
  annotations: {}

# -- Ingress configuration
ingress:
  enabled: true
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
  hosts:
    - host: ugc-marketplace.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: ugc-marketplace-tls
      hosts:
        - ugc-marketplace.example.com

# -- Resource limits and requests
resources:
  limits:
    cpu: 1000m
    memory: 2Gi
  requests:
    cpu: 250m
    memory: 512Mi

# -- Horizontal Pod Autoscaler configuration
autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 20
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 10
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
        - type: Pods
          value: 4
          periodSeconds: 15
      selectPolicy: Max

# -- Liveness probe configuration
livenessProbe:
  httpGet:
    path: /api/v1/health
    port: http
  initialDelaySeconds: 10
  periodSeconds: 30
  timeoutSeconds: 5
  failureThreshold: 3
  successThreshold: 1

# -- Readiness probe configuration
readinessProbe:
  httpGet:
    path: /api/v1/health/ready
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3
  successThreshold: 1

# -- Startup probe configuration
startupProbe:
  httpGet:
    path: /api/v1/health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 12

# -- Node selector for pod assignment
nodeSelector: {}

# -- Tolerations for pod assignment
tolerations: []

# -- Affinity rules for pod assignment
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - ugc-marketplace
          topologyKey: kubernetes.io/hostname

# -- Topology spread constraints
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: ugc-marketplace

# -- Pod disruption budget
podDisruptionBudget:
  enabled: true
  minAvailable: 2

# -- Rolling update strategy
deploymentStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

# -- Environment variables from configMap
config:
  APP_ENV: "production"
  LOG_LEVEL: "INFO"
  API_PREFIX: "/api/v1"
  LLM_MODEL: "gpt-4o"
  LLM_TEMPERATURE: "0.1"
  DEFAULT_CONFIDENCE_THRESHOLD: "0.7"
  ENABLE_METRICS: "true"
  METRICS_PORT: "9090"
  CORS_ORIGINS: "https://ugc-marketplace.example.com"
  RATE_LIMIT_REQUESTS_PER_MINUTE: "100"
  RATE_LIMIT_BURST: "20"

# -- Secrets (will be templated into secret.yaml)
secrets:
  DATABASE_URL: "postgresql+asyncpg://postgres:postgres@postgres:5432/ugc_marketplace"
  REDIS_URL: "redis://redis:6379/0"
  KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
  SECRET_KEY: "change-me-in-production"
  OPENAI_API_KEY: ""

# -- Extra environment variables
extraEnv: []
# - name: SOME_VAR
#   value: "some-value"

# -- Extra environment variables from secrets
extraEnvFrom: []
# - secretRef:
#     name: some-secret

# -- Extra volume mounts
extraVolumeMounts: []
# - name: tmp
#   mountPath: /tmp

# -- Extra volumes
extraVolumes: []
# - name: tmp
#   emptyDir: {}

# -- Init containers
initContainers: []
# - name: wait-for-db
#   image: busybox:1.36
#   command: ['sh', '-c', 'until nc -z postgres 5432; do echo waiting for db; sleep 2; done;']

# -- Sidecar containers
sidecarContainers: []

# -- Monitoring configuration
monitoring:
  enabled: true
  serviceMonitor:
    enabled: true
    interval: 30s
    scrapeTimeout: 10s
    labels: {}

# -- Network policy
networkPolicy:
  enabled: false
  ingress: []
  egress: []

# -- Pod security policy
podSecurityPolicy:
  enabled: false

# -- Priority class name
priorityClassName: ""

# -- Grace period for termination
terminationGracePeriodSeconds: 30

# -- DNS configuration
dnsPolicy: ClusterFirst
dnsConfig: {}

# -- Host aliases
hostAliases: []

# -- Lifecycle hooks
lifecycle: {}
# preStop:
#   exec:
#     command: ["/bin/sh", "-c", "sleep 10"]
