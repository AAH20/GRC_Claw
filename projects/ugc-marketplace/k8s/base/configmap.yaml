apiVersion: v1
kind: ConfigMap
metadata:
  name: ugc-marketplace-config
  namespace: ugc-marketplace
data:
  APP_ENV: "production"
  LOG_LEVEL: "INFO"
  API_PREFIX: "/api/v1"
  DATABASE_URL: "postgresql+asyncpg://postgres:postgres@postgres:5432/ugc_marketplace"
  REDIS_URL: "redis://redis:6379/0"
  KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
  LLM_MODEL: "gpt-4o"
  LLM_TEMPERATURE: "0.1"
  DEFAULT_CONFIDENCE_THRESHOLD: "0.7"
  ENABLE_METRICS: "true"
