apiVersion: apps/v1
kind: Deployment
metadata:
  name: ugc-marketplace-api
spec:
  replicas: 1
  template:
    spec:
                securityContext:
            readOnlyRootFilesystem: true
        containers:
        - name: api
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
