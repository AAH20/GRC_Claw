apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

namePrefix: prod-

commonLabels:
  environment: production

patches:
  - path: deployment-patch.yaml

configMapGenerator:
  - name: ugc-marketplace-config
    behavior: merge
    literals:
      - APP_ENV=production
      - LOG_LEVEL=INFO
