[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ugc-marketplace-sdk"
version = "2.0.0"
description = "Production-grade Python SDK for the UGC Marketplace API"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "UGC Marketplace", email = "dev@ugc-marketplace.example.com" },
]
keywords = ["ugc", "marketplace", "api", "sdk", "client"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "redis>=5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-httpx>=0.30.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
]

[project.urls]
Homepage = "https://github.com/ugc-marketplace/ugc-marketplace-python-sdk"
Documentation = "https://ugc-marketplace.example.com/docs/sdk/python"
Repository = "https://github.com/ugc-marketplace/ugc-marketplace-python-sdk"

[tool.hatch.build.targets.wheel]
packages = ["ugc_marketplace"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "SIM", "TCH"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
