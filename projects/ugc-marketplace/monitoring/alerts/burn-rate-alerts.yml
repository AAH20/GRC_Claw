# Error budget burn rate alerts for UGC Marketplace
# Multi-window burn rate alerting per Google SRE practices

groups:
  - name: ugc-marketplace-error-budget
    interval: 30s
    rules:
      # --- API Error Budget Burn Rate ---
      - alert: APIErrorBudgetFastBurn
        expr: |
          (
            sum(rate(http_requests_total{job="ugc-marketplace-api", status=~"5.."}[1h]))
            /
            sum(rate(http_requests_total{job="ugc-marketplace-api"}[1h]))
          ) > 14.4 * 0.001
        for: 2m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "Fast error budget burn on API"
          description: "API is burning error budget at 14.4x the acceptable rate (2% budget in 1h)."
          runbook: "https://wiki.internal/runbooks/error-budget-fast-burn"
          dashboard: "https://grafana.internal/d/ugc-marketplace-slo"

      - alert: APIErrorBudgetSlowBurn
        expr: |
          (
            sum(rate(http_requests_total{job="ugc-marketplace-api", status=~"5.."}[6h]))
            /
            sum(rate(http_requests_total{job="ugc-marketplace-api"}[6h]))
          ) > 2 * 0.001
        for: 15m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Slow error budget burn on API"
          description: "API is burning error budget at 2x the acceptable rate (5% budget in 6h)."
          runbook: "https://wiki.internal/runbooks/error-budget-slow-burn"
          dashboard: "https://grafana.internal/d/ugc-marketplace-slo"

      - alert: APIErrorBudgetExhausted
        expr: |
          0.001 - (
            sum(rate(http_requests_total{job="ugc-marketplace-api", status=~"5.."}[30d]))
            /
            sum(rate(http_requests_total{job="ugc-marketplace-api"}[30d]))
          ) <= 0
        for: 5m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "API error budget exhausted"
          description: "API error budget for the 30-day window is exhausted. Deployment freeze recommended."
          runbook: "https://wiki.internal/runbooks/error-budget-exhausted"

      # --- Database Error Budget Burn Rate ---
      - alert: DBErrorBudgetFastBurn
        expr: |
          (
            sum(rate(pg_query_errors_total[1h]))
            /
            sum(rate(pg_queries_total[1h]))
          ) > 14.4 * 0.0005
        for: 2m
        labels:
          severity: critical
          team: data
        annotations:
          summary: "Fast error budget burn on Database"
          description: "Database is burning error budget at 14.4x the acceptable rate."
          runbook: "https://wiki.internal/runbooks/db-error-budget-fast-burn"

      - alert: DBErrorBudgetSlowBurn
        expr: |
          (
            sum(rate(pg_query_errors_total[6h]))
            /
            sum(rate(pg_queries_total[6h]))
          ) > 2 * 0.0005
        for: 15m
        labels:
          severity: warning
          team: data
        annotations:
          summary: "Slow error budget burn on Database"
          description: "Database is burning error budget at 2x the acceptable rate."
          runbook: "https://wiki.internal/runbooks/db-error-budget-slow-burn"

      # --- Moderation Error Budget Burn Rate ---
      - alert: ModerationErrorBudgetFastBurn
        expr: |
          (
            sum(rate(ugc_content_moderation_total{status="error"}[1h]))
            /
            sum(rate(ugc_content_moderation_total[1h]))
          ) > 14.4 * 0.10
        for: 5m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "Fast error budget burn on Moderation"
          description: "Moderation pipeline is burning error budget at 14.4x the acceptable rate."
          runbook: "https://wiki.internal/runbooks/moderation-error-budget-fast-burn"

      # --- Multi-window burn rate (1h + 6h) ---
      - alert: APIMultiWindowBurnRate
        expr: |
          (
            (
              sum(rate(http_requests_total{job="ugc-marketplace-api", status=~"5.."}[1h]))
              /
              sum(rate(http_requests_total{job="ugc-marketplace-api"}[1h]))
            ) > 14.4 * 0.001
          ) and (
            (
              sum(rate(http_requests_total{job="ugc-marketplace-api", status=~"5.."}[6h]))
              /
              sum(rate(http_requests_total{job="ugc-marketplace-api"}[6h]))
            ) > 2 * 0.001
          )
        for: 2m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "API multi-window burn rate exceeded"
          description: "API is burning error budget in both 1h and 6h windows. Immediate action required."
          runbook: "https://wiki.internal/runbooks/multi-window-burn-rate"