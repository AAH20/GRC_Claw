# Business-level alert rules for UGC Marketplace
# These complement the infrastructure alerts in alert-rules.yml

groups:
  # ============================================================
  # Content & Moderation Business Alerts
  # ============================================================
  - name: ugc-marketplace-content-business
    interval: 60s
    rules:
      - alert: HighContentUploadFailureRate
        expr: |
          sum(rate(ugc_content_uploads_total{status="failed"}[10m]))
          /
          sum(rate(ugc_content_uploads_total[10m]))
          > 0.10
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "High content upload failure rate"
          description: "Upload failure rate is {{ $value | humanizePercentage }} over the last 10 minutes."
          runbook: "https://wiki.internal/runbooks/high-upload-failure-rate"
          dashboard: "https://grafana.internal/d/ugc-marketplace-business"

      - alert: ModerationQueueBacklog
        expr: |
          moderation_queue_depth > 500
        for: 10m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Moderation queue backlog"
          description: "Moderation queue has {{ $value }} items pending."

      - alert: ModerationAccuracyDrop
        expr: |
          ugc_moderation_accuracy < 0.85
        for: 15m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "Moderation model accuracy dropped"
          description: "Moderation accuracy is {{ $value | humanizePercentage }} for model {{ $labels.model_version }}."

      - alert: HighContentRemovalRate
        expr: |
          sum(rate(ugc_content_removed_total[1h])) by (reason)
          > 100
        for: 15m
        labels:
          severity: warning
          team: trust-and-safety
        annotations:
          summary: "High content removal rate"
          description: "Content removal rate for reason {{ $labels.reason }} is {{ $value }} per second."

      - alert: ContentIDHighMatchRate
        expr: |
          sum(rate(ugc_content_id_resolves_total{match_type="exact"}[10m]))
          /
          sum(rate(ugc_content_id_resolves_total[10m]))
          > 0.30
        for: 10m
        labels:
          severity: warning
          team: trust-and-safety
        annotations:
          summary: "High Content ID match rate"
          description: "Exact match rate is {{ $value | humanizePercentage }}, possible false positive issue."

  # ============================================================
  # Creator Economy Business Alerts
  # ============================================================
  - name: ugc-marketplace-creator-economy
    interval: 60s
    rules:
      - alert: CreatorEarningsDrop
        expr: |
          sum(rate(ugc_creator_earnings_total[1h]))
          <
          0.5 * sum(rate(ugc_creator_earnings_total[1h] offset 1d))
        for: 30m
        labels:
          severity: critical
          team: business
        annotations:
          summary: "Creator earnings dropped significantly"
          description: "Creator earnings have dropped by more than 50% compared to yesterday."

      - alert: SubscriptionChurnSpike
        expr: |
          sum(rate(ugc_subscription_churn_total[1h])) by (tier)
          > 5 * sum(rate(ugc_subscription_churn_total[1h] offset 1d)) by (tier)
        for: 30m
        labels:
          severity: warning
          team: business
        annotations:
          summary: "Subscription churn spike"
          description: "Churn rate for tier {{ $labels.tier }} is {{ $value }} per second, 5x higher than yesterday."

      - alert: LowActiveCreatorCount
        expr: |
          ugc_active_users{window="30d"} < 1000
        for: 1h
        labels:
          severity: warning
          team: business
        annotations:
          summary: "Low active creator count"
          description: "30-day active creators: {{ $value }}"

      - alert: LicensingRevenueDrop
        expr: |
          sum(rate(ugc_licensing_revenue_total[1h]))
          <
          0.7 * sum(rate(ugc_licensing_revenue_total[1h] offset 1d))
        for: 1h
        labels:
          severity: warning
          team: business
        annotations:
          summary: "Licensing revenue dropped"
          description: "Licensing revenue has dropped by more than 30% compared to yesterday."

  # ============================================================
  # Fraud & Safety Business Alerts
  # ============================================================
  - name: ugc-marketplace-fraud-safety
    interval: 60s
    rules:
      - alert: HighFraudDetectionRate
        expr: |
          sum(rate(ugc_fraud_detection_total[10m])) by (detection_type)
          /
          sum(rate(ugc_content_uploads_total[10m]))
          > 0.15
        for: 10m
        labels:
          severity: critical
          team: trust-and-safety
        annotations:
          summary: "High fraud detection rate"
          description: "Fraud detection rate is {{ $value | humanizePercentage }} for type {{ $labels.detection_type }}."

      - alert: HighFalsePositiveRate
        expr: |
          sum(rate(ugc_content_appeals_total{outcome="overturned"}[1h]))
          /
          sum(rate(ugc_content_appeals_total[1h]))
          > 0.30
        for: 1h
        labels:
          severity: warning
          team: trust-and-safety
        annotations:
          summary: "High false positive rate"
          description: "Appeal overturn rate is {{ $value | humanizePercentage }}, indicating high false positives."

      - alert: SafetyViolationSpike
        expr: |
          sum(rate(ugc_safety_violations_total[10m])) by (category)
          > 10 * sum(rate(ugc_safety_violations_total[10m] offset 1d)) by (category)
        for: 15m
        labels:
          severity: critical
          team: trust-and-safety
        annotations:
          summary: "Safety violation spike"
          description: "Safety violations for {{ $labels.category }} are {{ $value }} per second, 10x higher than yesterday."

      - alert: AccountSuspensionSpike
        expr: |
          sum(rate(ugc_accounts_suspended_total[10m])) by (reason)
          > 50
        for: 10m
        labels:
          severity: warning
          team: trust-and-safety
        annotations:
          summary: "Account suspension spike"
          description: "Account suspensions for {{ $labels.reason }}: {{ $value }} per second."

  # ============================================================
  # Discovery & Engagement Business Alerts
  # ============================================================
  - name: ugc-marketplace-discovery-engagement
    interval: 60s
    rules:
      - alert: SearchZeroResultsRate
        expr: |
          sum(rate(ugc_search_queries_total{result_bucket="0"}[10m]))
          /
          sum(rate(ugc_search_queries_total[10m]))
          > 0.20
        for: 10m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "High zero-results search rate"
          description: "{{ $value | humanizePercentage }} of searches return zero results."

      - alert: ContentEngagementDrop
        expr: |
          sum(rate(ugc_content_engagement_total[1h]))
          <
          0.5 * sum(rate(ugc_content_engagement_total[1h] offset 1d))
        for: 30m
        labels:
          severity: warning
          team: business
        annotations:
          summary: "Content engagement dropped"
          description: "Engagement rate has dropped by more than 50% compared to yesterday."

      - alert: RecommendationCTRDrop
        expr: |
          sum(rate(ugc_recommendation_clicks_total[1h])) by (slot)
          /
          sum(rate(ugc_content_views_total[1h])) by (source)
          < 0.01
        for: 1h
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Recommendation CTR dropped"
          description: "CTR for slot {{ $labels.slot }} is below 1%."

  # ============================================================
  # Platform Health Business Alerts
  # ============================================================
  - name: ugc-marketplace-platform-health
    interval: 60s
    rules:
      - alert: APIRateLimitHigh
        expr: |
          sum(rate(ugc_api_rate_limit_hits_total[5m])) by (endpoint)
          > 100
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "High API rate limit hits"
          description: "Endpoint {{ $labels.endpoint }} has {{ $value }} rate limit hits per second."

      - alert: WebhookDeliveryFailureRate
        expr: |
          sum(rate(ugc_webhook_deliveries_total{status="failed"}[10m]))
          /
          sum(rate(ugc_webhook_deliveries_total[10m]))
          > 0.10
        for: 10m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "High webhook delivery failure rate"
          description: "Webhook failure rate is {{ $value | humanizePercentage }}."

      - alert: NotificationDeliveryDrop
        expr: |
          sum(rate(ugc_notifications_sent_total{status="failed"}[10m])) by (channel)
          /
          sum(rate(ugc_notifications_sent_total[10m])) by (channel)
          > 0.05
        for: 10m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Notification delivery failure"
          description: "Channel {{ $labels.channel }} has {{ $value | humanizePercentage }} failure rate."

      - alert: UserGrowthStagnation
        expr: |
          ugc_registered_users{status="active"}
          -
          ugc_registered_users{status="active"} offset 7d
          < 100
        for: 1d
        labels:
          severity: info
          team: business
        annotations:
          summary: "User growth stagnation"
          description: "Only {{ $value }} new active users in the last 7 days."
