# Enhanced SLO definitions for UGC Marketplace
# Additional SLOs beyond the base slo-definitions.yml

slos:
  # --- Content Delivery ---
  - name: ugc-marketplace-content-delivery-availability
    description: "Content delivery availability (CDN/streaming)"
    target: 0.999
    window: 30d
    burn_rate_alerts:
      - name: fast-burn
        multiplier: 14.4
        severity: critical
      - name: slow-burn
        multiplier: 2
        severity: warning
    sli: |
      sum(rate(ugc_content_delivery_total{status="success"}[5m]))
      /
      sum(rate(ugc_content_delivery_total[5m])) > 0.999

  - name: ugc-marketplace-content-delivery-latency
    description: "Content delivery time to first byte (P95)"
    target: 0.95
    threshold: 0.5
    window: 30d
    sli: |
      histogram_quantile(0.95,
        sum(rate(ugc_content_delivery_ttfb_seconds_bucket[5m])) by (le)
      ) < 0.5

  # --- Search Relevance ---
  - name: ugc-marketplace-search-relevance
    description: "Search relevance (non-zero results rate)"
    target: 0.80
    window: 30d
    sli: |
      sum(rate(ugc_search_queries_total{result_bucket!="0"}[5m]))
      /
      sum(rate(ugc_search_queries_total[5m])) > 0.80

  - name: ugc-marketplace-search-click-through
    description: "Search click-through rate"
    target: 0.30
    window: 30d
    sli: |
      sum(rate(ugc_search_result_clicks_total[5m]))
      /
      sum(rate(ugc_search_queries_total[5m])) > 0.30

  # --- Notification Delivery ---
  - name: ugc-marketplace-notification-delivery
    description: "Notification delivery success rate"
    target: 0.99
    window: 30d
    sli: |
      sum(rate(ugc_notifications_sent_total{status="success"}[5m]))
      /
      sum(rate(ugc_notifications_sent_total[5m])) > 0.99

  - name: ugc-marketplace-notification-latency
    description: "Notification delivery latency (P99)"
    target: 0.95
    threshold: 5.0
    window: 30d
    sli: |
      histogram_quantile(0.99,
        sum(rate(ugc_notification_delivery_duration_seconds_bucket[5m])) by (le)
      ) < 5.0

  # --- WebSocket / Real-time ---
  - name: ugc-marketplace-websocket-availability
    description: "WebSocket service availability"
    target: 0.999
    window: 30d
    sli: |
      up{job="ugc-marketplace-websocket"} == 1

  - name: ugc-marketplace-websocket-latency
    description: "WebSocket message delivery latency (P99)"
    target: 0.99
    threshold: 0.1
    window: 30d
    sli: |
      histogram_quantile(0.99,
        sum(rate(ugc_websocket_message_duration_seconds_bucket[5m])) by (le)
      ) < 0.1

  # --- Content ID ---
  - name: ugc-marketplace-content-id-latency
    description: "Content ID resolution latency (P95)"
    target: 0.95
    threshold: 1.0
    window: 30d
    sli: |
      histogram_quantile(0.95,
        sum(rate(ugc_content_id_resolution_duration_seconds_bucket[5m])) by (le)
      ) < 1.0

  # --- Licensing ---
  - name: ugc-marketplace-licensing-availability
    description: "Licensing service availability"
    target: 0.995
    window: 30d
    sli: |
      up{job="ugc-marketplace-licensing"} == 1

  - name: ugc-marketplace-licensing-processing-time
    description: "License request processing time (P95)"
    target: 0.95
    threshold: 2.0
    window: 30d
    sli: |
      histogram_quantile(0.95,
        sum(rate(ugc_licensing_processing_duration_seconds_bucket[5m])) by (le)
      ) < 2.0

  # --- Rights Management ---
  - name: ugc-marketplace-rights-claim-processing
    description: "Rights claim processing time (P95)"
    target: 0.95
    threshold: 10.0
    window: 30d
    sli: |
      histogram_quantile(0.95,
        sum(rate(ugc_rights_claim_duration_seconds_bucket[5m])) by (le)
      ) < 10.0

  # --- API Endpoint SLOs ---
  - name: ugc-marketplace-api-upload-endpoint
    description: "Content upload endpoint availability"
    target: 0.999
    window: 30d
    sli: |
      sum(rate(ugc_api_endpoint_requests_total{endpoint="/api/v1/content", status!~"5.."}[5m]))
      /
      sum(rate(ugc_api_endpoint_requests_total{endpoint="/api/v1/content"}[5m])) > 0.999

  - name: ugc-marketplace-api-search-endpoint
    description: "Search endpoint availability"
    target: 0.995
    window: 30d
    sli: |
      sum(rate(ugc_api_endpoint_requests_total{endpoint="/api/v1/search", status!~"5.."}[5m]))
      /
      sum(rate(ugc_api_endpoint_requests_total{endpoint="/api/v1/search"}[5m])) > 0.995

  - name: ugc-marketplace-api-licensing-endpoint
    description: "Licensing endpoint availability"
    target: 0.995
    window: 30d
    sli: |
      sum(rate(ugc_api_endpoint_requests_total{endpoint="/api/v1/licensing", status!~"5.."}[5m]))
      /
      sum(rate(ugc_api_endpoint_requests_total{endpoint="/api/v1/licensing"}[5m])) > 0.995

# ============================================================
# Enhanced Error Budget Policies
# ============================================================
error_budget_policies:
  - name: content-delivery-error-budget
    slo: ugc-marketplace-content-delivery-availability
    window: 30d
    budget: 0.001
    actions:
      - threshold: 0.5
        action: alert
        severity: warning
      - threshold: 1.0
        action: freeze_deployments
        notify: ["platform-team", "engineering-manager"]

  - name: notification-error-budget
    slo: ugc-marketplace-notification-delivery
    window: 30d
    budget: 0.01
    actions:
      - threshold: 0.5
        action: alert
        severity: warning
      - threshold: 1.0
        action: freeze_deployments
        notify: ["platform-team", "engineering-manager"]

  - name: websocket-error-budget
    slo: ugc-marketplace-websocket-availability
    window: 30d
    budget: 0.001
    actions:
      - threshold: 0.5
        action: alert
        severity: warning
      - threshold: 1.0
        action: freeze_deployments
        notify: ["platform-team", "engineering-manager"]

# ============================================================
# Enhanced SLA Definitions
# ============================================================
slas:
  - name: ugc-marketplace-content-delivery-sla
    description: "Content delivery service level agreement"
    availability: 0.995
    latency_p95: 1.0
    error_rate: 0.005
    support_response_time: 2h
    support_resolution_time: 8h
    credits:
      - availability: 0.99
        credit: 10
      - availability: 0.95
        credit: 25

  - name: ugc-marketplace-notification-sla
    description: "Notification service level agreement"
    availability: 0.99
    delivery_time: 10.0
    error_rate: 0.01
    support_response_time: 4h
    support_resolution_time: 12h

  - name: ugc-marketplace-websocket-sla
    description: "WebSocket service level agreement"
    availability: 0.995
    message_latency: 0.5
    error_rate: 0.005
    support_response_time: 2h
    support_resolution_time: 8h