# Alertmanager configuration for UGC Marketplace
# Routes alerts to PagerDuty (critical) and Slack (warning/info)

global:
  smtp_smarthost: localhost:587
  smtp_from: alerts@ugc-marketplace.local
  slack_api_url: ${SLACK_WEBHOOK_URL}
  pagerduty_url: https://events.pagerduty.com/v2/enqueue
  resolve_timeout: 5m

# Templates
templates:
  - /etc/alertmanager/templates/*.tmpl

# Route tree
route:
  receiver: default-slack
  group_by: [alertname, service, severity]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

  routes:
    # Critical alerts → PagerDuty + Slack
    - match:
        severity: critical
      receiver: pagerduty-critical
      group_wait: 15s
      group_interval: 2m
      repeat_interval: 1h
      continue: true

    # Warning alerts → Slack only
    - match:
        severity: warning
      receiver: slack-warnings
      group_wait: 30s
      group_interval: 10m
      repeat_interval: 4h

    # Info alerts → Slack only, less frequent
    - match:
        severity: info
      receiver: slack-info
      group_wait: 5m
      group_interval: 30m
      repeat_interval: 12h

    # Data team alerts
    - match:
        team: data
      receiver: slack-data-team
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h

    # Platform team alerts
    - match:
        team: platform
      receiver: slack-platform-team
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h

# Receivers
receivers:
  - name: default-slack
    slack_configs:
      - channel: "#alerts"
        send_resolved: true
        title: '{{ template "slack.default.title" . }}'
        text: '{{ template "slack.default.text" . }}'

  - name: pagerduty-critical
    pagerduty_configs:
      - service_key: ${PAGERDUTY_SERVICE_KEY}
        severity: critical
        description: '{{ .GroupLabels.alertname }}: {{ .CommonAnnotations.summary }}'
        details:
          firing: '{{ template "pagerduty.default.instances" .Alerts.Firing }}'
          resolved: '{{ template "pagerduty.default.instances" .Alerts.Resolved }}'
          runbook: '{{ .CommonAnnotations.runbook }}'
          dashboard: '{{ .CommonAnnotations.dashboard }}'
    slack_configs:
      - channel: "#critical-alerts"
        send_resolved: true
        title: '🚨 CRITICAL: {{ .GroupLabels.alertname }}'
        text: '{{ .CommonAnnotations.description }}'
        actions:
          - type: button
            text: "Runbook"
            url: '{{ .CommonAnnotations.runbook }}'
          - type: button
            text: "Dashboard"
            url: '{{ .CommonAnnotations.dashboard }}'

  - name: slack-warnings
    slack_configs:
      - channel: "#warnings"
        send_resolved: true
        title: '⚠️ WARNING: {{ .GroupLabels.alertname }}'
        text: '{{ .CommonAnnotations.description }}'

  - name: slack-info
    slack_configs:
      - channel: "#info"
        send_resolved: true
        title: 'ℹ️ INFO: {{ .GroupLabels.alertname }}'
        text: '{{ .CommonAnnotations.description }}'

  - name: slack-data-team
    slack_configs:
      - channel: "#data-alerts"
        send_resolved: true
        title: '{{ .GroupLabels.alertname }}'
        text: '{{ .CommonAnnotations.description }}'

  - name: slack-platform-team
    slack_configs:
      - channel: "#platform-alerts"
        send_resolved: true
        title: '{{ .GroupLabels.alertname }}'
        text: '{{ .CommonAnnotations.description }}'

  - name: email-oncall
    email_configs:
      - to: oncall@ugc-marketplace.com
        send_resolved: true
        headers:
          Subject: '{{ .GroupLabels.alertname }}'

# Inhibit rules
inhibit_rules:
  # If ServiceDown is firing, inhibit APIServiceDown
  - source_match:
      alertname: ServiceDown
    target_match:
      alertname: APIServiceDown
    equal: [instance]

  # If DatabaseDown is firing, inhibit PostgreSQL alerts
  - source_match:
      alertname: DatabaseDown
    target_match:
      alertname: PostgreSQLHighConnections
    equal: [instance]

  # If RedisDown is firing, inhibit Redis alerts
  - source_match:
      alertname: RedisDown
    target_match:
      alertname: RedisHighMemory
    equal: [instance]

  # If KafkaDown is firing, inhibit Kafka alerts
  - source_match:
      alertname: KafkaDown
    target_match:
      alertname: KafkaConsumerLag
    equal: [instance]
