# Fluentd configuration for UGC Marketplace
# Centralized log aggregation pipeline

# ============================================================
# System-level configuration
# ============================================================
<system>
  log_level info
  workers 2
  root_dir /var/log/fluent/buffer
  flush_thread_count 2
  flush_interval 5s
  retry_max_interval 30
  retry_forever true
  disable_retry_limit false
  emit_error_log_interval 30
</system>

# ============================================================
# Source: Docker container logs (via Docker logging driver)
# ============================================================
<source>
  @type forward
  port 24224
  bind 0.0.0.0
  <transport>
    protocol tcp
  </transport>
  <security>
    self_hostname fluentd
    shared_key ugc-marketplace-fluentd-shared-key
  </security>
</source>

# ============================================================
# Source: Tail container log files (fallback)
# ============================================================
<source>
  @type tail
  path /var/log/containers/ugc-marketplace-*.log
  pos_file /var/log/fluent/ugc-marketplace.pos
  tag docker.ugc-marketplace.*
  refresh_interval 5s
  read_from_head true
  <parse>
    @type json
    time_key time
    time_format %Y-%m-%dT%H:%M:%S.%NZ
    keep_time_key true
  </parse>
</source>

# ============================================================
# Source: Application stdout/stderr (via Docker)
# ============================================================
<source>
  @type tail
  path /var/log/ugc-marketplace/app.log
  pos_file /var/log/fluent/app.pos
  tag app.ugc-marketplace
  refresh_interval 5s
  read_from_head true
  <parse>
    @type json
    time_key timestamp
    time_format %Y-%m-%dT%H:%M:%S.%NZ
    keep_time_key true
  </parse>
</source>

# ============================================================
# Filter: Parse and enrich Docker container logs
# ============================================================
<filter docker.ugc-marketplace.**>
  @type parser
  key_name log
  reserve_data true
  remove_key_name_field true
  <parse>
    @type json
    time_key time
    time_format %Y-%m-%dT%H:%M:%S.%NZ
  </parse>
</filter>

# ============================================================
# Filter: Add Kubernetes/Docker metadata
# ============================================================
<filter docker.ugc-marketplace.**>
  @type record_transformer
  enable_ruby true
  <record>
    hostname "#{Socket.gethostname}"
    environment production
    cluster ugc-marketplace
    source docker
    docker_container_id ${record["container_id"] || "unknown"}
    docker_image ${record["image"] || "unknown"}
  </record>
</filter>

# ============================================================
# Filter: Route by log level
# ============================================================
<filter docker.ugc-marketplace.**>
  @type grep
  <regexp>
    key level
    pattern /^(ERROR|CRITICAL|FATAL)$/
  </regexp>
  add_tag_prefix error
</filter>

# ============================================================
# Filter: Extract trace context (if present)
# ============================================================
<filter docker.ugc-marketplace.**>
  @type record_transformer
  enable_ruby true
  <record>
    trace_id ${record["trace_id"] || record["X-B3-TraceId"] || "none"}
    span_id ${record["span_id"] || record["X-B3-SpanId"] || "none"}
    parent_span_id ${record["parent_span_id"] || record["X-B3-ParentSpanId"] || "none"}
    sampled ${record["sampled"] || record["X-B3-Sampled"] || "0"}
  </record>
</filter>

# ============================================================
# Filter: Mask sensitive data
# ============================================================
<filter docker.ugc-marketplace.**>
  @type record_transformer
  enable_ruby true
  <record>
    message ${record["message"].gsub(/password["\s:=]+[^\s,}]+/i, 'password=[FILTERED]').gsub(/token["\s:=]+[^\s,}]+/i, 'token=[FILTERED]').gsub(/api[_-]?key["\s:=]+[^\s,}]+/i, 'api_key=[FILTERED]').gsub(/secret["\s:=]+[^\s,}]+/i, 'secret=[FILTERED]')}
  </record>
</filter>

# ============================================================
# Output: Elasticsearch (primary)
# ============================================================
<match docker.ugc-marketplace.**>
  @type elasticsearch
  host elasticsearch
  port 9200
  scheme http
  user ${ELASTICSEARCH_USER}
  password ${ELASTICSEARCH_PASSWORD}
  logstash_format true
  logstash_prefix ugc-marketplace
  logstash_dateformat %Y.%m.%d
  include_tag_key true
  tag_key @log_name
  flush_interval 5s
  max_retry_wait 30
  disable_retry_limit false
  num_threads 4
  request_timeout 10s
  reload_on_failure true
  reconnect_on_error true
  reload_connections true
  <buffer>
    @type file
    path /var/log/fluent/buffer/elasticsearch
    flush_mode interval
    flush_interval 5s
    flush_thread_count 2
    chunk_limit_size 8MB
    queue_limit_length 256
    retry_max_interval 30
    retry_forever true
    overflow_action block
  </buffer>
</match>

# ============================================================
# Output: S3 (archive, errors only)
# ============================================================
<match docker.ugc-marketplace.error.**>
  @type s3
  aws_key_id ${AWS_ACCESS_KEY_ID}
  aws_sec_key ${AWS_SECRET_ACCESS_KEY}
  s3_bucket ugc-marketplace-logs
  s3_region us-east-1
  path errors/%Y/%m/%d/
  time_slice_format %H%M
  time_slice_wait 10m
  utc true
  <buffer time>
    @type file
    path /var/log/fluent/buffer/s3
    timekey 3600
    timekey_wait 10m
    chunk_limit_size 256MB
    queue_limit_length 4
    flush_mode interval
    flush_interval 300s
    retry_forever true
  </buffer>
  <format>
    @type json
  </format>
</match>

# ============================================================
# Output: Stdout (debug/monitoring)
# ============================================================
<match docker.ugc-marketplace.**>
  @type stdout
  <format>
    @type json
  </format>
</match>
