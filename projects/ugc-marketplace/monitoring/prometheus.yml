# Prometheus configuration for UGC Marketplace
# Scrapes metrics from all services in the stack

global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
  external_labels:
    cluster: ugc-marketplace
    environment: production

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093
      scheme: http
      timeout: 10s

# Load alert rules
rule_files:
  - /etc/prometheus/alerts/*.yml

scrape_configs:
  # ============================================================
  # UGC Marketplace API (FastAPI application)
  # ============================================================
  - job_name: ugc-marketplace-api
    metrics_path: /metrics
    static_configs:
      - targets:
          - api:8000
        labels:
          service: api
          app: ugc-marketplace
    scrape_interval: 10s
    scrape_timeout: 5s

  # ============================================================
  # PostgreSQL exporter
  # ============================================================
  - job_name: postgres-exporter
    static_configs:
      - targets:
          - postgres-exporter:9187
        labels:
          service: database
          app: ugc-marketplace
    scrape_interval: 30s

  # ============================================================
  # Redis exporter
  # ============================================================
  - job_name: redis-exporter
    static_configs:
      - targets:
          - redis-exporter:9121
        labels:
          service: cache
          app: ugc-marketplace
    scrape_interval: 15s

  # ============================================================
  # Kafka exporter (JMX)
  # ============================================================
  - job_name: kafka-exporter
    static_configs:
      - targets:
          - kafka-exporter:9308
        labels:
          service: messaging
          app: ugc-marketplace
    scrape_interval: 30s

  # ============================================================
  # Node exporter (host-level metrics)
  # ============================================================
  - job_name: node-exporter
    static_configs:
      - targets:
          - node-exporter:9100
        labels:
          service: node
          app: ugc-marketplace
    scrape_interval: 15s

  # ============================================================
  # cAdvisor (container-level metrics)
  # ============================================================
  - job_name: cadvisor
    static_configs:
      - targets:
          - cadvisor:8080
        labels:
          service: container
          app: ugc-marketplace
    scrape_interval: 15s

  # ============================================================
  # Jaeger (tracing metrics)
  # ============================================================
  - job_name: jaeger
    static_configs:
      - targets:
          - jaeger:14269
        labels:
          service: tracing
          app: ugc-marketplace
    scrape_interval: 15s

  # ============================================================
  # Fluentd (logging pipeline metrics)
  # ============================================================
  - job_name: fluentd
    static_configs:
      - targets:
          - fluentd:24231
        labels:
          service: logging
          app: ugc-marketplace
    scrape_interval: 15s

  # ============================================================
  # Blackbox exporter (endpoint availability)
  # ============================================================
  - job_name: blackbox-http
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://api:8000/api/v1/health
        labels:
          service: api-health
          app: ugc-marketplace
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
    scrape_interval: 30s
