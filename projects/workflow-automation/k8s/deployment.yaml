apiVersion: apps/v1
kind: Deployment
metadata:
  name: workflow-automation
  labels:
    app: workflow-automation
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: workflow-automation
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: workflow-automation
        version: v1
    spec:
      containers:
        - name: workflow-automation
          image: workflow-automation:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              protocol: TCP
          env:
            - name: APP_ENV
              value: "production"
            - name: LOG_LEVEL
              value: "INFO"
            - name: N8N_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: workflow-automation-secrets
                  key: n8n-base-url
            - name: N8N_API_KEY
              valueFrom:
                secretKeyRef:
                  name: workflow-automation-secrets
                  key: n8n-api-key
            - name: ZAPIER_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: workflow-automation-secrets
                  key: zapier-webhook-url
            - name: MAKE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: workflow-automation-secrets
                  key: make-api-key
            - name: LANGCHAIN_API_KEY
              valueFrom:
                secretKeyRef:
                  name: workflow-automation-secrets
                  key: langchain-api-key
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      securityContext:
        fsGroup: 1000
