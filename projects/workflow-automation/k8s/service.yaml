apiVersion: v1
kind: Service
metadata:
  name: workflow-automation
  labels:
    app: workflow-automation
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8000
      protocol: TCP
      name: http
  selector:
    app: workflow-automation
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: workflow-automation
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/rate-limit: "100"
spec:
  tls:
    - hosts:
        - workflow-automation.example.com
      secretName: workflow-automation-tls
  rules:
    - host: workflow-automation.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: workflow-automation
                port:
                  number: 80
