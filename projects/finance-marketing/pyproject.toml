[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "finance-marketing"
version = "0.1.0"
description = "FINRA/SEC-compliant agentic AI marketing platform for financial services"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [
    { name = "Ahmed Hassan", email = "ahmed@example.com" },
]
keywords = ["finance", "marketing", "agents", "compliance", "finra", "sec"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial",
]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-community>=0.3.0",
    "langgraph>=0.2.0",
    "deepagents>=0.1.0",
    "httpx>=0.27.0",
    "PyYAML>=6.0.1",
    "python-dotenv>=1.0.1",
    "structlog>=24.1.0",
    "tenacity>=8.3.0",
    "cryptography>=42.0.0",
    "redis>=5.0.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "prometheus-client>=0.20.0",
]


[project.urls]
Homepage = "https://github.com/ahmedhassan/GRC_Claw"
Repository = "https://github.com/ahmedhassan/GRC_Claw"
[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "respx>=0.21.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "types-PyYAML>=6.0.12",
]

[project.scripts]
finance-marketing = "finance_marketing.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/finance_marketing"]

[tool.ruff]
target-version = "py311"
line-length = 100
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "TCH"]

[tool.ruff.lint.isort]
known-first-party = ["finance_marketing"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=src/finance_marketing --cov-report=term-missing --cov-report=xml"

[tool.coverage.run]
source = ["src/finance_marketing"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 80
