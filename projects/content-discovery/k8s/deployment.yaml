apiVersion: apps/v1
kind: Deployment
metadata:
  name: content-discovery
  labels:
    app: content-discovery
    version: v1
spec:
  replicas: 3
  selector:
    matchLabels:
      app: content-discovery
  template:
    metadata:
      labels:
        app: content-discovery
        version: v1
    spec:
      containers:
        - name: api
          image: content-discovery:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: content-discovery-config
            - secretRef:
                name: content-discovery-secrets
                optional: true
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 2Gi
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
