apiVersion: v1
kind: Service
metadata:
  name: content-discovery
  labels:
    app: content-discovery
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8000
      protocol: TCP
      name: http
  selector:
    app: content-discovery
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: content-discovery
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/rate-limit: "100"
spec:
  tls:
    - hosts:
        - content-discovery.example.com
      secretName: content-discovery-tls
  rules:
    - host: content-discovery.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: content-discovery
                port:
                  number: 80
