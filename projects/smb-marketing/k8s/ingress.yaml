apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: smb-marketing
  namespace: smb-marketing
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/rate-limit: "100"
spec:
  tls:
    - hosts:
        - smb-marketing.example.com
      secretName: smb-marketing-tls
  rules:
    - host: smb-marketing.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: smb-marketing
                port:
                  number: 80
