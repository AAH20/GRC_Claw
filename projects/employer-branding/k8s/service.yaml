apiVersion: v1
kind: Service
metadata:
  name: employer-branding-service
  labels:
    app: employer-branding
    component: api
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8000
      protocol: TCP
      name: http
  selector:
    app: employer-branding
    component: api
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: employer-branding-ingress
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
    - hosts:
        - employer-branding.example.com
      secretName: employer-branding-tls
  rules:
    - host: employer-branding.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: employer-branding-service
                port:
                  number: 80
