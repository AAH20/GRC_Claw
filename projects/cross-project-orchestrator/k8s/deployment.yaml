apiVersion: apps/v1
kind: Deployment
metadata:
  name: cross-project-orchestrator
  namespace: orchestrator
  labels:
    app: cross-project-orchestrator
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cross-project-orchestrator
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: cross-project-orchestrator
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: cross-project-orchestrator
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        fsGroup: 999
      containers:
        - name: orchestrator
          image: cross-project-orchestrator:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: ORCHESTRATOR_ENV
              value: "production"
            - name: ORCHESTRATOR_PORT
              value: "8080"
            - name: ORCHESTRATOR_LOG_LEVEL
              value: "INFO"
            - name: KUBERNETES_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: PROMETHEUS_URL
              value: "http://prometheus.monitoring.svc:9090"
          envFrom:
            - configMapRef:
                name: orchestrator-config
            - secretRef:
                name: orchestrator-secrets
                optional: true
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: tfstate
              mountPath: /app/tfstate
      volumes:
        - name: tmp
          emptyDir: {}
        - name: tfstate
          persistentVolumeClaim:
            claimName: orchestrator-tfstate
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - cross-project-orchestrator
                topologyKey: kubernetes.io/hostname
