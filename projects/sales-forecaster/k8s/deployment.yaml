apiVersion: apps/v1
kind: Deployment
metadata:
  name: sales-forecaster
  labels:
    app: sales-forecaster
    version: v1
spec:
  replicas: 3
  selector:
    matchLabels:
      app: sales-forecaster
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: sales-forecaster
        version: v1
    spec:
      containers:
        - name: api
          image: sales-forecaster:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              protocol: TCP
          env:
            - name: LOG_LEVEL
              value: "INFO"
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: sales-forecaster-secrets
                  key: redis-url
            - name: SALESFORCE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: sales-forecaster-secrets
                  key: salesforce-client-id
            - name: SALESFORCE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: sales-forecaster-secrets
                  key: salesforce-client-secret
            - name: HUBSPOT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: sales-forecaster-secrets
                  key: hubspot-api-key
            - name: SAP_USERNAME
              valueFrom:
                secretKeyRef:
                  name: sales-forecaster-secrets
                  key: sap-username
            - name: SAP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sales-forecaster-secrets
                  key: sap-password
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - sales-forecaster
                topologyKey: kubernetes.io/hostname
