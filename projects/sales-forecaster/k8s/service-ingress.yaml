apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sales-forecaster
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/rate-limit: "100"
spec:
  tls:
    - hosts:
        - sales-forecaster.example.com
      secretName: sales-forecaster-tls
  rules:
    - host: sales-forecaster.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sales-forecaster
                port:
                  number: 80
