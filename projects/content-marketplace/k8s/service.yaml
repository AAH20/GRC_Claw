apiVersion: v1
kind: Service
metadata:
  name: content-marketplace-service
  labels:
    app: content-marketplace
    component: api
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8000
      protocol: TCP
      name: http
  selector:
    app: content-marketplace
    component: api
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: content-marketplace-ingress
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/rate-limit: "100"
spec:
  tls:
    - hosts:
        - api.content-marketplace.example.com
      secretName: content-marketplace-tls
  rules:
    - host: api.content-marketplace.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: content-marketplace-service
                port:
                  number: 80
