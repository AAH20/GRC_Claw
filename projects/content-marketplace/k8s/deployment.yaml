apiVersion: apps/v1
kind: Deployment
metadata:
  name: content-marketplace-api
  labels:
    app: content-marketplace
    component: api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: content-marketplace
      component: api
  template:
    metadata:
      labels:
        app: content-marketplace
        component: api
    spec:
      containers:
        - name: api
          image: ghcr.io/ahmedhassan/content-marketplace:latest
          ports:
            - containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: content-marketplace-config
            - secretRef:
                name: content-marketplace-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
