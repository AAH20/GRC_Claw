apiVersion: v1
kind: ConfigMap
metadata:
  name: content-marketplace-config
  labels:
    app: content-marketplace
data:
  LOG_LEVEL: "INFO"
  ENVIRONMENT: "production"
  DATABASE_URL: "postgresql://postgres:postgres@postgres-service:5432/content_marketplace"
  REDIS_URL: "redis://redis-service:6379/0"
  MAX_LISTINGS_PER_USER: "100"
  DEFAULT_CURRENCY: "USD"
  PRICE_UPDATE_INTERVAL_SECONDS: "3600"
  TRUST_SCORE_THRESHOLD: "0.7"
  ANALYTICS_CACHE_TTL_SECONDS: "300"
