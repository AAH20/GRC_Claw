apiVersion: v1
kind: Namespace
metadata:
  name: community-governance
  labels:
    app: community-governance
    environment: production
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: community-governance-config
  namespace: community-governance
data:
  COMMUNITY_GOVERNANCE_ENVIRONMENT: "production"
  COMMUNITY_GOVERNANCE_LOG_LEVEL: "INFO"
  COMMUNITY_GOVERNANCE_LOG_FORMAT: "json"
  COMMUNITY_GOVERNANCE_LLM_MODEL: "gpt-4o-mini"
  COMMUNITY_GOVERNANCE_LLM_TEMPERATURE: "0.1"
  COMMUNITY_GOVERNANCE_METRICS_ENABLED: "true"
---
apiVersion: v1
kind: Secret
metadata:
  name: community-governance-secrets
  namespace: community-governance
type: Opaque
stringData:
  OPENAI_API_KEY: ""
  LANGCHAIN_API_KEY: ""
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: community-governance-api
  namespace: community-governance
  labels:
    app: community-governance
    component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: community-governance
      component: api
  template:
    metadata:
      labels:
        app: community-governance
        component: api
    spec:
      containers:
        - name: api
          image: community-governance:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: community-governance-config
            - secretRef:
                name: community-governance-secrets
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: community-governance-service
  namespace: community-governance
  labels:
    app: community-governance
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8000
      protocol: TCP
  selector:
    app: community-governance
    component: api
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: community-governance-ingress
  namespace: community-governance
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - governance.example.com
      secretName: community-governance-tls
  rules:
    - host: governance.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: community-governance-service
                port:
                  number: 80
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: community-governance-hpa
  namespace: community-governance
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: community-governance-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: community-governance-pdb
  namespace: community-governance
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: community-governance
      component: api
