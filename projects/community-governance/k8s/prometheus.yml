apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: community-governance
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      - job_name: 'community-governance'
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names:
                - community-governance
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_label_app]
            regex: community-governance
            action: keep
          - source_labels: [__meta_kubernetes_endpoint_port_name]
            regex: http
            action: keep
          - target_label: __address__
            replacement: $(1):8000
