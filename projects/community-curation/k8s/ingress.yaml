apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: community-curation-ingress
  namespace: community-curation
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
spec:
  tls:
    - hosts:
        - community-curation.example.com
      secretName: community-curation-tls
  rules:
    - host: community-curation.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: community-curation-api
                port:
                  number: 80
