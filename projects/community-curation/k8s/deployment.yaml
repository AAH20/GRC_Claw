apiVersion: apps/v1
kind: Deployment
metadata:
  name: community-curation-api
  namespace: community-curation
  labels:
    app: community-curation
    component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: community-curation
      component: api
  template:
    metadata:
      labels:
        app: community-curation
        component: api
    spec:
      containers:
        - name: api
          image: community-curation:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              protocol: TCP
          env:
            - name: APP_NAME
              value: "community-curation"
            - name: APP_VERSION
              value: "0.1.0"
            - name: ENVIRONMENT
              value: "production"
            - name: LOG_LEVEL
              value: "INFO"
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: community-curation-secrets
                  key: openai-api-key
                  optional: true
            - name: LLM_MODEL
              value: "gpt-4o-mini"
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
