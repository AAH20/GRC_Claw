apiVersion: v1
kind: ConfigMap
metadata:
  name: jdo-config
  labels:
    app: job-description-optimizer
data:
  APP_NAME: "job-description-optimizer"
  APP_ENV: "production"
  DEBUG: "false"
  LOG_LEVEL: "INFO"
  OPENAI_MODEL: "gpt-4o-mini"
  LANGCHAIN_TRACING_V2: "false"
  LANGCHAIN_PROJECT: "job-description-optimizer"
  MAX_AGENT_ITERATIONS: "10"
  AGENT_TIMEOUT_SECONDS: "120"
  ENABLE_FALLBACK: "true"
  RATE_LIMIT_REQUESTS_PER_MINUTE: "60"
  RATE_LIMIT_BURST: "10"
