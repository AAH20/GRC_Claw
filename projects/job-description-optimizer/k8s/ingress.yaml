apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: job-description-optimizer
  labels:
    app: job-description-optimizer
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/rate-limit: "60"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
spec:
  tls:
    - hosts:
        - jdo.example.com
      secretName: jdo-tls
  rules:
    - host: jdo.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: job-description-optimizer
                port:
                  number: 80
