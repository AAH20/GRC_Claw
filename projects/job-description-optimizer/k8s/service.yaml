apiVersion: v1
kind: Service
metadata:
  name: job-description-optimizer
  labels:
    app: job-description-optimizer
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8000
      protocol: TCP
      name: http
  selector:
    app: job-description-optimizer
---
apiVersion: v1
kind: Service
metadata:
  name: job-description-optimizer-headless
  labels:
    app: job-description-optimizer
spec:
  clusterIP: None
  ports:
    - port: 8000
      protocol: TCP
      name: http
  selector:
    app: job-description-optimizer
