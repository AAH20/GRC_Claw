apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: jdo

resources:
  - namespace.yaml
  - configmap.yaml
  - secret.yaml
  - deployment.yaml
  - service.yaml
  - hpa.yaml
  - ingress.yaml

commonLabels:
  app: job-description-optimizer
  managed-by: kustomize

images:
  - name: job-description-optimizer
    newTag: latest

configMapGenerator:
  - name: jdo-config
    behavior: merge
    literals:
      - APP_ENV=production
