apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: access-control

resources:
  - namespace.yaml
  - configmap.yaml
  - secret.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - hpa.yaml
  - pdb.yaml

images:
  - name: access-control
    newTag: latest

commonLabels:
  app.kubernetes.io/name: access-control
  app.kubernetes.io/managed-by: kustomize
