apiVersion: v1
kind: Namespace
metadata:
  name: resume-parser
  labels:
    name: resume-parser
---
apiVersion: v1
kind: Secret
metadata:
  name: resume-parser-secrets
  namespace: resume-parser
type: Opaque
stringData:
  openai-api-key: "sk-your-key-here"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: resume-parser-data
  namespace: resume-parser
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: resume-parser-config
  namespace: resume-parser
data:
  APP_ENV: "production"
  LOG_LEVEL: "INFO"
  OPENAI_MODEL: "gpt-4o-mini"
  STORAGE_BACKEND: "local"
  MAX_FILE_SIZE_MB: "10"
  AGENT_MAX_ITERATIONS: "10"
  AGENT_TIMEOUT_SECONDS: "120"
