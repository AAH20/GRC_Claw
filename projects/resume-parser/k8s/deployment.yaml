apiVersion: apps/v1
kind: Deployment
metadata:
  name: resume-parser
  labels:
    app: resume-parser
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: resume-parser
  template:
    metadata:
      labels:
        app: resume-parser
        version: v1
    spec:
      containers:
        - name: resume-parser
          image: resume-parser:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              protocol: TCP
          env:
            - name: APP_ENV
              value: "production"
            - name: LOG_LEVEL
              value: "INFO"
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: resume-parser-secrets
                  key: openai-api-key
            - name: REDIS_URL
              value: "redis://redis:6379/0"
            - name: STORAGE_BACKEND
              value: "local"
            - name: STORAGE_PATH
              value: "/app/data/resumes"
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: resume-data
              mountPath: /app/data
            - name: resume-uploads
              mountPath: /app/uploads
      volumes:
        - name: resume-data
          persistentVolumeClaim:
            claimName: resume-parser-data
        - name: resume-uploads
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: resume-parser
  labels:
    app: resume-parser
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8000
      protocol: TCP
  selector:
    app: resume-parser
