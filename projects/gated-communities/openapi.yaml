openapi: 3.1.0
info:
  title: Gated Communities API
  description: Unified API for gated community management platform
  version: 1.0.0
  contact:
    name: Ahmed Hassan
  license:
    name: MIT

servers:
  - url: http://localhost:8000
    description: Local development
  - url: https://api.gated-communities.example.com
    description: Production

security:
  - bearerAuth: []

paths:
  /health:
    get:
      summary: Health check
      operationId: health_check
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /api/v1/tiers:
    get:
      summary: List all tiers
      operationId: list_tiers
      responses:
        "200":
          description: List of tiers
          content:
            application/json:
              schema:
                type: array
                maxItems: 1000
                items:
                  $ref: "#/components/schemas/Tier"
    post:
      summary: Create a new tier
      operationId: create_tier
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TierCreate"
      responses:
        "201":
          description: Tier created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tier"

  /api/v1/moderation/queue:
    get:
      summary: Get moderation queue
      operationId: get_moderation_queue
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, in_review, resolved]
        - name: priority
          in: query
          schema:
            type: string
            enum: [low, medium, high, critical]
      responses:
        "200":
          description: Moderation queue items
          content:
            application/json:
              schema:
                type: array
                maxItems: 1000
                items:
                  $ref: "#/components/schemas/ModerationItem"

  /api/v1/access/evaluate:
    post:
      summary: Evaluate access request
      operationId: evaluate_access
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccessRequest"
      responses:
        "200":
          description: Access evaluation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessResult"

  /api/v1/health-score:
    get:
      summary: Get community health score
      operationId: get_health_score
      responses:
        "200":
          description: Community health metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthScore"

  /api/v1/verification/verify:
    post:
      summary: Verify member identity
      operationId: verify_member
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerificationRequest"
      responses:
        "200":
          description: Verification result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerificationResult"

  /api/v1/escalations:
    get:
      summary: List escalations
      operationId: list_escalations
      responses:
        "200":
          description: List of escalations
          content:
            application/json:
              schema:
                type: array
                maxItems: 1000
                items:
                  $ref: "#/components/schemas/Escalation"
    post:
      summary: Create escalation
      operationId: create_escalation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EscalationCreate"
      responses:
        "201":
          description: Escalation created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Escalation"

  /api/v1/reputation:
    get:
      summary: Get reputation scores
      operationId: get_reputation
      parameters:
        - name: member_id
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Reputation data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reputation"

  /api/v1/compliance/policies:
    get:
      summary: List compliance policies
      operationId: list_policies
      responses:
        "200":
          description: List of policies
          content:
            application/json:
              schema:
                type: array
                maxItems: 1000
                items:
                  $ref: "#/components/schemas/Policy"

  /api/v1/analytics/moderation:
    get:
      summary: Get moderation analytics
      operationId: get_moderation_analytics
      parameters:
        - name: start_date
          in: query
          schema:
            type: string
            format: date
        - name: end_date
          in: query
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Analytics data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModerationAnalytics"

  /api/v1/governance/disputes:
    get:
      summary: List disputes
      operationId: list_disputes
      responses:
        "200":
          description: List of disputes
          content:
            application/json:
              schema:
                type: array
                maxItems: 1000
                items:
                  $ref: "#/components/schemas/Dispute"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: healthy
        version:
          type: string
          example: "1.0.0"
        timestamp:
          type: string
          format: date-time

    Tier:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        level:
          type: integer
        benefits:
          type: array
          maxItems: 100
          items:
            type: string

    TierCreate:
      type: object
      required: [name, level]
      properties:
        name:
          type: string
        level:
          type: integer
        benefits:
          type: array
          maxItems: 100
          items:
            type: string

    ModerationItem:
      type: object
      properties:
        id:
          type: string
        content:
          type: string
        status:
          type: string
          enum: [pending, in_review, resolved]
        priority:
          type: string
          enum: [low, medium, high, critical]
        created_at:
          type: string
          format: date-time

    AccessRequest:
      type: object
      required: [user_id, resource, action]
      properties:
        user_id:
          type: string
        resource:
          type: string
        action:
          type: string

    AccessResult:
      type: object
      properties:
        allowed:
          type: boolean
        reason:
          type: string
        permissions:
          type: array
          maxItems: 50
          items:
            type: string

    HealthScore:
      type: object
      properties:
        overall_score:
          type: number
          minimum: 0
          maximum: 100
        toxicity_level:
          type: number
        engagement_rate:
          type: number
        timestamp:
          type: string
          format: date-time

    VerificationRequest:
      type: object
      required: [member_id, document_type, document_data]
      properties:
        member_id:
          type: string
        document_type:
          type: string
        document_data:
          type: string

    VerificationResult:
      type: object
      properties:
        verified:
          type: boolean
        confidence:
          type: number
        risk_level:
          type: string
          enum: [low, medium, high]

    Escalation:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        status:
          type: string
        priority:
          type: string
        assignee:
          type: string
        created_at:
          type: string
          format: date-time

    EscalationCreate:
      type: object
      required: [title, priority]
      properties:
        title:
          type: string
        priority:
          type: string
        description:
          type: string

    Reputation:
      type: object
      properties:
        member_id:
          type: string
        score:
          type: number
        tier:
          type: string
        badges:
          type: array
          maxItems: 100
          items:
            type: string
        history:
          type: array
          maxItems: 1000
          items:
            type: object

    Policy:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        rules:
          type: array
          maxItems: 100
          items:
            type: object
        active:
          type: boolean

    ModerationAnalytics:
      type: object
      properties:
        total_items:
          type: integer
        resolved_items:
          type: integer
        average_resolution_time:
          type: number
        top_violations:
          type: array
          maxItems: 100
          items:
            type: object

    Dispute:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        status:
          type: string
        parties:
          type: array
          maxItems: 50
          items:
            type: string
        created_at:
          type: string
          format: date-time
