version: 2
updates:
  # Python dependencies
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: UTC
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - python
    commit-message:
      prefix: "deps"
      include: scope
    reviewers:
      - ahmedhassan
    assignees:
      - ahmedhassan
    allow:
      - dependency-type: all
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
    groups:
      python-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      python-major:
        patterns:
          - "*"
        update-types:
          - major

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: UTC
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: "ci"
      include: scope
    reviewers:
      - ahmedhassan
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # Docker
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: UTC
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - docker
    commit-message:
      prefix: "docker"
      include: scope
    reviewers:
      - ahmedhassan
