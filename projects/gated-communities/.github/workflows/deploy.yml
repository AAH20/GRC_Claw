name: Deploy to Production

on:
  workflow_run:
    workflows: ["CD — Docker Build & Push"]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment"
        required: true
        default: "production"
        type: choice
        options:
          - staging
          - production
      image_tag:
        description: "Image tag to deploy (e.g. v1.0.0, sha, latest)"
        required: false
        default: "latest"

concurrency:
  group: deploy-${{ github.event.inputs.environment || 'production' }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  NAMESPACE: gated-communities

jobs:
  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event.inputs.environment || 'production' }}
      url: https://gated-communities.example.com
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --name ${{ secrets.EKS_CLUSTER_NAME }} \
            --region ${{ secrets.AWS_REGION }}

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Determine image tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.image_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy with Helm
        run: |
          helm upgrade --install gated-communities ./helm \
            --namespace ${{ env.NAMESPACE }} \
            --create-namespace \
            --set image.repository=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }} \
            --set image.tag=${{ steps.tag.outputs.tag }} \
            --set image.pullPolicy=Always \
            --set environment=${{ github.event.inputs.environment || 'production' }} \
            --set secrets.databaseUrl=${{ secrets.DATABASE_URL }} \
            --set secrets.redisUrl=${{ secrets.REDIS_URL }} \
            --set secrets.llmApiKey=${{ secrets.LLM_API_KEY }} \
            --set secrets.secretKey=${{ secrets.SECRET_KEY }} \
            --wait \
            --timeout 5m \
            --atomic

      - name: Verify deployment
        run: |
          kubectl rollout status deployment/gated-communities \
            -n ${{ env.NAMESPACE }} \
            --timeout=300s

      - name: Run smoke tests
        run: |
          kubectl run smoke-test --rm -i --restart=Never \
            -n ${{ env.NAMESPACE }} \
            --image=curlimages/curl:latest \
            -- curl -sf http://gated-communities:8000/health || exit 1

      - name: Rollback on failure
        if: failure()
        run: |
          helm rollback gated-communities 0 \
            -n ${{ env.NAMESPACE }} \
            --wait \
            --timeout 3m

  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: deploy
    if: always()
    steps:
      - name: Notify Slack (success)
        if: needs.deploy.result == 'success'
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": "✅ Deployment successful: ${{ github.repository }}@${{ github.ref_name }} to ${{ github.event.inputs.environment || 'production' }}"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Notify Slack (failure)
        if: needs.deploy.result == 'failure'
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": "❌ Deployment failed: ${{ github.repository }}@${{ github.ref_name }} to ${{ github.event.inputs.environment || 'production' }}"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
