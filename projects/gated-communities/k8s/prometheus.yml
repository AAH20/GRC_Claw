apiVersion: v1
kind: ConfigMap
metadata:
  name: gated-communities-monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    scrape_configs:
      - job_name: gated-communities
        static_configs:
          - targets: ["localhost:8000"]
        metrics_path: /metrics
