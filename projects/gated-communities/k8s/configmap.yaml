apiVersion: v1
kind: ConfigMap
metadata:
  name: gated-communities-config
data:
  LOG_LEVEL: "INFO"
  ENVIRONMENT: "production"
  DATABASE_POOL_SIZE: "20"
  REDIS_DB: "0"
  LLM_MODEL: "gpt-4"
  LLM_TEMPERATURE: "0.7"
  MODERATION_THRESHOLD: "0.8"
  ESCALATION_TIMEOUT_MINUTES: "30"
  REPUTATION_DECAY_DAYS: "90"
  COMPLIANCE_AUDIT_RETENTION_DAYS: "365"
