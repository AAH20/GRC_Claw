apiVersion: apps/v1
kind: Deployment
metadata:
  name: gated-communities
  labels:
    app: gated-communities
spec:
  replicas: 3
  selector:
    matchLabels:
      app: gated-communities
  template:
    metadata:
      labels:
        app: gated-communities
    spec:
      containers:
        - name: app
          image: gated-communities:latest
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: gated-communities-secrets
                  key: database-url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: gated-communities-secrets
                  key: redis-url
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: gated-communities-secrets
                  key: llm-api-key
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
