# Default values for gated-communities.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 3

image:
  repository: gated-communities
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 80
  targetPort: 8000

ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
  hosts:
    - host: api.gated-communities.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: gated-communities-tls
      hosts:
        - api.gated-communities.example.com

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

nodeSelector: {}
tolerations: []
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - gated-communities
          topologyKey: kubernetes.io/hostname

# Application configuration
config:
  LOG_LEVEL: "INFO"
  ENVIRONMENT: "production"
  DATABASE_POOL_SIZE: "20"
  REDIS_DB: "0"
  LLM_MODEL: "gpt-4"
  LLM_TEMPERATURE: "0.7"
  MODERATION_THRESHOLD: "0.8"
  ESCALATION_TIMEOUT_MINUTES: "30"
  REPUTATION_DECAY_DAYS: "90"
  COMPLIANCE_AUDIT_RETENTION_DAYS: "365"

# Secrets - override these in production with --set or a secrets manager
secrets:
  database-url: "postgresql://postgres:postgres@localhost:5432/gated_communities"
  redis-url: "redis://localhost:6379/0"
  llm-api-key: ""
  secret-key: "change-me-in-production"

# Liveness and readiness probes
probes:
  liveness:
    path: /health
    port: 8000
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    path: /health
    port: 8000
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3

# Pod Disruption Budget
pdb:
  enabled: true
  minAvailable: 1
