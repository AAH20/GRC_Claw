apiVersion: v1
kind: Service
metadata:
  name: {{ include "gated-communities.fullname" . }}
  labels:
    {{- include "gated-communities.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
      name: http
  selector:
    {{- include "gated-communities.selectorLabels" . | nindent 4 }}
