apiVersion: v1
kind: Secret
metadata:
  name: {{ include "gated-communities.fullname" . }}-secrets
  labels:
    {{- include "gated-communities.labels" . | nindent 4 }}
type: Opaque
stringData:
  database-url: {{ .Values.secrets.database-url | quote }}
  redis-url: {{ .Values.secrets.redis-url | quote }}
  llm-api-key: {{ .Values.secrets.llm-api-key | quote }}
  secret-key: {{ .Values.secrets.secret-key | quote }}
