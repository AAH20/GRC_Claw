# Fluentd Configuration for Gated Communities
# Centralized logging with structured JSON output

# ============================================================
# System Configuration
# ============================================================
<system>
  log_level info
  workers 4
  root_dir /var/log/fluent/buffer
  dir_perm 0755
  file_perm 0644
</system>

# ============================================================
# Source: Docker Container Logs
# ============================================================
<source>
  @type forward
  port 24224
  bind 0.0.0.0
  <transport tls>
    cert_path /etc/fluentd/certs/fluentd.crt
    private_key_path /etc/fluentd/certs/fluentd.key
    client_cert_auth true
  </transport>
  <parse>
    @type json
    time_key timestamp
    time_format %Y-%m-%dT%H:%M:%S.%NZ
  </parse>
</source>

# ============================================================
# Source: Application Log Files
# ============================================================
<source>
  @type tail
  path /var/log/gated-communities/*.log
  pos_file /var/log/fluent/gated-communities.pos
  tag app.gated-communities
  refresh_interval 5s
  read_from_head true
  <parse>
    @type json
    time_key timestamp
    time_format %Y-%m-%dT%H:%M:%S.%NZ
  </parse>
</source>

# ============================================================
# Source: Nginx/Access Logs
# ============================================================
<source>
  @type tail
  path /var/log/nginx/access.log
  pos_file /var/log/fluent/nginx-access.pos
  tag nginx.access
  refresh_interval 5s
  read_from_head true
  <parse>
    @type json
    time_key time_iso8601
    time_format %Y-%m-%dT%H:%M:%S.%NZ
  </parse>
</source>

# ============================================================
# Source: Nginx/Error Logs
# ============================================================
<source>
  @type tail
  path /var/log/nginx/error.log
  pos_file /var/log/fluent/nginx-error.pos
  tag nginx.error
  refresh_interval 5s
  read_from_head true
  <parse>
    @type regexp
    expression /^(?<time>\d{4}/\d{2}/\d{2} \d{2}:\d{2}:\d{2}) \[(?<level>\w+)\] (?<pid>\d+)#(?<tid>\d+): \*(?<cid>\d+) (?<message>.*)$/
    time_format %Y/%m/%d %H:%M:%S
  </parse>
</source>

# ============================================================
# Source: PostgreSQL Logs
# ============================================================
<source>
  @type tail
  path /var/log/postgresql/postgresql.log
  pos_file /var/log/fluent/postgresql.pos
  tag db.postgresql
  refresh_interval 10s
  read_from_head true
  <parse>
    @type regexp
    expression /^(?<time>\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2} \w+) \[(?<pid>\d+)\] (?<level>\w+):\s+(?<message>.*)$/
    time_format %Y-%m-%d %H:%M:%S %Z
  </parse>
</source>

# ============================================================
# Source: Redis Logs
# ============================================================
<source>
  @type tail
  path /var/log/redis/redis-server.log
  pos_file /var/log/fluent/redis.pos
  tag db.redis
  refresh_interval 10s
  read_from_head true
  <parse>
    @type regexp
    expression /^(?<pid>\d+):(?<role>\w+)\s+(?<time>\d{2} \w{3} \d{4} \d{2}:\d{2}:\d{2}\.\d+)\s+(?<level>[#*.-])\s+(?<message>.*)$/
    time_format %d %b %Y %H:%M:%S.%L
  </parse>
</source>

# ============================================================
# Filter: Enrich all logs with common metadata
# ============================================================
<filter **>
  @type record_transformer
  enable_ruby true
  <record>
    environment production
    cluster gated-communities
    hostname ${Socket.gethostname}
    fluentd_worker ${worker_id}
    ingested_at ${Time.now.utc.iso8601}
  </record>
</filter>

# ============================================================
# Filter: Parse and enrich application logs
# ============================================================
<filter app.gated-communities>
  @type parser
  key_name message
  reserve_data true
  remove_key_name_field true
  <parse>
    @type json
    time_key timestamp
    time_format %Y-%m-%dT%H:%M:%S.%NZ
  </parse>
</filter>

<filter app.gated-communities>
  @type record_transformer
  enable_ruby true
  <record>
    service ${record["service"] || "unknown"}
    level ${record["level"] || "info"}
    trace_id ${record["trace_id"] || ""}
    span_id ${record["span_id"] || ""}
    user_id ${record["user_id"] || ""}
    community_id ${record["community_id"] || ""}
  </record>
</filter>

# ============================================================
# Filter: Add severity levels for alerting
# ============================================================
<filter **>
  @type grep
  <regexp>
    key level
    pattern /^(ERROR|CRITICAL|FATAL|error|critical|fatal)$/
  </regexp>
  add_tag_prefix error
</filter>

<filter **>
  @type grep
  <regexp>
    key level
    pattern /^(WARN|WARNING|warn|warning)$/
  </regexp>
  add_tag_prefix warning
</filter>

# ============================================================
# Filter: Mask sensitive data
# ============================================================
<filter **>
  @type record_transformer
  enable_ruby true
  <record>
    message ${record["message"].gsub(/password["\s:=]+[^\s,}]+/i, 'password=[FILTERED]') if record["message"]}
    message ${record["message"].gsub(/token["\s:=]+[^\s,}]+/i, 'token=[FILTERED]') if record["message"]}
    message ${record["message"].gsub(/api[_-]?key["\s:=]+[^\s,}]+/i, 'api_key=[FILTERED]') if record["message"]}
    message ${record["message"].gsub(/bearer\s+[^\s]+/i, 'bearer [FILTERED]') if record["message"]}
  </record>
</filter>

# ============================================================
# Match: Error logs to dedicated output
# ============================================================
<match error.**>
  @type copy
  <store>
    @type elasticsearch
    host elasticsearch
    port 9200
    logstash_format true
    logstash_prefix gated-communities-errors
    logstash_dateformat %Y.%m.%d
    include_tag_key true
    tag_key _tag
    flush_interval 5s
    max_retry_wait 30
    disable_retry_limit false
    num_threads 4
    request_timeout 30s
    reload_on_failure true
    reload_connections true
    <buffer>
      @type file
      path /var/log/fluent/buffer/errors
      flush_mode interval
      flush_interval 5s
      retry_max_interval 30
      chunk_limit_size 8MB
      queue_limit_length 256
      total_limit_size 50GB
      overflow_action block
    </buffer>
  </store>
  <store>
    @type prometheus
    <metric>
      name fluentd_output_status_retry_count
      type counter
      desc The number of errors
    </metric>
  </store>
</match>

