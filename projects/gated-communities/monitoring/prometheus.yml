# Prometheus Configuration for Gated Communities
# Production-grade monitoring setup

global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
  external_labels:
    cluster: gated-communities
    environment: production
    region: us-east-1

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093
      scheme: http
      timeout: 10s

# Rule files
rule_files:
  - /etc/prometheus/rules/*.yml

# Scrape configurations
scrape_configs:
  # Prometheus self-monitoring
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090
    metrics_path: /metrics
    scrape_interval: 30s

  # Gated Communities API Gateway
  - job_name: api-gateway
    static_configs:
      - targets:
          - api-gateway:8080
        labels:
          service: api-gateway
          team: platform
    metrics_path: /metrics
    scrape_interval: 15s
    scrape_timeout: 10s
    honor_labels: true
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance

  # Community Service
  - job_name: community-service
    static_configs:
      - targets:
          - community-service:8081
        labels:
          service: community-service
          team: backend
    metrics_path: /metrics
    scrape_interval: 15s
    scrape_timeout: 10s

  # Membership Service
  - job_name: membership-service
    static_configs:
      - targets:
          - membership-service:8082
        labels:
          service: membership-service
          team: backend
    metrics_path: /metrics
    scrape_interval: 15s
    scrape_timeout: 10s

  # Notification Service
  - job_name: notification-service
    static_configs:
      - targets:
          - notification-service:8083
        labels:
          service: notification-service
          team: backend
    metrics_path: /metrics
    scrape_interval: 15s
    scrape_timeout: 10s

  # PostgreSQL Exporter
  - job_name: postgres-exporter
    static_configs:
      - targets:
          - postgres-exporter:9187
        labels:
          service: database
          team: data
    metrics_path: /metrics
    scrape_interval: 30s

  # Redis Exporter
  - job_name: redis-exporter
    static_configs:
      - targets:
          - redis-exporter:9121
        labels:
          service: cache
          team: data
    metrics_path: /metrics
    scrape_interval: 30s

  # Node Exporter (host metrics)
  - job_name: node-exporter
    static_configs:
      - targets:
          - node-exporter:9100
        labels:
          service: node
          team: infrastructure
    metrics_path: /metrics
    scrape_interval: 30s

  # Jaeger metrics
  - job_name: jaeger
    static_configs:
      - targets:
          - jaeger:14269
        labels:
          service: tracing
          team: observability
    metrics_path: /metrics
    scrape_interval: 30s

  # Fluentd metrics
  - job_name: fluentd
    static_configs:
      - targets:
          - fluentd:24231
        labels:
          service: logging
          team: observability
    metrics_path: /metrics
    scrape_interval: 30s

