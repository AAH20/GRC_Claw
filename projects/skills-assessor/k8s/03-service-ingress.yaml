apiVersion: v1
kind: Service
metadata:
  name: skills-assessor
  namespace: skills-assessor
  labels:
    app: skills-assessor
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8000
      protocol: TCP
      name: http
  selector:
    app: skills-assessor
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: skills-assessor
  namespace: skills-assessor
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
spec:
  tls:
    - hosts:
        - skills-assessor.example.com
      secretName: skills-assessor-tls
  rules:
    - host: skills-assessor.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: skills-assessor
                port:
                  number: 80
