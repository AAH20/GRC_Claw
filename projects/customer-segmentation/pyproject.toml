[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "customer-segmentation"
version = "0.1.0"
description = "AI-powered customer segmentation platform with multi-agent architecture"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    {name = "Ahmed Hassan", email = "ahmed@example.com"}
]
keywords = ["customer-segmentation", "ai-agents", "marketing", "crm", "analytics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
]

dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "httpx>=0.25.0",
    "PyYAML>=6.0.1",
    "structlog>=23.2.0",
    "tenacity>=8.2.3",
    "numpy>=1.26.0",
    "pandas>=2.1.0",
    "scikit-learn>=1.3.2",
    "langchain>=0.1.0",
    "langchain-core>=0.1.0",
    "langchain-community>=0.0.10",
    "langgraph>=0.0.20",
    "openai>=1.6.0",
    "anthropic>=0.18.0",
    "prometheus-client>=0.19.0",
    "python-json-logger>=2.0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.3",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.25.0",
    "respx>=0.20.2",
    "ruff>=0.1.6",
    "mypy>=1.7.1",
    "pre-commit>=3.5.0",
]
salesforce = [
    "simple-salesforce>=1.12.5",
]
hubspot = [
    "hubspot-api-client>=8.2.0",
]
google-analytics = [
    "google-analytics-data>=0.18.0",
    "google-auth>=2.23.0",
]

[project.scripts]
customer-segmentation = "customer_segmentation.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "TCH"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src/customer_segmentation"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 80
