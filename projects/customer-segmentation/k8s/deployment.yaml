apiVersion: apps/v1
kind: Deployment
metadata:
  name: customer-segmentation
  namespace: customer-segmentation
  labels:
    app: customer-segmentation
    version: v1
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: customer-segmentation
  template:
    metadata:
      labels:
        app: customer-segmentation
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: customer-segmentation
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        fsGroup: 999
      containers:
        - name: app
          image: ghcr.io/ahmedhassan/customer-segmentation:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: ENVIRONMENT
              value: "production"
            - name: LOG_LEVEL
              value: "INFO"
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: customer-segmentation-secrets
                  key: openai-api-key
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: customer-segmentation-secrets
                  key: anthropic-api-key
            - name: SALESFORCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: customer-segmentation-secrets
                  key: salesforce-username
            - name: SALESFORCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: customer-segmentation-secrets
                  key: salesforce-password
            - name: SALESFORCE_SECURITY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: customer-segmentation-secrets
                  key: salesforce-security-token
            - name: HUBSPOT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: customer-segmentation-secrets
                  key: hubspot-api-key
            - name: GOOGLE_ANALYTICS_PROPERTY_ID
              valueFrom:
                secretKeyRef:
                  name: customer-segmentation-secrets
                  key: ga-property-id
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - customer-segmentation
                topologyKey: kubernetes.io/hostname
