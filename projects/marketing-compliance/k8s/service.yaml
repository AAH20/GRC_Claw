apiVersion: v1
kind: Service
metadata:
  name: compliance-api
  namespace: marketing-compliance
  labels:
    app: compliance-api
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8000
      protocol: TCP
      name: http
  selector:
    app: compliance-api
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: compliance-config
  namespace: marketing-compliance
data:
  environment: "production"
  log_level: "INFO"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: compliance-api
  namespace: marketing-compliance
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: compliance-api
  namespace: marketing-compliance
spec:
  podSelector:
    matchLabels:
      app: compliance-api
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8000
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 53
        - protocol: UDP
          port: 53
    - to: []
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 80
