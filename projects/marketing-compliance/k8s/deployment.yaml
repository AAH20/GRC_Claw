apiVersion: apps/v1
kind: Deployment
metadata:
  name: compliance-api
  namespace: marketing-compliance
  labels:
    app: compliance-api
    version: v1
spec:
  replicas: 3
  selector:
    matchLabels:
      app: compliance-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: compliance-api
        version: v1
    spec:
      serviceAccountName: compliance-api
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        fsGroup: 999
      containers:
        - name: compliance-api
          image: ghcr.io/ahmedhassan/marketing-compliance:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              protocol: TCP
          env:
            - name: COMPLIANCE_ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: compliance-config
                  key: environment
            - name: COMPLIANCE_LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: compliance-config
                  key: log_level
            - name: COMPLIANCE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: compliance-secrets
                  key: secret-key
            - name: SALESFORCE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: compliance-secrets
                  key: salesforce-client-id
                  optional: true
            - name: SALESFORCE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: compliance-secrets
                  key: salesforce-client-secret
                  optional: true
            - name: HUBSPOT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: compliance-secrets
                  key: hubspot-api-key
                  optional: true
            - name: MAILCHIMP_API_KEY
              valueFrom:
                secretKeyRef:
                  name: compliance-secrets
                  key: mailchimp-api-key
                  optional: true
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - compliance-api
                topologyKey: kubernetes.io/hostname
