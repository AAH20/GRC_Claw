apiVersion: v1
kind: Service
metadata:
  name: feedback-management
  labels:
    app: feedback-management
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8000
      protocol: TCP
      name: http
  selector:
    app: feedback-management
---
apiVersion: v1
kind: Secret
metadata:
  name: feedback-management-secrets
type: Opaque
stringData:
  # Replace with actual secrets or use external secret management
  OPENAI_API_KEY: ""
  SURVEYMONKEY_API_KEY: ""
  TYPEFORM_API_KEY: ""
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: feedback-management
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/rate-limit: "100"
spec:
  tls:
    - hosts:
        - feedback.example.com
      secretName: feedback-management-tls
  rules:
    - host: feedback.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: feedback-management
                port:
                  number: 80
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: feedback-management
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: feedback-management
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
