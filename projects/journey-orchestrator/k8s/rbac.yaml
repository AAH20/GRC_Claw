# Kubernetes Namespace, ServiceAccount, Role, and RoleBinding
apiVersion: v1
kind: Namespace
metadata:
  name: journey-orchestrator
  labels:
    app: journey-orchestrator
    environment: production
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: journey-orchestrator
  namespace: journey-orchestrator
  labels:
    app: journey-orchestrator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: journey-orchestrator
  namespace: journey-orchestrator
  labels:
    app: journey-orchestrator
rules:
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: journey-orchestrator
  namespace: journey-orchestrator
  labels:
    app: journey-orchestrator
subjects:
  - kind: ServiceAccount
    name: journey-orchestrator
    namespace: journey-orchestrator
roleRef:
  kind: Role
  name: journey-orchestrator
  apiGroup: rbac.authorization.k8s.io
