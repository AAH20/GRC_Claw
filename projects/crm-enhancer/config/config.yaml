app:
  name: CRM Enhancer
  version: 0.1.0
  log_level: INFO
  host: 0.0.0.0
  port: 8000
  env: development
agents:
  contact_enrichment:
    enabled: true
    timeout_seconds: 30
    enrichment_sources:
    - clearbit
    - zoominfo
    - hunter
    retry_attempts: 3
  deal_scoring:
    enabled: true
    model_path: models/deal_scorer.pkl
    scoring_factors:
    - deal_size
    - stage_progression
    - engagement_level
    - company_fit
    - timeline
    weights:
      deal_size: 0.25
      stage_progression: 0.2
      engagement_level: 0.25
      company_fit: 0.15
      timeline: 0.15
  task_automation:
    enabled: true
    max_concurrent_tasks: 10
    default_priority: medium
    auto_assign: true
  meeting_scheduling:
    enabled: true
    default_duration_minutes: 30
    buffer_minutes: 15
    timezone: UTC
    working_hours:
      start: 09:00
      end: '17:00'
  followup_automation:
    enabled: true
    max_followups: 5
    followup_intervals_days:
    - 1
    - 3
    - 7
    - 14
    - 30
    templates:
      initial: templates/followup_initial.md
      reminder: templates/followup_reminder.md
      final: templates/followup_final.md
  performance_analytics:
    enabled: true
    metrics_refresh_interval_minutes: 15
    retention_days: 365
    dashboards:
    - sales_performance
    - pipeline_health
    - agent_effectiveness
integrations:
  salesforce:
    enabled: false
    api_version: v58.0
    sandbox: false
    batch_size: 200
  hubspot:
    enabled: false
    api_version: v3
    rate_limit_per_second: 10
  pipedrive:
    enabled: false
    api_version: v1
    rate_limit_per_second: 5
monitoring:
  prometheus:
    enabled: true
    port: 9090
  health_check:
    interval_seconds: 30
    timeout_seconds: 10
cache:
  enabled: true
  ttl_seconds: 300
  max_entries: 10000
  backend: memory
security:
  api_key_header: X-API-Key
  rate_limit_requests_per_minute: 60
  cors_origins:
  - http://localhost:3000
database:
  pool_size: 10
  max_overflow: 20
  pool_timeout: 30
  echo: false
