[build-system]
requires = ["hatchling>=1.21.0"]
build-backend = "hatchling.build"

[project]
name = "grc-marketing-core"
version = "0.1.0"
description = "Grand Unified Architecture core library for agentic AI marketing projects"
readme = "README.md"
license = { text = "Proprietary" }
requires-python = ">=3.11"
authors = [
    { name = "Ahmed Hassan", email = "ahmed@grc-claw.ai" },
]
keywords = ["agent", "marketing", "ai", "governance", "monitoring"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]

dependencies = [
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.0",
    "structlog>=23.2.0",
    "tenacity>=8.2.0",
    "httpx>=0.25.0",
    "aiohttp>=3.9.0",
    "langchain>=0.1.0",
    "langchain-core>=0.1.0",
    "langgraph>=0.0.20",
    "deepagents>=0.1.0",
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "starlette>=0.35.0",
    "websockets>=12.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "redis>=5.0.0",
    "kafka-python>=2.0.2",
    "confluent-kafka>=2.3.0",
    "pandas>=2.1.0",
    "numpy>=1.26.0",
    "cryptography>=42.0.0",
    "PyJWT>=2.8.0",
    "authlib>=1.3.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.1.0",
    "opentelemetry-api>=1.22.0",
    "opentelemetry-sdk>=1.22.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.22.0",
    "opentelemetry-instrumentation-fastapi>=0.43b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.43b0",
    "opentelemetry-instrumentation-redis>=0.43b0",
    "prometheus-client>=0.19.0",
    "mcp>=0.1.0",
    "aio-pika>=9.4.0",
    "aiokafka>=0.9.0",
    "avro>=1.11.0",
    "protobuf>=4.25.0",
    "grpcio>=1.60.0",
    "grpcio-tools>=1.60.0",
    "orjson>=3.9.0",
    "msgpack>=1.0.7",
    "pyyaml>=6.0.1",
    "tomli>=2.0.0",
    "click>=8.1.0",
    "rich>=13.7.0",
    "typer>=0.9.0",
    "python-dateutil>=2.8.2",
    "pytz>=2024.1",
    "ulid-py>=1.1.0",
    "semver>=3.0.0",
    "jsonschema>=4.21.0",
    "jsonpath-ng>=1.6.0",
    "jinja2>=3.1.0",
    "networkx>=3.2.0",
    "scikit-learn>=1.4.0",
    "scipy>=1.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "pytest-xdist>=3.5.0",
    "respx>=0.20.0",
    "factory-boy>=3.3.0",
    "freezegun>=1.4.0",
    "ruff>=0.2.0",
    "mypy>=1.8.0",
    "pyright>=1.1.0",
    "bandit>=1.7.0",
    "safety>=3.0.0",
    "pre-commit>=3.6.0",
    "types-PyYAML>=6.0.0",
    "types-python-dateutil>=2.8.0",
    "types-redis>=4.6.0",
    "types-requests>=2.31.0",
]
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.24.0",
]

[project.urls]
Homepage = "https://github.com/grc-claw/grc-marketing-core"
Repository = "https://github.com/grc-claw/grc-marketing-core"
Issues = "https://github.com/grc-claw/grc-marketing-core/issues"

[tool.hatch.build.targets.wheel]
packages = ["grc_marketing_core"]

[tool.ruff]
target-version = "py311"
line-length = 100
select = ["E", "F", "I", "N", "W", "UP", "B", "A", "C4", "DTZ", "T10", "T20", "TID", "SIM", "ARG", "PTH", "PL", "TRY", "FLY", "PERF", "FURB", "RUF"]
ignore = ["E501", "PLR0913", "PLR2004", "TRY003", "TRY300", "TRY301", "SIM108", "SIM110", "SIM118", "PERF203"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
