apiVersion: v1
kind: Service
metadata:
  name: crm-enhancer
  labels:
    app: crm-enhancer
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8000
      protocol: TCP
      name: http
  selector:
    app: crm-enhancer
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: crm-enhancer
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/rate-limit: "100"
spec:
  tls:
    - hosts:
        - crm-enhancer.example.com
      secretName: crm-enhancer-tls
  rules:
    - host: crm-enhancer.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: crm-enhancer
                port:
                  number: 80
