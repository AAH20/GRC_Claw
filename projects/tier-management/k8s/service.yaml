apiVersion: v1
kind: Service
metadata:
  name: tier-management
  namespace: grc-claw
  labels:
    app: tier-management
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app: tier-management
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tier-management
  namespace: grc-claw
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
spec:
  tls:
    - hosts:
        - tier-management.grc-claw.example.com
      secretName: tier-management-tls
  rules:
    - host: tier-management.grc-claw.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: tier-management
                port:
                  number: 80
