apiVersion: v1
kind: Service
metadata:
  name: cross-domain-orchestrator
  labels:
    app: cross-domain-orchestrator
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8000
      protocol: TCP
      name: http
  selector:
    app: cross-domain-orchestrator
---
apiVersion: v1
kind: Service
metadata:
  name: cross-domain-orchestrator-headless
  labels:
    app: cross-domain-orchestrator
spec:
  clusterIP: None
  ports:
    - port: 8000
      protocol: TCP
  selector:
    app: cross-domain-orchestrator
