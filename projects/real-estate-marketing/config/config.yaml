app:
  name: "Real Estate Marketing Platform"
  version: "0.1.0"
  description: "AI-powered real estate marketing automation"
  environment: "development"
  debug: true
  log_level: "INFO"

server:
  host: "0.0.0.0"
  port: 8000
  workers: 4
  reload: true
  timeout_keep_alive: 30

database:
  url: "postgresql://postgres:postgres@localhost:5432/real_estate"
  pool_size: 20
  max_overflow: 10
  pool_timeout: 30
  echo: false

redis:
  url: "redis://localhost:6379/0"
  max_connections: 50

agents:
  listings:
    model: "gpt-4"
    temperature: 0.7
    max_tokens: 2000
    retry_attempts: 3
    retry_delay: 1.0
  lead_nurture:
    model: "gpt-4"
    temperature: 0.5
    max_tokens: 1500
    retry_attempts: 3
    retry_delay: 1.0
  virtual_tours:
    model: "gpt-4"
    temperature: 0.6
    max_tokens: 1800
    retry_attempts: 3
    retry_delay: 1.0
  analytics:
    model: "gpt-4"
    temperature: 0.3
    max_tokens: 2500
    retry_attempts: 3
    retry_delay: 1.0
  reporting:
    model: "gpt-4"
    temperature: 0.4
    max_tokens: 3000
    retry_attempts: 3
    retry_delay: 1.0

integrations:
  zillow:
    base_url: "https://api.zillow.com/v2"
    timeout: 30
    rate_limit: 100
  realtor:
    base_url: "https://api.realtor.com/v1"
    timeout: 30
    rate_limit: 100
  salesforce:
    base_url: "https://login.salesforce.com"
    timeout: 30
    api_version: "v58.0"

marketing:
  email_templates_dir: "templates/email"
  report_templates_dir: "templates/reports"
  default_from_email: "marketing@realestate.com"
  nurture_sequence:
    - delay_days: 0
      template: "welcome"
    - delay_days: 3
      template: "property_recommendations"
    - delay_days: 7
      template: "market_update"
    - delay_days: 14
      template: "follow_up"
    - delay_days: 30
      template: "check_in"

analytics:
  tracking_enabled: true
  attribution_window_days: 30
  session_timeout_minutes: 30
  metrics:
    - "impressions"
    - "clicks"
    - "leads"
    - "conversions"
    - "revenue"
