apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: real-estate-marketing
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/rate-limit: '100'
spec:
  tls:
  - hosts:
    - api.real-estate-marketing.example.com
    secretName: real-estate-marketing-tls
  rules:
  - host: api.real-estate-marketing.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: real-estate-marketing
            port:
              number: 80
