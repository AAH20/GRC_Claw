apiVersion: v1
kind: Service
metadata:
  name: social-media-manager
  labels:
    app: social-media-manager
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8000
      protocol: TCP
      name: http
  selector:
    app: social-media-manager
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: social-media-manager
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/rate-limit: "100"
spec:
  tls:
    - hosts:
        - smm.example.com
      secretName: smm-tls
  rules:
    - host: smm.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: social-media-manager
                port:
                  number: 80
