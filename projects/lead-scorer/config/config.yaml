app:
  name: lead-scorer
  version: 0.1.0
  log_level: INFO
  env: development
scoring:
  weights:
    firmographic: 0.25
    technographic: 0.15
    engagement: 0.3
    intent: 0.2
    timing: 0.1
  thresholds:
    hot: 80
    warm: 50
    cold: 0
  decay:
    half_life_days: 30
    engagement_window_days: 90
qualification:
  framework: MEDDIC
  required_fields:
  - budget
  - authority
  - need
  - timeline
  scoring:
    budget:
      min: 10000
      optimal: 50000
    timeline:
      urgent_days: 14
      standard_days: 90
integrations:
  salesforce:
    enabled: false
    api_version: v58.0
    timeout_seconds: 30
    retry_attempts: 3
  hubspot:
    enabled: false
    api_version: v3
    timeout_seconds: 30
    retry_attempts: 3
agents:
  research:
    timeout_seconds: 60
    retry_attempts: 2
  evidence:
    timeout_seconds: 45
    retry_attempts: 2
  scoring:
    timeout_seconds: 30
    retry_attempts: 1
  qualification:
    timeout_seconds: 30
    retry_attempts: 1
  churn_prediction:
    timeout_seconds: 45
    retry_attempts: 2
  next_best_action:
    timeout_seconds: 30
    retry_attempts: 1
  insight_synthesis:
    timeout_seconds: 60
    retry_attempts: 2
api:
  host: 0.0.0.0
  port: 8000
  workers: 4
  cors_origins:
  - http://localhost:3000
  - https://app.example.com
  rate_limit:
    requests_per_minute: 100
cache:
  enabled: true
  ttl_seconds: 300
  max_entries: 10000
  backend: memory
monitoring:
  enabled: true
  metrics_port: 9090
  health_check_interval_seconds: 30
  log_level: INFO
security:
  api_key_header: X-API-Key
  rate_limit_requests_per_minute: 60
  cors_origins:
  - http://localhost:3000
database:
  pool_size: 10
  max_overflow: 20
  pool_timeout: 30
  echo: false
