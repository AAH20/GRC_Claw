apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lead-scorer
  namespace: lead-scorer
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/rate-limit: "100"
spec:
  tls:
    - hosts:
        - api.lead-scorer.example.com
      secretName: lead-scorer-tls
  rules:
    - host: api.lead-scorer.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: lead-scorer
                port:
                  number: 80
