apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: compliance-monitor
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
    - hosts:
        - compliance-monitor.example.com
      secretName: compliance-monitor-tls
  rules:
    - host: compliance-monitor.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: compliance-monitor
                port:
                  number: 80
