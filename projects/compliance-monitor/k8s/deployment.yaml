apiVersion: apps/v1
kind: Deployment
metadata:
  name: compliance-monitor
  labels:
    app: compliance-monitor
spec:
  replicas: 2
  selector:
    matchLabels:
      app: compliance-monitor
  template:
    metadata:
      labels:
        app: compliance-monitor
    spec:
      containers:
        - name: api
          image: compliance-monitor:latest
          ports:
            - containerPort: 8000
          env:
            - name: APP_ENV
              value: "production"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: compliance-monitor-secrets
                  key: database-url
            - name: LANGCHAIN_API_KEY
              valueFrom:
                secretKeyRef:
                  name: compliance-monitor-secrets
                  key: langchain-api-key
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: compliance-monitor-secrets
                  key: openai-api-key
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: compliance-monitor
  labels:
    app: compliance-monitor
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8000
      protocol: TCP
  selector:
    app: compliance-monitor
