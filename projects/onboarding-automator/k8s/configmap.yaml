apiVersion: v1
kind: ConfigMap
metadata:
  name: onboarding-automator-config
data:
  APP_ENV: "production"
  LOG_LEVEL: "INFO"
  DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/onboarding"
  REDIS_URL: "redis://redis:6379/0"
  MAX_CONCURRENT_AGENTS: "5"
  AGENT_TIMEOUT_SECONDS: "300"
---
apiVersion: v1
kind: Secret
metadata:
  name: onboarding-automator-secrets
type: Opaque
stringData:
  OPENAI_API_KEY: ""
  DATABASE_PASSWORD: ""
