apiVersion: apps/v1
kind: Deployment
metadata:
  name: onboarding-automator
  labels:
    app: onboarding-automator
spec:
  replicas: 2
  selector:
    matchLabels:
      app: onboarding-automator
  template:
    metadata:
      labels:
        app: onboarding-automator
    spec:
      containers:
        - name: api
          image: ghcr.io/ahmedhassan/onboarding-automator:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: onboarding-automator-config
            - secretRef:
                name: onboarding-automator-secrets
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
