apiVersion: v1
kind: Service
metadata:
  name: onboarding-automator
  labels:
    app: onboarding-automator
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8000
      protocol: TCP
  selector:
    app: onboarding-automator
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: onboarding-automator
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
    - hosts:
        - onboarding.example.com
      secretName: onboarding-automator-tls
  rules:
    - host: onboarding.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: onboarding-automator
                port:
                  number: 80
