name: Offline agent policy denial example

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/agent-policy-denial.yml'
      - 'examples/agent-policy-denial/**'
      - 'packages/agent-policy-firewall/src/**'
      - 'packages/evidence/src/action-ledger.ts'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/agent-policy-denial.yml'
      - 'examples/agent-policy-denial/**'
      - 'packages/agent-policy-firewall/src/**'
      - 'packages/evidence/src/action-ledger.ts'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay-and-verify:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        node-version: ['20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm install --include=optional --no-audit --no-fund
      - run: npm run test:agent-policy-denial
